server:
  port: 1667
  address: 0.0.0.0
  maxHttpHeaderSize: 102400
  servlet:
    context-path: /tams #兼容SpringBoot2.x
  context-path: /tams   #兼容SpringBoot1.x

  tomcat:
    #     最小备用线程数
    min-spare-threads: 10
    #     建议这个配置数可以在服务器CUP核心数的200~250倍之间
    max-threads: 50
    #     能够接受的最大等待数
    accept-count: 10
    #     等于max-threads + accept-count
    max-connections: 3000
spring:
  application:
    name: data-service-provider
  profiles:
    include:
      - framework
      - cfets
  rabbitmq:
    # 开发环境使用mq配置如下
    addresses: 192.168.60.97:5672
    username: rbmq
    password: rbmq
    #243测试环境使用mq配置如下
    #    addresses: 192.168.90.243:5672
    #    username: rbmq
    #    password: rbmq
    publisher-confirms: true
    publisher-returns: true
    listener:
      simple:
        max-concurrency: 20
        concurrency: 1
        acknowledge-mode: manual
        retry:
          enabled: true
    template:
      retry:
        enabled: false
      mandatory: true