<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
    <div class="pro-module-wrap" th:id="|${entityName}_div|">
        <div class="pro-module">
            <h3 class="pro-module-title">
                <span class="title-des">人员信息</span>
                <i class="iconfont icon-arrow-down pro-down-icon"></i>
            </h3>
            <input type="hidden" th:id="|${entityName}_traderDept|" th:name="|${entityName}.traderDept|" th:value="${entity?.trader}">
            <input type="hidden" th:id="|${entityName}_isOutTrade|" th:name="|${entityName}.isOutTrade|" th:value="${entity?.isOutTrade}">
            <div class="pro-module-item">
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-utext="#{EtrInvestPersonInfo002.trader}" >本方交易员</label>
                        <div class="layui-input-inline input-inline">
                            <input required disabled th:id="|${entityName}_trader|" th:name="|${entityName}.trader|"
                                    th:value="${entity?.trader}" class="layui-input form-input"
                                    th:placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-utext="#{EtrInvestPersonInfo002.counterId}" >交易对手</label>
                        <div class="layui-input-inline input-inline">
                            <!-- 场内基金改造 modify by renping 20191117 start -->
                            <select required th:id="|${entityName}_counterId|" th:name="|${entityName}.counterId|" parentIds="ps,finprodType2,profitType,tradeMarket,chlId,portfolioId"
                                    th:data-url="|@{/component/trade/TrdInvestPersonInfo002/selectCounterId}?innerTrade=${innerTrade}&counterType=${counterType}|"
                                    formatOption="false"
                                    th:initValue="${entity?.counterId}" class="layui-input form-input input-select"
                                    th:placeholder="#{SysCommon.placeholder}">
                            </select>
                            <!-- 场内基金改造 modify by renping 20191117 end -->
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-utext="#{EtrInvestPersonInfo002.counterTrader}" >对手方交易员</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" maxlength="60" th:id="|${entityName}_counterTrader|" th:name="|${entityName}.counterTrader|"  th:value="${entity?.counterTrader}" class="layui-input form-input "  />
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-utext="#{EtrInvestPersonInfo002.contactInfo}" >联系方式</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" maxlength="300" th:id="|${entityName}_contactInfo|" th:name="|${entityName}.contactInfo|"  th:value="${entity?.contactInfo}" class="layui-input form-input "  />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script data-th-inline="javascript" type="text/javascript">
        var WINDTYPEONE_B14 = /*[[${WINDTYPEONE_B14}]]*/'B14';
        var ENTITY_NAME = /*[[${entityName}]]*/'';
        var pageId = /*[[${pageId}]]*/'';
        var psId = /*[[${psId}]]*/'';
        var callPageId = /*[[${callPageId}]]*/'';
        var IS_AUTO_GENERATE_NEGATE_DEAL = /*[[${IS_AUTO_GENERATE_NEGATE_DEAL}]]*/'';
    </script>
    <script data-th-src="@{/js/component/trade/TrdInvestPersonInfo002.js}" type="text/javascript"></script>
</body>
</html>
