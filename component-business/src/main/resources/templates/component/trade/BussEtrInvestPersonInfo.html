<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
    <div class="pro-module-wrap" th:id="|${entityName}_div|">
        <div class="pro-module">
            <h3 class="pro-module-title">
                <span class="title-des">委托投资人员信息</span>
                <i class="iconfont icon-arrow-down pro-down-icon"></i>
            </h3>
            <input type="text" th:id="|${entityName}_profitType|" th:name="|${entityName}.profitType|" hidden>
             <div class="pro-module-item">
                <div class="layui-form-item"> 
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-lable" data-th-utext="#{EtrInvestPersonInfo002.invManagerId}">投资经理</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_realName|" th:name="|${entityName}.realName|"  th:value="${entity?.realName} " class="layui-input form-input" required="required" disabled="disabled" />
                            <input type="hidden" th:id="|${entityName}_invManagerId|" th:name="|${entityName}.invManagerId|"  th:value="${entity?.invManagerId} " class="layui-input form-input" required="required" disabled="disabled" />
                        </div>
                    </div> 
                     <div class="form-inline-wrap">
                     	<!-- 投资处理室改为所属部门  yzg 20190903 start -->
                        <label class="layui-form-label form-lable" data-th-utext="#{EtrInvestPersonInfo002.room}" >所属部门</label>
                        <!-- 投资处理室改为所属部门  yzg 20190903 end -->
                        <div class="layui-input-inline input-inline"> 
                            <input type="text" th:id="|${entityName}_room|" th:name="|${entityName}.room|"  th:Value="${entity?.room}" class="layui-input form-input" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required="required" disabled="disabled" />
                         
                       </div>
                    </div>
                     <div class="form-inline-wrap">
                        <label class="layui-form-label form-lable" data-th-utext="#{EtrInvestPersonInfo002.trader}" >本方交易员</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" th:id="|${entityName}_trader|" th:name="|${entityName}.trader|"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true 
                                                multiple="multiple"
                                                data-th-data-url="@{/component/trade/BussEtrInvestPersonInfo/getTrader}"
                                                th:initValue="${entity?.trader}">
                                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-lable" data-th-utext="#{EtrInvestPersonInfo002.counterId}" >交易对手</label>
                        <div class="layui-input-inline input-inline">
                            <select th:id="|${entityName}_counterId|" th:name="|${entityName}.counterId|"
                                                class="layui-input form-input input-select"
                                                pdata-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption="false" parentIds="ps,finprodType2,profitType,tradeMarket"
                                                data-th-data-url="|@{/component/trade/BussEtrInvestPersonInfo/getCounterId}?innerTrade=${innerTrade}&counterType=${counterType}|"
                                                th:initValue="${entity?.counterId}">
                                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-lable" data-th-utext="#{EtrInvestPersonInfo002.counterTrader}" >对手方交易员</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" maxlength="10" th:id="|${entityName}_counterTrader|" th:name="|${entityName}.counterTrader|"  th:value="${entity?.counterTrader}" class="layui-input form-input " placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" />
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-lable" data-th-utext="#{EtrInvestPersonInfo002.contactInfo}" >联系方式</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" maxlength="20" th:id="|${entityName}_contactInfo|" th:name="|${entityName}.contactInfo|"  th:value="${entity?.contactInfo}" class="layui-input form-input " placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" />
                        </div>
                    </div>
                </div> 
           </div>
        </div> 
    </div>
    <script data-th-inline="javascript" type="text/javascript">
        var single = /*[[${single}]]*/'';
        var entityName = /*[[${entityName}]]*/'';
        var psId = /*[[${psId}]]*/'';
        var callPageId = /*[[${callPageId}]]*/'';
        var IS_AUTO_GENERATE_NEGATE_DEAL = /*[[${IS_AUTO_GENERATE_NEGATE_DEAL}]]*/'';
    </script>
    <script data-th-src="@{/js/component/trade/BussEtrInvestPersonInfo.js}" type="text/javascript"></script>
</body>
</html>
