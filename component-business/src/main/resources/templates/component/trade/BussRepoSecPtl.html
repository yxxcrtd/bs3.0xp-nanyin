<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<body>
<div class="pro-module-wrap" >
    <!--质押券信息-->
    <div class="pro-module">
        <h3 class="pro-module-title">
           <span class="title-des" data-th-utext="#{BussRepoSecPtl.ptlDistribution}">组合分配</span>
           <i class="iconfont icon-arrow-down pro-down-icon"></i>
        </h3>
        <div class="pro-module-item pro-item-wrap">
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                       data-th-utext="#{BussRepoSecPtl.distribution}">分配方式</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" th:id="|${entityNameBussRepoSecPtl}_distribution|"
                                th:name="|${entityNameBussRepoSecPtl}.distribution|"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                allowClear="true" formatoption="true"
                                data-th-data-result='${DISTRIBUTION}'>
                        </select>
                     </div>
                </div>
                <div class="form-inline-wrap">
                    <a class="layui-btn layui-btn-sm btn-create layui-btn-disabled" th:id="|${entityNameBussRepoSecPtl}_btn_autoAllocation|">
                        <i class="iconfont icon-found"></i><span
                            data-th-utext="#{BussRepoSecPtl.autoAllocation}">自动分配</span></a>
                </div>
            </div>
            <div>
                <table class="layui-table" th:id="|${entityNameBussRepoSecPtl}_pledgeBondTotalList|"
                       th:name="|${entityNameBussRepoSecPtl}.pledgeBondList|"></table>
                <input th:id="|${entityNameBussRepoSecPtl}_ps|" type="hidden" th:name="|${entityNameBussRepoSecPtl}.ps|"></input>
                <input th:id="|${entityNameBussRepoSecPtl}_term|" type="hidden" th:name="|${entityNameBussRepoSecPtl}.term|"></input>
                <input th:id="|${entityNameBussRepoSecPtl}_basis|" type="hidden" th:name="|${entityNameBussRepoSecPtl}.basis|"></input>
                <input th:id="|${entityNameBussRepoSecPtl}_channelFee|" type="hidden" th:name="|${entityNameBussRepoSecPtl}.channelFee|"></input>
                <input th:id="|${entityNameBussRepoSecPtl}_pageFrom|" type="hidden" th:name="|${entityNameBussRepoSecPtl}.pageFrom|" th:value="${pageFrom}"></input>
                <input th:id="|${entityNameBussRepoSecPtl}_profitTypeElement|" type="hidden" th:value="${profitTypeElement}"><!-- 收益类型 -->
                <input th:id="|${entityNameBussRepoSecPtl}_ptlIdElement|" type="hidden" th:value="${ptlIdElement}"><!-- 组合代码 -->
                <input th:id="|${entityNameBussRepoSecPtl}_pageId|" type="hidden" th:name="|${entityName}.pageId|" th:value="${pageId}"><!--  使用方式 -->
                <input th:id="|${entityNameBussRepoSecPtl}_secAcctIdElement|" type="hidden" th:value="${secAcctIdElement}"><!-- 父画面起息日元素Id -->
                <input th:id="|${entityNameBussRepoSecPtl}_mdateElement|" type="hidden" th:value="${mdateElement}"><!-- 父画面到期日元素Id -->
                <input th:id="|${entityNameBussRepoSecPtl}_dealCalIdElement|" type="hidden" th:value="${dealCalIdElement}"><!-- 父画面交易日历元素Id -->
                <input th:id="|${entityNameBussRepoSecPtl}_finprodMarketIdElement|" type="hidden" th:value="${finprodMarketIdElement}"><!-- 父画面交易日历元素Id -->
                <input th:id="|${entityNameBussRepoSecPtl}_finprodType|" type="hidden" th:value="${finprodType}">
                <input th:id="prinAmt_pinyun_isChange" type="hidden">
                <input th:id="prinAmt_shijian_isChange" type="hidden">
                <input th:id="prinAmt_shuliang_isChange" type="hidden">
            </div>
        </div>
    </div>
    <div class="pro-module" th:id="|${entityNameBussRepoSecPtl}_main|">
    <h3 class="pro-module-title">
        <span class="title-des" data-th-utext="#{BussRepoSecPtl.pledgeInfo}">质押券汇总信息</span>
        <i class="iconfont icon-arrow-down pro-down-icon"></i>
    </h3>
    <div>
        <table class="layui-table" th:id="|${entityNameBussRepoSecPtl}_pledgeBondTotalListDetailed|"
               th:name="|${entityNameBussRepoSecPtl}.pledgeBondListDetailed|"></table>
    </div>
    </div>
</div>

<script data-th-inline="javascript" type="text/javascript">
    var entity = eval(/*[[${entity}]]*/'');
	var BACK_LEND_DIRECTION_03 = /*[[${BACK_LEND_DIRECTION_03}]]*/'';
    var statusValid = /*[[${statusValid}]]*/'';
    var bizCode = /*[[${bizCode}]]*/'';
    var pageModel = /*[[${pageModel}]]*/'';
    var entityNameBussRepoSecPtl = /*[[${entityNameBussRepoSecPtl}]]*/'';
    var workflowId = /*[[${workflowId}]]*/'';
    var operationType = /*[[${operationType}]]*/'';
    var IS_AVERAGE_DISTRIBUTION_OF_EXPENSES = /*[[${IS_AVERAGE_DISTRIBUTION_OF_EXPENSES}]]*/'';//增加费用平均分配
</script>
<script data-th-src="@{/js/component/trade/BussRepoSecPtl.js}" type="text/javascript"></script>
</body>
</html>
