<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
    <div class="pro-module-wrap" th:id="|${entityName}_div|">
        <div class="pro-module">
            <h3 class="pro-module-title">
                <span class="title-des">人员信息</span>
                <i class="iconfont icon-arrow-down pro-down-icon"></i>
            </h3>
            <input type="hidden" th:id="|${entityName}_traderDept|" th:name="|${entityName}.traderDept|" th:value="${entity?.trader}">

            <div class="pro-module-item">
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"  >本方交易员</label>
                        <div class="layui-input-inline input-inline">
                            <input required disabled th:id="trader" th:name="trader"
                                    th:value="${entity?.trader}" class="layui-input form-input"
                                    th:placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"  >对手方</label>
                        <div class="layui-input-inline input-inline">
                            <select required th:id="counterId" th:name="counterId" parentIds="ps,finprodType2,reprivalparty"
                                    th:data-url="|@{/component/trade/TrdInvestPersonInfo002/selectCounterId}?innerTrade=${innerTrade}&counterType=${counterType}|"
                                    formatOption="false"
                                    th:initValue="${entity?.counterId}" class="layui-input form-input input-select"
                                    th:placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"  >对手方交易员</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" maxlength="60" th:id="counterTrader" th:name="counterTrader"  th:value="${entity?.counterTrader}" class="layui-input form-input "  />
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" >资金账户</label>
                        <div class="layui-input-inline input-inline">
                            <input disabled type="text" maxlength="300" th:id="acctNo" th:name="acctNo"  th:value="${entity?.acctNo}" class="layui-input form-input "

                            />
                           <!-- <select required th:id="acctNo" th:name="acctNo" parentIds="ps,finprodType2,reprivalparty"
                                    th:data-url="@{/invest/trade/pretrdrepotrade/PreTrdRepoTrade001/getAcct}"
                                    formatOption="false"
                                    th:initValue="${entity?.acctNo}" class="layui-input form-input input-select"
                                    th:placeholder="#{SysCommon.placeholder}">
                            </select>-->
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"  >资金账户名</label>
                        <div class="layui-input-inline input-inline">
                            <input disabled type="text" maxlength="300" th:id="acctName" th:name="acctName"  th:value="${entity?.acctName}" class="layui-input form-input "

                            />
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"  >资金开户行</label>
                        <div class="layui-input-inline input-inline">
                            <input disabled type="text" maxlength="300" th:id="acctBankDep" th:name="acctBankDep"  th:value="${entity?.acctBankDep}" class="layui-input form-input "  />
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"  >资金开户行支付系统行号</label>
                        <div class="layui-input-inline input-inline">
                            <input disabled type="text" maxlength="300" th:id="acctBankDepoPayno" th:name="acctBankDepoPayno"  th:value="${entity?.acctBankDepoPayno}" class="layui-input form-input "  />
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"  >托管账号</label>
                        <div class="layui-input-inline input-inline">
                          <!--  <select required name="ourdepositaccountnumber" id="ourdepositaccountnumber"
                                    class="layui-input form-input input-select"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/trade/pretrdrepotrade/PreTrdRepoTrade001/getSecAcct}"
                                    th:value="${entity?.ourdepositaccountnumber}"

                            >
                            </select>-->

                            <select required th:id="secAcctId" th:name="secAcctId" parentIds="sec_portfolioId,validPortfolioId"
                                    th:data-url="@{/invest/trade/pretrdrepotrade/PreTrdRepoTrade001/getSecAcctNew}"
                                    formatOption="false"
                                    th:initValue="${entity?.secAcctId}" class="layui-input form-input input-select"
                                    th:placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"  >托管账户户名</label>
                        <div class="layui-input-inline input-inline">
                            <input disabled type="text" maxlength="300" th:id="secAcctName" th:name="secAcctName"  th:value="${entity?.secAcctName}" class="layui-input form-input "  />
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"  >托管机构名称</label>
                        <div class="layui-input-inline input-inline">
                            <input disabled type="text" maxlength="300" th:id="registOrg" th:name="registOrg"  th:value="${entity?.registOrg}" class="layui-input form-input "  />
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <script data-th-inline="javascript" type="text/javascript">
        var WINDTYPEONE_B14 = /*[[${WINDTYPEONE_B14}]]*/'B14';
        var ENTITY_NAME = /*[[${entityName}]]*/'';
        var pageId = /*[[${pageId}]]*/'';
        var psId = /*[[${psId}]]*/'';
        var callPageId = /*[[${callPageId}]]*/'';
        var IS_AUTO_GENERATE_NEGATE_DEAL = /*[[${IS_AUTO_GENERATE_NEGATE_DEAL}]]*/'';
    </script>
    <script data-th-src="@{/js/component/trade/PreTrdBondTrdInvestPersonInfo.js}" type="text/javascript"></script>
</body>
</html>
