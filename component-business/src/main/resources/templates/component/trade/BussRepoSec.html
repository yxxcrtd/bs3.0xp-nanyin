<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<body>
<div class="pro-module-wrap" th:id="|${entityNameBussRepoSec}_main|">
    <!--质押券信息-->
    <div class="pro-module-wrap" th:id="|${entityNameBussRepoSec}_total|">
        <div class="pro-module">
            <h3 class="pro-module-title">
                                <span class="title-des"
                                      data-th-utext="#{BussRepoSec.pledgeInfo}">质押券信息</span>
                <i class="iconfont icon-arrow-down pro-down-icon"></i>
            </h3>
            <div class="pro-module-item pro-item-wrap">
                <div class="layui-form-item">
                    <div class="form-inline-wrap" id="isBondLendTrade" style="display: none">
                        <label class="layui-form-label form-label-wrap"
                               data-th-utext="#{TrdBondLendInvestTrade002.zhap}">质押劵置换安排</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" th:id="|${entityNameBussRepoSec}_exchangePledge|"
                                    th:name="|${entityNameBussRepoSec}.exchangePledge|" class="layui-input form-input input-select"
                                    placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                    th:data-result='${YES_OR_NO}' allowClear="true" formatoption="true"
                                    th:initValue="*{entity?.exchangePledge}"
                                    ></select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                               data-th-utext="#{BussRepoSec.totalPrinAmt}">汇总券面总额</label>
                        <div class="layui-input-inline input-inline">
                            <input disabled type="text" th:id="|${entityNameBussRepoSec}_totalPrinAmt|"
                                   th:name="|${entityNameBussRepoSec}.totalPrinAmt|" maxlength="16"
                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                   th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.totalPrinAmt==null?null:entity?.totalPrinAmt}">
                            <span class="input-right-show"
                                  data-th-utext="#{BussRepoSec.yuan}">元</span>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <a class="layui-btn layui-btn-sm btn-create" th:id="|${entityNameBussRepoSec}_btn_add|">
                            <i class="iconfont icon-found"></i><span
                                data-th-utext="#{BussRepoSec.add}">添加</span></a>
                        <a class="layui-btn layui-btn-sm btn-delete" th:id="|${entityNameBussRepoSec}_btn_delete|">
                            <i class="iconfont icon-delete"></i><span
                                data-th-utext="#{BussRepoSec.delete}">删除</span></a>
                  		<span id="EtrRepo002_auto_pledge_div" style="display: none">
                  			&nbsp;&nbsp;
                       		<a class="layui-btn layui-btn-sm btn-create" th:id="|${entityNameBussRepoSec}_auto_pledge|">
                            	<i class="iconfont icon-quanka"></i>
                            	<span data-th-utext="#{BussRepoSec.auto.pledge}">自动导入质押券</span>
                      		</a>
                      	</span>
                    </div>
                </div>
                <div>
                    <table class="layui-table" th:id="|${entityNameBussRepoSec}_pledgeBondTotalList|"
                           th:name="|${entityNameBussRepoSec}.pledgeBondList|"></table>
                    <input type="hidden" th:id="|${entityNameBussRepoSec}_ps|" th:name="|${entityNameBussRepoSec}.ps|"></input>
                    <!-- add by gaopeng 2019/10/12 添加委托代码回显 start -->
                    <input type="hidden" th:id="|${entityNameBussRepoSec}_entrustId|" th:name="|${entityNameBussRepoSec}.entrustId|" th:value="${entrustId}"></input>
                    <!-- add by gaopeng 2019/10/12 end -->
                    <input type="hidden" th:id="|${entityNameBussRepoSec}_pageFrom|" th:name="|${entityNameBussRepoSec}.pageFrom|" th:value="${pageFrom}"></input>
                </div>
            </div>
        </div>
    </div>
</div>

<script data-th-inline="javascript" type="text/javascript">
    var entity = eval(/*[[${entity}]]*/'');
	var BACK_LEND_DIRECTION_03 = /*[[${BACK_LEND_DIRECTION_03}]]*/'';
    var statusValid = /*[[${statusValid}]]*/'';
    var bizCode = /*[[${bizCode}]]*/'';
    var pageModel = /*[[${pageModel}]]*/'';
    var entityNameBussRepoSec = /*[[${entityNameBussRepoSec}]]*/'';
    var workflowId = /*[[${workflowId}]]*/'';
    var operationType = /*[[${operationType}]]*/'';
    var tradeMarketId = /*[[${tradeMarketId}]]*/'';
    var isBondLendTrade = /*[[${isBondLendTrade}]]*/'';
</script>
<script data-th-src="@{/js/component/trade/BussRepoSec.js}" type="text/javascript"></script>
</body>
</html>
