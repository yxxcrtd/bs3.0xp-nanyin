<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="pro-module-wrap" th:id="|${entityName}_div|">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des" >产品投向</span><iclass="iconfont icon-arrow-down pro-down-icon"></i></h3>

        <div class="pro-module-item">
            <div class="layui-form-item">

                    <label class="layui-form-label form-label-wrap" style="width: 9%;" data-th-utext="#{BussFinProductInvest.remark}">投资范围及方向</label>

                   <div class="layui-input-inline input-inline" style="width: 88%!important;">
							<textarea th:id="|${entityName}_remark|" th:name="|${entityName}.remark|"
								class="layui-textarea" placeholder="请输入" maxlength=1000 data-th-text="${entity?.remark}"></textarea>
						</div>
                </div>
            </div>
        </div>
    </div>
</div>

    var investInfoEntityName = /*[[${entityName}]]*/'';
