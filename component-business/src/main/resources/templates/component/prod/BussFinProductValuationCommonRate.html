<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="pro-module-wrap" th:id="|${entityName}_div|">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">估值信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
        <input type="text" th:id="|${entityName}_profitType|" th:name="|${entityName}.profitType|" hidden>
        <input type="text" th:name="|${entityName}.pageId|" data-th-value='${pageId}' hidden>
        <div class="pro-module-item">
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{ValuactionInfo.unitvalueDec1}">单位估值小数位</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_unitvalueDec|" th:name="|${entityName}.unitvalueDec|" th:value="${entity?.unitvalueDec}" class="layui-input form-input text-number" data-textrange="0" data-fixtype="1" maxlength=2  required/>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">单位估值尾差处理方式</label>
                    <!-- <label class="layui-form-label form-label-wrap" data-th-utext="#{ValuactionInfo.unitvalueMode1}">单位估值尾差处理方式</label> -->
                    <!-- 2019-9-4 10:59:15 yangxiaofeng 单位估值尾数处理方式改为单位估值尾差处理方式 -->
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_unitvalueMode|" th:name="|${entityName}.unitvalueMode|" searchable="false" data-th-data-result="${MANTISSA_PROCESS_MODE}" th:initValue="${entity?.unitvalueMode}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{ValuactionInfo.milionProfitDec1}">年化收益小数位</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_milionProfitDec|" th:name="|${entityName}.milionProfitDec|" th:value="${entity?.milionProfitDec}" data-textrange="0" data-fixtype="1" maxlength=2 class="layui-input form-input text-number" required/>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <!-- <label class="layui-form-label form-label-wrap" data-th-utext="#{ValuactionInfo.milionProfitDecMode1}">年化收益尾差处理方式</label> -->
                    <!-- 2019-9-4 10:59:15 yangxiaofeng 年化收益尾数处理方式改为年化收益尾差处理方式 -->
                    <label class="layui-form-label form-label-wrap">年化收益尾差处理方式</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_milionProfitDecMode|" th:name="|${entityName}.milionProfitDecMode|" th:initValue="${entity?.milionProfitDecMode}" searchable="false" data-th-data-result="${MANTISSA_PROCESS_MODE}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{ValuactionInfo.rateDec}">利率小数位</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_rateDec|" th:name="|${entityName}.rateDec|" th:value="${entity?.rateDec}" data-textrange="0" data-fixtype="1" maxlength=2 class="layui-input form-input text-number"/>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">利率尾差处理方式</label>
                    <!-- 2019-9-4 10:59:15 yangxiaofeng 利率处理方式改为利率尾差处理方式 -->
                    <!-- <label class="layui-form-label form-label-wrap" data-th-utext="#{ValuactionInfo.ratevalueMode}">利率尾差处理方式</label> -->
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_ratevalueMode|" th:name="|${entityName}.ratevalueMode|" data-th-data-result="${MANTISSA_PROCESS_MODE}" th:initValue="${entity?.ratevalueMode}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" searchable="false">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap"  th:id="|${entityName}_dealLossModeDiv|">
                 <label class="layui-form-label form-label-wrap" data-th-utext="#{ValuactionInfo.dealLossMode}">当期亏损处理</label>
                    <div class="layui-input-inline input-inline">
                       <select th:id="|${entityName}_dealLossMode|" th:name="|${entityName}.dealLossMode|"
                               data-th-data-result="${LOSS_HANDLE_MODE}" th:initValue="${entity?.dealLossMode}"
                               class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" searchable="false" required/>
                     </div>
                     <!--
                 &lt;!&ndash;
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{ValuactionInfo.isCountingCurInt}">托管活期利息计提</label>
                    <div class="layui-input-inline input-inline">
                        <input type="checkbox" th:id="|${entityName}_isCountingCurInt|" th:name="|${entityName}.isCountingCurInt|" lay-skin="switch" th:value="${YES}" lay-text="是|否" th:checked="${entity?.isCountingCurInt ne 'N'}">
                    </div>&ndash;&gt;
                </div>-->
            </div>
        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var NET_WORTH = /*[[${PROFIT_TYPE_01}]]*/'01';//收益类型 - 净值型
    var EXPECTED_RETURN = /*[[${PROFIT_TYPE_02}]]*/'02';//预期收益
    var CURRENCY = /*[[${PROFIT_TYPE_03}]]*/'03';//货币
    var STRUCT_PRO = '04';//结构化产品
    var MANT_PROC_MODE = /*[[${MANTISSA_PROCESS_MODE_01}]]*/'01'; //四舍五入
    var profitTypeElement = /*[[${profitTypeElement}]]*/'profitType';
    var valuationInfoEntityName = /*[[${entityName}]]*/'';
    var v_milionProfitDec = /*[[${entity?.milionProfitDec}]]*/;
    var v_unitvalueDec = /*[[${entity?.unitvalueDec}]]*/;
    var v_milionProfitDecMode = /*[[${entity?.milionProfitDecMode}]]*/;
    var v_unitvalueMode = /*[[${entity?.unitvalueMode}]]*/;
    var v_ratevalueMode = /*[[${entity?.ratevalueMode}]]*/;
</script>
<script data-th-src="@{/js/component/prod/BussFinProductValuationCommonRate.js}" type="text/javascript"></script>
</body>

</html>
