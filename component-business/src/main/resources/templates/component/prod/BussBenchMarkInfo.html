<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
<style>
.rate-inline-wrapper .select2-container{
width: 33%!important;
}
</style>
</head>
<body>
<div th:id="|${entityName}_div|" class="pro-module-wrap">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des" th:text="#{BussBenchMarkInfo}">业绩基准</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
        <div class="pro-module-item">
        	<input th:id="|${entityName}_workflowId|" type="hidden" th:value="${workflowId}"><!-- 工作流代码 -->
        	<input type="text" th:name="|${entityName}.pageId|" data-th-value='${pageId}' style="display: none;">
            <div class="layui-form-item">
            	<div class="form-inline-wrap" th:id="|${entityName}_div1|">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussBenchMarkInfo.publishType}"></label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_publishType|"
							th:name="|${entityName}.publishType|"
							class="layui-input form-input input-select"
							data-th-initValue="${pageModel} eq ${pageModelNew} ? '02' : ${entity?.publishType}"
							data-th-data-result="${SVR_YES_OR_NO}" searchable="false"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}">
						</select>
                    </div>
                </div>
                <div class="form-inline-wrap" id="rateTypeDiv">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussBenchMarkInfo.rateType}"></label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_rateType|"
							th:name="|${entityName}.rateType|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.rateType}"
							data-th-data-result="${INT_TYPE}" searchable="false"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}">
						</select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussBenchMarkInfo.rate}"></label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_rate|"
									th:name="|${entityName}.rate|" length="5"
									th:value="${entity?.rate}"
									class="layui-input form-input text-number" data-textrange="4" />
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style="width: 100%!important;">
                    <label class="layui-form-label form-label-wrap" style="width: 11.9%!important;" th:text="|#{BussBenchMarkInfo.indexId}=|">浮动利率(%)=</label>
                    <div class="layui-input-inline input-inline rate-inline-wrap rate-inline-wrapper" style="width: 85%!important;">
                        <select th:id="|${entityName}_indexId|"
							th:name="|${entityName}.indexId|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.indexId}"
							data-th-data-result="${INDEX_ID_SOURCE}" searchable="true"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}">
						</select>
                    	<span class="rate-text" th:text="#{BussBenchMarkInfo.coefficient}"></span>
                        <input type="text" th:id="|${entityName}_coefficient|"
									th:name="|${entityName}.coefficient|" maxlength="11"
									th:value="${entity?.coefficient}"
									class="layui-input form-input text-number" style="display:inline-block;width: 143px;" data-textrange="2" />
	                    <span class="rate-text" th:text="#{BussBenchMarkInfo.spreadRate}"></span>
                        <input type="text" th:id="|${entityName}_spreadRate|"
									th:name="|${entityName}.spreadRate|" maxlength="11"
									th:value="${entity?.spreadRate}"
									class="layui-input form-input text-number" style="display:inline-block;width: 180px;" data-textrange="4" />
                    </div>
				</div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussBenchMarkInfo.resetType}"></label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_resetType|"
							th:name="|${entityName}.resetType|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.resetType}"
							data-th-data-result="${EFFECTIVE_RULE}" searchable="false"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"
							>
						</select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item" th:id="|${entityName}_div2|">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussBenchMarkInfo.rateLower}"></label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_rateLower|"
									th:name="|${entityName}.rateLower|" length="5"
									th:value="${entity?.rateLower}"
									class="layui-input form-input text-number" data-textrange="4" />
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussBenchMarkInfo.rateLimit}"></label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_rateLimit|"
									th:name="|${entityName}.rateLimit|" length="5"
									th:value="${entity?.rateLimit}"
									class="layui-input form-input text-number" data-textrange="4" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
	    var INT_TYPE_01 = /*[[${INT_TYPE_01}]]*/'01'; // 数据字典.利率类型_固定利率
	    var PROFIT_TYPE_01 = /*[[${PROFIT_TYPE_01}]]*/'01';//净值型
	    var PROFIT_TYPE_02 = /*[[${PROFIT_TYPE_02}]]*/'02';
	    var profitType = /*[[${profitType}]]*/;
	    var benchMarkInfoEntityName = /*[[${entityName}]]*/'bussBenchMarkInfoDto'; // 实体类字段名
	    var dealModeElement=/*[[${dealModeElement}]]*/; //产品处理模式
	    var DISPOSE_PATTERN_11=/*[[${DISPOSE_PATTERN_11}]]*/; //产品处理模式 分档
	    var PUBLISH_TYPE_01 = /*[[${PUBLISH_TYPE_01}]]*/'01'; // 披露类型.区间披露
	    var BASE_RULE_TYPE_01 = '01';
        var DISPOSE_PATTERN_10 = /*[[${DISPOSE_PATTERN_10}]]*/'10'; //产品处理模式 分档
	    var periodElement = /*[[${periodElement}]]*/; //期限品种
	    var TERM_TYPE_02 = /*[[${TERM_TYPE_02}]]*/; //期限品种 02 
	    var PUBLISH_TYPE_02 = /*[[${PUBLISH_TYPE_02}]]*/'02'; // 披露类型.单值披露
	</script>
	<script data-th-src="@{/js/component/prod/BussBenchMarkInfo.js}" type="text/javascript"></script>
</div>
</body>

</html>
