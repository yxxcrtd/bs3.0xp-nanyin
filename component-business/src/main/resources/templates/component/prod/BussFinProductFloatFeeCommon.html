<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="pro-module-wrap" th:id="|${entityName}_div|">
    <div class="pro-module" th:id="|${entityNameFloat}_div|">
        <h3 class="pro-module-title"><span class="title-des" th:text="#{BussFinProductFloatFee}">浮动管理费</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
        <div class="pro-module-item">
        	<input th:id="|${entityNameFloat}_workflowId|" type="hidden" th:value="${workflowId}"><!-- 工作流代码 -->
        	<input type="text" th:name="|${entityNameFloat}.pageId|" data-th-value='${pageId}' style="display: none;">
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussBenchMarkInfo.rateType}"></label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityNameFloat}_rateType|"
							th:name="|${entityNameFloat}.rateType|"
							class="layui-input form-input input-select"
							th:initValue="${entity_float?.rateType}"
							data-th-data-result="${INT_TYPE}" searchable="false"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}">
						</select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussBenchMarkInfo.rate}"></label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityNameFloat}_rate|"
									th:name="|${entityNameFloat}.rate|" length="5"
									th:value="${entity_float?.rate}"
									class="layui-input form-input text-number" data-textrange="4" />
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style="width: 100%!important;">
                    <label class="layui-form-label form-label-wrap" style="width: 11.9%!important;" th:text="|#{BussBenchMarkInfo.indexId}=|">浮动利率(%)=</label>
                    <div class="layui-input-inline input-inline rate-inline-wrap rate-inline-wrapper" style="width: 85%!important;">
                        <select th:id="|${entityNameFloat}_indexId|"
							th:name="|${entityNameFloat}.indexId|"
							class="layui-input form-input input-select"
							th:initValue="${entity_float?.indexId}"
							data-th-data-result="${INDEX_ID_SOURCE}" searchable="true"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}">
						</select>
                    	<span class="rate-text" th:text="#{BussBenchMarkInfo.coefficient}"></span>
                        <input type="text" th:id="|${entityNameFloat}_coefficient|"
									th:name="|${entityNameFloat}.coefficient|" length="5"
									th:value="${entity_float?.coefficient}"
									class="layui-input form-input text-number" style="display:inline-block;width: 143px;" data-textrange="2" />
	                    <span class="rate-text" th:text="#{BussBenchMarkInfo.spreadRate}"></span>
                        <input type="text" th:id="|${entityNameFloat}_spreadRate|"
									th:name="|${entityNameFloat}.spreadRate|" length="5"
									th:value="${entity_float?.spreadRate}"
									class="layui-input form-input text-number" style="display:inline-block;width: 180px;" data-textrange="4" />
                    </div>
				</div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussBenchMarkInfo.resetType}"></label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityNameFloat}_resetType|"
							th:name="|${entityNameFloat}.resetType|"
							class="layui-input form-input input-select"
							th:initValue="${entity_float?.resetType}"
							data-th-data-result="${EFFECTIVE_RULE}" searchable="false"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"
							>
						</select>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="pro-module">
        <div class="pro-module-item">
        	<input th:id="|${entityName}_workflowId|" type="hidden" th:value="${workflowId}"><!-- 工作流代码 -->
        	<input type="text" th:name="|${entityName}.pageId|" data-th-value='${pageId}' style="display: none;">
        	<input type="text" th:name="|${entityName}.entityName|" data-th-value='${entityName}' hidden>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductFloatFee.feeName}">费用名称</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_feeId|"
							th:name="|${entityName}.feeId|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.feeId}" searchable="false"
							data-th-data-url="@{/component/prod/BussFinProductFloatFee/queryFeeNameInfoList}"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductFloatFee.basicBill}">计费基数</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_basicBill|"
							th:name="|${entityName}.basicBill|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.basicBill}" searchable="false"
							data-th-data-result="${BILL_BASE_FEE_KIND}"
							placeholder="请输入内容" disabled
							data-th-placeholder="#{SysCommon.placeholder}">
						</select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductFloatFee.basis}">计息基础</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_basis|"
							th:name="|${entityName}.basis|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.basis}" searchable="false"
							data-th-data-result="${BASIS}"
							placeholder="请输入内容" disabled
							data-th-placeholder="#{SysCommon.placeholder}">
						</select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item" id="hidediv1">
            	<div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductFloatFee.netAssetValueDay}">资产净值日</label>
                    <div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_netAssetValueDay|"
							th:name="|${entityName}.netAssetValueDay|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.netAssetValueDay}" searchable="false"
							data-th-data-result="${BASE_DATE_TYPE}" disabled
							placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductFloatFee.accrType}">计提方式</label>
                    <div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_accrType|"
							th:name="|${entityName}.accrType|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.accrType}" searchable="false"
							data-th-data-result="${DRAW_TYPE}"
							placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
                    </div>
                </div>
                <div class="form-inline-wrap" id="floatBaseRuleDiv">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductFloatFee.floatBaseRule}">业绩基准规则</label>
                    <div class="layui-input-inline input-inline">
                        <!-- 一体化对应etliu -->
                        <!-- <select th:id="|${entityName}_floatBaseRule|"
							th:name="|${entityName}.floatBaseRule|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.floatBaseRule}" searchable="false"
							data-th-data-result="${ACHIEVEMENT_BENCHMARK_RULE}"
							placeholder="请输入内容" disabled
							data-th-placeholder="#{SysCommon.placeholder}">
						</select> -->
						<select th:id="|${entityName}_floatBaseRule|"
							th:name="|${entityName}.floatBaseRule|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.floatBaseRule}" searchable="false"
							data-th-data-result="${FLOAT_CALC_RULE}"
							placeholder="请输入内容" disabled
							data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
                    </div>
                </div>
            </div>
             <div class="layui-form-item" id="hidediv2">
            	
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductFloatFee.interValRule}">区间规则</label>
                    <div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_interValRule|"
							th:name="|${entityName}.interValRule|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.interValRule}" searchable="false"
							data-th-data-result="${FREQUENCY_UNIT}"
							placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
                    </div>
                </div>
                <div class="form-inline-wrap">
            	<label class="layui-form-label form-label-wrap" th:text="#{BussFinProductFloatFee.fAccrEndDate}">首个计提区间结束日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_fAccrEndDate|" th:name="|${entityName}.fAccrEndDate|"
								data-th-value='${#dates.format(entity?.fAccrEndDate,"yyyy-MM-dd")}' disabled
								class="layui-input form-input input-dateSelect" />
                    </div>
            	</div>
            	<div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductFloatFee.accrTdayRule}">计提营业日准则</label>
                    <div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_accrTdayRule|"
							th:name="|${entityName}.accrTdayRule|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.accrTdayRule}" searchable="false"
							data-th-data-result="${TDAY_RULE}"
							placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
                    </div>
                </div>
                
                </div>
                
                <div class="layui-form-item">
                <div class="form-inline-wrap" >
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductFloatFee.provisionFirstDay1}">首次计提日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_provisionFirstDay|" th:name="|${entityName}.provisionFirstDay|"
								data-th-value='${#dates.format(entity?.provisionFirstDay,"yyyy-MM-dd")}' disabled
								class="layui-input form-input input-dateSelect" required />
                    </div>
                </div>
            	 <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductFloatFee.eAccrDate}">计提结束日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_eAccrDate|" th:name="|${entityName}.eAccrDate|"
								data-th-value='${#dates.format(entity?.eAccrDate,"yyyy-MM-dd")}' disabled
								class="layui-input form-input input-dateSelect"  required/>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductFloatFee.payCycle}">付费规则</label>
                    <div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_payCycle|"
							th:name="|${entityName}.payCycle|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.payCycle}" searchable="false"
							data-th-data-result="${FREQUENCY_UNIT}"
							placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
                    </div>
                </div>
            	</div>
            	<div class="layui-form-item">
            	<div class="form-inline-wrap">
            	<label class="layui-form-label form-label-wrap" th:text="#{BussFinProductFloatFee.firstPayDate}">首次付费日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_firstPayDate|" th:name="|${entityName}.firstPayDate|"
								data-th-value='${#dates.format(entity?.firstPayDate,"yyyy-MM-dd")}' disabled
								class="layui-input form-input input-dateSelect" required/>
                    </div>
            	</div>
            	<div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductFloatFee.endTdayRule}">计提营业日准则</label>
                    <div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_endTdayRule|"
							th:name="|${entityName}.endTdayRule|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.endTdayRule}" searchable="false"
							data-th-data-result="${TDAY_RULE}"
							placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductFloatFee.payTdayRule}">付费营业日准则</label>
                    <div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_payTdayRule|"
							th:name="|${entityName}.payTdayRule|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.payTdayRule}" searchable="false"
							data-th-data-result="${TDAY_RULE}"
							placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
                    </div>
                </div>
            	</div>
            <div th:id="|${entityName}_div_floatManageFee|">
            	<table class="layui-table pro-table-wrap" th:id="|${entityName}_floatManageFee|" th:title="#{BussFinProductFloatFee}" th:name="|${entityName}.finFloatCalcRuleDetailDtoList|"></table>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
	    var floatFeeEntityName = /*[[${entityName}]]*/''; // 实体类字段名
	    var profitType = /*[[${profitType}]]*/''; // 父画面收益类型
	    var PROFIT_TYPE_02 = /*[[${PROFIT_TYPE_02}]]*/'02'; // 预期收益性
	    var floatFeeFinprodId = /*[[${finprodId}]]*/''; // 金融产品代码
	    var workflowId = /*[[${workflowId}]]*/''; // 工作流代码
	    var effDate = /*[[${effDate}]]*/''; // 生效日期
	    var PROFIT_TYPE_01 = /*[[${PROFIT_TYPE_01}]]*/'01'; //净值性
	    var mdate = /*[[${mdate}]]*/''; 
	    var vdate = /*[[${vdate}]]*/''; 
	    var productBuildForm = /*[[${productBuildForm}]]*/'';
	    var operationType = /*[[${operationType}]]*/''; 
	    var dealModeElement = /*[[${dealModeElement}]]*/'';//产品处理模式
	    var INDEX_ID_SOURCE = /*[[${INDEX_ID_SOURCE}]]*/'';//利率列表
	    var DISPOSE_PATTERN_11 = /*[[${DISPOSE_PATTERN_11}]]*/'11'; //产品处理模式 分档	    
	    var INT_TYPE_01 = /*[[${INT_TYPE_01}]]*/'01'; // 数据字典.利率类型_固定利率
	    var parentProfitType = /*[[${profitType}]]*/''; // 父画面收益类型 ADD BY ON YANYA 20190920
	    var DISPOSE_PATTERN_10 = /*[[${DISPOSE_PATTERN_10}]]*/'10'; //产品处理模式 周期
	    var periodElement = /*[[${periodElement}]]*/; //期限品种
	    var TERM_TYPE_02 = /*[[${TERM_TYPE_02}]]*/; //期限品种 02 
	</script>
	<script data-th-src="@{/js/component/prod/BussFinProductFloatFeeCommon.js}" type="text/javascript"></script>
	<script data-th-src="@{/js/component/prod/BussBenchMarkFloatInfo.js}" type="text/javascript"></script>
</div>
</body>

</html>
