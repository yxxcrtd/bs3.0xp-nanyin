<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<body>
	<div th:id="|${entityName}_div|" class="pro-module-wrap">
		<div class="pro-module">
			<h3 class="pro-module-title">
				<span class="title-des">产品分层信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
			</h3>
			<div class="pro-module-item">
				<input type="text" th:id="|${entityName}_pageId|" th:name="|${entityName}.pageId|" data-th-value='${pageId}' style="display: none;">
				<div class="|${entityName}_dataTable|">
					<table class="layui-table" th:id="|${entityName}_dataTable|" th:title="#{bussFinProductLayeredInfoDto.finProductPtlLayeredDtoList}" th:name="|${entityName}.finProductPtlLayeredDtoList|"></table>
				</div>
			</div>
		</div>
	</div>	
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			// 父画面传入参数
			// 组件代码
			var layeredInfoEntityName = /*[[${entityName}]]*/'';
			// 金融产品代码
			var layeredInfoFinprodId = /*[[${finprodId}]]*/'';
			// 工作流代码
			var workflowId = /*[[${workflowId}]]*/'';
			//目标客户类型
			var SALETARGET_DECLARE = /*[[${SALETARGET_DECLARE}]]*/'';	
			//销售渠道
			var SALECHANNELCHB = /*[[${SALECHANNELCHB}]]*/'';
			//销售部门
			var SALE_DEPT = /*[[${SALE_DEPT}]]*/'';
			//是或否
			var YES_OR_NO = /*[[${YES_OR_NO}]]*/'';
			//产品处理模式
			var dealModeElement = /*[[${dealModeElement}]]*/'';//父页面的id
			//是否支持代销
			var consignmentFlag = /*[[${consignmentFlag}]]*/'';//父页面的id
			//收益类型id
			var profitTypeElement = /*[[${profitTypeElement}]]*/'';//父页面的id
			//产品款型集合
			var prodStyleArr = [];
		</script>
		<script data-th-src="@{/js/component/prod/BussFinProductLayeredInfo.js}" type="text/javascript"></script>
	</div>	
</body>
</html>
