<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
<style>
.rate-inline-wrapper .select2-container{
width: 33%!important;
}
</style>
</head>
<body>
<div id="periodDiv" class="pro-module-wrap">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des" th:text="#{BussFinProductInvestPeriod}">投资周期</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
        <div class="pro-module-item">
        	<input th:id="|${entityName}_workflowId|" type="hidden" th:value="${workflowId}"><!-- 工作流代码 -->
        	<input th:id="|${entityName}_finprodId|" type="hidden" th:value="${finprodId}"><!-- 产品代码-->
        	<input type="text" th:name="|${entityName}.pageId|" data-th-value='${pageId}' style="display: none;">
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductInvestPeriod.investDays}"></label>
                    <div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_investDays|" maxlength=4 oninput="this.value = this.value.replace(/[^0-9]/g, '');"
									th:name="|${entityName}.investDays|" length="5"
									th:value="${entity?.investDays}"
									class="layui-input form-input"/>
                    </div>
                </div>
                <div class="form-inline-wrap layui-col-md-offset2">
                	<a class="layui-btn layui-btn-sm btn-create" th:id="|${entityName}_btn_create|"><i class="iconfont icon-found"></i><span>添加</span></a>
            	</div>
            </div>
            <div class="layui-form-item">
            	<table class="layui-table" th:id="|${entityName}_period|" th:title="#{BussFinProductInvestPeriod.bussFinProductInvestPeriodDtoList}" th:name="|${entityName}.bussFinProductInvestPeriodDtoList|"></table>
            </div>
            
        </div>
    </div>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
	    var INT_TYPE_01 = /*[[${INT_TYPE_01}]]*/'01'; // 数据字典.利率类型_固定利率
	    var PROFIT_TYPE_01 = /*[[${PROFIT_TYPE_01}]]*/'01';//净值型
	    var PROFIT_TYPE_02 = /*[[${PROFIT_TYPE_02}]]*/'02';
	    var profitType = /*[[${profitType}]]*/;
	    var bussFinProductInvestPeriodEntityName = /*[[${entityName}]]*/'bussFinProductInvestPeriodDto'; // 实体类字段名
	    
	    var INT_TYPE = /*[[${INT_TYPE}]]*/'[]'; //利率类型
	    var EFFECTIVE_RULE = /*[[${EFFECTIVE_RULE}]]*/'[]'; //业绩基准重置规则
	    var dealModeElement=/*[[${dealModeElement}]]*/; //产品处理模式
	    var DISPOSE_PATTERN_11=/*[[${DISPOSE_PATTERN_11}]]*/; //产品处理模式 分档
	    var PROD_STYLE_1 = ''; 
	    var PUBLISH_TYPE_01 = /*[[${PUBLISH_TYPE_01}]]*/'01'; // 披露类型.区间披露
	</script>
	<script data-th-src="@{/js/component/prod/BussFinProductInvestPeriod.js}" type="text/javascript"></script>
</div>
</body>

</html>
