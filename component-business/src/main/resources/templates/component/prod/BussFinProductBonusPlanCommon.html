<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
<style>
.rate-inline-wrapper1 .select2-container{
	width: 100px!important;
	vertical-align: bottom;
}
</style>
</head>
<body>
<div th:id="|${entityName}_div|" class="pro-module-wrap">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">分红计划</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
        <div class="pro-module-item">
        	<input type="text" th:name="|${entityName}.pageId|" data-th-value='${pageId}' hidden>
        	<input type="text" th:id="|${entityName}_profitType|" data-th-value='${profitType}' hidden>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                <!--  
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductBonusPlan.payType}"></label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_payType|"
							th:name="|${entityName}.payType|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.payType}"
							data-th-data-result="${BONUS_MODE}" searchable="false"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-required="${pageId} eq 'FinProductBuild002'">
						</select>
                    </div>-->
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductBonusPlan.payRule}"></label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_payCycle|"
							th:name="|${entityName}.payCycle|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.payCycle}"
							data-th-data-result="${BONUS_RULE}" searchable="false"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-required="true">
						</select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductBonusPlan.payCycle}"></label>
                    <div class="layui-input-inline input-inline rate-inline-wrap rate-inline-wrapper1">
                        <input type="text" th:id="|${entityName}_payCycleVal|"
									th:name="|${entityName}.payCycleVal|" maxlength=10
									th:value="${entity?.payCycleVal}"
									class="layui-input form-input text-number" style="display:inline-block;width:50px;" data-textrange="0" />
                        <select th:id="|${entityName}_payCycleUnit|"
							th:name="|${entityName}.payCycleUnit|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.payCycleUnit}"
							data-th-data-result="${FREQUENCY_UNIT}" searchable="false"
							placeholder="请输入内容" formatoption="false"
							data-th-placeholder="#{SysCommon.placeholder}">
						</select>
                    </div>
                </div>
         
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductBonusPlan.calcRule}"></label>
                    <div class="layui-input-inline input-inline">
                        <!-- - <select th:id="|${entityName}_calcRule|"
							th:name="|${entityName}.calcRule|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.calcRule}"
							data-th-data-result="${CALC_METHOD}" searchable="false"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}">
						</select> -->
						<select th:id="|${entityName}_calcRule|"
							th:name="|${entityName}.calcRule|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.calcRule}"
							data-th-data-result="${CALC_RULE}" searchable="false"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}">
						</select>
                    </div>
                </div>
                   </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" th:if="${pageId} eq 'FinProductBuild002' or ${pageId} eq 'FinNetValueProductBuild002'">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductBonusPlan.firstPayDate}"></label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_firstPayDate|"
                        	th:name="|${entityName}.firstPayDate|"
							th:value='${#dates.format(entity?.firstPayDate,"yyyy-MM-dd")}'
							class="layui-input form-input input-dateSelect" />
						</select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductBonusPlan.endTDayRule}"></label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_endTdayRule|"
							th:name="|${entityName}.endTdayRule|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.endTdayRule}"
							data-th-data-result="${TDAY_RULE}" searchable="false"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}" 
							data-th-childrenIds="|${entityName}_payTdayRule|" 
							>
						</select>
                    </div>
                </div>
                <!-- 
            </div>
            <div class="layui-form-item"> -->
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductBonusPlan.payTDayRule}"></label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_payTdayRule|"
							th:name="|${entityName}.payTdayRule|"
							class="layui-input form-input input-select"
							th:initValue="${entity?.payTdayRule}"
							data-th-data-result="${TDAY_RULE}" searchable="false"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}" >
						</select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item" th:id="|${entityName}_planDiv|" >
        		<div style="padding-left: 10px;">
	        		<a th:id="|${entityName}_btn_preview|" class="layui-btn layui-btn-sm" data-icon="iconfont icon-search">计划生成</a>
        		</div>
	        	<table class="layui-table" th:id="|${entityName}_dataTable|" th:name="|${entityName}.cashPlanList|"></table>
				<!-- JS中使用的参数，为了不造成命名冲突，使用隐藏域的方式 -->
				<input th:id="|${entityName}_vdateElement|" type="hidden" th:value="${vdateElement}">
				<input th:id="|${entityName}_mdateElement|" type="hidden" th:value="${mdateElement}">
				<input th:id="|${entityName}_calendarIdElement|" type="hidden" th:value="${calendarIdElement}">
				<input th:id="|${entityName}_pageId|" th:name="|${entityName}.pageId|" type="hidden" th:value="${pageId}">
	        </div>
        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
	var BONUS_RULE_01 = /*[[${BONUS_RULE_01}]]*/'01';
	var BONUS_RULE_02 = /*[[${BONUS_RULE_02}]]*/'02';
	var BONUS_RULE_03 = /*[[${BONUS_RULE_03}]]*/'03';
	var BONUS_RULE_04 = /*[[${BONUS_RULE_04}]]*/'04';
	var BONUS_RULE_05 = /*[[${BONUS_RULE_05}]]*/'05';
	var PROFIT_TYPE_02 = /*[[${PROFIT_TYPE_02}]]*/'02';
	var BONUS_MODE_01 = /*[[${BONUS_MODE_01}]]*/'01';
	var CAL_RULE_05 = /*[[${CAL_RULE_05}]]*/'05';
	var CAL_RULE_01 = /*[[${CAL_RULE_01}]]*/'01';
	var TDAY_RULE_04 = /*[[${TDAY_RULE_04}]]*/'04';
	var TDAY_RULE_02 = /*[[${TDAY_RULE_02}]]*/'02';
	var PROFIT_TYPE_03 = /*[[${PROFIT_TYPE_03}]]*/'03';
	var bussFinProductBonusPlanEntityName = /*[[${entityName}]]*/'bussFinProductBonusPlanDto'; // 实体类字段名
	var payPlanFinprodId = /*[[${finprodId}]]*/'';
	//定义规则临时值
	var vdateBounse = '';
	var mdateBounse = '';
	var calendarIdBounse = '';
	var payTypeBounse = '';
	var payCycleBounse = '';
	var payCycleValBounse = '';
	var payCycleUnitBounse = '';
	var calcRuleBounse = '';
	var endTdayRuleBounse = '';
	var payTdayRuleBounse = '';
	var firstPayDateBounse = '';
</script>
<script data-th-src="@{/js/component/prod/BussFinProductBonusPlanCommon.js}" type="text/javascript"></script>
</body>

</html>
