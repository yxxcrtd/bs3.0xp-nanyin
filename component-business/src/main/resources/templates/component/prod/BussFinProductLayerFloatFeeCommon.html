<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<div layout:fragment="content">
	<div class="pro-module-wrap" th:id="|${entityName}_Layerdiv|">
	    <div class="pro-module">
	        <h3 class="pro-module-title"><span class="title-des">浮动管理费信息</span>
	            <a class="layui-btn layui-btn-sm btn-create" th:id="|${entityName}_btn_create|"><i class="iconfont icon-found"></i><span>新增</span></a>
	            <i class="iconfont icon-arrow-down pro-down-icon"></i>
	        </h3>
	        <div class="pro-module-item">
	        	<input th:id="|${entityName}_profitTypeElement|" type="hidden" th:value="${profitType}"><!-- 父画面起息日元素Id -->
				<input th:id="|${entityName}_vdateElement|" type="hidden" th:value="${vdate}"><!-- 父画面起息日元素Id -->
				<input th:id="|${entityName}_mdateElement|" type="hidden" th:value="${mdate}"><!-- 父画面到期日元素Id -->
				<input th:id="|${entityName}_dealModeElement|" type="hidden" th:value="${dealMode}"><!-- 父画面处理模式元素Id-->
	        	<div class="pro-module-item">
	        		<table class="layui-table" th:id="|${entityName}_floatfeeInfo|" th:title="#{bussFinProductFeeInfoDto.bussFinProductFeeInfoDtoList}" th:name="|${entityName}.bussFinProductFloatFeeInfoDtoList|"></table>
	        	</div>
	        </div>
	    </div>
	</div>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
	    var floatFeeEntityName = /*[[${entityName}]]*/''; // 实体类字段名
	    var profitType = /*[[${profitType}]]*/''; // 父画面收益类型
	    var PROFIT_TYPE_02 = /*[[${PROFIT_TYPE_02}]]*/'02'; // 预期收益性
	    var finprodId = /*[[${finprodId}]]*/''; // 金融产品代码
	    var workflowId = /*[[${workflowId}]]*/''; // 工作流代码
	    var effDate = /*[[${effDate}]]*/''; // 生效日期
	    var PROFIT_TYPE_01 = /*[[${PROFIT_TYPE_01}]]*/'01'; //净值性
	    var mdate = /*[[${mdate}]]*/''; 
	    var vdate = /*[[${vdate}]]*/''; 
	    var productBuildForm = /*[[${productBuildForm}]]*/''; 
	    var pageId = /*[[${pageId}]]*/''; 
	    var BILL_BASE_FEE_KIND = /*[[${BILL_BASE_FEE_KIND}]]*/'';//计费基数
	    var BASIS = /*[[${BASIS}]]*/'';//计费基础
	    var BASE_DATE_TYPE = /*[[${BASE_DATE_TYPE}]]*/'';//计费基数
	    // var BASE_DATE_TYPE = /*[[${BASE_DATE_TYPE}]]*/'';//资产净值日
	    var FREQUENCY_UNIT = /*[[${FREQUENCY_UNIT}]]*/'';//区间规则
	    var DRAW_TYPE = /*[[${DRAW_TYPE}]]*/'';//计提方式
	    var TDAY_RULE = /*[[${TDAY_RULE}]]*/'';//营业日准则
	    var dealModeElement = /*[[${dealModeElement}]]*/'';//产品处理模式
	    var DISPOSE_PATTERN_11 = /*[[${DISPOSE_PATTERN_11}]]*/'11'; //产品处理模式 分档
	    var DISPOSE_PATTERN_10 = /*[[${DISPOSE_PATTERN_10}]]*/'10'; //产品处理模式 周期
	    var periodElement = /*[[${periodElement}]]*/; //期限品种
	    var TERM_TYPE_02 = /*[[${TERM_TYPE_02}]]*/; //期限品种 02 
	</script>
	<script data-th-src="@{/js/component/prod/BussFinProductLayerFloatFeeCommon.js}" type="text/javascript"></script>
</div>
</body>

</html>
