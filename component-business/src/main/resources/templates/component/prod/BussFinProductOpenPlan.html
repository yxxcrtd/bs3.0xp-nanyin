<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<body>
	<div th:id="|${bussFinProductOpenPlanDto}_div|" class="pro-module-wrap">
		<div class="pro-module">
			<h3 class="pro-module-title">
				<span class="title-des">开放计划信息</span>（<span class="star-sign">*</span>必填）<i
					class="iconfont icon-arrow-down pro-down-icon"></i>
			</h3>
			<input type="text" th:id="|${bussFinProductOpenPlanDto}_dealMode|" th:name="|${bussFinProductOpenPlanDto}.dealMode|" hidden>
			<input type="text" th:name="|${bussFinProductOpenPlanDto}.pageId|" data-th-value="${pageId}" hidden>
			<div class="pro-module-item">
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							th:text="#{FinProductOpenRule.openMode}">开放模式</label>
						<div class="layui-input-inline input-inline">
							<select th:id="|${bussFinProductOpenPlanDto}_openMode|"
								th:name="|${bussFinProductOpenPlanDto}.openMode|"
								class="layui-input form-input input-select"
								th:initValue="${pageModel} eq ${pageModelNew} ? ${OPENMODE_01} : ${entity?.openMode}"
								data-th-data-result="${OPENMODE}" searchable="false"
								placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-required="${pageId} eq 'FinProductBuild002'">
							</select>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="form-inline-wrap" style="padding-left: 7.3%;width: 98%;">
						<div class="form-day-wrap">
							<label class="layui-form-label form-label-wrap"
								th:text="#{FinProductOpenRule.openDays}" style="width: auto!important;">开放天数</label>
							<div class="layui-input-inline input-inline" style="width: 60px!important;padding-left:3px;">
								<input type="text" th:id="|${bussFinProductOpenPlanDto}_openDays|"
									th:name="|${bussFinProductOpenPlanDto}.openDays|" length="3"
									th:value="${pageModel} eq ${pageModelNew} ? '1' : ${entity?.openDays}"
									class="layui-input form-input text-number" data-textrange="0"/>
									<span class="input-right-show">天</span>
							</div>
						</div>
						<div class="form-day-wrap">
							<label class="layui-form-label form-label-wrap"
							th:text="#{FinProductOpenRule.openCycle}" style="width: auto!important;padding-left: 20px;">开放周期</label>
							<div class="layui-input-inline input-inline" style="width: 143px!important;">
								<input th:id="|${bussFinProductOpenPlanDto}_openCycle|"
									th:name="|${bussFinProductOpenPlanDto}.openCycle|"
									style="width: 75px; float: left; border-right: none;"
									class="layui-input form-input text-number" data-textrange="0"
									placeholder="请输入内容" th:value="${entity?.openCycle}"
									data-th-placeholder="#{SysCommon.placeholder}">
								<div style="width: 60px; float: left;">
									<select th:id="|${bussFinProductOpenPlanDto}_openCycleUnit|"
										th:name="|${bussFinProductOpenPlanDto}.openCycleUnit|"
										class="layui-input form-input input-select"
										searchable="false" formatoption="false" placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-data-result="${PERIOD_UNIT}" allowClear="false"
										th:initValue="${pageModel} eq ${pageModelNew} ? ${PERIOD_UNIT_01} : ${entity?.openCycleUnit}">
									</select>
								</div>
							</div>
						</div>
						<div class="form-day-wrap">
							<label class="layui-form-label form-label-wrap" style="width: auto!important;padding-left: 20px;">周</label>
								<div class="layui-input-inline input-inline" style="width: 100px!important;">
								<select th:id="|${bussFinProductOpenPlanDto}_dayOfWeek|"
									th:name="|${bussFinProductOpenPlanDto}.dayOfWeek|"
									class="layui-input form-input input-select" disabled formatoption="false"
									th:initValue="${entity?.dayOfWeek}" data-th-data-result="${WEEK}"
									searchable="false" placeholder="请输入内容" multiple="true"
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
						<div class="form-day-wrap">
							<label class="layui-form-label form-label-wrap radio-wrap" style="width: auto!important;padding-left: 20px;">
								<input type="radio" th:name="|${bussFinProductOpenPlanDto}.openDateRadio|" value="0" th:checked="${entity?.dayOfMonth != null}" lay-filter="openDateFilter">几号
							</label>
							<div class="layui-input-inline input-inline" style="width: 100px!important;">
								<select th:id="|${bussFinProductOpenPlanDto}_dayOfMonth|"
									th:name="|${bussFinProductOpenPlanDto}.dayOfMonth|"
									class="layui-input form-input input-select" disabled
									th:initValue="${entity?.dayOfMonth}"
									data-th-data-result="${DAY_OF_MONTH}" searchable="false" formatoption="false"
									placeholder="请输入内容" multiple="true"
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
						<div class="form-day-wrap">
							<label class="layui-form-label form-label-wrap radio-wrap" style="width: auto!important;padding-left: 42px;"><input
							type="radio" th:name="|${bussFinProductOpenPlanDto}.openDateRadio|" value="1" th:checked="${entity?.workdayOfMonth != null}" lay-filter="openDateFilter">第几工作日</label>
							<div class="layui-input-inline input-inline" style="width: 100px!important;">
								<select th:id="|${bussFinProductOpenPlanDto}_workdayOfMonth|"
									th:name="|${bussFinProductOpenPlanDto}.workdayOfMonth|"
									class="layui-input form-input input-select" disabled
									th:initValue="${entity?.workdayOfMonth}" formatoption="false"
									data-th-data-result="${WORKDAY_OF_MONTH}" searchable="false"
									placeholder="请输入内容" multiple="true"
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							th:text="#{FinProductOpenRule.calcMethod}">推算方法</label>
						<div class="layui-input-inline input-inline">
							<!-- 一体化对应etliu -->
							<!-- <select th:id="|${bussFinProductOpenPlanDto}_calcMethod|" th:name="|${bussFinProductOpenPlanDto}.calcMethod|"
								th:initValue="${pageModel} eq ${pageModelNew} ? ${CALC_METHOD_01} : ${entity?.calcMethod}" searchable="false"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${CALC_METHOD}"
								data-th-required="${pageId} eq 'FinProductBuild002'">
							</select> -->
							<select th:id="|${bussFinProductOpenPlanDto}_calcMethod|" th:name="|${bussFinProductOpenPlanDto}.calcMethod|"
								th:initValue="${pageModel} eq ${pageModelNew} ? ${CALC_METHOD_01} : ${entity?.calcMethod}" searchable="false"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${CALC_RULE}"
								data-th-required="${pageId} eq 'FinProductBuild002'">
							</select>
						</div>
					</div>
					<div class="form-inline-wrap" th:if="${pageId} eq 'FinProductBuild002'">
						<label class="layui-form-label form-label-wrap"
							th:text="#{FinProductOpenRule.firstOpenDate}">首次开放日</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="|${bussFinProductOpenPlanDto}_firstOpenDate|" th:name="|${bussFinProductOpenPlanDto}.firstOpenDate|"
								data-th-value='${#dates.format(entity?.firstOpenDate,"yyyy-MM-dd")}' disabled
								class="layui-input form-input input-dateSelect" />
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							th:text="#{FinProductOpenRule.tradedayRule}">营业日准则</label>
						<div class="layui-input-inline input-inline">
							<select th:id="|${bussFinProductOpenPlanDto}_tradedayRule|" th:name="|${bussFinProductOpenPlanDto}.tradedayRule|"
								th:initValue="${pageModel} eq ${pageModelNew} ? ${TDAY_RULE_02} : ${entity?.tradedayRule}" searchable="false"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${TDAY_RULE}">
							</select>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap" th:text="#{FinProductOpenRule.calcRule}">推算规则</label>
						<div class="layui-input-inline input-inline">
						<!-- 一体化对应etliu -->
							<!-- <select th:id="|${bussFinProductOpenPlanDto}_calcRule|" th:name="|${bussFinProductOpenPlanDto}.calcRule|"
								searchable="false" class="layui-input form-input input-select"
								placeholder="请输入内容" th:initValue="${entity?.calcRule}"
								data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${CALC_RULE}">
							</select> -->
							<select th:id="|${bussFinProductOpenPlanDto}_calcRule|" th:name="|${bussFinProductOpenPlanDto}.calcRule|"
								searchable="false" class="layui-input form-input input-select"
								placeholder="请输入内容" th:initValue="${entity?.calcRule}"
								data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${CALC_METHOD}">
							</select>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap">节假日开放</label>
						<div class="layui-input-inline input-inline">
							<input type="checkbox" th:id="|${bussFinProductOpenPlanDto}_hdayOpenFlag|"
								th:name="|${bussFinProductOpenPlanDto}.hdayOpenFlag|" lay-skin="switch"
								th:value="${YES}" lay-text="是|否" lay-filter="isOpenHolidayFilter"
								data-th-checked="${YES} == ${entity?.hdayOpenFlag}"
								data-th-required="${pageId} eq 'FinProductBuild002'">
						</div>
					</div>
				</div>
				<div class="layui-form-item" th:if="${pageId} eq 'FinProductBuild002'" th:id="|${bussFinProductOpenPlanDto}_tableDiv|">
					<div style="padding-left: 10px;">
						<a th:id="|${bussFinProductOpenPlanDto}_btn_preview|"
							class="layui-btn layui-btn-sm" data-icon="iconfont icon-search">预览</a>
					</div>
					<table class="layui-table" th:id="|${bussFinProductOpenPlanDto}_dataTable|" th:name="|${bussFinProductOpenPlanDto}.finOpenPlanList|"></table>
				</div>
			</div>
		</div>
	</div>
	<script data-th-inline="javascript" type="text/javascript">
		// 业务组件自身引用
		var OPENMODE_01 = /*[[${OPENMODE_01}]]*/'01';
		var OPENMODE_02 = /*[[${OPENMODE_02}]]*/'02';
		var OPENMODE_03 = /*[[${OPENMODE_03}]]*/'03';
		var DISPOSE_PATTERN_01 = /*[[${DISPOSE_PATTERN_01}]]*/'01';
		var DISPOSE_PATTERN_03 = /*[[${DISPOSE_PATTERN_03}]]*/'03';
		var DISPOSE_PATTERN_05 = /*[[${DISPOSE_PATTERN_05}]]*/'05';
		var DISPOSE_PATTERN_06 = /*[[${DISPOSE_PATTERN_06}]]*/'06';
		var DISPOSE_PATTERN_07 = /*[[${DISPOSE_PATTERN_07}]]*/'07';
		var PERIOD_UNIT_01 = /*[[${PERIOD_UNIT_01}]]*/'01';
		var PERIOD_UNIT_02 = /*[[${PERIOD_UNIT_02}]]*/'02';
		var PERIOD_UNIT_03 = /*[[${PERIOD_UNIT_03}]]*/'03';
		var PERIOD_UNIT_04 = /*[[${PERIOD_UNIT_04}]]*/'04';
		var CALC_METHOD_01 = /*[[${CALC_METHOD_01}]]*/'01';
		var CALC_METHOD_03 = /*[[${CALC_METHOD_03}]]*/'03';
		var platDate = /*[[${platDate}]]*/'';
		var TDAY_RULE_02 = /*[[${TDAY_RULE_02}]]*/'02';
		var ISSUE_MODE_01 = /*[[${ISSUE_MODE_01}]]*/'01';
		// 父画面传入参数
		var vdate = /*[[${vdate}]]*/'';// 父画面起息日Id
		var mdate = /*[[${mdate}]]*/'';// 父画面到期日Id
		var tradCalender = /*[[${tradCalender}]]*/'';// 父画面交易日历Id
		var raiseStrDate = /*[[${raiseStrDate}]]*/'';// 父画面募集开始日Id
		var raiseEndDate = /*[[${raiseEndDate}]]*/'';// 父画面募集结束日Id
		var purConfDays = /*[[${purConfDays}]]*/'';// 父画面申购确认天数Id
		var isCycle = /*[[${isCycle}]]*/'';// 父画面是否周期型Id
		var closeTerm = /*[[${closeTerm}]]*/'';// 父画面封闭期限Id
		
		var bussFinProductOpenPlanDto = /*[[${bussFinProductOpenPlanDto}]]*/'';
		var pageId = /*[[${pageId}]]*/'';
		var operationType = /*[[${operationType}]]*/'';// 父画面开放类型Id
		var dealMode = /*[[${dealMode}]]*/'';// 父画面处理模式Id
		var openPlanFinprodId = /*[[${finprodId}]]*/'';
		var workflowId = /*[[${workflowId}]]*/'';
		var finprodId = /*[[${finprodId}]]*/'';
		
		
		
		var openModeEntityValue = /*[[${entity?.openMode}]]*/'';
	</script>
	<script data-th-src="@{/js/component/prod/BussFinProductOpenPlan.js}"
		type="text/javascript"></script>
</body>

</html>
