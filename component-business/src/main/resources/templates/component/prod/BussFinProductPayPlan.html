<html>
<body>
<!-- 付息计划 -->
<div th:id="|${entityName}_div|" class="pro-module-wrap">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des" th:text="#{BussFinProductPayPlan}">付息信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
        <div class="pro-module-item">
            <div class="layui-form-item">
                <!--<div class="form-inline-wrap">-->
                	<!-- 现金流支付规则表.支付方式 -->
                    <!-- <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductPayPlan.payType}">分红方式</label>
                    <div class="layui-input-inline input-inline">
							<select th:id="|${entityName}_payType|"
								th:name="|${entityName}.payType|" searchable="false"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${BONUS_MODE}"
								th:initValue="${entity?.payType}"
								data-th-required="${pageId} eq 'FinProductBuild002'">
							</select>
						</div>
                </div> -->
                <div class="form-inline-wrap">
                	<!-- 现金流支付规则表.支付频率 -->
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductPayPlan.payCycle}">付息规则</label>
                    <div class="layui-input-inline input-inline">
							<select th:id="|${entityName}_payCycle|"
								th:name="|${entityName}.payCycle|" searchable="false"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${INTPAY_PERIOD}"
								th:initValue="${entity?.payCycle}"
								data-th-required="${pageId} eq 'FinProductBuild002'">
							</select>
						</div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductPayPlan.payCycleVal}">付息周期</label>
                    <div class="layui-input-inline input-inline">
	                	<!-- 现金流支付规则表.支付频率值 -->
							<input th:id="|${entityName}_payCycleVal|"
								th:name="|${entityName}.payCycleVal|"
								style="width: 60%; float: left; border-right: none;"
								class="layui-input form-input text-number" data-textrange="0"
								placeholder="请输入内容" th:value="${entity?.payCycleVal}"
								data-th-placeholder="#{SysCommon.placeholder}">
							<!-- 数据字典.周期单位 -->
                		<div style="width: 40%;float:left;">
                        <!-- 一体化对应etliu -->
								<!-- <select th:id="|${entityName}_payCycleUnit|"
									th:name="|${entityName}.payCycleUnit|" searchable="false" formatoption="false"
									class="layui-input form-input input-select" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result="${PERIOD_UNIT}" allowClear="false"
									th:initValue="${entity?.payCycleUnit}">
								</select> -->
                                <select th:id="|${entityName}_payCycleUnit|"
                                    th:name="|${entityName}.payCycleUnit|" searchable="false" formatoption="false"
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${FREQUENCY_UNIT}" allowClear="false"
                                    th:initValue="${entity?.payCycleUnit}">
                                </select>
							</div>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductPayPlan.calcRule}">推算方法</label>
                    <div class="layui-input-inline input-inline">
                    		<!-- 一体化对应etliu -->
							<!-- <select th:id="|${entityName}_calcRule|"
								th:name="|${entityName}.calcRule|" searchable="false"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${CALC_METHOD}"
								th:initValue="${entity?.calcRule}">
							</select> -->
							<select th:id="|${entityName}_calcRule|"
								th:name="|${entityName}.calcRule|" searchable="false"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${CALC_RULE}"
								th:initValue="${entity?.calcRule}">
							</select>
						</div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">计息营业日准则</label>
                    <div class="layui-input-inline input-inline">
							<select th:id="|${entityName}_endTdayRule|"
								th:name="|${entityName}.endTdayRule|" searchable="false"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${TDAY_RULE}"
								th:initValue="${entity?.endTdayRule}">
							</select>
						</div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">付息营业日准则</label>
                    <div class="layui-input-inline input-inline">
							<select th:id="|${entityName}_payTdayRule|"
								th:name="|${entityName}.payTdayRule|" searchable="false"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${TDAY_RULE}"
								th:initValue="${entity?.payTdayRule}"
								data-th-required="${pageId} eq 'FinProductBuild002'">
							</select>
						</div>
                </div>
            </div>
            <div class="layui-form-item" th:if="${pageId} eq 'FinProductBuild002'">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" th:text="#{BussFinProductPayPlan.firstPayDate}">首次付息日</label>
                    <div class="layui-input-inline input-inline">
							<input th:id="|${entityName}_firstPayDate|" type="text"
								th:name="|${entityName}.firstPayDate|"
								class="layui-input form-input input-dateSelect"
								th:value='${#dates.format(entity?.firstPayDate,"yyyy-MM-dd")}' />
					</div>
                </div>
            </div>
	        <div class="layui-form-item" th:if="${pageId} eq 'FinProductBuild002'">
        		<div style="padding-left: 10px;">
	        		<a th:id="|${entityName}_btn_preview|" class="layui-btn layui-btn-sm" data-icon="iconfont icon-search">预览</a>
        		</div>
	        	<table class="layui-table" th:id="|${entityName}_dataTable|" th:name="|${entityName}.cashPlanList|"></table>
				<!-- JS中使用的参数，为了不造成命名冲突，使用隐藏域的方式 -->
				<input th:id="|${entityName}_vdateElement|" type="hidden" th:value="${vdateElement}">
				<input th:id="|${entityName}_mdateElement|" type="hidden" th:value="${mdateElement}">
				<input th:id="|${entityName}_calendarIdElement|" type="hidden" th:value="${calendarIdElement}">
				<input th:id="|${entityName}_pageId|" th:name="|${entityName}.pageId|" type="hidden" th:value="${pageId}">
	        </div>
        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var payPlanEntityName = /*[[${entityName}]]*/'bussFinProductPayPlanDto'; // 实体类字段名
    var INTPAY_PERIOD_01 = /*[[${INTPAY_PERIOD_01}]]*/'01'; // 数据字典.付息周期_周期
    var INTPAY_PERIOD_02 = /*[[${INTPAY_PERIOD_02}]]*/'02'; // 数据字典.付息周期_到期
    var INTPAY_PERIOD_03 = /*[[${INTPAY_PERIOD_03}]]*/'03'; // 数据字典.付息周期_申购同频
    var operationType = /*[[${operationType}]]*/'';  //父画面发行方式Id
    var PERIOD_UNIT_01 = /*[[${PERIOD_UNIT_01}]]*/'01'; // 数据字典.付息周期单位_日
    var CALC_METHOD_01 = /*[[${CALC_METHOD_01}]]*/'01'; // 数据字典.推算方法_起息日向后
    var CALC_METHOD_04 = /*[[${CALC_METHOD_04}]]*/'04'; // 数据字典.推算方法_首次付息日
    var TDAY_RULE_02 = /*[[${TDAY_RULE_02}]]*/'02'; // 数据字典.营业日准则_向后调整
    var TDAY_RULE_04 = /*[[${TDAY_RULE_04}]]*/'04'; // 数据字典.营业日准则_不调整
    var profitType = /*[[${profitType}]]*/''; // 收益类型
    var PROFIT_TYPE_02 = /*[[${PROFIT_TYPE_02}]]*/'02'; // 数据字典.收益类型_预期收益
    var payPlanFinprodId = /*[[${finprodId}]]*/'';
    var workflowId = /*[[${workflowId}]]*/'';
</script>
<script data-th-src="@{/js/component/prod/BussFinProductPayPlan.js}" type="text/javascript"></script>
</body>

</html>
