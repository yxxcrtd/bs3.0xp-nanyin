<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:id="|${entityName}_div|"  class="pro-module-wrap">
        <div class="pro-module">
            <h3 class="pro-module-title"><span class="title-des" data-th-text="#{BussRepAssetAstBillInfo}">非标资产(票据或信用)报送信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
            <div class="pro-module-item">  
                <div class="layui-form-item" th:id="|${entityName}_content_one_div|">
                    <div class="form-inline-wrap" th:id="|${entityName}_repAssetType_div|" style="display: none">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussRepAssetAstBillInfo.repAssetType}">二级资产类别</label>
                        <div class="layui-input-inline input-inline">
                            <select th:id="|${entityName}_repAssetType|" th:name="|${entityName}.repAssetType|"
                                th:initValue="${entity?.repAssetType}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_ASSET_TYPE_SECOND_LEVEL}"
                                childrenIds="bussRepAssetAstBillInfoDto_repAstBillType"
                                >
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussRepAssetAstBillInfo.repTradeMarket}">交易流通场所</label>
                        <div class="layui-input-inline input-inline">
                            <select th:id="|${entityName}_repTradeMarket|" th:name="|${entityName}.repTradeMarket|"
                                th:initValue="${entity?.repTradeMarket}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${TRADE_MARKET}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussRepAssetAstBillInfo.repIsRight}">是否为收/受益权</label>
                        <div class="layui-input-inline input-inline">
                            <input type="checkbox" th:id="|${entityName}_repIsRight|"
                                th:name="|${entityName}.repIsRight|" lay-skin="switch" data-th-value="${YES}"
                                lay-text="是|否" data-th-checked="${YES} ==${entity?.repIsRight}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepAssetAstBillInfo.repRemainTerm}">加权剩余期限（天）</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_repRemainTerm|" th:name="|${entityName}.repRemainTerm|"
                                th:value="${entity?.repRemainTerm}" data-textrange="0" required="required" maxlength="5"
                                class="layui-input form-input text-number" />
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepAssetAstBillInfo.repMaxRemainTerm}">最长剩余期限（天）</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_repMaxRemainTerm|" th:name="|${entityName}.repMaxRemainTerm|" required="required"
                                th:value="${entity?.repMaxRemainTerm}" data-textrange="0" maxlength="5"
                                class="layui-input form-input text-number" />
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepAssetAstBillInfo.repMinRemainTerm}">最短剩余期限（天）</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_repMinRemainTerm|" th:name="|${entityName}.repMinRemainTerm|" required="required"
                                th:value="${entity?.repMinRemainTerm}" data-textrange="0" maxlength="5"
                                class="layui-input form-input text-number" />
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussRepAssetAstBillInfo.repIsResale}">是否属于买入返售</label>
                        <div class="layui-input-inline input-inline">
                            <input type="checkbox" th:id="|${entityName}_repIsResale|"
                                th:name="|${entityName}.repIsResale|" lay-skin="switch" data-th-value="${YES}"
                                lay-text="是|否" data-th-checked="${YES} ==${entity?.repIsResale}">
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepAssetAstBillInfo.repNum}">数量</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_repNum|" th:name="|${entityName}.repNum|" required="required"
                                th:value="${entity?.repNum}" data-textrange="0" maxlength="6"
                                class="layui-input form-input text-number" />
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_investRate_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepAssetAstBillInfo.repDiscRate}">贴现利率</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_repDiscRate|" th:name="|${entityName}.repDiscRate|"  th:value="${entity?.repDiscRate}"  
                                   class="layui-input form-input text-number" required="required"/>
                            <span class="input-right-show">%</span>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repPrivatefundFlag}">投向金融资产投资公司或其附属机构发行的私募股权投资基金</label>
                        <div class="layui-input-inline input-inline">
                            <input type="checkbox" th:id="|${entityName}_repPrivatefundFlag|" th:name="|${entityName}.repPrivatefundFlag|"
                                   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                   data-th-checked="${YES} ==${entity?.repPrivatefundFlag}" required="required">
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repPppflag}">投向“公共私营合作项目”（PPP）的部分</label>
                        <div class="layui-input-inline input-inline">
                            <input type="checkbox" th:id="|${entityName}_repPppflag|" th:name="|${entityName}.repPppflag|"
                                   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                   data-th-checked="${YES} ==${entity?.repPppflag}" required="required">
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repSmallcredit}">小微企业信贷资产流转和收益权转让</label>
                        <div class="layui-input-inline input-inline">
                            <input type="checkbox" th:id="|${entityName}_repSmallcredit|" th:name="|${entityName}.repSmallcredit|"
                                   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                   data-th-checked="${YES} ==${entity?.repSmallcredit}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repPrivateprdFlag}">投向地方政府融资平台的部分</label>
                        <div class="layui-input-inline input-inline">
                            <input type="checkbox" th:id="|${entityName}_repPrivateprdFlag|" th:name="|${entityName}.repPrivateprdFlag|"
                                   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                   data-th-checked="${YES} ==${entity?.repPrivateprdFlag}" required="required">
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repBondtostockFlag}">投向市场化债转股相关产品的部分</label>
                        <div class="layui-input-inline input-inline">
                            <input type="checkbox" th:id="|${entityName}_repBondtostockFlag|" th:name="|${entityName}.repBondtostockFlag|"
                                   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                   data-th-checked="${YES} ==${entity?.repBondtostockFlag}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item" id="bussRepAssetAstBillInfoDto_repAstBillType_div">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussRepAssetAstBillInfo.repAstBillType}">类型</label>
                        <div class="layui-input-inline input-inline">
                            <select th:id="|${entityName}_repAstBillType|" th:name="|${entityName}.repAstBillType|"
                                th:initValue="${entity?.repAstBillType}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_ASSET_TYPE_BILL_LETTERCREDIT}">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap" style="width:100%;">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepAssetAstBillInfo.repRemark}"  style=" width: 11.9%;">备注</label>
                        <div class="layui-input-inline input-inline" style="width:81%!important;">
                            <input th:id="|${entityName}_repRemark|" th:name="|${entityName}.repRemark|" 
                            th:value="${entity?.repRemark}" 
                            class="layui-input form-input" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" ></input>
                        </div>
                    </div>
                </div>
           </div>
    </div>
    </div>
    <script data-th-inline="javascript" type="text/javascript">
        var entityName_BussRepAssetAstBillInfo = /*[[${entityName}]]*/'';
        var CHB_ASSET_TYPE_PROJECT_1201 = /*[[${CHB_ASSET_TYPE_PROJECT_1201}]]*/'';
        var CHB_ASSET_TYPE_PROJECT_1210 = /*[[${CHB_ASSET_TYPE_PROJECT_1210}]]*/'';
    </script>
    <script data-th-src="@{/js/component/report/asset/project/BussRepAssetAstBillInfo.js}" type="text/javascript"></script>
</body>

</html>
