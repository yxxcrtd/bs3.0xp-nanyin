<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
<style>
.buss-inline-wrap .select2-container{
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}
</style>
</head>
<body>
<div class="pro-module-wrap" th:id="|${entityName}_div|">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">中债报送信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
        <div class="pro-module-item">
			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepOutInvestAgrInfo.repTradeMarket}" style="line-height: normal!important;">交易流通场所</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_repTradeMarket|" th:name="|${entityName}.repTradeMarket|" data-th-data-result="${TRADE_MARKET}" th:initValue="${entity?.repTradeMarket}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
					</div>
				</div>
				<div class="form-inline-wrap" th:id="|${entityName}_repAssetType_div|" style="display: none">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepOutInvestAgrInfo.repAssetType}" style="line-height: normal!important;">资产/负债类别</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_repAssetType|" th:name="|${entityName}.repAssetType|"
								data-th-data-result="${SVR_ASSET_TYPE_SECOND_LEVEL}"
								th:initValue="${entity?.repAssetType}" class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								required>
						</select>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepOutInvestAgrInfo.repTrustee}" style="line-height: normal!important;">受托人</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_repTrustee|" th:name="|${entityName}.repTrustee|" th:value="${entity?.repTrustee}" class="layui-input form-input" required="required" maxlength="100"/>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepOutInvestAgrInfo.repCapiInvest}">资金实际投向</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_repCapiInvest|" th:name="|${entityName}.repCapiInvest|" data-th-data-result="${SVR_TRU_ACT_TYPE}" th:initValue="${entity?.repCapiInvest}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepOutInvestAgrInfo.repApplicationMode}">资金运用方式</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_repApplicationMode|" th:name="|${entityName}.repApplicationMode|" th:value="${entity?.repApplicationMode}" class="layui-input form-input" maxlength="150" required/>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepOutInvestAgrInfo.repCapUseIndu}" style="line-height: normal!important;">行业</label>
					<div class="layui-input-inline input-inline buss-inline-wrap" style="width: 30%!important;display: inline-block;">
						<select th:id="|${entityName}_repCapUseIndu|" th:name="|${entityName}.repCapUseIndu|"
								data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}" th:initValue="${entity?.repCapUseIndu}"
								class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
								data-th-childrenids="|${entityName}_repCapUseInduLevel2|" required>
						</select>
					</div>
					<div class="layui-input-inline input-inline buss-inline-wrap" style="width: 30%!important;display: inline-block;">
						<select th:id="|${entityName}_repCapUseInduLevel2|" th:name="|${entityName}.repCapUseInduLevel2|" data-th-parentids="|${entityName}_repCapUseIndu|"
								data-th-data-result="${INSTITUTION_INDUSTRY_SECOND_LEVEL}" th:initValue="${entity?.repCapUseInduLevel2}"
								class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepOutInvestAgrInfo.repTrustInvestAttribute}" style="line-height: normal!important;">委外投资属性</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_repTrustInvestAttribute|" th:name="|${entityName}.repTrustInvestAttribute|" data-th-data-result="${CHB_OUTSOURCE_INVEST_PROPERTY}" th:initValue="${entity?.repTrustInvestAttribute}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepOutInvestAgrInfo.repContainExpectedYield}" style="line-height: normal!important;">是否有预期收益率</label>
					<div class="layui-input-inline input-inline">
						<input type="checkbox" th:id="|${entityName}_repContainExpectedYield|" th:name="|${entityName}.repContainExpectedYield|" lay-skin="switch" data-th-value="${YES}" lay-text="是|否" data-th-checked="${YES} ==${entity?.repContainExpectedYield}" required lay-filter="repContainExpected">
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepOutInvestAgrInfo.repMaxExpectedYield}" style="line-height: normal!important;">预期最高收益率</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_repMaxExpectedYield|" th:name="|${entityName}.repMaxExpectedYield|" placeholder="请输入内容" data-pattern="" data-fixtype="2" class="layui-input form-input text-number" th:value="${entity?.repMaxExpectedYield}" data-th-data-textrange="3">
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepOutInvestAgrInfo.repMinExpectedYield}" style="line-height: normal!important;">预期最低收益率</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_repMinExpectedYield|" th:name="|${entityName}.repMinExpectedYield|" placeholder="请输入内容" data-pattern="" data-fixtype="2" class="layui-input form-input text-number" th:value="${entity?.repMinExpectedYield}" data-th-data-textrange="3">
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepOutInvestAgrInfo.repManagementRate}" style="line-height: normal!important;">管理费率%</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_repManagementRate|" th:name="|${entityName}.repManagementRate|" placeholder="请输入内容" data-pattern="" data-fixtype="2" class="layui-input form-input text-number" th:value="${entity?.repManagementRate}" data-th-data-textrange="3" required>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepOutInvestAgrInfo.repTrustRate}" style="line-height: normal!important;">托管费率%</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_repTrustRate|" th:name="|${entityName}.repTrustRate|" placeholder="请输入内容" data-pattern="" data-fixtype="2" class="layui-input form-input text-number" th:value="${entity?.repTrustRate}" data-th-data-textrange="3" required>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepOutInvestAgrInfo.repTradeSumRate}" style="line-height: normal!important;">交易相关合计费率%</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_repTradeSumRate|" th:name="|${entityName}.repTradeSumRate|" placeholder="请输入内容" data-pattern="" data-fixtype="2" class="layui-input form-input text-number" th:value="${entity?.repTradeSumRate}" data-th-data-textrange="3" required>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepOutInvestAgrInfo.repIntermediarySumRate}" style="line-height: normal!important;">中介服务机构合计费率%</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_repIntermediarySumRate|" th:name="|${entityName}.repIntermediarySumRate|" placeholder="请输入内容" data-pattern="" data-fixtype="2" class="layui-input form-input text-number" th:value="${entity?.repIntermediarySumRate}" data-th-data-textrange="3" required>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepOutInvestAgrInfo.repOtherSumRate}" style="line-height: normal!important;">其他合计费率%</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_repOtherSumRate|" th:name="|${entityName}.repOtherSumRate|" placeholder="请输入内容" data-pattern="" data-fixtype="2" class="layui-input form-input text-number" th:value="${entity?.repOtherSumRate}" data-th-data-textrange="3" required>
					</div>
				</div>
            </div>
            <div class="layui-form-item">	
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepOutInvestAgrInfo.repEntrustInvestMoney}" style="line-height: normal!important;">委托投资金额</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_repEntrustInvestMoney|" th:name="|${entityName}.repEntrustInvestMoney|" placeholder="请输入内容" data-pattern="" data-fixtype="2" class="layui-input form-input text-money" th:value="${entity?.repEntrustInvestMoney}" data-moneymemory = "" required data-th-data-textrange="2">
					</div>
				</div>
				<!-- 添加是否投向金融资产投资公司发行的私募资产管理产品by赵东东 2019.10.10 start -->
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepOutInvestAgrInfo.repPrivateprdFlag}" style="line-height: normal!important;">是否投向金融资产投资公司发行的私募资产管理产品</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_repPrivateprdFlag|" th:name="|${entityName}.repPrivateprdFlag|" data-th-data-result="${SVR_YES_OR_NO}" th:initValue="${entity?.repPrivateprdFlag}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
						</select>
					</div>
				</div>
				<!-- 添加是否投向金融资产投资公司发行的私募资产管理产品by赵东东 2019.10.10 end -->
			</div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style="width: 100% !important;">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepOutInvestAgrInfo.remark}" style="width: 12%;">备注</label>
					<div class="layui-input-inline input-inline" style="width: 86% !important;">
						<input th:id="|${entityName}_repRemark|" th:name="|${entityName}.repRemark|" placeholder="请输入内容" class="layui-input form-input"data-th-placeholder="#{SysCommon.placeholder}" data-th-text="${entity?.repRemark}" maxlength="128" style="width: 100%!important;">
						</input>
					</div>
				</div>
            </div>
        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var TRADE_MARKET_99 = /*[[${TRADE_MARKET_99}]]*/'';
    var entityName = /*[[${entityName}]]*/'';
    var FLAG_YES = /*[[${FLAG_YES}]]*/'';
</script>
<script data-th-src="@{/js/component/report/asset/trust/BussRepOutInvestAgrInfo.js}" type="text/javascript"></script>
</body>

</html>
