<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:id="|${entityName}_div|" class="pro-module-wrap">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des"
                                           data-th-text="#{BussRepEquityInfo}">权益类资产报送信息</span>（<span class="star-sign">*</span>必填）<i
            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
        <div class="pro-module-item">
            <input id="type8"  name="type8" th:value="8" hidden>
            <input th:id="|${entityName}_finprodType2|" th:name="|${entityName}.finprodType2|"  th:value="${INT_ASSET_TYPE}" hidden>
            <div class="layui-form-item" th:id="|${entityName}_content_one_div|">
                <div class="form-inline-wrap" id="div01" style="display: none">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepEquityInfo.repAssetType}">二级资产类别</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repAssetType|" th:name="|${entityName}.repAssetType|"
                                th:initValue="${entity?.repAssetType}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_ASSET_TYPE_SECOND_LEVEL}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepEquityInfo.repInvestStage}">投资阶段</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repInvestStage|" th:name="|${entityName}.repInvestStage|"
                                th:initValue="${entity?.repInvestStage}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_INVEST_STAGE}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap" id="div02" style="display: none">
                    <label class="layui-form-label form-lable"
                           data-th-utext="#{BussRepFundInfo.repIndustry}">行业</label>
                    <div class="layui-input-inline input-inline buss-inline-wrap"
                         style="width: 30%!important;display: inline-block;">
                        <select th:id="|${entityName}_repIndustry|"
                                th:name="|${entityName}.repIndustry|"
                                th:childrenIds="|${entityName}_repIndustryLevel2|"
                                th:initValue="${entity?.repIndustry}"
                                data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                    <div class="layui-input-inline input-inline buss-inline-wrap"
                         style="width: 30%!important;display: inline-block;">
                        <select th:id="|${entityName}_repIndustryLevel2|"
                                th:name="|${entityName}.repIndustryLevel2|"
                                th:initValue="${entity?.repIndustryLevel2}"
                                data-th-data-result="${INSTITUTION_INDUSTRY_SECOND_LEVEL}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepEquityInfo.repSharesType}">股票类型</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repSharesType|" th:name="|${entityName}.repSharesType|"
                                th:initValue="${entity?.repSharesType}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_SHARES_TYPE}">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepEquityInfo.repPartyType1}">发行机构类型（按规模划分）</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repPartyType1|" th:name="|${entityName}.repPartyType1|"
                                th:initValue="${entity?.repPartyType1}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_PARTY_TYPE1}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap" th:id="|${entityName}_repInstitSize_div|" style="display: none">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{BussRepOther.repInstitSize}">人行机构规模</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repInstitSize|" th:name="|${entityName}.repInstitSize|"
                                th:initValue="${entity?.repInstitSize}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${INSTIT_SIZE}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepEquityInfo.repPartyType2}">发行机构类型（按经济类型划分）</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repPartyType2|" th:name="|${entityName}.repPartyType2|"
                                th:initValue="${entity?.repPartyType2}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_PARTY_TYPE2}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepEquityInfo.repPartyType3}">发行机构类型（按技术领域划分）</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repPartyType3|" th:name="|${entityName}.repPartyType3|"
                                th:initValue="${entity?.repPartyType3}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_PARTY_TYPE3}">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepEquityInfo.repIsPledge}">是否为质押融资</label>
                    <div class="layui-input-inline input-inline">
                        <input type="checkbox" th:id="|${entityName}_repIsPledge|" th:name="|${entityName}.repIsPledge|"
                               lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                               data-th-checked="${YES} ==${entity?.repIsPledge}" required="required">
                    </div>
                </div>
                <div class="form-inline-wrap" id="div03" style="display: none">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepEquityInfo.repTradeMarket}">交易流通场所</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repTradeMarket|" th:name="|${entityName}.repTradeMarket|"
                                th:initValue="${entity?.repTradeMarket}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${TRADE_MARKET}">
                        </select>
                    </div>
                </div> 
                <div class="form-inline-wrap" th:id="|${entityName}_repPrivateprdFlag_div|" style="display: none">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repPrivateprdFlag}">投向地方政府融资平台的部分</label>
                    <div class="layui-input-inline input-inline">
                        <input type="checkbox" th:id="|${entityName}_repPrivateprdFlag|" th:name="|${entityName}.repPrivateprdFlag|"
                               lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                               data-th-checked="${YES} ==${entity?.repPrivateprdFlag}" required="required">
                    </div>
                </div>
            </div>
            <!--<div class="layui-form-item"> -->
            <!-- start  modify by wj  20200407 增加   是否债转股 是否银行优先股 -->
                <div class="form-inline-wrap" th:id="|${entityName}_repDeptEquity_div|" style="display: none">
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{BussRepEquityInfo.repDeptEquity}">是否为债转股</label>
							<div class="layui-input-inline input-inline">
								<input type="checkbox"  th:id="|${entityName}_repDeptEquity|" th:name="|${entityName}.repDeptEquity|"
									lay-skin="switch"  
									data-th-value="${YES}" lay-text="是|否"
									data-th-checked="${YES} ==${entity?.repDeptEquity}"
									required="required">
									
							</div>
					</div>
					
                <div class="form-inline-wrap" th:id="|${entityName}_repBankSecPrefer_div|" style="display: none">
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{BussRepEquityInfo.repBankSecPrefer}">是否商业银行优先股</label>
							<div class="layui-input-inline input-inline">
								<input type="checkbox" th:id="|${entityName}_repBankSecPrefer|" th:name="|${entityName}.repBankSecPrefer|"
									lay-skin="switch" 
									data-th-value="${YES}" lay-text="是|否"
									data-th-checked="${YES} ==${entity?.repBankSecPrefer}"
									required="required">
							</div>
				</div>
              <!--  </div> -->
            <div class="layui-form-item" th:id="|${entityName}_project_other_div|" style="display: none">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repPrivatefundFlag}">投向金融资产投资公司或其附属机构发行的私募股权投资基金</label>
                    <div class="layui-input-inline input-inline">
                        <input type="checkbox" th:id="|${entityName}_repPrivatefundFlag|" th:name="|${entityName}.repPrivatefundFlag|"
                               lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                               data-th-checked="${YES} ==${entity?.repPrivatefundFlag}" required="required">
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repPppflag}">投向“公共私营合作项目”（PPP）的部分</label>
                    <div class="layui-input-inline input-inline">
                        <input type="checkbox" th:id="|${entityName}_repPppflag|" th:name="|${entityName}.repPppflag|"
                               lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                               data-th-checked="${YES} ==${entity?.repPppflag}" required="required">
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repSmallcredit}">小微企业信贷资产流转和收益权转让</label>
                    <div class="layui-input-inline input-inline">
                        <input type="checkbox" th:id="|${entityName}_repSmallcredit|" th:name="|${entityName}.repSmallcredit|"
                               lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                               data-th-checked="${YES} ==${entity?.repSmallcredit}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item" th:id="|${entityName}_repBondtostockFlag_div|" style="display: none">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repBondtostockFlag}">投向市场化债转股相关产品的部分</label>
                    <div class="layui-input-inline input-inline">
                        <input type="checkbox" th:id="|${entityName}_repBondtostockFlag|" th:name="|${entityName}.repBondtostockFlag|"
                               lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                               data-th-checked="${YES} ==${entity?.repBondtostockFlag}">
                    </div>
                </div>
                <div class="form-inline-wrap" th:id="|${entityName}_repEquityQuit_div|" style="display: none">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repEquityQuit}">股权退出安排</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repEquityQuit|" th:name="|${entityName}.repEquityQuit|"  data-th-value='${#dates.format(entity?.repEquityQuit,"yyyy-MM-dd")}'
                                class="layui-input form-input input-dateSelect" required="required"/>
                    </div>
                </div>
                
                <div class="form-inline-wrap" th:id="|${entityName}_isUnlisted_div|" >
							<label class="layui-form-label form-label-wrap"
								   data-th-text="#{BussRepOther.isUnlisted}">是否政府出资产业投资基金</label>
							<div class="layui-input-inline input-inline">
								<select th:name="|${entityName}.isUnlisted|"
										th:id="|${entityName}_isUnlisted|"
										class="layui-input form-input input-select"
										data-th-initValue= "${entity?.isUnlisted}"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-data-result="${SVR_YES_OR_NO}" required>
								</select>
							</div>
						</div>	
                <!--<div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repDeptEquity}">是否为债转股</label>
                    <div class="layui-input-inline input-inline">
                        <input type="checkbox" th:id="|${entityName}_repDeptEquity|" th:name="|${entityName}.repDeptEquity|"
                               lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                               data-th-checked="${YES} ==${entity?.repDeptEquity}" required="required">
                    </div>
                </div>-->
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style="width:100%;">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepEquityInfo.repRemark}"
                           style=" width: 11.9%;">备注</label>
                    <div class="layui-input-inline input-inline" style="width:81%!important;">
                            <input th:id="|${entityName}_repRemark|" th:name="|${entityName}.repRemark|"
                                      th:value="${entity?.repRemark}"
                                      class="layui-input form-input" placeholder="请输入内容"
                                      data-th-placeholder="#{SysCommon.placeholder}"></input>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var entityName_BussRepEquityInfo = /*[[${entityName}]]*/'';
    var initgp = [[${gp}]];
    var initentity = [[${entityName}]];
    var FINPROD_TYPE_TG_F18 = /*[[${FINPROD_TYPE_TG_F18}]]*/'F18'; //项目类资产类型code
    var SVR_PARTY_TYPE1_01 = /*[[${SVR_PARTY_TYPE1_01}]]*/'01';
    var FINPROD_TYPE_TG_F01 = /*[[${FINPROD_TYPE_TG_F01}]]*/'F01';
</script>
<script data-th-src="@{/js/component/report/asset/project/BussRepEquityInfo.js}" type="text/javascript"></script>
</body>

</html>
