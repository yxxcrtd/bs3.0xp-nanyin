<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
<style>
.buss-inline-wrap .select2-container{
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
</style>
</head>
<body>
<div class="pro-module-wrap" th:id="|${entityName}_div|">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">中债报送信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
        <div class="pro-module-item">
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repTradeMarket}" style="line-height: normal!important;">交易流通<br>场所</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repTradeMarket|" th:name="|${entityName}.repTradeMarket|"  data-th-data-result="${TRADE_MARKET}" th:initValue="${entity?.repTradeMarket}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap" th:id="|${entityName}_repAssetType_div|" style="display: none">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repAssetType}" style="line-height: normal!important;">资产/负债类别</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repAssetType|" th:name="|${entityName}.repAssetType|"
                                data-th-data-result="${SVR_ASSET_TYPE_SECOND_LEVEL}"
                                th:initValue="${entity?.repAssetType}"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repPartyCode}" style="line-height: normal!important;">资管计划发起<br>人机构编码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repPartyCode|" th:name="|${entityName}.repPartyCode|" th:value="${entity?.repPartyCode}" class="layui-input form-input" onKeyUp="value=value.replace(/[^\a-\z\A-\Z0-9]/g,'')" maxlength="32" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required/>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repRegistCode}" style="line-height: normal!important;">资管计划登<br>记编码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repRegistCode|" data-th-maxlength="85" th:name="|${entityName}.repRegistCode|" th:value="${entity?.repRegistCode}" class="layui-input form-input" maxlength="300" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repCapiInvest}">资金实际投向</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repCapiInvest|" th:name="|${entityName}.repCapiInvest|" data-th-data-result="${SVR_TRU_ACT_TYPE}" th:initValue="${entity?.repCapiInvest}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repCapUseWay}">资金运用方式</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repCapUseWay|" th:name="|${entityName}.repCapUseWay|" th:value="${entity?.repCapUseWay}" class="layui-input form-input" maxlength="150" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required/>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repCapUseIndu}" style="line-height: normal!important;">行业</label>
                    <div class="layui-input-inline input-inline buss-inline-wrap" style="width: 30%!important;display: inline-block;">
                        <select th:id="|${entityName}_repCapUseIndu|" th:name="|${entityName}.repCapUseIndu|" data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}"
                                th:initValue="${entity?.repCapUseIndu}" class="layui-input form-input input-select"
                                data-th-childrenids="|${entityName}_repCapUseInduLevel2|"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>

                <!--<div class="form-inline-wrap">-->
                    <!--<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repCapUseInduLevel2}" style="line-height: normal!important;">资金运用行<br>业二级分类</label>-->
                    <div class="layui-input-inline input-inline buss-inline-wrap" style="width: 30%!important;display: inline-block;">
                        <select th:id="|${entityName}_repCapUseInduLevel2|" th:name="|${entityName}.repCapUseInduLevel2|"
                                 data-th-data-result="${INSTITUTION_INDUSTRY_SECOND_LEVEL}"
                                th:initValue="${entity?.repCapUseInduLevel2}" class="layui-input form-input input-select"
                                data-th-parentids="|${entityName}_repCapUseIndu|"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
					</div>
                <!--</div>-->
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repPlanProp}" style="line-height: normal!important;">资管计划属性</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repPlanProp|" th:name="|${entityName}.repPlanProp|"  data-th-data-result="${SVR_PRO_PROPERTY}" th:initValue="${entity?.repPlanProp}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>
				<div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repYieldFlag}" style="line-height: normal!important;">是否有预<br>期收益率</label>
                    <div class="layui-input-inline input-inline">
                        <input type="checkbox" th:id="|${entityName}_repYieldFlag|" th:name="|${entityName}.repYieldFlag|" lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                        data-th-checked="${YES} ==${entity?.repYieldFlag}" lay-filter="switchTest">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repMaxRate}" style="line-height: normal!important;">预期最高<br>收益率</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repMaxRate|" th:name="|${entityName}.repMaxRate|" placeholder="请输入内容" data-pattern="" data-fixtype="2" class="layui-input form-input text-number" th:value="${entity?.repMaxRate}" data-th-data-textrange="8">
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repMinRate}" style="line-height: normal!important;">预期最低<br>收益率</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repMinRate|" th:name="|${entityName}.repMinRate|" placeholder="请输入内容" data-pattern="" data-fixtype="2" class="layui-input form-input text-number" th:value="${entity?.repMinRate}" data-th-data-textrange="8">
                    </div>
                </div>
				<div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repBuyStruct}" style="line-height: normal!important;">购买结构</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repBuyStruct|" th:name="|${entityName}.repBuyStruct|"  data-th-data-result="${SVR_BUY_STRUCT}" th:initValue="${entity?.repBuyStruct}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repManageType}" style="line-height: normal!important;">管理方式</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repManageType|" th:name="|${entityName}.repManageType|"  data-th-data-result="${SVR_MANAGE_STYLE}" th:initValue="${entity?.repManageType}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repIsCtrlBottom}" style="line-height: normal!important;">是否掌控计划<br>底层资产详情</label>
                    <div class="layui-input-inline input-inline">
                        <input type="checkbox" th:id="|${entityName}_repIsCtrlBottom|" th:name="|${entityName}.repIsCtrlBottom|" lay-skin="switch" 
                        data-th-value="${YES}" lay-text="是|否" 
                        data-th-checked="${YES_OR_NO_Y} ==${entity?.repIsCtrlBottom}"  required>
                    </div>
                </div>
				<div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repMgrFeeRate}" style="line-height: normal!important;">管理费率%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repMgrFeeRate|" th:name="|${entityName}.repMgrFeeRate|" placeholder="请输入内容" data-th-data-fixtype="2" class="layui-input form-input text-number" th:value="${entity?.repMgrFeeRate}" data-th-data-textrange="3" required>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repTruFeeRate}" style="line-height: normal!important;">托管费率%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repTruFeeRate|" th:name="|${entityName}.repTruFeeRate|" placeholder="请输入内容" data-th-data-fixtype="2" class="layui-input form-input text-number" th:value="${entity?.repTruFeeRate}" data-th-data-textrange="3" required>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repTradeFeeRate}" style="line-height: normal!important;">交易相关合计<br>费率%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repTradeFeeRate|" th:name="|${entityName}.repTradeFeeRate|" placeholder="请输入内容" data-th-data-fixtype="2" class="layui-input form-input text-number" th:value="${entity?.repTradeFeeRate}" data-th-data-textrange="3" required>
                    </div>
                </div>
				<div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repAgencyFeeRate}" style="line-height: normal!important;">中介服务机构<br>合计费率%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repAgencyFeeRate|" th:name="|${entityName}.repAgencyFeeRate|" placeholder="请输入内容" data-th-data-fixtype="2" class="layui-input form-input text-number" th:value="${entity?.repAgencyFeeRate}" data-th-data-textrange="3" required>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repOtherFeeRate}" style="line-height: normal!important;">其他合计费率%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repOtherFeeRate|" th:name="|${entityName}.repOtherFeeRate|" placeholder="请输入内容" data-th-data-fixtype="2" class="layui-input form-input text-number" th:value="${entity?.repOtherFeeRate}" data-th-data-textrange="3" required>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repAmt}" style="line-height: normal!important;">金额</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repAmt|" th:name="|${entityName}.repAmt|" placeholder="请输入内容" data-th-data-fixtype="2" class="layui-input form-input text-money" th:value="${entity?.repAmt}" required data-th-data-textrange="2">
                    </div>
                </div>
              <!--  新增字段 add by zhuyongkang 2019/10/08 start-->
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{BussRepAssetMngProdInfo.repPrivateprdFlag}">是否投向金融资产投资公司发行的私募资产管理产品</label>
                    <div class="layui-input-inline input-inline">
                        <input type="checkbox" th:id="|${entityName}_repPrivateprdFlag|" th:name="|${entityName}.repPrivateprdFlag|"
                               lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                               data-th-checked="${YES} ==${entity?.repPrivateprdFlag}" required="required">
                        <!--<select type="text" th:id="|${entityName}_repPrivateprdFlag|" th:name="|${entityName}.repPrivateprdFlag|"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-initValue="${entity?.repPrivateprdFlag}"
                                data-th-data-result='${SVR_YES_OR_NO}'>
                        </select>-->
                    </div>
                </div>
                <div class="layui-form-item" th:id="|${entityName}_project_other_div|" style="display: none">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repPrivatefundFlag}">投向金融资产投资公司或其附属机构发行的私募股权投资基金</label>
                        <div class="layui-input-inline input-inline">
                            <input type="checkbox" th:id="|${entityName}_repPrivatefundFlag|" th:name="|${entityName}.repPrivatefundFlag|"
                                   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                   data-th-checked="${YES} ==${entity?.repPrivatefundFlag}" required="required">
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repPppflag}">投向“公共私营合作项目”（PPP）的部分</label>
                        <div class="layui-input-inline input-inline">
                            <input type="checkbox" th:id="|${entityName}_repPppflag|" th:name="|${entityName}.repPppflag|"
                                   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                   data-th-checked="${YES} ==${entity?.repPppflag}" required="required">
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repSmallcredit}">小微企业信贷资产流转和收益权转让</label>
                        <div class="layui-input-inline input-inline">
                            <input type="checkbox" th:id="|${entityName}_repSmallcredit|" th:name="|${entityName}.repSmallcredit|"
                                   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                   data-th-checked="${YES} ==${entity?.repSmallcredit}">
                        </div>
                    </div>
                </div>
                <!--  新增字段 add by zhuyongkang 2019/10/08 end-->
            </div>
            
            <div class="layui-form-item">
                <div class="form-inline-wrap" th:id="|${entityName}_repBondtostockFlag_div|" style="display: none">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repBondtostockFlag}">投向市场化债转股相关产品的部分</label>
                    <div class="layui-input-inline input-inline">
                        <input type="checkbox" th:id="|${entityName}_repBondtostockFlag|" th:name="|${entityName}.repBondtostockFlag|"
                               lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                               data-th-checked="${YES} ==${entity?.repBondtostockFlag}">
                    </div>
                </div>
                  <!--  新增 是否由金融资产投资公司发行     modify by wj 20200409  -->
            <!--  <div class="layui-form-item">-->
            	<div class="form-inline-wrap" th:id="|${entityName}_repFinancialComissue_div|" >
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.repFinancialComissue}" style="line-height: normal!important;">是否由金融资产<br>投资公司发行</label>
                    <div class="layui-input-inline input-inline">
                        <input type="checkbox" th:id="|${entityName}_repFinancialComissue|" th:name="|${entityName}.repFinancialComissue|" lay-skin="switch" 
                        data-th-value="${YES}" lay-text="是|否" 
                        data-th-checked="${YES} ==${entity?.repFinancialComissue}"  >                         
                    </div>
                </div>
                
           <!--  </div>-->
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style="width: 100% !important;">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepAssetMngProdInfo.remark}" style="width: 12%;">备注</label>
                    <div class="layui-input-inline input-inline" style="width: 86%!important">
                        <input th:id="|${entityName}_repRemark|" th:name="|${entityName}.repRemark|" 
                               th:value="${entity?.repRemark}" class="layui-input form-input" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" ></input>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var BussRepAssetMngProdInfo_entityName = /*[[${entityName}]]*/'';
    var FLAG_YES = /*[[${FLAG_YES}]]*/'';
    var SVR_ASSET_TYPE_SECOND_LEVEL = /*[[${SVR_ASSET_TYPE_SECOND_LEVEL}]]*/'';
    var TRADE_MARKET_99 = /*[[${TRADE_MARKET_99}]]*/'';
    var FINPROD_TYPE_TG_F18 = /*[[${FINPROD_TYPE_TG_F18}]]*/'F18';
    var INT_ASSET_TYPE = /*[[${INT_ASSET_TYPE}]]*/'';
</script>
 <script data-th-src="@{/js/component/report/asset/plan/BussRepAssetMngProdInfo.js}" type="text/javascript"></script>
</body>

</html>
