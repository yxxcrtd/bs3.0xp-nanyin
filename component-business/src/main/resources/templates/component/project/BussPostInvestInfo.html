<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.springframework.org/schema/mvc">
<body>
    <div th:id="|${entityName}_div|" class="pro-module-wrap">
        <div class="pro-module">
            <h3 class="pro-module-title">
                <span class="title-des" data-th-text="#{BussPostInvestInfo}">投后信息</span>（<span class="star-sign"></span>必填）<i
                    class="iconfont icon-arrow-down pro-down-icon"></i>
            </h3>
            <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-utext="#{BussPostInvestInfo.postOrg}" >投后责任机构</label>
                        <div class="layui-input-inline input-inline">
                            <select  th:id="|${entityName}_postOrg|" th:name="|${entityName}.postOrg|"
                                    th:data-url="|@{/business/common/CommonSelect/selectCounterId}?counterType=${counterType}|"
                                    formatOption="false"
                                    th:initValue="${entity?.postOrg}" class="layui-input form-input input-select"
                                    th:placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussPostInvestInfo.initInferiorRate}">初始劣后占比</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_initInferiorRate|"
                                   th:name="|${entityName}.initInferiorRate|"
                                   data-th-value="${entity?.initInferiorRate}"
                                   class="layui-input form-input text-number" data-textrange="2"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussPostInvestInfo.isRepClause}">是否含回购条款</label>
                        <div class="layui-input-inline input-inline">
                            <input type="checkbox" th:id="|${entityName}_isRepClause|" th:name="|${entityName}.isRepClause|"
                                   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                   data-th-checked="${YES} ==${entity?.isRepClause}" >
                        </div>
                    </div>
                </div>
                 <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{BussPostInvestInfo.assetInsideType}">部门内部资产分类</label>
                        <div class="layui-input-inline input-inline">
                            <input th:id="|${entityName}_assetInsideType|" th:name="|${entityName}.assetInsideType|"
                                   th:initValue="${entity?.assetInsideType}" class="layui-input form-input input-select"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result="${ASSET_INSIDE_TYPE}" />
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{BussPostInvestInfo.assetBotType}">底层资产类型</label>
                        <div class="layui-input-inline input-inline">
                            <input th:id="|${entityName}_assetBotType|" th:name="|${entityName}.assetBotType|"
                                   th:initValue="${entity?.assetBotType}" class="layui-input form-input input-select"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result="${ASSET_BOT_TYPE}" />
                        </div>
                    </div>
                </div>
            <div class="pro-module-item">
                <div class="layui-form-item" th:id="|${entityName}_one_div|">
                    <div class="form-inline-wrap" th:id="|${entityName}_hostCustomerManager_div|">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussPostInvestInfo.hostCustomerManager}">主办客户经理</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_hostCustomerManager|"
                                th:name="|${entityName}.hostCustomerManager|"
                                data-th-value="${entity?.hostCustomerManager}" class="layui-input form-input"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_assistCustomerManager_div|">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussPostInvestInfo.assistCustomerManager}">协办客户经理</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_assistCustomerManager|"
                                th:name="|${entityName}.assistCustomerManager|"
                                data-th-value="${entity?.assistCustomerManager}" class="layui-input form-input"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_isLay_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussPostInvestInfo.isLay}">是否分层</label>
                        <div class="layui-input-inline input-inline">
                            <input type="checkbox" th:id="|${entityName}_isLay|" th:name="|${entityName}.isLay|"
                                lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                data-th-checked="${YES} ==${entity?.isLay}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item" th:id="|${entityName}_two_div|">
                    <div class="form-inline-wrap" th:id="|${entityName}_layPortfolio_div|">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussPostInvestInfo.layPortfolio}">分层组合</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_layPortfolio|"
                                th:name="|${entityName}.layPortfolio|" data-th-value="${entity?.layPortfolio}"
                                class="layui-input form-input" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_myBankGrade_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussPostInvestInfo.myBankGrade}">我行对应层级</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_myBankGrade|" th:name="|${entityName}.myBankGrade|"
                                th:initValue="${entity?.myBankGrade}" class="layui-input form-input input-checkbox"
                                data-th-data-result="${PARALLELISM_TIER}" />
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_bottomContractForm_div|">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussPostInvestInfo.bottomContractForm}">底层合同形式</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_bottomContractForm|"
                                th:name="|${entityName}.bottomContractForm|"
                                data-th-value="${entity?.bottomContractForm}" class="layui-input form-input"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item" th:id="|${entityName}_three_div|">
                    <div class="form-inline-wrap" th:id="|${entityName}_actualCreditProvid_div|">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussPostInvestInfo.actualCreditProvid}">实际授信主体</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_actualCreditProvid|"
                                th:name="|${entityName}.actualCreditProvid|" class="layui-input form-input"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item" th:id="|${entityName}_four_div|">
                    <div class="form-inline-wrap" th:id="|${entityName}_natureAssignAssets_div|">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussPostInvestInfo.natureAssignAssets}">受让资产性质</label>
                        <div class="layui-input-inline input-inline">
                            <input th:id="|${entityName}_natureAssignAssets|"
                                th:name="|${entityName}.natureAssignAssets|"
                                data-th-initValue="${entity?.natureAssignAssets}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${TRANSFER_ASSET_NATUER}" />
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_isFloat_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussPostInvestInfo.isFloat}">是否有浮动收益</label>
                        <div class="layui-input-inline input-inline">
                            <input type="checkbox" th:id="|${entityName}_isFloat|" th:name="|${entityName}.isFloat|"
                                lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                data-th-checked="${YES} ==${entity?.isFloat}" >
                        </div>
                    </div>
                </div>
                <div class="layui-form-item" th:id="|${entityName}_five_div|">
                    <div class="form-inline-wrap" th:id="|${entityName}_prdTypes_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussPostInvestInfo.prdTypes}">业务品种</label>
                        <div class="layui-input-inline input-inline">
                            <input th:id="|${entityName}_prdTypes|" th:name="|${entityName}.prdTypes|"
                                th:initValue="${entity?.prdTypes}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${BUSINESS_VARIETY}" />
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_singleVoteRatio_div|">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussPostInvestInfo.singleVoteRatio}">单票集中度</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_singleVoteRatio|"
                                th:name="|${entityName}.singleVoteRatio|" data-th-value="${entity?.singleVoteRatio}"
                                class="layui-input form-input text-number" data-textrange="2"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item" th:id="|${entityName}_six_div|">
                    <div class="form-inline-wrap" th:id="|${entityName}_saleDeadline_div|">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussPostInvestInfo.saleDeadline}">限售期截止日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_saleDeadline|"
                                th:name="|${entityName}.saleDeadline|"
                                data-th-value='${#dates.format(entity?.saleDeadline,"yyyy-MM-dd")}'
                                class="layui-input form-input input-dateSelect" />
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_propPrioPer_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussPostInvestInfo.propPrioPer}">优先劣后比例</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_propPrioPer|" th:name="|${entityName}.propPrioPer|"
                                data-th-value="${entity?.propPrioPer}" class="layui-input form-input"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" >
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_amountInvesBad_div|">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussPostInvestInfo.amountInvesBad}">劣后出资金额</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_amountInvesBad|"
                                th:name="|${entityName}.amountInvesBad|" data-th-value="${entity?.amountInvesBad}"
                                class="layui-input form-input text-number" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item" th:id="|${entityName}_seven_div|">
                    <div class="form-inline-wrap" th:id="|${entityName}_warnLine_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussPostInvestInfo.warnLine}">预警线</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_warnLine|" th:name="|${entityName}.warnLine|"
                                data-th-value="${entity?.warnLine}" class="layui-input form-input"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_warnRule_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussPostInvestInfo.warnRule}">预警机制</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_warnRule|" th:name="|${entityName}.warnRule|"
                                data-th-value="${entity?.warnRule}" class="layui-input form-input"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_flatLine_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussPostInvestInfo.flatLine}">平仓线</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_flatLine|" th:name="|${entityName}.flatLine|"
                                data-th-value="${entity?.flatLine}" class="layui-input form-input"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item" th:id="|${entityName}_eight_div|">
                    <div class="form-inline-wrap" th:id="|${entityName}_flatRule_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussPostInvestInfo.flatRule}">平仓机制</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_flatRule|" th:name="|${entityName}.flatRule|"
                                data-th-value="${entity?.flatRule}" class="layui-input form-input"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_diffrentPartyName_div|">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussPostInvestInfo.diffrentPartyName}">差补方名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_diffrentPartyName|"
                                th:name="|${entityName}.diffrentPartyName|" data-th-value="${entity?.diffrentPartyName}"
                                class="layui-input form-input"  placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_compoundBatch_div|">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussPostInvestInfo.compoundBatch}">批复方</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_compoundBatch|"
                                th:name="|${entityName}.compoundBatch|" th:initValue="${entity?.compoundBatch}"
                                class="layui-input form-input input-checkbox" data-th-data-result="${REPLY_PARTY}" />
                        </div>
                    </div>
                </div>
                <div class="layui-form-item" th:id="|${entityName}_nine_div|">
                    <div class="form-inline-wrap" th:id="|${entityName}_pawnShare_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussPostInvestInfo.pawnShare}">质押股票</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_pawnShare|" th:name="|${entityName}.pawnShare|"
                                data-th-value="${entity?.pawnShare}" class="layui-input form-input"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_pawnSharePer_div|">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussPostInvestInfo.pawnSharePer}">初始质押率</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_pawnSharePer|"
                                th:name="|${entityName}.pawnSharePer|" data-th-value="${entity?.pawnSharePer}"
                                class="layui-input form-input text-number" data-textrange="2"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_pawnShareMoney_div|">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussPostInvestInfo.pawnShareMoney}">初始质押价格</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_pawnShareMoney|"
                                th:name="|${entityName}.pawnShareMoney|" data-th-value="${entity?.pawnShareMoney}"
                                class="layui-input form-input text-number" data-textrange="2"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item" th:id="|${entityName}_ten_div|">
                    <div class="form-inline-wrap" th:id="|${entityName}_pawnShareQuanlity_div|">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussPostInvestInfo.pawnShareQuanlity}">原质押股本数</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_pawnShareQuanlity|"
                                th:name="|${entityName}.pawnShareQuanlity|" data-th-value="${entity?.pawnShareQuanlity}"
                                class="layui-input form-input" data-textrange="2"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_isRestrictShare_div|">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussPostInvestInfo.isRestrictShare}">质押股票是否限售股</label>
                        <div class="layui-input-inline input-inline">
                            <input type="checkbox" th:id="|${entityName}_isRestrictShare|"
                                th:name="|${entityName}.isRestrictShare|" lay-skin="switch" data-th-value="${YES}"
                                lay-text="是|否"  data-th-checked="${YES} ==${entity?.isRestrictShare}">
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_propTotalCapitalShare_div|">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussPostInvestInfo.propTotalCapitalShare}">占总股本比例</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_propTotalCapitalShare|"
                                th:name="|${entityName}.propTotalCapitalShare|"
                                data-th-value="${entity?.propTotalCapitalShare}"
                                class="layui-input form-input text-number" data-textrange="2"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item" th:id="|${entityName}_elevn_div|">
                    <div class="form-inline-wrap" th:id="|${entityName}_pledgeShare_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussPostInvestInfo.pledgeShare}">股票质押</label>
                        <div class="layui-input-inline input-inline">
                            <select th:id="|${entityName}_pledgeShare|" th:name="|${entityName}.pledgeShare|"
                                th:initValue="${entity?.pledgeShare}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SHARES_PLEDGE}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_penaltyRate_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussPostInvestInfo.penaltyRate}">罚息比例</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_penaltyRate|" th:name="|${entityName}.penaltyRate|"
                                data-th-value="${entity?.penaltyRate}" class="layui-input form-input text-number"
                                data-textrange="2"  placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item" th:id="|${entityName}_twl_div|">
                    <div class="form-inline-wrap" th:id="|${entityName}_shareHolder_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussPostInvestInfo.shareHolder}">标的股票持有主体</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_shareHolder|" th:name="|${entityName}.shareHolder|"
                                data-th-value="${entity?.shareHolder}" class="layui-input form-input"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_tradeMarket_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussPostInvestInfo.tradeMarket}">交易场所</label>
                        <div class="layui-input-inline input-inline">
                            <select th:id="|${entityName}_tradeMarket|" th:name="|${entityName}.tradeMarket|"
                                th:initValue="${entity?.tradeMarket}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${TRADE_PLACE}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_repurchasePartyName_div|">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussPostInvestInfo.repurchasePartyName}">回购方名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_repurchasePartyName|"
                                th:name="|${entityName}.repurchasePartyName|"
                                data-th-value="${entity?.repurchasePartyName}" class="layui-input form-input"
                                 placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item" th:id="|${entityName}_threeteen_div|">
                    <div class="form-inline-wrap" th:id="|${entityName}_shareCode_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussPostInvestInfo.shareCode}">股票代码</label>
                        <div class="layui-input-inline input-inline">
