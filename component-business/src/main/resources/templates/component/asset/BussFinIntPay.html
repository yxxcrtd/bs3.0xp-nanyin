<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
	<div class="pro-module-wrap" th:id="|${entityName}_div|">
		<div class="pro-module">
			<h3 class="pro-module-title">
				<span class="title-des">分红计划</span>（<span class="star-sign">*</span>必填）<i
					class="iconfont icon-arrow-down pro-down-icon"></i>
			</h3>
			<input type="text" th:id="|${entityName}_profitType|"
				th:name="|${entityName}.profitType|" hidden>
			<div class="pro-module-item">
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-lable"
							data-th-utext="#{BussFinIntPay.payType}">分红方式</label>
						<div class="layui-input-inline input-inline">
							<input type="text"
								th:id="|${entityName}_payType|"
								th:name="|${entityName}.payType|"
								data-th-data-result="${BONUS_MODE}"
								th:initValue="${entity?.payType}"
								class="layui-input form-input input-checkbox" required />
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-lable"
							data-th-utext="#{BussFinIntPay.payCycle}">分红频率</label>
						<div class="layui-input-inline input-inline">
							<select th:id="|${entityName}_payCycle|"
								th:name="|${entityName}.payCycle|"
								data-th-data-result="${RETURN_FREQUENCY}"
								th:initValue="${entity?.payCycle}"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}" required>
							</select>
						</div>
					</div>
					<div class="form-inline-wrap" th:id="|${entityName}_dayValueDiv|">
						<label class="layui-form-label form-lable"
							data-th-utext="#{BussFinIntPay.dayValue}">分红日</label>
						<div class="layui-input-inline input-inline">
							<input type="number" th:id="|${entityName}_dayValue|"
								th:name="|${entityName}.dayValue|" required
								th:value="${entity?.dayValue}"
								min="1" step="1" max="31" data-textrange="0"
								class="layui-input form-input"/>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="form-inline-wrap" th:id="|${entityName}_endTdayRuleDiv|">
						<label class="layui-form-label form-lable"
							data-th-utext="#{BussFinIntPay.endTdayRule}">计息营业日准则</label>
						<div class="layui-input-inline input-inline">
							<select th:id="|${entityName}_endTdayRule|"
								th:name="|${entityName}.endTdayRule|"
								th:initValue="${entity?.endTdayRule}"
								data-th-data-result="${TDAY_RULE}"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}" required>
							</select>
						</div>
					</div>
					<div class="form-inline-wrap" th:id="|${entityName}_payTdayRuleDiv|">
						<label class="layui-form-label form-lable"
							data-th-utext="#{BussFinIntPay.payTdayRule}">付息营业日准则</label>
						<div class="layui-input-inline input-inline">
							<select th:id="|${entityName}_payTdayRule|"
								th:name="|${entityName}.payTdayRule|"
								data-th-data-result="${TDAY_RULE}"
								th:initValue="${entity?.payTdayRule}"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								 required>
							</select>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script data-th-inline="javascript" type="text/javascript">
		var Cycle_01 = /*[[${Cycle_01}]]*/'';//收益结转频率 - 按日结转
		var Cycle_02 = /*[[${Cycle_02}]]*/'';//收益结转频率 - 按月结转
		var MANT_PROC_MODE = /*[[${MANTISSA_PROCESS_MODE_01}]]*/'01'; //四舍五入
 		var BussFinIntPayEntityName = /*[[${entityName}]]*/'';
 		var h_01 = /*[[${h_01}]]*/'01';//货币基金
 		var bussFinIntPayElement = /*[[${bussFinIntPayElement}]]*/'';
		var fundTypeElement = /*[[${fundTypeElement}]]*/'';
		var TDAY_RULE_02 = /*[[${entity?.endTdayRule}]]*/'02';
		var pageModel = /*[[${pageModel}]]*/'';
		var isNotFromToDoList = /*[[${isNotFromToDoList}]]*/'';
	</script>
	<script data-th-src="@{/js/component/asset/BussFinIntPay.js}"
		type="text/javascript"></script>
</body>

</html>
