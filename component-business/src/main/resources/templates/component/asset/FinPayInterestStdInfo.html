<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.springframework.org/schema/mvc">
<body>
<div th:id="|${entityName}_div|" class="pro-module-wrap">
    <div class="pro-module">
        <h3 class="pro-module-title" th:id="|${entityName}_title_div|"><span class="title-des" data-th-text="#{FinPayInterestStdInfo}">付息信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i>
        </h3>
        <div class="pro-module-item">
            <div th:id="|${entityName}_form_div|" th:if="${FinInterestFactor_PageId } ne 'TrdProjectDurationInterest002'">
                <div class="layui-form-item">
                    <input th:name="|${entityName}.finprodType2|" th:value="${INT_ASSET_TYPE}" hidden>
                    <div class="form-inline-wrap" th:id="|${entityName}_endTdayRule_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinPayInterestStdInfo.endTdayRule}">计息营业日准则</label>
                        <div class="layui-input-inline input-inline">
                            <select th:id="|${entityName}_endTdayRule|" th:name="|${entityName}.endTdayRule|" th:initValue="${entity?.endTdayRule?:ENDTDAY_RULE_INIT}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${TDAY_RULE}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" th:text="${payTdayRuleLableName}"></label>
                        <div class="layui-input-inline input-inline">
                            <select th:id="|${entityName}_payTdayRule|" th:name="|${entityName}.payTdayRule|" th:initValue="${entity?.payTdayRule?:TDAY_RULE_INIT}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${TDAY_RULE}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinPayInterestStdInfo.payCycle}">付息频率</label>
                        <div class="layui-input-inline input-inline">
                        <!-- 一体化对应etliu -->
                            <!-- <select th:id="|${entityName}_payCycle|" th:name="|${entityName}.payCycle|" th:initValue="${entity?.payCycle?:INTPAY_CYCLE_INIT}" class="layui-input form-input input-select payCycle" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${INTPAY_CYCLE}">
                            </select> -->
                            <select th:id="|${entityName}_payCycle|" th:name="|${entityName}.payCycle|" th:initValue="${entity?.payCycle?:INTPAY_CYCLE_INIT}" class="layui-input form-input input-select payCycle" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${FREQUENCY_UNIT}">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinPayInterestStdInfo.calcRule}">推算方式</label>
                        <div class="layui-input-inline input-inline">
                        	<!-- 一体化对应etliu -->
                            <!-- <select th:id="|${entityName}_calcRule|" th:name="|${entityName}.calcRule|" th:initValue="${entity?.calcRule?:CALC_METHOD_INIT}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${CALC_METHOD}">
                            </select> -->
                            <select th:id="|${entityName}_calcRule|" th:name="|${entityName}.calcRule|" th:initValue="${entity?.calcRule?:CALC_METHOD_INIT}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${CALC_RULE}" required>
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinPayInterestStdInfo.firstPayDate}">首次付息日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_firstPayDate|" th:name="|${entityName}.firstPayDate|" data-th-value='${#dates.format(entity?.firstPayDate,"yyyy-MM-dd")}' class="layui-input form-input input-dateSelect"/>
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_remark_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinPayInterestStdInfo.remark}">自定义说明</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_remark|" th:name="|${entityName}.remark|" th:value="${entity?.remark}"
                                   class="layui-input form-input"/>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap" th:id="|${entityName}_payMonth_div|" style="display: none">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinPayInterestStdInfo.payMonth}">付息月</label>
                        <div class="layui-input-inline input-inline">
                            <select th:id="|${entityName}_payMonth|"  th:name="|${entityName}.payMonth|" th:initValue="${entity?.payMonth}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${MONTH}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_dayValue_div|" style="display: none">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinPayInterestStdInfo.dayValue}">付息日</label>
                        <div class="layui-input-inline input-inline">
                            <select th:id="|${entityName}_dayValue|" th:name="|${entityName}.dayValue|" th:initValue="${entity?.dayValue}" multiple="true" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${DAY_OF_MONTH}">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md11" style="padding-left: 10px;">
                    <div class="text-left">
                        <a th:id="|${entityName}_btn_generationPlan|" class="layui-btn layui-btn-sm" data-th-text="#{FinPayInterestStdInfo.generationPlan}">生成计划</a>
                        <a th:id="|${entityName}_btn_confirm|" class="layui-btn layui-btn-sm">确认</a>
                    </div>
                </div>
            </div>
            <div id="generationPlanTable_div">
                <table class="layui-table" id="generationPlanTable"></table>
            </div>
        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var INT_ASSET_TYPE = /*[[${INT_ASSET_TYPE}]]*/'';//初始化 --金融产品类型(投管)
    var INT_ASSET_TYPE_PAYINTEREST = /*[[${INT_ASSET_TYPE_PAYINTEREST}]]*/'';//项目类资产付息计划维护标志
    var COMMON_BUSINESS_TYPE_FINPROD10 = /*[[${COMMON_BUSINESS_TYPE_FINPROD10}]]*/'';//共同业务类型--付息计划调整
    var FINPROD_TYPE_TG_F01 = /*[[${FINPROD_TYPE_TG_F01}]]*/'F01'; //债券资产类型code
    var FINPROD_TYPE_TG_F07 = /*[[${FINPROD_TYPE_TG_F07}]]*/'F07'; //存款资产类型code
    var FINPROD_TYPE_TG_F17 = /*[[${FINPROD_TYPE_TG_F17}]]*/'F17'; //计划类资产类型code
    var FINPROD_TYPE_TG_F18 = /*[[${FINPROD_TYPE_TG_F18}]]*/'F18'; //项目类资产类型code
    var BIZ_TYPE_TRD17 = /*[[${BIZ_TYPE_TRD17}]]*/'TRD17'; //项目类资产存续期code
    var CALC_METHOD_04 = /*[[${CALC_METHOD_04}]]*/'04';     //推算方式-首次付息日
    var CALC_METHOD_NAME_04 = /*[[${CALC_METHOD_NAME_04}]]*/'首次付息日';     //推算方式-首次付息日name
    var INTPAY_CYCLE_09 = /*[[${INTPAY_CYCLE_09}]]*/'09';     //支付频率--不规则
    var INTPAY_CYCLE_10 = /*[[${INTPAY_CYCLE_10}]]*/'10';     //支付频率--到期一次性还本
    var INTPAY_CYCLE_NAME_09 = /*[[${INTPAY_CYCLE_NAME_09}]]*/'不规则';     //支付频率--不规则name
    var COUPON_SPECIES_01 = /*[[${COUPON_SPECIES_01}]]*/'01';     //息票品种--附息
    var COUPON_SPECIES_04 = /*[[${COUPON_SPECIES_04}]]*/'04';     //息票品种--利随本清
    var entityName_FinPayInterestStdInfo = /*[[${entityName}]]*/'';
    var entityName_FinInterestFactor = /*[[${entityNameFinInterestFactor}]]*/'';
    var entityName_BussFinRepayment = /*[[${entityNameBussFinRepayment}]]*/'';
    var INTPAY_CYCLE_03 = /*[[${INTPAY_CYCLE_03}]]*/'03';
    var INTPAY_CYCLE_04 = /*[[${INTPAY_CYCLE_04}]]*/'04';
    var INTPAY_CYCLE_05 = /*[[${INTPAY_CYCLE_05}]]*/'05';
</script>
<script data-th-src="@{/js/component/asset/FinPayInterestStdInfo.js}" type="text/javascript"></script>
</body>

</html>
