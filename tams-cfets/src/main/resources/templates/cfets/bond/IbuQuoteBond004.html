<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorator="~{layout/default}">
<head>
    <title th:text="#{CfetsBondDealQuotedPrice002}">现券买卖-对话报价</title>
</head>
<body>
<div layout:fragment="content">
    <style type="text/css">
        .form-inline-wrap {
            display: inline-block;
            float: left;
            width: 32%;
            padding-top: 10px;
        }

        .layui-form-radio {
            line-height: 28px;
            margin: 0 0 0 0;
            padding-right: 0px;
            cursor: pointer;
            font-size: 0;
        }

        .layui-form-radio>i {
            margin-right: 0px;
            font-size: 15px;
            color: rgb(194, 194, 194);
        }
        /* 放大镜特殊处理 */
        .iconfont {
            font-size: 21px;
        }
    </style>
    <div class="pro-module-container" style="margin-bottom: 20px;">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <input type="hidden" id="CfetsBondDealQuotedPrice004_hidden_finprodId" th:value="${entity?.finprodId}" />
            <input type="hidden" id="CfetsBondDealQuotedPrice004_hidden_calculateField" th:value="${entity?.calculateField}" />
            <div class="pro-module-wrapper pro-module-base" th:title="#{CfetsBondDealQuotedPrice003.baseinfo}">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{CfetsBondDealQuotedPrice002.baseinfo}">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item" data-th-if="${entity?.ps} neq ${PS_T03}">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label">报价方式</label>
                                    <div class="layui-input-block">
                                        <input type="radio" name="quoteStyle" value="01" th:checked="'01' eq ${entity?.quoteStyle}" title="对话报价">
                                        <input type="radio" name="quoteStyle" value="02" th:checked="'02' eq ${entity?.quoteStyle}" title="请求报价">
                                        <input type="radio" name="quoteStyle" value="03" th:checked="'03' eq ${entity?.quoteStyle}" title="X-Bond">
                                        <input type="radio" name="quoteStyle" value="04" th:checked="'04' eq ${entity?.quoteStyle}" title="做市报价">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice002.ps}">交易方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="ps" name="ps"
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${PS}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.ps}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资产代码</label>
                                    <div class="layui-input-inline input-inline buss-inline-wrap">
                                        <input required type="text" name="finprodMarketId"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.finprodMarketId}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资产简称</label>
                                    <div class="layui-input-inline input-inline buss-inline-wrap">
                                        <input required type="text" name="finprodAbbr"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.finprodAbbr}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item" data-th-if="${entity?.ps} eq ${PS_T03}">
                                <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" >登记日期</label>
                                <div class="layui-input-inline input-inline buss-inline-wrap">
                                    <div class="layui-input-inline input-inline buss-inline-wrap">
                                        <input disabled type="text"  name="settleDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${#dates.format(entity?.settleDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >理论行权日</label>
                                    <div class="layui-input-inline input-inline buss-inline-wrap">
                                        <div class="layui-input-inline input-inline buss-inline-wrap">
                                            <input disabled type="text"  name="settleDate"
                                                   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                                   th:placeholder="#{SysCommon.placeholder}"
                                                   th:value="${#dates.format(entity?.theoreticalExerciseDate,'yyyy-MM-dd')}">
                                        </div>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >实际行权日</label>
                                    <div class="layui-input-inline input-inline buss-inline-wrap">
                                        <div class="layui-input-inline input-inline buss-inline-wrap">
                                            <input disabled type="text"  name="settleDate"
                                                   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                                   th:placeholder="#{SysCommon.placeholder}"
                                                   th:value="${#dates.format(entity?.actSetteDate,'yyyy-MM-dd')}">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item" data-th-if="${entity?.ps} neq ${PS_T03}">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice002.my}">本方</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="mySideAbbr"
                                               data-th-value="${entity?.mySideAbbr}"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}">
                                        <!--<select required type="text" id="CfetsBondDealQuotedPrice004_mySide" name="mySide"
                                                class="layui-input form-input input-select" parentIds="CfetsBondDealQuotedPrice004_portfolioName"
                                                th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
                                                th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryMySideList}" allowClear="true"
                                                formatoption="true" th:initValue="${entity?.mySide}"></select>-->
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{CfetsBondDealQuotedPrice002.myTradeId}">本方交易员</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="ouTraderName"
                                               data-th-value="${entity?.ouTraderName}"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}">
                                        <!--<select required type="text" id="CfetsBondDealQuotedPrice004_mySideTrader" name="mySideTrader"
                                                class="layui-input form-input input-select" parentIds="CfetsBondDealQuotedPrice004_mySide"
                                                th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
                                                th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryMySideTraderList}" allowClear="true"
                                                formatoption="true" th:initValue="${entity?.mySideTrader}"></select>-->
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item" data-th-if="${entity?.ps} neq ${PS_T03}">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice002.counterId}">对手方</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="counterName"
                                               data-th-value="${entity?.counterName}"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}">
                                        <!--<select required type="text" id="CfetsBondDealQuotedPrice004_counterId" name="counterId"
                                                class="layui-input form-input input-select"
                                                th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
                                                th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryCounterSideList}" allowClear="true"
                                                formatoption="true"
                                                th:initValue="${entity?.counterId}"></select>-->
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice002.counterTradeId}">对手方交易员</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="counterTraderName"
                                               data-th-value="${entity?.counterTraderName}"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}">
                                        <!--<select required type="text" id="CfetsBondDealQuotedPrice004_counterTrader" name="counterTrader"
                                                class="layui-input form-input input-select" parentIds="CfetsBondDealQuotedPrice004_counterId"
                                                th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
                                                th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryMySideTraderList}" allowClear="true"
                                                formatoption="true"
                                                th:initValue="${entity?.counterTrader}"></select>-->
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item" data-th-if="${entity?.ps} neq ${PS_T03}">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{CfetsBondDealQuotedPrice002.settleSpeed}" >清算速度</label>
                                    <div class="layui-input-inline input-inline buss-inline-wrap">
                                        <select required type="text" id="CfetsBondDealQuotedPrice004_settleSpreed" name="settleSpreedCode"
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${ACCOUNT_SPEED}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.settleSpreedCode}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >结算日期</label>
                                    <div class="layui-input-inline input-inline buss-inline-wrap">
                                        <div class="layui-input-inline input-inline buss-inline-wrap">
                                            <input disabled type="text" id="CfetsBondDealQuotedPrice004_settleDate" name="settleDate"
                                                   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                                   th:placeholder="#{SysCommon.placeholder}"
                                                   th:value="${#dates.format(entity?.settleDate,'yyyy-MM-dd')}">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item" data-th-if="${entity?.ps} neq ${PS_T03}">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">
                                        <input type="radio" lay-filter="calculateField" id="calculateField_unitCprice" name="calculateField" value="01" th:checked="${entity?.calculateField eq '01'}">
                                        <span th:if="${entity?.calculateField eq calcTypeUnitCprice}" style="color: blue;" data-th-text="#{CfetsBondDealQuotedPrice002.cleanPrice}"></span>
                                        <span id="calculateField_span_unitCprice" th:if="${entity?.calculateField != calcTypeUnitCprice}" data-th-text="#{CfetsBondDealQuotedPrice002.cleanPrice}"></span>
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="CfetsBondDealQuotedPrice004_unitCprice" name="price"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-fixtype="2" data-textrange="4"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.price}">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">
                                        <input type="radio" lay-filter="calculateField" id="calculateField_yield" name="calculateField" value="02" th:checked="${entity?.calculateField eq '02'}">
                                        <span th:if="${entity?.calculateField eq calcTypeYield}" style="color: blue;" data-th-text="#{CfetsBondDealQuotedPrice002.mYield}"></span>
                                        <span id="calculateField_span_yield" th:if="${entity?.calculateField != calcTypeYield}" data-th-text="#{CfetsBondDealQuotedPrice002.mYield}"></span>
                                    </label>
                                    <div class="layui-input-inline input-inline buss-inline-wrap">
                                        <input required type="text" id="CfetsBondDealQuotedPrice004_matureYield" name="matureYield"
                                               class="layui-input form-input text-number"
                                               data-fixtype="2" data-textrange="4" th:value="${entity?.matureYield}">
                                        <span class="input-right-show">%</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <div>
                                        <label class="layui-form-label form-label-wrap">
                                            <input type="radio" style="float: left;" id="calculateField_exerYield" name="calculateField" value="03" th:checked="${entity?.calculateField eq '03'}">
                                            <span th:if="${entity?.calculateField eq calcTypeExecYield}" style="color: blue;" data-th-text="#{CfetsBondDealQuotedPrice002.exec}"></span>
                                            <span id="calculateField_span_exerYield" th:if="${entity?.calculateField != calcTypeExecYield}" data-th-text="#{CfetsBondDealQuotedPrice002.exec}"></span>
                                        </label>
                                        <div class="layui-input-inline input-inline buss-inline-wrap">
                                            <input required type="text" id="CfetsBondDealQuotedPrice004_exerYield" name="exerYield"
                                                   class="layui-input form-input text-number"
                                                   data-fixtype="2" data-textrange="4" th:value="${entity?.exerYield}">
                                            <span class="input-right-show">%</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required disabled type="text"  name="ccy" class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${CCY}' allowClear="true" formatoption="true"
                                                th:initValue="*{entity?.ccy}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice002.bondPrinamt}">券面总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" name="shareAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-fixtype="2" data-textrange="2"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.shareAmt}">
                                        <span class="input-right-show">万元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" data-th-if="${entity?.ps} eq ${PS_T03}">
                                    <label class="layui-form-label form-label-wrap">行权净价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text"  name="price"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-fixtype="2" data-textrange="4"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.price}">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item" style="display: none">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">本方券券面总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text"  name="ourEntNum"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-fixtype="2" data-textrange="2"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.ourEntNum}">
                                        <span class="input-right-show">万元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" data-th-if="${entity?.ps} eq ${PS_T02}">
                                    <label class="layui-form-label form-label-wrap">融入券券面总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" name="lendinEntNum"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-fixtype="2" data-textrange="2"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.lendinEntNum}">
                                        <span class="input-right-show">万元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" data-th-if="${entity?.ps} eq ${PS_T01}">
                                    <label class="layui-form-label form-label-wrap">卖空购回券面总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" name="sellAbleNum"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-fixtype="2" data-textrange="2"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.sellAbleNum}">
                                        <span class="input-right-show">万元</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item" data-th-if="${entity?.ps} neq ${PS_T03}">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice002.settleMethod}">结算方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="CfetsBondDealQuotedPrice004_settleMethod" name="settleMethod"
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${SETT_MODE}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.settleMethod}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice002.settleType}">清算类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="CfetsBondDealQuotedPrice004_settleType" name="settleType"
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${CLEAR_TYPE}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.settleType}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易手续费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="dealFeeAmt" name="dealFeeAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-fixtype="2" data-textrange="2"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.dealFeeAmt}">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">结算服务费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="settFeeAmt" name="settFeeAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-fixtype="2" data-textrange="2"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.settFeeAmt}">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap" data-th-if="${entity?.ps} neq ${PS_T03}">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des" th:text="#{CfetsBondDealQuotedPrice002.remark}">备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="layui-form-item">
                                <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                    <textarea id="CfetsBondDealQuotedPrice004_remark" name="remark" maxlength="200" th:text="${entity?.remark}"
                                              class="layui-textarea" placeholder="请输入内容"
                                              th:placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap" data-th-if="${entity?.ps} neq ${PS_T03}">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des" th:text="#{CfetsBondDealQuotedPrice002.amtInfo}">金额信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">净价</label>
                                <div class="layui-input-inline input-inline">
                                <input required disabled type="text" id="CfetsBondDealQuotedPrice004_unitCprice2" name="price2" data-th-value="${entity?.price}"

                                <span class="input-right-show">元</span>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">交易金额</label>
                                <div class="layui-input-inline input-inline">

                                </div>
                            </div>
