    heartbeatInterval: 5
    senderCompId: JOYIN
    targetCompId: MDGW
    version: 00.40
    reconnect: 10
    reconnectInterval: 30
    filePath: D:\HQ
  file:
    active: true             #是否启动文件行情服务
    quoteDir: D:\HQ           #行情落地文件目录
    cpxx: cpxx0202            #产品信息文件前缀，根据提供文件进行配置版本期次，仅用于获取涨跌停价格 -- cpxx0202、cpxx0201、cpxx0102、cpxx
