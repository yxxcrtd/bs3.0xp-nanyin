szse:
  binary:
    active: true  #是否启用深证流行情服务
    ip: 127.0.0.1 #对应通神（国金）行情分发程序所在ip地址
    port: 9201    #行情分发程序配置行情行情分发端口
    password: N000227Q0007  # 无需配置，默认配置即可
    heartbeatInterval: 10   # 行情终端与行情分发程序心跳间隔时间（s）
    senderCompId: Zork_XBL_2.54 # 默认配置即可
    targetCompId: N000227Q0008 #  默认配置即可
    version: 1.02   # 行情网关版本号，默认即可
    reconnect: 3    # 行情终端主动重连次数，超过次数即不在重连
    reconnectInterval: 30 #重连间隔时间（s）