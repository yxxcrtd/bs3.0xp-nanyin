server:
  port: 8084
spring:
  application:
    name: PINGAN-BATCH-SERVER #服务名称
  profiles:
    active: test
  datasource:
    driverClassName: oracle.jdbc.driver.OracleDriver
batch:
  properties:
    chunkNumber: 100
    concurrency: 10
    queueCapacity: 50
    maxExeUser: 5         #最大并发用户数
    maxThreadPerUser: 10  #每用户最大并发数
    sleeptime: 10000      #轮询时间
    maxSqlNum: 50         #批量提交数量
    needProcessLog: false #process是否记录正常日志
    enableServerDoubleAlive: false #是否启用双活
    serverName: SERVER1 #服务器名称
    notifyIntervalTime: 30000 #通知没有宕机的时间间隔， 服务器单独线程，间隔这个毫秒刷新SYS_SERVER_PRI的UPDATE_TIME，标识没有宕机
    serverDownTime: 600000 #判断已经宕机的时间（毫秒） 数据库服务器当前时间与上次更新时间对比，如果毫秒数超过这个设置，认为宕机
eureka:
  instance:
    hostname: ${spring.cloud.client.ipAddress}
    instanceId: ${spring.cloud.client.ipAddress}:${server.port}
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://192.168.70.6:9100/eureka/

