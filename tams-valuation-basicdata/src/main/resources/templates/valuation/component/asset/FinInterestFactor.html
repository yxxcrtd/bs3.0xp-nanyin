<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.springframework.org/schema/mvc">
<html>
<head>
    <style type="text/css">
     .delaytime-inline-wrap .select2-container{
        width: 150px!important;
    } 
    .rate-inline-label .select2-container{
        width: 55%!important;
    }
    .fin-interest-wrap .select2-container{
        float: left;
        display: inline-block;
        width: 24%!important;
    }
    </style>
</head>
<body>
	<div th:id="|${entityName}_div|"  class="pro-module-wrap">
	    <div class="pro-module">
	        <h3 class="pro-module-title"><span class="title-des" data-th-text="#{FinInterestFactor}">计息要素</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
	        <div class="pro-module-item">  
                <div class="layui-form-item" th:id="|${entityName}_one_div|">
                    <input th:name="|${entityName}.finprodType2|" th:value="${INT_ASSET_TYPE}" hidden>
                    <input th:name="|${entityName}.finprodType|" th:value="${INT_ASSET_TYPE}" hidden>
                    <div class="form-inline-wrap" th:id="|${entityName}_couponSpecies_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinInterestFactor.couponSpecies}" >息票品种</label>
                        <div class="layui-input-inline input-inline">
                            <select th:id="|${entityName}_couponSpecies|" th:name="|${entityName}.couponSpecies|" th:initValue="${entity?.couponSpecies?:COUPON_SPECIES_INIT}" 
                                        class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${COUPON_SPECIES}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_rateType_div|">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{FinInterestFactor.rateType}">利率类型</label>
                            <div class="layui-input-inline input-inline">
                            		 <!-- 一体化对应etliu -->
                                     <!-- <input type="text" th:id="|${entityName}_rateType|" th:name="|${entityName}.rateType|"  th:initValue="${entity?.rateType?:ASSET_TYPE_INIT}" required -->
                                     <input type="text" th:id="|${entityName}_rateType|" th:name="|${entityName}.intType|"  th:initValue="${entity?.intType?:ASSET_TYPE_INIT}" required
                                                           class="layui-input form-input input-checkbox"  data-th-data-result="${INT_TYPE}"/>
                                </select>
                            </div>
                      </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_basis_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinInterestFactor.basis}" >计息基础</label>
                        <div class="layui-input-inline input-inline">
                            <select th:id="|${entityName}_basis|" th:name="|${entityName}.basis|" th:initValue="${entity?.basis?:BASIS_INIT}"   
                                        class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${BASIS}">
                            </select>
                        </div>
                     </div>
                    <div class="form-inline-wrap" id="calRateType_div">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="计息利率方式">计息利率方式</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_calRateType|"  th:name="|${entityName}.calRateType|"
                                   data-th-initValue="${entity?.calRateType?:CAL_RATE_TYPE_02}" required="required"
                                   class="layui-input form-input input-checkbox"
                                   data-th-data-result="${CAL_RATE_TYPE}" />
                        </div>
                    </div>
                </div>
                <div class="layui-form-item" th:id="|${entityName}_two_div|">
	                <div class="form-inline-wrap" th:id="|${entityName}_basisStyle_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinInterestFactor.basisStyle}" >利息分配方式</label>
                        <div class="layui-input-inline input-inline">
                            <select th:id="|${entityName}_basisStyle|" th:name="|${entityName}.basisStyle|" th:initValue="${entity?.basisStyle?:INTPAY_RULE_INIT}"   
                                        class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${INTPAY_RULE}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_rate_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinInterestFactor.rate}">初始利率</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_rate|" th:name="|${entityName}.rate|"   th:value="${entity?.rate}"  required
                                   class="layui-input form-input text-number" data-textrange="4"/>
                            <span class="input-right-show begin-show">%<a id="FinInterestFactor_btn_calRate" class="layui-btn layui-btn-sm form-input-text" >计算</a></span>
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_loadRate_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinInterestFactor.loadRate}">借款利率</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_loadRate|" th:name="|${entityName}.loadRate|"  th:value="${entity?.loadRate}"  
                                   class="layui-input form-input text-number" data-textrange="4" required="required"/>
                            <span class="input-right-show">%</span>
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_investRate_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinInterestFactor.investRate}">净投资收益率</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_investRate|" th:name="|${entityName}.investRate|"  th:value="${entity?.investRate}"  disabled="disabled"
                                   class="layui-input form-input text-number" data-textrange="4"/>
                            <span class="input-right-show">%</span>
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_rateMax_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinInterestFactor.rateMax}">利率上限</label>
                        <div class="layui-input-inline input-inline">
                            <!-- 一体化对应etliu -->
                            <!-- <input type="text" th:id="|${entityName}_rateMax|" th:name="|${entityName}.rateMax|"  th:value="${entity?.rateMax}" --> 
                            <input type="text" th:id="|${entityName}_rateMax|" th:name="|${entityName}.highestRate|"  th:value="${entity?.highestRate}"
                                   class="layui-input form-input text-number"/>
                            <span class="input-right-show">%</span>
                        </div>
                    </div>
	            </div>
                <div class="layui-form-item" th:id="|${entityName}_three_div|">
                    <div class="form-inline-wrap" th:id="|${entityName}_rateMin_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinInterestFactor.rateMin}">利率下限</label>
                        <div class="layui-input-inline input-inline">
							<!-- 一体化对应etliu -->
                            <!-- <input type="text" th:id="|${entityName}_rateMin|" th:name="|${entityName}.rateMin|"  th:value="${entity?.rateMin}" --> 
                            <input type="text" th:id="|${entityName}_rateMin|" th:name="|${entityName}.lowestRate|"  th:value="${entity?.lowestRate}" 
                                   class="layui-input form-input text-number"/>
                            <span class="input-right-show">%</span>
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_resetType_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinInterestFactor.resetType}" >基准利率调整规则</label>
                        <div class="layui-input-inline input-inline">
                            <select th:id="|${entityName}_resetType|" th:name="|${entityName}.resetType|" th:initValue="${entity?.resetType}"   
                                        class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${RESET_TYPE}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_observeBefDay_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinInterestFactor.observeBefDay}" >延后时间</label>
                        <div class="layui-input-inline input-inline delaytime-inline-wrap">
                            <input type="text" th:id="|${entityName}_observeBefDay|" th:name="|${entityName}.observeBefDay|" th:value="${entity?.observeBefDay}" data-textrange="0" style="width: 75px;display:inline-block;" class="layui-input form-input text-number"/>
                            <span class="rate-text" style="margin-left: 10px"></span>
                            <select th:id="|${entityName}_observeBefUnit|" th:name="|${entityName}.observeBefUnit|" th:initValue="${entity?.observeBefUnit}"    style="width: 49%"
                                        class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${ADVANCE_OBSERV_UNIT}">
                            </select>
                        </div>
                    </div>
                 </div>
                 <div class="layui-form-item" th:id="|${entityName}_four_div|">
                   <div class="form-inline-wrap" th:id="|${entityName}_indexId_div|" style='width:100%;'>
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinInterestFactor.indexId}" style=" width: 11.9%;">浮动利率</label>
                        <div class='layui-input-inline input-inline fin-interest-wrap' style="width: 82%!important;">
						<!-- 一体化对应etliu -->
                        <!-- <select th:id="|${entityName}_indexId|" th:name="|${entityName}.indexId|" th:initValue="${entity?.indexId}" -->   
                        <select th:id="|${entityName}_indexId|" th:name="|${entityName}.benchmarkId|" th:initValue="${entity?.benchmarkId}"   
                                        class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${SECRATE_DATA}">
                            </select>
                           <label class="layui-form-label form-label-wrap rate-text" data-th-text="#{FinInterestFactor.coefficient}" style="float: left;display: inline-block;width: 6%;">*系数</label>
                                <input type="text" th:id="|${entityName}_coefficient|" th:name="|${entityName}.coefficient|"  th:value="${entity?.coefficient}" class="layui-input form-input" style="float: left;display: inline-block; width: 12%;"/>
                            <label class="layui-form-label form-label-wrap rate-text" data-th-text="#{FinInterestFactor.spreadRate}" style="float: left;display: inline-block;width: 6%;">+利差(%)</label>
                            <input type="text" th:id="|${entityName}_spreadRate|" th:name="|${entityName}.spreadRate|"  th:value="${entity?.spreadRate}" class="layui-input form-input" style="float: left;display: inline-block; width: 12%;"/>
                            <!-- <div class='layui-input-inline input-inline'>
                                <label class="layui-form-label form-label-wrap rate-text" data-th-text="#{FinInterestFactor.coefficient}">*系数</label>
                                <input type="text" th:id="|${entityName}_coefficient|" th:name="|${entityName}.coefficient|"  th:value="${entity?.coefficient}" class="layui-input form-input"/>
                            </div> -->
                            
                           <!--  <div class='layui-input-inline input-inline'>
                            <label class="layui-form-label form-label-wrap rate-text" data-th-text="#{FinInterestFactor.spreadRate}">+利差</label>
                            <input type="text" th:id="|${entityName}_spreadRate|" th:name="|${entityName}.spreadRate|"  th:value="${entity?.spreadRate}" class="layui-input form-input"/>
                            </div> -->
                        </div>
                        </div>
                        <!-- <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap rate-text" data-th-text="#{FinInterestFactor.coefficient}">*系数</label>
                            <div class='layui-input-inline input-inline'>
                                <input type="text" th:id="|${entityName}_coefficient|" th:name="|${entityName}.coefficient|"  th:value="${entity?.coefficient}" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap rate-text" data-th-text="#{FinInterestFactor.spreadRate}">+利差</label>
                            <div class='layui-input-inline input-inline'>
                            <input type="text" th:id="|${entityName}_spreadRate|" th:name="|${entityName}.spreadRate|"  th:value="${entity?.spreadRate}" class="layui-input form-input"/>
                            </div>
                        </div> -->
                        <!-- <div class="layui-input-inline input-inline rate-inline-label">

                           
                            <span class="rate-text" data-th-text="#{FinInterestFactor.spreadRate}">+利差</span>
                            <input type="text" th:id="|${entityName}_spreadRate|" th:name="|${entityName}.spreadRate|"  th:value="${entity?.spreadRate}" class="layui-input form-input rate-input-wrap"/>
                        </div> -->
                    </div>
                 <div class="layui-form-item" th:id="|${entityName}_five_div|">
                    <!-- <div class="form-inline-wrap" th:id="|${entityName}_investRate_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinInterestFactor.investRate}">净投资收益率</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_investRate|" th:name="|${entityName}.investRate|"  th:value="${entity?.investRate}"  disabled="disabled"
                                   class="layui-input form-input text-number" data-textrange="4"/>
                            <span class="input-right-show">%</span>
                        </div>
                    </div> -->
                   <!--  <div class="form-inline-wrap" th:id="|${entityName}_referRate_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinInterestFactor.referRate}">资产推荐费率</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_referRate|" th:name="|${entityName}.referRate|"  th:value="${entity?.referRate}" 
                                   class="layui-input form-input text-number"/>
                             <span class="input-right-show">%</span>
                        </div>
                    </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_buyOutRate_div|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinInterestFactor.buyOutRate}">买断利率</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_buyOutRate|" th:name="|${entityName}.buyOutRate|"  th:value="${entity?.buyOutRate}"  
                                   class="layui-input form-input text-number"/>
                            <span class="input-right-show">%</span>
                        </div>
                    </div> -->
                </div>
                </div>
                </div>
	    </div>
    <script data-th-inline="javascript" type="text/javascript">
    	var BASIS_A_A = /*[[${BASIS_A_A}]]*/'A/A';   //计息基础A/A
        var BASIS_A_A_D = /*[[${BASIS_A_A_D}]]*/'A/A_D';   //计息基础A/A
        var INT_ASSET_TYPE = /*[[${INT_ASSET_TYPE}]]*/'';//初始化 --金融产品类型(投管)
        var INT_TYPE_01 = /*[[${INT_TYPE_01}]]*/'01';//利率类型 -- 固定利率
        var INT_TYPE_02 = /*[[${INT_TYPE_02}]]*/'02';//利率类型 -- 浮动利率
        var FINPROD_TYPE_F01 = /*[[${FINPROD_TYPE_F01}]]*/'F01'; //债券资产类型code
        var FINPROD_TYPE_F07 = /*[[${FINPROD_TYPE_F07}]]*/'F07'; //存款资产类型code
        var FINPROD_TYPE_F21 = /*[[${FINPROD_TYPE_F21}]]*/'F21'; //同业借款code
        var FINPROD_TYPE_F17 = /*[[${FINPROD_TYPE_F17}]]*/'F17'; //计划类资产类型code
        var COUPON_SPECIES_01 = /*[[${COUPON_SPECIES_01}]]*/'01'; //息票品种_附息
        var COUPON_SPECIES_02 = /*[[${COUPON_SPECIES_02}]]*/'02'; //息票品种_贴现
        var COUPON_SPECIES_03 = /*[[${COUPON_SPECIES_03}]]*/'03'; //息票品种_零息
        var COUPON_SPECIES_04 = /*[[${COUPON_SPECIES_04}]]*/'04'; //息票品种_利随本清
        var RESET_TYPE_01 = /*[[${RESET_TYPE_01}]]*/'01'; //重置类型_基准利率调整规则_基准利率变动后固定间隔生效
        var RESET_TYPE_02 = /*[[${RESET_TYPE_02}]]*/'02'; //重置类型_基准利率调整规则_付息后下一计息期生效
        var INTPAY_RULE_01 = /*[[${INTPAY_RULE_01}]]*/'01'; //利息分配方式_按照实际天数分配
        var entityName_FinInterestFactor = /*[[${entityName}]]*/'';
        var entityName_PayInterest = /*[[${entityNamePayInterest}]]*/'';
        var entityName_BussFinRepayment  = /*[[${entityNamebussFinRepayment}]]*/''; 
        var entityName_BusiFinExercisePlan  = /*[[${entityNamebusiFinExercisePlan}]]*/''; 
        var entityName_BussFinRecomment  = /*[[${entityNameBussFinRecomment}]]*/''; 
        //add by wangpeng 20190828 修复债券类资产新建时选择利随本清时候 推算方式为空 strat 
        var CALC_RULE_01 = /*[[${CALC_RULE_01}]]*/'01'; //起息日向后
        //add by wangpeng 20190828 end
	</script>
	<script data-th-src="@{/js/valuation/component/asset/FinInterestFactor.js}" type="text/javascript"></script>
</body>

</html>
