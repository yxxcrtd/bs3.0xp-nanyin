<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{MstCurveDefManage002}">收益率曲线详情</title>
    <style>
        .height30{
            height:30px;
            padding-top:0px;
        }
    </style>
</head>
<body>
     <div layout:fragment="content">
           <form class="layui-form"  id="submitForm">
               <div class="layui-form-item">
                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-lable"
                              data-th-text="#{MstCurveDefManage002.curveCode}">曲线代码</label>
                       <div class="layui-input-inline input-inline">
                           <input type="text" id="curveCode" name="curveCode" maxlength="50"
                                  class="layui-input form-input"
                                  placeholder="请输入内容" data-th-value = "${entity?.curveCode}"
                                  data-th-placeholder="#{SysCommon.placeholder}" required
                           >
                       </div>
                   </div>

                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-lable"
                              data-th-text="#{MstCurveDefManage002.curveName}">曲线名称</label>
                       <div class="layui-input-inline input-inline">
                           <input type="text" id="curveName" name="curveName"
                                  class="layui-input form-input"
                                  placeholder="请输入内容"
                                  data-th-placeholder="#{SysCommon.placeholder}"
                                  data-th-value = "${entity?.curveName}" required
                           >
                       </div>
                   </div>
               </div>

               <div class="layui-form-item">
                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-lable"
                              data-th-text="#{MstCurveDefManage002.valueSource}">曲线来源</label>
                       <div class="layui-input-inline input-inline">
                           <select formatoption = "true" type="text" id="valueSource"
                                   name="valueSource"class="layui-input form-input input-select"
                                   data-th-data-result='${CURVE_SOURCE}' data-th-initValue="${entity?.valueSource}"
                                   allowClear="true"placeholder="请输入内容"data-th-placeholder="#{SysCommon.placeholder}" required>
                           </select>
                       </div>
                   </div>

                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-label-wrap">是否曲线族</label>
                       <div class="layui-input-inline input-inline">
                           <input type="checkbox" id="curveGroupType" name="curveGroupType" lay-filter="curveGroupType"
                                  lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                  data-th-checked="${YES_OR_NO_Y} ==${entity?.curveGroupType}" required>
                       </div>
                   </div>

               </div>

               <div class="layui-form-item" id="intCurveType_id">
                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-lable"
                              data-th-text="#{MstCurveDefManage002.intCurveType}">曲线类型</label>
                       <div class="layui-input-inline input-inline">
                           <select formatoption = "true" type="text" id="intCurveType"
                                   name="intCurveType"class="layui-input form-input input-select"
                                   data-th-data-result='${CURVE_TYPE}' data-th-initValue="${entity?.intCurveType}"
                                   allowClear="true"placeholder="请输入内容"data-th-placeholder="#{SysCommon.placeholder}" required>
                           </select>
                       </div>
                   </div>

                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-lable">评级</label>
                       <div class="layui-input-inline input-inline">
                           <select formatoption = "true" type="text" id="gradeResult"
                                   name="gradeResult"class="layui-input form-input input-select"
                                   data-th-data-result='${MAIN_GRADE_RESULT}' data-th-initValue="${entity?.gradeResult}"
                                   allowClear="true"placeholder="请输入内容"data-th-placeholder="#{SysCommon.placeholder}">
                           </select>
                       </div>
                   </div>
               </div>

               <div class="layui-form-item">
                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-label-wrap">N</label>
                       <div class="layui-input-inline input-inline">
                           <select type="text" id="n" name="n"
                                   class="layui-input form-input input-select" allowClear="true"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    data-formatoption="false"
                                   data-th-data-url="@{/valuation/basicdata/mstcurvedefmanage/MstCurveDefManage002/getNkSelect}"
                                   data-th-initvalue="${entity?.n}">
                           </select>
                       </div>
                   </div>
                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-lable">K</label>
                       <div class="layui-input-inline input-inline">
                           <select type="text" id="k" name="k"
                                   class="layui-input form-input input-select" allowClear="true"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-formatoption="false"
                                   data-th-data-url="@{/valuation/basicdata/mstcurvedefmanage/MstCurveDefManage002/getNkSelect}"
                                   data-th-initvalue="${entity?.k}">
                           </select>
                       </div>
                   </div>
               </div>



               <div class="layui-form-item">
                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-lable">所属曲线族</label>
                       <div class="layui-input-inline input-inline">
                           <select type="text" id="curveGroupCode" name="curveGroupCode"
                                   class="layui-input form-input input-select" allowClear="true"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-formatoption="false"
                                   data-th-data-url="@{/valuation/basicdata/mstcurvedefmanage/MstCurveDefManage002/getCurveGroupSelect}"
                                   data-th-initvalue="${entity?.curveGroupCode}">
                           </select>
                       </div>
                   </div>

                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-lable"
                              data-th-text="#{MstCurveDefManage002.ccy}">币种</label>
                       <div class="layui-input-inline input-inline">
                           <select formatoption = "true" type="text" id="ccy"
                                   name="ccy"class="layui-input form-input input-select"
                                   data-th-data-result='${CCY}' data-th-initValue="${entity?.ccy}"
                                   allowClear="true"placeholder="请输入内容"data-th-placeholder="#{SysCommon.placeholder}" required>
                           </select>
                       </div>
                   </div>

               </div>

               <div class="layui-form-item">

                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-lable"
                              data-th-text="#{MstCurveDefManage002.interMethod}">插值方式</label>
                       <div class="layui-input-inline input-inline ">
                           <input type="text" id="interMethod" name="interMethod"
                                  class="layui-input form-input"
                                  placeholder="请输入内容"
                                  data-th-placeholder="#{SysCommon.placeholder}"
                                  data-th-value = "${entity?.interMethod}" disabled required>
                       </div>
                   </div>

                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-lable"
                              data-th-text="#{MstCurveDefManage002.dayRules}">日算规则</label>
                       <div class="layui-input-inline input-inline">
                           <input type="text" id="dayRules" name="dayRules"
                                  class="layui-input form-input"
                                  placeholder="请输入内容"
                                  data-th-placeholder="#{SysCommon.placeholder}"
                                  data-th-value = "${entity?.dayRules}" disabled required>
                       </div>
                   </div>
               </div>

               <div class="layui-form-item">

                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-lable"
                              data-th-text="#{MstCurveDefManage002.calender}">日历</label>
                       <div class="layui-input-inline input-inline">
                           <input type="text" id="calender" name="calender"
                                  class="layui-input form-input"
                                  placeholder="请输入内容"
                                  data-th-placeholder="#{SysCommon.placeholder}"
                                  data-th-value = "${entity?.calender}" disabled required>
                       </div>
                   </div>

                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-lable"
                              data-th-text="#{MstCurveDefManage002.interestDateRule}">付息日规则</label>
                       <div class="layui-input-inline input-inline">
                           <input type="text" id="interestDateRule" name="interestDateRule"
                                  class="layui-input form-input"
                                  placeholder="请输入内容"
                                  data-th-placeholder="#{SysCommon.placeholder}"
                                  data-th-value = "${entity?.interestDateRule}" disabled  required>
                       </div>
                   </div>
               </div>

               <div class="layui-form-item">

                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-lable"
                              data-th-text="#{MstCurveDefManage002.interestCalMethod}">计息方式</label>
                       <div class="layui-input-inline input-inline">
                           <input type="text" id="interestCalMethod" name="interestCalMethod"
                                  class="layui-input form-input"
                                  placeholder="请输入内容"
                                  data-th-placeholder="#{SysCommon.placeholder}"
                                  data-th-value = "${entity?.interestCalMethod}" disabled  required>
                       </div>
                   </div>

                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-lable"
                              data-th-text="#{MstCurveDefManage002.interestFreq}">付息频率</label>
                       <div class="layui-input-inline input-inline">
                           <input type="text" id="interestFreq" name="interestFreq"
                                  class="layui-input form-input"
                                  placeholder="请输入内容"
                                  data-th-placeholder="#{SysCommon.placeholder}"
                                  data-th-value = "${entity?.interestFreq}" disabled required>
                       </div>
                   </div>
               </div>

               <div class="layui-form-item">
                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-lable" >描述</label>
                       <div class="layui-input-inline input-inline">
                           <input type="text" id="remark" name="remark"
                                  class="layui-input form-input"
                                  placeholder="请输入内容"
                                  data-th-placeholder="#{SysCommon.placeholder}"
                                  data-th-value = "${entity?.remark}" required>
                       </div>
                   </div>
               </div>
               <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="position: fixed;bottom: 30px;">
                   <div class="text-center">
                       <!--<a id="ModGradePdConfig002_btn_save" class="layui-btn layui-btn-sm btn-save"
                          data-th-text="#{SysCommon.save}">保存</a>-->
                       <a id="MstCurveDefManage002_btn_submit"
                          class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                       <a id="MstCurveDefManage002_btn_cancel"
                          class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                   </div>
               </div>
           </form>

     </div>
     <div layout:fragment="script">
         <script data-th-src="@{/js/valuation/basicdata/mstcurvedefmanage/MstCurveDefManage002.js}" type="text/javascript"></script>
     </div>
</body>

</html>
