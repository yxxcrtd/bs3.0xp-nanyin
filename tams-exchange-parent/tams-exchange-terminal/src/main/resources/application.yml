server:
  port: 8889
agent:
  servers: 127.0.0.1:9190
  name: default
  type: mock #mock #ufx #KDGateway #ufx #kcbp
  query:
    interval: 1000
    count: 2
  cache:
    path: cache
    clean: 0 0 16 ? * MON-FRI

#主配置文件，配置了这个会有限读取里面的属性覆盖著配置文件的属性
spring:
  profiles:
    active: joyin-210
  application:
    name: terminal
  datasource:
    driverClassName: oracle.jdbc.driver.OracleDriver
    validationQuery: SELECT 1 FROM DUAL
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
jixu:
  user:
    type: 2
trade:
  serverName: exchangeService # 交易核心的注册服务名
netty:
  port: 9190
  buffer:
    recv: 4194304
    send: 4194304
    write:
      high: 524288
      low: 32768
  idle:
    read: 20
    write: 10
    all: 0
  thread:
    num:
      boss: 1
      worker: 2
  reconnect:
    delay: 2
  timeout: 10000

# kcbp config
kcbp:
  active: true
  keep:
    fixRate: 30000 #kcbp终端维持连接频率
  # 上报本机信息
  client:
    address: 192.168.1.175
    # 16进制紧缩形式,AABBCCDDEEFF
    mac: 001EEC10D59A
    # 固定8位16进制,aaaaaaaa,例如:000006fd
    cpuid: 000006fd
    # 硬盘ID，不定长,由各硬盘厂商确定
    hdid: S1DBNSAF492660H
    # 计算机名称
    computename: ZXJT_PC
    # 机器GUID，由标准GUID算法确定
    guid: 92516-OEM-7502605-10173
    # 客户公司名称
    company: 中信建投

# ufx config
ufx:
  active: false
  path: tams-exchange-terminal/ufxconfig/t2sdk_hundsun-config.xml
  opStation:
    #终端名称
    cinfo: O32Client
    #终端版本
    cver: V2.0
    #特征码
    ch: ZYYH
    #后台系统的版本号
    sver: O32Server1.0
    #接入网关的ip地址
    ar: 121.8.190.120

KDGateway:
  active: false
  # 上报本机信息
  client:
    # 扩展信息
    mark: JOYIN;V0.0.0.1@V1.0

jsd:
  active: true
  connectTimeout: 10000

ctp:
  active: false

