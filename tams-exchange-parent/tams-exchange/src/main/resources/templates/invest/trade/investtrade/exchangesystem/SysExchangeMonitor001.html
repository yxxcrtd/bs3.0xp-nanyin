<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <link data-th-href="@{/public/layui/css/layui.css}" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" data-th-href="@{/js/exchange/joyin/common.css}">
    <link rel="stylesheet" type="text/css" data-th-href="@{/js/exchange/joyin/select2.min.css}" media="all">
    <link rel="stylesheet" type="text/css" data-th-href="@{/js/exchange/joyin/lightblue.css}" media="all">
    <link rel="icon" data-th-href="@{/js/exchange/joyin/favicon.ico}" type="image/x-icon">

    <title>运行时数据管理 - 场内交易</title>
</head>
<body>

<div id="content-body" class="content-body">

    <div class="upper-part">

        <div class="toolbar">

            <!-- <div class="layui-inline">
                <input type="text" id="keywords-summary" autocomplete="off" class="layui-input" placeholder="关键字搜索">
            </div> -->

            <label id="label-update-time" class="label-update-time"></label>

        </div>

        <table>
            <tbody>
            <tr>
                <td label="表格名称" prop="name" min-width="200" sortable searchable overflowt></td>
                <td label="记录行数" prop="count" min-width="80" formatter="thousandsInteger" sortable overflowt></td>
                <th class="cell-row-actions" label="操作" min-width="200" align="center" exportable="false" formatter="formatActions"></th>
            </tr>
            </tbody>
        </table>

    </div>

    <div class="lower-part">

        <div class="toolbar is-hidden">

            <!-- <div class="layui-inline">
                <input type="text" id="keywords-records" autocomplete="off" class="layui-input" placeholder="关键字搜索">
            </div> -->

            <div class="layui-inline">
                <button type="button" id="add-btn-runtime" class="layui-btn layui-btn-normal layui-btn-sm">增加</button>
                <button type="button" id="delect-btn-runtime" class="layui-btn layui-btn-normal layui-btn-sm">批量删除</button>

                <span class="refresh-time"></span>
                <a class="layui-icon layui-icon-refresh-3 refresh-time" id = 'refresh-time' title="刷新"></a>
            </div>

        </div>

        <div id="dynamic-table">
            <!-- table definition -->
        </div>
        <div id="page-runtime" ></div>
    </div>

    <div id='form-runtime' class="is-hidden">

        <form class="layui-form form-create-runtime" lay-filter="form-create-runtime"  action="">

            <div class="layui-form-item">
                <label class="layui-form-label">请选择修改值</label>
                <div class="layui-input-block">
                    <input type="radio" name="updataValue" value="true" title="是" checked>
                    <input type="radio" name="updataValue" value="false" title="否">
                </div>
            </div>
            <div class="layui-form-item is-hidden">
                <div class="layui-input-block">
                    <button class="layui-btn" id="runtimeSubmit" type="button" lay-submit lay-filter="runtimeSubmit" >立即提交</button>
                </div>
            </div>

        </form>
    </div>

    <div id="form-addInfo-runtime" class="is-hidden">

        <form class="layui-form form-create-runtime" lay-filter="form-add-runtime" id="addRowInfo" action="">
            <!-- 动态生成表单 -->
        </form>
    </div>


    <div id="form-time-runtime" class="is-hidden">

        <form class="layui-form form-create-runtime" lay-filter="form-time-runtime" action="">

            <div class="layui-inline">
                <label class="layui-form-label">时间输入</label>
                <div class="layui-input-inline">
                    <input type="text" name="time" autocomplete="off" class="layui-input" >
                </div>
            </div>

            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">时间选择</label>
                    <div class="layui-input-block">
                        <input type="text" name="date" id="date" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">毫秒</label>
                    <div class="layui-input-block">
                        <input type="text" name="millisecond" autocomplete="off" class="layui-input" >
                    </div>
                </div>
            </div>

        </form>
    </div>
</div>

    <script data-th-src="@{/public/layui/layui.all.js}" type="text/javascript" charset="utf-8"></script>
    <script data-th-src="@{/js/exchange/3rd/axios.min.js}" type="text/javascript" charset="utf-8"></script>
    <script data-th-src="@{/js/exchange/3rd/split.min.js}" type="text/javascript" charset="utf-8"></script>
    <script data-th-src="@{/js/exchange/type-extension.js}" type="text/javascript" charset="utf-8"></script>

    <script data-th-inline="javascript" type="text/javascript">
        var exchangeusername = /*[[${username}]]*/'';
        var basePath = /*[[@{/}]]*/'/';

        window.UserName = exchangeusername;
        window.ServiceBaseUrl = basePath + 'joyin';
        window.ServerBaseUrl = basePath ;

        var contentBody = document.getElementById('content-body');
        contentBody.style.height = window.innerHeight + 'px';

        window.onresize = function(){
            contentBody.style.height = window.innerHeight + 'px';
        }

    </script>
    <script type="text/javascript" data-th-src="@{/js/exchange/pages/runtime.js}"></script></body>
</html>
