server:
  port: 8989
  address: 0.0.0.0
  context-path: /exchange
#监听端口配置
listener:
  port: 8888
  length: 8
  encode: UTF-8
#主配置文件，配置了这个会有限读取里面的属性覆盖著配置文件的属性
spring:
  jmx:
    enabled: false
  thymeleaf:
    cache: false
  profiles:
    active: gaoyu
  application:
    name: trade-server
  datasource:
    driverClassName: oracle.jdbc.driver.OracleDriver
    validationQuery: SELECT 1 FROM DUAL
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  http:
    multiport:
      maxFileSize: 10Mb
      maxRequestSize: 100Mb
shiro:
  casClientName: exchange
  loginUrl: /exchange/login
  allowUrl: /joyin/**
application:
  menuType: hover
  menuPosition: top
  sysCode: EXC #系统代码
  logoAbout: /image/exchange/logo-about.png
  logo: /image/exchange/logo.png
  logoPA: /image/exchange/bankNameLog.png
  isDimensionRun: true
jixu:
  user:
    type: 2
scheduled:
  token:
    enable: false
    fixedRate: 20000
    serverName: exchangeService # 交易核心的注册服务名

cacheType: #数据库存储类型
  asyncDb: true #默认为true：表示异步存储数据库； false： 表示同步写入数据库
  useRedis: false #默认为true：表示使用redis并将数据写入redis； false：表示不使用redis
---
spring:
  profiles: gaoyu
  cache:
    type: redis
  redis:
    database: 0
    timeout: 20000
    host: 127.0.0.1
    port: 6379
  datasource:
    url: jdbc:oracle:thin:@//192.168.70.2:1521/orcl
    username: hzpoc2
    password: hzpoc2
    maxTotal: 50
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.net.ReadTimeout=50000
base:
  datasource:
    url: jdbc:oracle:thin:@//192.168.70.2:1521/orcl
    username: hzpoc2
    password: hzpoc2
    maxTotal: 50
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.net.ReadTimeout=50000
log:
  path: /home/tams/logs/exchange
  level: INFO
eureka:
  client:
    enabled: true #是否启用eureka客户端，如果启用，则需要有eureka服务器，默认为true
    serviceUrl:
      defaultZone: http://47.108.58.49:2222/eureka/ #http://192.168.70.210:1111/eureka/ #http://joyin.gaoyusoft.com:2222/eureka/
  instance:
    hostname: 192.168.30.95
    #prefer-ip-address: true
    #instance-id: ${spring.cloud.client.ipAddress}:${server.port}
#分布式事务配置
tx-lcn:
  springcloud:
    loadbalance:
      enabled: false #开启负载均衡
  client:
    managerAddress: 192.168.90.215:8070 # manager服务地址(rpc端口),可填写多个负载
  logger:
    enabled: true # 开启日志数据库记录存储
    onlyError: true
