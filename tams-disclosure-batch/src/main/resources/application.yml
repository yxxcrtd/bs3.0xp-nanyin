server:
  port: 8084
spring:
  application:
    name: REPORT-BATCH-SERVER #服务名称
  profiles:
    active: yitihua
  datasource:
    driverClassName: oracle.jdbc.driver.OracleDriver
  activemq:
    active: false
    systemId: REPORT-BATCH-SERVER
    brokerUrl: tcp://localhost:61616
    user: system
    password: manager
    maximumRedeliveries: 10
    initialRedeliveryDelay: 1
    backOffMultiplier: 2
    useExponentialBackOff: true
    maximumRedeliveryDelay: -1

batch:
  sysCode: REP
  properties:
    chunkNumber: 100
    concurrency: 10
    queueCapacity: 50
    maxExeUser: 5
    maxThreadPerUser: 1 #定时任务并发数
    serverDownTime: 600000
    sleeptime: 20000
    notifyIntervalTime: 30000
    enableServerDoubleAlive: false
    serverName: SERVER1
    needProcessLog: false #process是否记录正常日志
application:
    reportInsertCount: 15
    reportSelectOrDeleteCount: 50
    reportInsertLongCount: 10
    reportSelectOrDeleteCountForShenFen: 100 #数据批量一次查询或者删除条数(身份信息用)
    reportCbFeedBackHandleCountOneTime: 10000 #中债反馈文件内容单次处理数据条数
eureka:
  instance:
    hostname: ${spring.cloud.client.ipAddress}
    instanceId: ${spring.cloud.client.ipAddress}:${server.port}
    preferIpAddress: true
  client:
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
      defaultZone: http://192.168.70.146:1111/eureka/

