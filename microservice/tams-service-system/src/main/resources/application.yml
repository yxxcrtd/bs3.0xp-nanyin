server:
  port: 8114
  address: 0.0.0.0
#监听端口配置 service-disclosure工程有
listener:
  port: 8888 #端口
  length: 8 #报文前长度信息占位长度，配置为空或者0表示不存在占位
  encode: UTF-8 #编码
#主配置文件，配置了这个会优先读取里面的属性覆盖主配置文件的属性
spring:
  application:
    name: TamsMicroservice #服务名称
  profiles:
    active: dtx
#  activemq:
#    brokerUrl: tcp://localhost:61616
#    user: system
#    active: true
#    password: manager
#    maximumRedeliveries: 10
#    initialRedeliveryDelay: 1
#    backOffMultiplier: 2
#    useExponentialBackOff: true
#    maximumRedeliveryDelay: -1
#    systemId: framework
  thymeleaf:
    cache: false
  jmx:
    enabled: false
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    driverClassName: oracle.jdbc.driver.OracleDriver
    validationQuery: SELECT 1 FROM DUAL
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.jdbc.ReadTimeout=50000  
  cache:
    type: redis
  redis:
    database: 1 #redis 集群为0
    password: joyin!234
    host: 192.168.90.86
    port: 6379
    timeout: 20000 
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
#base数据源
base:
  datasource:
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.jdbc.ReadTimeout=50000
#interf数据源
interf:
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    driverClassName: oracle.jdbc.driver.OracleDriver
    validationQuery: SELECT 1 FROM DUAL
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.jdbc.ReadTimeout=50000    
    testWhileIdle: true

stresstest:
  datasource:    
    type: org.apache.commons.dbcp2.BasicDataSource
    driverClassName: oracle.jdbc.driver.OracleDriver
    validationQuery: SELECT FUNC_PKG_VALIDATION FROM DUAL  #验证时会将查询无结果的连接关闭，重新从连接池中获取连接，循环操作直到获得有效连接
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    testWhileIdle: true  #指明连接是否被空闲连接回收器(如果有)进行检验.如果检测失败,则连接将被从池中去除
    minEvictableIdleTimeMillis: 5000 #连接有资格被驱逐之前必须在池中闲置的最短时间毫秒，默认30分钟。
    testOnBorrow: true  #从连接池中获取连接时是否进行验证，如果检验失败,则从池中去除连接并尝试取出另一个
    testOnReturn: true  #指明是否在归还到池中前进行检验. 
#wind数据库配置
wind:
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    driverClassName: oracle.jdbc.driver.OracleDriver
    validationQuery: SELECT 1 FROM DUAL
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.jdbc.ReadTimeout=50000

#注册中心配置
eureka:
  client:
    enabled: true #是否启用eureka客户端，如果启用，则需要有eureka服务器，默认为true
  instance:
    prefer-ip-address: false
#分布式事物配置
tx-lcn:
  springcloud:
    loadbalance:
      enabled: true #开启负载均衡#用户系统
  logger:
    enabled: true # 开启日志数据库记录存储
    onlyError: true
#用户系统
#1 jixu用户系统
#2 joyin用户系统
#3 joyinBatch用户系统
jixu:
  user:
    type: 2
#安全配置
shiro:
  jwtEnable: true
  # service-common、service-period、service-portfolio、service-settle、service-trade工程有
  allowUrl: /core/selectRule,
            /common/ptlposition/insertPosition,
            /BussSettleOrderComm/generateSettleOrder,
            /common/trdcommonbase/insertTradeInfo,/TrdFxswapInvestTrade001/doComplete,/TrdBondInvestTrade/**,/BussRepoSec/**,/common/trdcommonbase/selectParam/COM/is_auto_generate_negate_deal,/CstpAutoSelect/**,
            /TrdBondDuration/findAllData,/TrdDepoDuration/selectAllData,/TrdRepoDuration/selectAllData,/TrdProjectDuration/selectAllData,
            /TrdRepoDuration/findEffectiveData,/TrdProjectDuration/findEffectiveData,/TrdPlanInterestDuration/findEffectiveData,
            /TrdDepoDuration/findEffectiveData,/TrdPlanInterestDuration/selectAllData,/TrdLendDuration/getEntityByMap,
            /TrdLendDuration/selectAllDataList,/TrdBondDuration/findEffectiveData,/TrdExchangeDuration/findAllData,
            /TrdRepoDuration/findFinCashInfo,/TrdRepoDuration/findRepoInfo
  # service-document工程有
  casEnable: false
  # service-chb工程有
  casClientName: report
#应用配置
application:
  menuType: hover
  sysCode: TAMS
  menuPosition: top #菜单默认位置（设置主题后失效），支持left和top两种
  pageStep: 100 #数据表格页码步长
  mainPage: report/myHome
  logoAbout: /image/report/logo-about.png
  logo: /image/report/logo.png
  sessionTimeout: 1800000 #超时自动退出
  interfMaxCorePoolSize: 20 #上游接口解析读取文件处理最大线程数
  maxDataCountOneTimeForInvestholdInfo : 50 #上游接口解析读取文件处理中持有信息批量查询单次最大查询主键数（江苏银行50）
  reportInterfIsNeedOkFile: 1 #上游接口解析读取文件处理中，是否需要.ok传输完成标志文件（1：需要 0：不需要）
  reportInterfOkFileExtension: ok #上游接口解析读取文件处理中，传输完成标志文件的扩展名（默认为ok）
  reportInsertCount: 15 #数据批量一次性insert条数
  reportSelectOrDeleteCount: 50 #数据批量一次查询或者删除条数
  reportSelectOrDeleteCountForShenFen: 100 #数据批量一次查询或者删除条数(身份信息用)
  reportInsertLongCount: 10 #数据批量一次性insert条数(单条数据字段较多)
  reportInterfFileEncoding: UTF-8 #上游接口文件编码格式 
  reportInterfOneTimeDataCount: 1000 #上游接口解析读取文件处理,单线程处理数据条数
  reportInterfOneTimeSqlLdrDataCount: 200000 #上游接口解析读取文件处理,单次sqlldr处理最大数据条数
  reportInterfOneTimeSqlLdrCommitCount: 10000 #上游接口解析读取文件处理,单次sqlldr处理单次提交数
  reportInterfSplitCharacter: '|' #上游txt文件解析分割符
  reportCbFeedBackHandleCountOneTime: 10000 #中债反馈文件内容单次处理数据条数
  isMicroService: microservice
