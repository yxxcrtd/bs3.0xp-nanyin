server:
  port: 8121
#主配置文件，配置了这个会优先读取里面的属性覆盖主配置文件的属性
spring:
  profiles:
    active: YTH_RISKRDS
  application:
    name: riskRedisService #服务名称
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    driverClassName: oracle.jdbc.driver.OracleDriver
    validationQuery: SELECT 1 FROM DUAL
  cache:
    type: redis
  redis:
    database: 1 #redis 集群为0
    password: joyin!234
    host: 192.168.90.86
    port: 6379
    timeout: 20000
# redis 集群部署
#  redis：
#    database：0
#    cluster:
#      nodes: 192.168.70.104:6379,192.168.70.104:6380,192.168.90.3:6381,192.168.90.3:6382,192.168.90.79:6383,192.168.90.79:6384
    
shiro:
  jwtEnable: true

application:
  reportInsertLongCount: 10 #数据批量一次性insert条数(单条数据字段较多)（信息披露项目【tams-pingan-report】需要用到）

---
spring:
  profiles: yc_yitihua11
  datasource:
    url: jdbc:oracle:thin:@//192.168.90.6:1521/ORCL
    username: yc_yitihua11
    password: yc_yitihua11
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.jdbc.ReadTimeout=50000
base:
  datasource:
    url: jdbc:oracle:thin:@//192.168.90.6:1521/ORCL
    username: yc_yitihua11
    password: yc_yitihua11
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.jdbc.ReadTimeout=50000
# Added by Jiaoxujin on 2019-08-22 邮储压力测试专用数据源
stresstest:
  datasource:
    url: jdbc:oracle:thin:@//192.168.70.148:1521/orcl
    username: stress_test
    password: stress_test
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    #timeBetweenEvictionRunsMillis: 120000  #在空闲连接回收器线程运行期间休眠的时间值,以毫秒为单位.如果设置为非正数,则不运行空闲连接回收器线程
    testWhileIdle: true  #指明连接是否被空闲连接回收器(如果有)进行检验.如果检测失败,则连接将被从池中去除
    minEvictableIdleTimeMillis: 5000 #连接有资格被驱逐之前必须在池中闲置的最短时间毫秒，默认30分钟。
    testOnBorrow: true  #从连接池中获取连接时是否进行验证，如果检验失败,则从池中去除连接并尝试取出另一个
    testOnReturn: true  #指明是否在归还到池中前进行检验.
    validationQuery: SELECT FUNC_PKG_VALIDATION FROM DUAL  #验证时会将查询无结果的连接关闭，重新从连接池中获取连接，循环操作直到获得有效连接
log:
  path: E:/logs/service/risk
  level: DEBUG
eureka:
  client:
    enabled: true #是否启用eureka客户端，如果启用，则需要有eureka服务器，默认为true
    serviceUrl:
      defaultZone: http://192.168.70.70:1111/eureka/
  instance:
    hostname: localhost
#分布式事物配置
tx-lcn:
  springcloud:
    loadbalance:
      enabled: true #开启负载均衡
  client:
    managerAddress: 192.168.90.89:8070 # manager服务地址(rpc端口),可填写多个负载
  logger:
    enabled: true # 开启日志数据库记录存储
    onlyError: true
#用户系统
jixu:
  user:
    type: 2

