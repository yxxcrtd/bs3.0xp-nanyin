server:
  port: 8211
#主配置文件，配置了这个会优先读取里面的属性覆盖主配置文件的属性
spring:
  profiles:
    active: dev
  application:
    name: investInterfService #服务名称
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    driverClassName: oracle.jdbc.driver.OracleDriver
    validationQuery: SELECT 1 FROM DUAL
  cache:
    type: redis
  redis:
    database: 1 #redis 集群为0
    host: 192.168.90.86
    port: 6379
    timeout: 20000
# redis 集群部署
#  redis：
#    database：0
#    cluster:
#      nodes: 192.168.70.104:6379,192.168.70.104:6380,192.168.90.3:6381,192.168.90.3:6382,192.168.90.79:6383,192.168.90.79:6384
    
  activemq:
    systemId: invest
    active: false
shiro:
  jwtEnable: true
  casClientName: invest
application:
  sysCode: INVEST
  sessionTimeout: 1800000 #超时自动退出

---
spring:
  profiles: dev
  thymeleaf:
    cache: false
  datasource:
    url: jdbc:oracle:thin:@(DESCRIPTION=(ADDRESS_LIST=(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.90.111)(PORT=1521))(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.90.112)(PORT=1521))(LOAD_BALANCE=no)(FAILOVER=on))(CONNECT_DATA=(SERVICE_NAME=tamsdbpdb)))
    username: tams212
    password: tams212
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.jdbc.ReadTimeout=50000
base:
  datasource:
    url: jdbc:oracle:thin:@(DESCRIPTION=(ADDRESS_LIST=(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.90.111)(PORT=1521))(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.90.112)(PORT=1521))(LOAD_BALANCE=no)(FAILOVER=on))(CONNECT_DATA=(SERVICE_NAME=tamsdbpdb)))
    username: tams212
    password: tams212
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.jdbc.ReadTimeout=50000

shiro:
  casEnable: false
log:
  path: /home/tams/logs/service/investInterfService
  level: DEBUG
eureka:
  client:
    enabled: true #是否启用eureka客户端，如果启用，则需要有eureka服务器，默认为true
    serviceUrl:
      defaultZone: http://127.0.0.1:8761/eureka/
  instance:
    hostname: localhost
#分布式事物配置
tx-lcn:
  springcloud:
    loadbalance:
      enabled: true #开启负载均衡
  client:
    managerAddress: 192.168.90.89:8070 # manager服务地址(rpc端口),可填写多个负载
  logger:
    enabled: true # 开启日志数据库记录存储
    onlyError: true     
