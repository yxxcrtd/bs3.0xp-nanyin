server:
  port: 8085
spring:
  application:
    name: SETTLE-BATCH-SERVER #服务名称
  profiles:
    active: dev
  activemq:
    active: false
batch:
  properties:
    chunkNumber: 100
    concurrency: 10
    queueCapacity: 50
    maxExeUser: 5         #最大并发用户数
    maxThreadPerUser: 10  #每用户最大并发数
    sleeptime: 10000      #轮询时间 
    maxSqlNum: 50         #批量提交数量
    needProcessLog: false #process是否记录正常日志
    enableServerDoubleAlive: false #是否启用双活
    serverName: SERVER1 #服务器名称
    notifyIntervalTime: 30000 #通知没有宕机的时间间隔， 服务器单独线程，间隔这个毫秒刷新SYS_SERVER_PRI的UPDATE_TIME，标识没有宕机
    serverDownTime: 600000 #判断已经宕机的时间（毫秒） 数据库服务器当前时间与上次更新时间对比，如果毫秒数超过这个设置，认为宕机
eureka:
  client:
    enabled: false #是否启用eureka客户端，如果启用，则需要有eureka服务器，默认为true
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:9100/eureka/
  instance:
    ip-address: localhost
---
spring:
  profiles: dev
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    driverClassName: oracle.jdbc.driver.OracleDriver
    url: jdbc:oracle:thin:@//192.168.90.217:1521/orcl
    username: tams
    password: tams
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.net.ReadTimeout=50000 # 批处理不加该配置
base:
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    driverClassName: oracle.jdbc.driver.OracleDriver
    url: jdbc:oracle:thin:@//192.168.90.217:1521/orcl
    username: tams
    password: tams
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.net.ReadTimeout=50000 # 批处理不加该配置
log:
  path: E:/logs/batch/settle
  level: DEBUG
