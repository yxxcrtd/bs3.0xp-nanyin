server:
  port: 18084
spring:
  application:
    name: VALUATION-BATCH-SERVER #服务名称
  profiles:
    active: yitihua
  datasource:
    driverClassName: oracle.jdbc.driver.OracleDriver
application:
  sysCode: VAL

batch:
  properties:
    chunkNumber: 100 #writer提交频率
    concurrency: 50 #processor并发数
    queueCapacity: 50 #任务组信息最大队列数
    maxJobPoolSize: 10 #job线程池
    maxExeUser: 2 #最大并发用户数
    maxThreadPerUser: 5 #任务并发数
    sleeptime: 10000 #轮询时间
    maxSqlNum: 50 #批量提交数
    needProcessLog: false #process是否记录正常日志
    enableServerDoubleAlive: false #是否启用双活
    serverName: SERVER1 #服务器名称
    serverDownTime: 600000 #判断已经宕机的时间（毫秒） 数据库服务器当前时间与上次更新时间对比，如果毫秒数超过这个设置，认为宕机
    notifyIntervalTime: 30000 #通知没有宕机的时间间隔， 服务器单独线程，间隔这个毫秒刷新SYS_SERVER_PRI的UPDATE_TIME，标识没有宕机
threadpool:
  corePoolSize: 50 #核心线程数
  maxPoolSize: 600 #最大线程数
  queueCapacity: 600 #线程队列大小
  keepAliveSeconds: 60 #线程池维护线程所允许的空闲时间（秒）
  namePrefix: batch-thread- #线程池中的线程的名称前缀
eureka:
  instance:
    hostname: ${spring.cloud.client.ipAddress}
    instanceId: ${spring.cloud.client.ipAddress}:${server.port}
    preferIpAddress: true
  client:
    enabled: false

jixu:
  datasource:
    driverClassName: oracle.jdbc.driver.OracleDriver
    url: jdbc:oracle:thin:@192.168.70.218:1521/orcl
    username: tams_mast_jx0521
    password: tams_mast_jx0521
    defaultSchema: tams_mast_jx0521
  #用户系统
  #1 jixu用户系统
  #2 joyin用户系统
  #3 joyinBatch用户系统
  user:
    type: 3

  #是否使用和joyin整合后的缩表版本,该参数为临时存在，在尚未完成缩表结构前,测试人员还是测试用原表进行功能测试
  #true 精简锁表版本
  #false 使用原始的jixu表结构
  joyintables:
    flag: true

  #主配置文件，配置了这个会优先读取里面的属性覆盖主配置文件的属性
  ##目标数据库的类型
  #Oracle=11;
  #MySQL=12;
  #SQLServer=13;
  #DB2=14;
  #Access=15;
  adapter:
    targetDB:
      dbType: 11

  ##是否同步数据到数据中心
  #0:不同步
  #1:同步数据
  #如果在StartDate和EndDate输入日期,则是同步一段区间内的数据
  #默认都是空,则是同步做账日的数据
  #DataCenter.StartDate=2017-07-19
  dataCenter:
    synchFlag: 0
    startDate:
    endDate:

  ##使用Hibernate或MyBatis框架
  #0:使用Hibernate框架
  #1:使用MyBatis框架
  frameWork:
    flag: 0

  ##0 jixu独立系统
  ##1 jixu调用joyin的主键生成系统
  keyGenerate:
    flag: 0

  #是否需要生成估值表,余额表等报表。外接入其它系统时，不需要几许生成报表
  genValreport:
    flag: false

---
