<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{FinStageManagement}">期次管理</title>
</head>
<body>
    <div layout:fragment="content" id="FinStageManagement_DIV">
        <input id="finprodId" th:value="${finprodId}" hidden>
        <input id="workflowId" th:value="${workflowId}" hidden>
        <input id="calendarId" th:value="${calendarId}" hidden>
        <input id="ccy" th:value="${ccy}" hidden>
        <div style="margin: 5px;" id="FinStageManagement_btn_submit_div" >
            <a id="FinStageManagement_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var finprodId = /*[[${finprodId}]]*/'';    //资产id 
            var finprodName = /*[[${finprodName}]]*/'';//资产名称
            var finprodMarketId = /*[[${finprodMarketId}]]*/'';//资产名称 
            var calendarId =  /*[[${calendarId}]]*/'';//资产名称 
            var buyoutRate = /*[[${buyoutRate}]]*/'';//母资产买断利率
            var chlRate = /*[[${chlRate}]]*/'';//母资产买断利率
        </script>
        <script data-th-src="@{/js/invest/asset/common/FinStageManagement.js}" type="text/javascript"></script>
    </div>
</body>

</html>
