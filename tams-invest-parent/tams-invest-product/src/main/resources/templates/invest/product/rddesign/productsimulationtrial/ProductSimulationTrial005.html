<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
	<style>
		.rate-inline-wrapper .select2-container{
			width: 33%!important;
		}
	</style>
</head>
<body>
<div class="pro-module-wrap" th:id="|${productSimulationTrial}_main|">
	<!--历史数据查询信息-->
	<div class="pro-module-wrap" th:id="|${productSimulationTrial}_total|">
		<div class="pro-module">
			<h3 class="pro-module-title">
                                <span class="title-des"
									  data-th-utext="#{ProductSimulationTrial005.list}">历史数据查询</span>
				<i class="iconfont icon-arrow-down pro-down-icon"></i>
			</h3>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{ProductSimulationTrial005.assetTypeOne}">资产大类</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="assetTypeOne" name="assetTypeOne"
										class="layui-input form-input input-select" allowClear="true"
										formatoption=false
										required="required"
										data-th-childrenIds="assetTypeThree"
										data-th-data-result="${ASSET_CLASS}">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{ProductSimulationTrial005.assetTypeThree}">资产三级分类</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="assetTypeThree" name="assetTypeThree"
										class="layui-input form-input input-select"
										formatoption="false"
										allowClear="true"
										multiple="true"
										data-th-parentIds="assetTypeOne"
										data-th-childrenIds="assetTypeFour"
										data-th-data-url="@{/invest/product/rddesign/productsimulationtrial/ProductSimulationTrial005/queryMulType3}">
								</select>
							</div>
						</div>

						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{ProductSimulationTrial005.assetTypeFour}">资产四级分类</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="assetTypeFour" name="assetTypeFour"
										class="layui-input form-input input-select"
										formatoption="true"
										allowClear="true"
										multiple="true"
										data-th-parentIds="assetTypeThree"
										data-th-childrenIds="assetTypeFive"
                                        data-th-data-url="@{/invest/product/rddesign/productsimulationtrial/ProductSimulationTrial005/queryMulType4}">
								</select>
							</div>
						</div>

					</div>
						<div class="layui-form-item">

						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4" style="margin-top:5px;">
							<label class="layui-form-label form-lable"
								   data-th-text="#{ProductSimulationTrial005.assetTypeFive}">资产五级分类</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="assetTypeFive" name="assetTypeFive"
										class="layui-input form-input input-select" allowClear="true"
										formatoption="true"
										multiple="true"
										data-th-parentIds="assetTypeFour"
                                        data-th-data-url="@{/invest/product/rddesign/productsimulationtrial/ProductSimulationTrial005/queryMulType5}">
								</select>
							</div>
						</div>
						<div class="form-inline-wrap" style="width: 100%!important;float: left;margin-left:525px;margin-top: -28px;">
							<label class="layui-form-label form-label-wrap" style="width: 11.9%!important;"  data-th-text="#{ProductSimulationTrial005.lastPeriod}">剩余期限</label>
							<div class="layui-input-inline input-inline rate-inline-wrap rate-inline-wrapper" style="width: 78%!important;">
								<input type="text" id="lastMinPeriod"
									   name="lastMinPeriod" length="5"
									   class="layui-input form-input text-number" style="display:inline-block;width: 140px;" data-textrange="0" />
								<span class="rate-text">—</span>
								<input type="text" id="lastMaxPeriod"
									   name="lastMaxPeriod" length="5"
									   class="layui-input form-input text-number" style="display:inline-block;width: 140px;" data-textrange="0" />
								<span class="rate-text">月</span>
							</div>
						</div>
					</div>
					<div class="layui-form-item" id="oType_1">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4" >
							<label class="layui-form-label form-lable"
								   data-th-text="#{ProductSimulationTrial005.oType}">外部债项评级（不低于）</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="debtRating" name="debtRating"
										class="layui-input form-input input-select" allowClear="true"
										formatoption=false
										data-th-data-result="${MAIN_GRADE_RESULT}">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{ProductSimulationTrial005.fcrGradeOut}">外部主体评级（不低于）</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="fcrGradeOut" name="fcrGradeOut"
										class="layui-input form-input input-select" allowClear="true"
										formatoption=false
										data-th-data-result="${MAIN_GRADE_RESULT}">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{ProductSimulationTrial005.partyType}">机构类型（经济类）</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="partyType" name="partyType"
										class="layui-input form-input input-select" allowClear="true"
										formatoption=false
										data-th-data-result="${ENTERPRISE_PROPERTY}">
								</select>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable" data-th-text="#{ProductSimulationTrial005.checkDate}">查询日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="checkDate" name="checkDate" required
									   class="layui-input form-input input-dateRangeSelect" />
							</div>
						</div>

						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4" style="margin-top:6px;">
							<label class="layui-form-label form-lable"
								   data-th-text="#{ProductSimulationTrial005.additionalEquity}">加权权益率(%)</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="additionalEquity" name="additionalEquity"
									    data-textrange="4"
									   class="layui-input form-input text-number" maxLength="50" disabled="disabled"/>
								<span class="input-right-show">%</span>
							</div>
						</div>&nbsp;&nbsp;&nbsp;&nbsp;
						<div class="layui-inline">
							<a class="layui-btn layui-btn-sm btn-search" id="ProductSimulationTrial005_btn_search">
								<i class="iconfont icon-search"></i><span>&nbsp;&nbsp;查询</span></a>
						</div>
						<div class="layui-inline">
							<a class="layui-btn layui-btn-sm btn-reset btn-default" id="ProductSimulationTrial005_btn_reset">
								<i class="iconfont icon-reset"></i><span>&nbsp;&nbsp;重置</span></a>
						</div>
					</div>
				</form>
			<table class="layui-table" th:id="|${productSimulationTrial}_productSimulationTrialTotalList|"
				   th:name="|${productSimulationTrial}.productSimulationTrialList|"></table>
		</div>
	</div>
</div>

<script data-th-inline="javascript" type="text/javascript">
	var entity = eval(/*[[${entity}]]*/'');
	var productSimulationTrial = /*[[${productSimulationTrial}]]*/'';
</script>
<script data-th-src="@{/js/invest/product/rddesign/productsimulationtrial/Productsimulationtrial005.js}"  type="text/javascript"></script>
</body>
</html>
