<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <style type="text/css">
        .pro-module-item-ex {
            height: 206px;
        }

        .form-inline-wrap-ex {
            width: 50%;
        }

        .form-label-wrap-ex {
            width: 50%;
        }

        .input-inline-ex {
            width: 40% !important;
        }
        
        .form-input-ex {
        	text-align: right;
        	padding-right: 3px;
        }
    </style>
</head>
<body>
<div class="pro-module-wrap">
    <div class="pro-module">
        <h3 class="pro-module-title">
            <span class="title-des">估值结果</span>
            <i class="iconfont icon-arrow-down pro-down-icon"></i>
        </h3>
        <div class="pro-module-item pro-module-item-ex">
            <div class="layui-form-item">
                <div class="form-inline-wrap form-inline-wrap-ex">
                    <label class="layui-form-label form-label-wrap form-label-wrap-ex"
                           data-th-text="#{FinProductValuationResultInfo.prodNetAsset}">产品净资产</label>
                    <div class="layui-input-inline input-inline input-inline-ex">
                        <input type="text" name="prodNetAsset"
                               class="layui-input form-input form-input-ex text-number"
                               data-textrange="2"
                               data-th-value='${entity?.prodNetAsset}'>
                    </div>
                </div>
                <div class="form-inline-wrap form-inline-wrap-ex">
                    <label class="layui-form-label form-label-wrap form-label-wrap-ex"
                           data-th-text="#{FinProductValuationResultInfo.prodTotQty}">产品总份额</label>
                    <div class="layui-input-inline input-inline input-inline-ex">
                        <input type="text" name="prodTotQty"
                               class="layui-input form-input form-input-ex text-number"
                               data-textrange="2"
                               data-th-value='${entity?.prodTotQty}'>
                    </div>
                </div>
            </div>
            <div id="nprodOwner" class="layui-form-item">
                <div class="form-inline-wrap form-inline-wrap-ex">
                    <label class="layui-form-label form-label-wrap form-label-wrap-ex"
                           data-th-text="#{FinProductValuationResultInfo.netValue}">产品单位净值</label>
                    <div class="layui-input-inline input-inline input-inline-ex">
                        <input type="text" name="netValue"
                               class="layui-input form-input form-input-ex text-number"
                               data-textrange="4"
                               data-th-value='${entity?.netValue}'>
                    </div>
                </div>
                <div class="form-inline-wrap form-inline-wrap-ex">
                    <label class="layui-form-label form-label-wrap form-label-wrap-ex"
                           data-th-text="#{FinProductValuationResultInfo.totNetValue}">产品累计净值</label>
                    <div class="layui-input-inline input-inline input-inline-ex">
                        <input type="text" name="totNetValue"
                               class="layui-input form-input form-input-ex text-number"
                               data-textrange="4"
                               data-th-value='${entity?.totNetValue}'>
                    </div>
                </div>
            </div>
            <div id="mprodOwner" class="layui-form-item">
                <div class="form-inline-wrap form-inline-wrap-ex">
                    <label class="layui-form-label form-label-wrap form-label-wrap-ex"
                           data-th-text="#{FinProductValuationResultInfo.yield}">产品万份收益</label>
                    <div class="layui-input-inline input-inline input-inline-ex">
                        <input type="text" name="yield"
                               class="layui-input form-input form-input-ex text-number"
                               data-textrange="4"
                               data-th-value='${entity?.yield}'>
                    </div>
                </div>
                <div class="form-inline-wrap form-inline-wrap-ex">
                    <label class="layui-form-label form-label-wrap form-label-wrap-ex"
                           data-th-text="#{FinProductValuationResultInfo.totYield}">产品累计万份收益</label>
                    <div class="layui-input-inline input-inline input-inline-ex">
                        <input type="text" name="totYield"
                               class="layui-input form-input form-input-ex text-number"
                               data-textrange="4"
                               data-th-value='${entity?.totYield}'>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap form-inline-wrap-ex">
                    <label class="layui-form-label form-label-wrap form-label-wrap-ex"
                           data-th-text="#{FinProductValuationResultInfo.table.yield7}">7日年化收益率（%）</label>
                    <div class="layui-input-inline input-inline input-inline-ex">
                        <input type="text" name="yield7"
                               class="layui-input form-input form-input-ex text-number"
                               data-textrange="4"
                               data-th-value='${entity?.yield7}'>
                    </div>
                </div>
                <div class="form-inline-wrap form-inline-wrap-ex">
                    <label class="layui-form-label form-label-wrap form-label-wrap-ex"
                           data-th-text="#{FinProductValuationResultInfo.table.curYield}">当前周期年化收益率（%）</label>
                    <div class="layui-input-inline input-inline input-inline-ex">
                        <input type="text" name="curYield"
                               class="layui-input form-input form-input-ex text-number"
                               data-textrange="4"
                               data-th-value='${entity?.curYield}'>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div id="nprod_totCurYield" class="form-inline-wrap form-inline-wrap-ex">
                    <label class="layui-form-label form-label-wrap form-label-wrap-ex"
                           data-th-text="#{FinProductValuationResultInfo.table.totCurYield}">累计折合年化收益率（%）</label>
                    <div class="layui-input-inline input-inline input-inline-ex">
                        <input type="text" name="totCurYield"
                               class="layui-input form-input form-input-ex text-number"
                               data-textrange="4"
                               data-th-value='${entity?.totCurYield}'>
                    </div>
                </div>
                <div id="mprod_unpayProfit" class="form-inline-wrap form-inline-wrap-ex">
                    <label class="layui-form-label form-label-wrap form-label-wrap-ex"
                           data-th-text="#{FinProductValuationResultInfo.unpayProfit}">未分配利润</label>
                    <div class="layui-input-inline input-inline input-inline-ex">
                        <input type="text" name="unpayProfit"
                               class="layui-input form-input form-input-ex text-number"
                               data-textrange="4"
                               data-th-value='${entity?.unpayProfit}'>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script data-th-src="@{/js/invest/product/valuation/FinProductValuationResultInfo.js}" type="text/javascript"></script>
</body>
</html>
