<!DOCTYPE html>
<html style="height:80%;" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml" layout:decorator="~{layout/default}">
    <meta charset="UTF-8" />
    <head> 
    </head>
    <body>
        <div layout:fragment="content">
            <div class="joyin-form-wrap">
                <form class="layui-form pro-module-form" id="searchForm">
                    <input type="hidden" id="finprodIdhid" name="finprodId" th:value="${entity?.finprodId}" />
                    <input type="hidden" id="calendarId" name="calendarId" th:value="${entity?.calendarId}" />
                    <input type="hidden" id="businessId" name="businessId" th:value="${businessId?: ''}">
                    <input type="text" id="entrustId" name="entrustId" disabled="disabled" style="display: none" data-th-value="${entity?.entrustId}" />
                    <input type="text" id="entrustStatus" name="entrustId" disabled="disabled" style="display: none" data-th-value="${entity?.entrustStatus}" />
                    <input type="hidden" id="finvdate" name="finvdate" />
                    <input type="hidden" id="finmdate" name="finmdate" />
                    <input type="hidden" id="isRight" name="isRight" />
                    <input type="hidden" id="profitType" name="profitType" />
                    <!--币种 - 人民币-->
                    <input type="hidden" id="ccy" name="ccy" th:value="${entity?.ccy}" />
                    <!--交易市场-银行间-->
                    <input type="hidden" id="tradeMarket" name="tradeMarket" th:value="${entity?.tradeMarket}" />
                    <!--投资经理-当前用户-->
                    <input type="hidden" id="invManagerId" name="invManagerId" th:value="${entity?.invManagerId}">
                    <input type="hidden" id="secManageAcctId" name="secAcctId" th:value="${entity?.secAcctId}">
                    <!-- 可用现金 -->
                    <input type="hidden" id="proAvailableCash" name="proAvailableCash" th:value="${entity?.proAvailableCash}">
                    <input type="hidden" id="assetAvailablePosition" name="assetAvailablePosition" th:value="${entity?.assetAvailablePosition}">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                            <label class="layui-form-label" style="width: 100px;" data-th-text="#{EtrIbBondinfo002.portfolioId}">组合名称</label>
                            <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                                <select
                                        required
                                        type="text"
                                        id="portfolioId"
                                        name="portfolioId"
                                        class="layui-input form-input input-select"
                                        placeholder="请输入内容"
                                        th:placeholder="#{SysCommon.placeholder}"
                                        th:data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
                                        allowClear="true"
                                        formatoption="true"
                                        th:initValue="${entity?.parentPortfolioId}"
                                ></select>
                            </div>
                        </div>
                        <!-- <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                            <label class="layui-form-label" style="width: 100px;" data-th-text="#{EtrIbBondinfo002.portfolioIdChild}">子组合名称</label>
                            <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                                <select
                                    required
                                    type="text"
                                    id="portfolioId"
                                    name="portfolioId"
                                    class="layui-input form-input input-select"
                                    placeholder="请输入内容"
                                    th:placeholder="#{SysCommon.placeholder}"
                                    th:data-url="@{/business/common/CommonSelect/qryPortfolioIdChildByRequestParam}"
                                    allowClear="true"
                                    parentIds="parentPortfolioId"
                                    formatoption="true"
                                    th:initValue="${entity?.portfolioId}"
                                ></select>
                            </div>
                        </div> -->
                         <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                            <label class="layui-form-label" style="width: 100px;" data-th-text="#{EtrIbBondinfo002.finprodName}">资产简称</label>
                            <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                                <select
                                        type="text"
                                        id="finprodId"
                                        name="finprodMarketId"
                                        class="layui-input form-input input-select"
                                        allowClear="true"
                                        placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        required="required"
                                        data-formatoption="true"
                                        data-th-data-url="@{/invest/entrust/etribbondinfo/EtrIbBondinfo002/getfinprodIdForAdd}"
                                        data-th-initvalue="${entity?.finprodMarketId}"
                                ></select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item" style="padding:0px;">
                       
                        <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                            <label class="layui-form-label" style="width: 100px;" data-th-text="#{EtrIbBondinfo002.ps}">交易方向</label>
                            <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                                <select
                                    required
                                    type="text"
                                    id="ps"
                                    name="ps"
                                    allowClear="true"
                                    class="layui-input form-input input-select"
                                    data-th-data-result="${PS}"
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption="true"
                                    data-th-initvalue="${entity?.ps}"
                                ></select>
                            </div>
                        </div>
                         <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                            <label class="layui-form-label" style="width: 100px;" data-th-text="#{EtrIbBondinfo002.entrustAmt}">券面总额</label>
                            <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                                <input
                                        type="text"
                                        id="entrustNum"
                                        name="entrustNum"
                                        placeholder="请输入内容"
                                        data-pattern=""
                                        data-fixtype="2"
                                        class="layui-input form-input text-number"
                                        required="required"
                                        data-th-value="${entity?.entrustNum}"
                                />
                                <span class="input-right-show">万元</span>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item" style="padding:0px;">
                       
                        <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                            <label class="layui-form-label" style="width: 100px;" data-th-text="#{EtrIbBondinfo002.settleSpreed}">清算速度</label>
                            <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                                <select
                                    required
                                    type="text"
                                    id="settleSpreed"
                                    name="settleSpreed"
                                    allowClear="true"
                                    class="layui-input form-input input-select"
                                    data-th-data-result="${ACCOUNT_SPEED}"
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption="true"
                                    data-th-initvalue="${entity?.settleSpreed}"
                                ></select>
                            </div>
                        </div>
                         <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                            <label class="layui-form-label" style="width: 100px;" data-th-text="#{EtrIbBondinfo002.priceModel}">价格模式</label>
                            <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                                <select
                                        type="text"
                                        id="priceModel"
                                        name="priceModel"
                                        required
                                        class="layui-input form-input input-select"
                                        placeholder="请输入内容"
                                        th:placeholder="#{SysCommon.placeholder}"
                                        data-th-data-result="${PRICE_MODEL}"
                                        allowClear="true"
                                        th:initValue="${entity?.priceModel}"
                                ></select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item" style="padding:0px;">
                       
                        <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                            <label class="layui-form-label" style="width: 100px;" data-th-text="#{EtrIbBondinfo002.price}">净价</label>
                            <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                                <input
                                    type="text"
                                    id="price"
                                    name="price"
                                    placeholder="请输入内容"
                                    data-pattern=""
                                    data-fixtype="2"
                                    data-textrange="4"
                                    class="layui-input form-input text-number"
                                    data-th-value="${entity?.price}"
                                />
                                <span class="input-right-show">元</span>
                            </div>
                        </div>
                         <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                            <label class="layui-form-label" style="width: 100px;" data-th-text="#{EtrIbBondinfo002.fpriceAmt}">全价</label>
                            <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                                <input
                                        type="text"
                                        id="fpriceAmt"
                                        name="fpriceAmt"
                                        placeholder="请输入内容"
                                        data-pattern=""
                                        data-fixtype="2"
                                        data-textrange="4"
                                        class="layui-input form-input text-number"
                                        data-th-value="${entity?.fpriceAmt}"
                                />
                                <span class="input-right-show">元</span>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item" style="padding:0px;">
                       
                        <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                            <label class="layui-form-label" style="width: 100px;" data-th-text="#{EtrIbBondinfo002.matureYield}">到期收益率(%)</label>
                            <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                                <input
                                    type="text"
                                    id="matureYield"
                                    name="matureYield"
                                    placeholder="请输入内容"
                                    data-pattern=""
                                    data-fixtype="2"
                                    data-textrange="4"
                                    class="layui-input form-input text-number"
                                    data-th-value="${entity?.matureYield}"
                                />
                                <span class="input-right-show">%</span>
                            </div>
                        </div>
                         <div class="form-inline-wrap" style=" width: 50%; padding:0px;" id="exerYieldDiv">
                            <label class="layui-form-label" style="width: 100px;" data-th-text="#{EtrIbBondinfo002.exerYield}">行权收益率(%)</label>
                            <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                                <input
                                        type="text"
                                        id="exerYield"
                                        name="exerYield"
                                        placeholder="请输入内容"
                                        data-pattern=""
                                        data-fixtype="2"
                                        data-textrange="4"
                                        class="layui-input form-input text-number"
                                        data-th-value="${entity?.exerYield}"
                                />
                                <span class="input-right-show">%</span>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item" style="padding:0px;">
                       
                        <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                            <label class="layui-form-label" style="width: 100px;" data-th-text="#{EtrIbBondinfo002.counterId}">交易对手</label>
                            <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                                <select
                                    id="counterId"
                                    name="counterId"
                                    class="layui-input form-input input-select"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption="false"
                                    parentIds="ps,finprodType2,profitType,tradeMarket,finprodId,pinanAssetType"
                                    data-th-data-url="|@{/component/trade/BussEtrInvestPersonInfo/getCounterId}?innerTrade=false&tradeMarket=01&callPageId=EtrInvestBondInfo002|"
                                    th:initValue="${entity?.counterId}"
                                ></select>
                            </div>
                        </div>
                         <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                            <label class="layui-form-label" style="width: 100px;" data-th-text="#{invest.channelId}">通道</label>
                            <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                                <select
                                        type="text"
                                        id="chlFinprodId"
                                        name="chlId"
                                        class="layui-input form-input input-select"
                                        allowClear="true"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        formatoption="false"
                                        data-th-data-url="@{/component/trade/BussChannelCommon/getChannelId}"
                                        data-th-initvalue="${entity?.chlId}"
                                ></select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item" style="padding:0px;">
                       
                        <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                            <label class="layui-form-label" style="width: 100px;" data-th-text="#{EtrIbBondinfo002.vdate}">指令开始日</label>
                            <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                                <input
                                    class="layui-input form-input input-dateSelect"
                                    id="vdate"
                                    name="vdate"
                                    placeholder="请选择时间"
                                    data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
                                    disabled="disabled"
                                    required="required"
                                />
                            </div>
                        </div>
                         <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                            <label class="layui-form-label" style="width: 100px;" data-th-text="#{EtrIbBondinfo002.mdate}">指令终止日</label>
                            <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                                <input
                                        class="layui-input form-input input-dateSelect"
                                        id="mdate"
                                        name="mdate"
                                        placeholder="请选择时间"
                                        data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
                                        required="required"
                                        disabled="disabled"
                                />
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item" style="padding:0px;">
                       
                        <div class="form-inline-wrap" style="width: 100%;padding:0px;" >
                            <label class="layui-form-label" style="width: 100px;" data-th-text="#{EtrIbBondinfo002.remark}">备注</label>
                            <div class="layui-input-inline" style="width: 80%; margin: 0px; margin-left: auto;">
                                <textarea
                                    id="remark"
                                    name="remark"
                                    th:value="${entity?.remark}"
                                    data-th-text="${entity?.remark}"
                                    class="layui-textarea"
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                ></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                        <div class="text-center">
                            <a id="EtrIbBondinfo002_btn_fileupload" class="layui-btn layui-btn-sm"
                               data-th-text="#{EtrIbBondinfo002.upload}">附件上传</a>
                            <a id="EtrIbBondinfo002_btn_riskcal" class="layui-btn layui-btn-sm"
                               data-th-text="#{EtrIbBondinfo002.riskcal}">风险试算</a>
                             <a id="EtrIbBondinfo002_btn_save" class="layui-btn layui-btn-sm btn-save" style="display: none;"
                                data-th-text="#{SysCommon.save}">保存</a>
                             <a id="EtrIbBondinfo002_btn_submit" class="layui-btn layui-btn-sm  btn-submit" style="display: none;"
                                data-th-text="#{SysCommon.submit}">提交</a>
                        </div>
                        <div id="baseRiskMathComm" class="page-component" style="display: none;"  th:data-path="@{/component/common/BaseRiskMathComm/init}"
                             th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>   
                    </div>
                </form>
            </div>
        </div>
        <div layout:fragment="script">
            <script th:inline="javascript" type="text/javascript">
                var bankRoom = /*[[${bankRoom}]]*/ ''
                var shse = /*[[${shse}]]*/ ''
                var szse = /*[[${szse}]]*/ ''
                var oneMarket = /*[[${oneMarket}]]*/ ''
                var marketLv2 = /*[[${marketLv2}]]*/ '02'
                var T01 = /*[[${T01}]]*/ ''
                var T02 = /*[[${T02}]]*/ ''
                var T03 = /*[[${T03}]]*/ ''
                var T39 = /*[[${T39}]]*/ ''

                var bankPlat = /*[[${bankPlat}]]*/ ''
                var type01 = /*[[${type01}]]*/ ''
                var type02 = /*[[${type02}]]*/ ''
                var type03 = /*[[${type03}]]*/ ''
                var aim01 = /*[[${aim01}]]*/ ''
                var aim02 = /*[[${aim02}]]*/ ''
                var N = /*[[${N}]]*/ ''
                var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/ ''
                var sysDate = /*[[${sysDate}]]*/ ''
                var fintype = /*[[${fintype}]]*/ ''
                var IS_SHOW_TYPE = /*[[${isShowType}]]*/ '02'
                var PRICEMODEL_03 = /*[[${PRICEMODEL_03}]]*/ 'PRM03'

                var SHARES_TRADE_MARKET_01 = /*[[${SHARES_TRADE_MARKET_01}]]*/'';
                var SHARES_TRADE_MARKET_02 = /*[[${SHARES_TRADE_MARKET_02}]]*/'';

                var ENTRUST_RECORD_NEW = /*[[${ENTRUST_RECORD_NEW}]]*/'';
                var ENTRUST_RECORD_MODIFY = /*[[${ENTRUST_RECORD_MODIFY}]]*/'';

                var todoList = /*[[${TodoList}]]*/'';

                var shortSellingSupported = /*[[${shortSellingSupported}]]*/ ''
            </script>
            <script data-th-src="@{/js/component/common/TradeCommon.js}" type="text/javascript"></script>
            <script data-th-src="@{/js/invest/entrust/etribbondinfo/EtrIbBondinfo002.js}" type="text/javascript"></script>
            <script data-th-src="@{/js/component/autocoupon/AutoCoupon.js}" type="text/javascript"></script>
        </div>
    </body>
</html>
