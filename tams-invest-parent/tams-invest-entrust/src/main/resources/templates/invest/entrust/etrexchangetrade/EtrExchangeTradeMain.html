<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="#{EtrExchangeTradeMain}">场内交易指令</title>
    <style type="text/css">
	    .main_panel{
	    	width: 100%;
	    	display: inline-block;
	    	padding-left:3px;
	    }
	    
    	.left_panel {
            float: left;
            height:99%;
            display: inline-block;
    	}
		.left_top_panel {
			float:right;
			margin:1px;
			width:100%;
			margin-left:10px;
			border: 1px solid #E6E6E6;
			display: inline-block;
			border-radius:2px 2px 0 0;
		}
		.left_bottom_panel {
			margin:1px;
			width:100%;
			float:right;
			height:38.5%;
			border: 1px solid #E6E6E6;
			isplay: inline-block;
		}
    	.right_panel {
    	    width:74.7%;
    	    float:right;
    	    height:99%;
            display: inline-block;
    	}
    	.right_top_panel {
    		margin:1px;
    		width:100%;
    		border: 1px solid #E6E6E6;
    		display: inline-block;
            float: right;
    	}
    	.right_bottom_panel {
    		margin:1px;
    		width:100%;
    		border: 1px solid #E6E6E6;
    		isplay: inline-block;
            float: right;
    	}
        .gutter-vertical{
            width:100%;
            height:3px !important;
            background:#dbdbdd;
            -webkit-box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
            box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
            cursor:n-resize;
            float: right;
        }

        .gutter-horizontal{
            height:570px;
            width:3px !important;
            background:#dbdbdd;
            -webkit-box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
            box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
            cursor:ew-resize;
            float: left;
			margin-left: 2px;
        }

    	@media screen and (min-width: 1921px) {
    		.left_panel {
	    		width:17%;
	    	}
	    	.right_panel {
	    	 	width:82.7%;
	    	}
	    	
	    	.left_top_panel {
	    		height:38%;
	    	}
	    	
	    	.left_bottom_panel {
	    		height:54%;
	    	}
	    	
	    	.right_top_panel {
	    		height:38%;
	    	}
	    	
	    	.right_bottom_panel {
	    		height:60%;
	    	}
    	}
    	
    	@media screen and  (min-width: 1681px) and (max-width: 1920px) {
    		.left_panel {
	    		width:19%;
	    	}
	    	.right_panel {
	    	 	width:80.7%;
	    	}
	    	   	
	    	.left_top_panel {
	    		height:38%;
	    	}
	    	
	    	.left_bottom_panel {
	    		height:54%;
	    	}
	    	
	    	.right_top_panel {
	    		height:38%;
	    	}
	    	
	    	.right_bottom_panel {
	    		height:60%;
	    	}

    	}
    	@media screen and (min-width: 1441px) and (max-width: 1680px) {
    		.left_panel {
	    		width:22%;
	    	}
	    	.right_panel {
	    	 	width:77.7%;
	    	}
	    		    	
	    	.left_top_panel {
	    		height:40%;
	    	}
	    	
	    	.left_bottom_panel {
	    		height:52%;
	    	}
	    	
	    	.right_top_panel {
	    		height:40%;
	    	}
	    	
	    	.right_bottom_panel {
	    		height:57%;
	    	}
    		
        }
        
        @media screen and (min-width: 1367px) and (max-width: 1440px) {
    		.left_panel {
	    		width:24.4%;
	    	}
	    	.right_panel {
	    	 	width:75.4%;
	    	}  	    	
	    	.left_top_panel {
	    		height:40%;
	    	}
	    	
	    	.left_bottom_panel {
	    		height:52%;
	    	} 
	    	
	    	.right_top_panel {
	    		height:40%;
	    	}
	    	
	    	.right_bottom_panel {
	    		height:57%;
	    	}
	    	    
        }
        @media screen and (max-width: 1366px) {
        	.left_panel {
	    		width:25%;
	    	}
	    	.right_panel {
	    	 	width:74.7%;
	    	}

	    	.left_top_panel {
	    		height:48%;
	    	}

	    	.left_bottom_panel {
	    		height:44%;
	    	}

	    	.right_top_panel {
	    		height:48%;
	    	}

	    	.right_bottom_panel {
	    		height:49%;
	    	}

        }
    </style>
</head>
<body>
	<div id="main_body" layout:fragment="content">

		<div class="main_panel">
			<div class="left_panel" id="left_panel_div">
				 <div class="left_top_panel" style="display:none" id="left_top_div">
					<iframe id = "EtrExchangeTradeHq" th:src="@{'/invest/entrust/etrexchangetrade/EtrExchangeTrade001/initHq'}" width="100%"
							height="100%"  frameborder="0"  style="border:none;"></iframe>
				 </div>
				<div class="left_bottom_panel" id="left_bottom_panel_div">
				     <iframe  name ='EtrExchangeTrade001' id = "EtrExchangeTrade001" th:src="@{'/invest/entrust/etrexchangetrade/EtrExchangeTrade001/init?workflowId='+${workflowId}
				     			+'&isFromToDoList='+${isFromToDoList}+'&pageModel='+${pageModel}+'&entrustId='+${entrustId}}" width="100%"
		                       height="100%"  frameborder="0"  style="border:none;"></iframe>
	             </div>
	             <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 5px;">
	                <div class="text-center">
	                    <a id="EtrExchangeTrade001_btn_riskcal" class="layui-btn layui-btn-sm" data-th-text="#{EtrExchangeTrade001.riskcal}">风险试算</a>
	                    <a id="EtrExchangeTrade001_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
	                    <a id="EtrExchangeTrade001_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
	                    <a id="EtrExchangeTrade001_btn_reset" class="layui-btn layui-btn-sm  btn-reset" data-th-text="#{SysCommon.reset}">重置</a>
	                </div>
	            </div>	
			</div>
			<div class="right_panel" id="right_panel_div">
				<div class="right_top_panel" id="right_top_panel_div">
					<iframe th:src="@{/invest/entrust/etrexchangetrade/EtrExchangeTrade002/init}" width="100%"
	                        height="100%" frameborder="0" style="border:none;"></iframe>
				</div>			
				<div class="right_bottom_panel" id="right_bottom_panel_div">
					<iframe th:src="@{/invest/entrust/etrexchangetrade/EtrExchangeTrade003/init}" width="100%"
	                        height="100%" frameborder="0" style="border:none;"></iframe>
				</div>	
			</div>
			<div id="baseRiskMathComm" class="page-component" style="display: none;"  th:data-path="@{/component/common/BaseRiskMathComm/init}"
			     th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${entrustId}'}|">
			</div>	
			
             
		</div>
		
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var ENTRUST_STATUS_05 = /*[[${ENTRUST_STATUS_05}]]*/'05';
			var ENTRUST_STATUS_07 = /*[[${ENTRUST_STATUS_07}]]*/'07';
			var isFromToDoList = /*[[${isFromToDoList}]]*/;
            var FINPROD_TYPE_TG_F01 = /*[[${FINPROD_TYPE_TG_F01}]]*/'';
            var FINPROD_TYPE_TG_F02 = /*[[${FINPROD_TYPE_TG_F02}]]*/'';
            var FINPROD_TYPE_TG_F03 = /*[[${FINPROD_TYPE_TG_F03}]]*/'';
            var FINPROD_TYPE_TG_F06 = /*[[${FINPROD_TYPE_TG_F06}]]*/'';
            var FINPROD_TYPE_TG_F10 = /*[[${FINPROD_TYPE_TG_F10}]]*/'';
            var FINPROD_TYPE_TG_ZYSHG = /*[[${FINPROD_TYPE_TG_ZYSHG}]]*/'';
		</script>
        <script data-th-src="@{/js/invest/entrust/etrexchangetrade/split.min.js}" type="text/javascript"></script>
    	<script data-th-src="@{/js/invest/entrust/etrexchangetrade/EtrExchangeTradeMain.js}" type="text/javascript"></script>

    </div>
</body>
</html>
