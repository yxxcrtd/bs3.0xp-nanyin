<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title>查询</title>
    <style>
    </style>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form" id="EtrIbBondinfo001_queryDialog_searchForm_zqzy">
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable"
                       data-th-text="#{EtrIbBondinfo001_queryDialog.portfolioName}">组合名称</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" id="portfolioId" name="portfolioId"
                            class="layui-input form-input input-select"
                            placeholder="请输入内容"
                            data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?ww=false}"
                            data-th-value="${portfolioId}" multiple="true">
                    </select>
                </div>
            </div>

            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable"
                       data-th-text="#{EtrIbBondinfo001_queryDialog.finprodAbbr}">资产简称</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="finprodAbbr" name="finprodAbbr" class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                           data-th-data-url="@{/common/basicdata/marketdata/mstrateassetquotationinfo/ComRateAssetQuotationInfo001/getAssetName}"
                           data-idfield="shortName" data-keyfield="shortName" 
                           data-th-data-effectivefieldsalias='|{"code":"资产编号", "shortName":"资产名称"}|' data-th-placeholder="#{SysCommon.placeholder}">
                </div>
            </div>

            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable"
                       data-th-text="#{EtrIbBondinfo001_queryDialog.ps}">交易方向</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" id="ps" name="ps" class="layui-input form-input input-select" placeholder="请输入内容"
                            data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-data-result="${BACK_LEND_DIRECTION}" >
                    </select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap" th:text="#{EtrIbBondinfo001_queryDialog.settleSpeed}">清算速度</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" id="settleSpeed" name="settleSpeed" class="layui-input form-input input-select"
                            data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${ACCOUNT_SPEED}'
                            data-th-initvalue="${settleSpeed}">
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-utext="#{EtrIbBondinfo001_queryDialog.repManager}">投资经理</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" id="EtrIbBondinfo001_queryDialog_repManager" name="repManager"
                            class="layui-input form-input input-select"
                            allowClear="true" placeholder="请输入内容"
                            data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-data-url="@{/invest/trade/investtrade/commanddispatcher/TrdCommandDispatcher001/getManagers}"
                            data-th-Value="${repManager}">
                    </select>
                </div>
            </div>

            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable"
                       data-th-text="#{EtrIbBondinfo001_queryDialog.entrustId}">指令代码</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="TrdCommandDispatcher001_entrustId" name="entrustId" maxlength="50"
                           class="layui-input form-input input-lenovoselect"
                           data-th-data-url="@{/invest/trade/investtrade/commanddispatcher/TrdCommandDispatcher001/getEntIds}"
                           data-idfield="code" data-th-data-effectivefields="code"
                           data-th-data-effectivefieldsalias='|{"code":"指令代码"}|'
                           placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" />
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="#{EtrIbBondinfo001_queryDialog.entrustDate}">指令日期</label>
                <div class="layui-input-inline input-inline">
                    <input id='entrustDate' name='entrustDate'
                           class="layui-input form-input input-dateSelect" placeholder="请选择时间"
                           data-th-placeholder="#{SysCommon.placeholder}">
                </div>
            </div>
        </div>
    </form>

    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 20px;">
        <div class="text-center">
            <a id="EtrIbBondinfo001_queryDialog_btn_submit" class="layui-btn layui-btn-sm  btn-submit">确定</a>
            <a id="EtrIbBondinfo001_queryDialog_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel">取消</a>
            <a id="EtrIbBondinfo001_queryDialog_btn_reset"  class="layui-btn layui-btn-sm  btn-reset">重置</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/entrust/etribbondinfo/EtrIbBondinfo001QueryDialog.js}" type="text/javascript"></script>
</div>
</body>
</html>
