<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>风险试算</title>
    <style>
        .riskclu{
            border: 1px solid #ccc;
            margin: 7px 5px 0px 5px;
            height: 35px
        }
        .riskclu span{
            font-weight: bold;
        }
    </style>
</head>

<body>
<div class="pro-module-wrap" id="FundAccountInfo_DIV">
    <input type="hidden" id="riskMathFlag" value="01" name="riskMathFlag">
    <input type="text" id="bankCode" name="bankCode" data-th-value='${bankCode}' hidden>
    <div class="pro-module">
        <div id="ResoluteRiskMathComm_btn_riskControl"><h3 class="pro-module-title"><span class="title-des" >风险试算</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3></div>
        <div class="pro-module-item" id="FundAccountInfo_DIV1">
            <div class="riskclu" id="FundAccountInfo_DIV2"><span id="riskTrialSpan"></span></div>
            <div id="FundAccountInfo_DIV3">
                <table class="layui-table" id="resoluteRiskMathCommTable" th:name="${entityName}"></table>
            </div>
        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
</script>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var SUP_TIME_TYPE_01 = /*[[${SUP_TIME_TYPE_01}]]*/'';
        var SUP_TIME_TYPE_02 = /*[[${SUP_TIME_TYPE_02}]]*/'';
        var SUP_TIME_TYPE_03 = /*[[${SUP_TIME_TYPE_03}]]*/'';
        var RiskTrialRetDto = /*[[${RiskTrialRetDto}]]*/'';

        var SUP_UNIT=/*[[${SUP_UNIT}]]*/;  //单位数据字典下拉
        var FORBID_ASSETTYPE=JSON.parse(/*[[${FINPROD_TYPE_TG}]]*/'[]'); // 资产类型
        var FORBID_BONDTYPE=JSON.parse(/*[[${WINDTYPEONE}]]*/'[]'); // 债券资产类型
        var FORBID_FUNDTYPE=JSON.parse(/*[[${FUND_ASSET_SECOND_TYPE}]]*/'[]'); // 基金资产类型
        var FORBID_DEBTRATE=JSON.parse(/*[[${SVR_MAIN_GRADE}]]*/'[]'); // 债项评级
        var FORBID_BODYRATE=JSON.parse(/*[[${SVR_MAIN_GRADE}]]*/'[]'); // 主体评级
        var FORBID_INDUSTRY=JSON.parse(/*[[${SW_INDUSTRY_ONE_TYPE}]]*/'[]'); // 负面行业清单
        var IND_TYPE_FORBID_ASSETTYPE=/*[[${IND_TYPE_FORBID_ASSETTYPE}]]*/; // 资产类型
        var IND_TYPE_FORBID_BONDTYPE=/*[[${IND_TYPE_FORBID_BONDTYPE}]]*/; // 债券资产类型
        var IND_TYPE_FORBID_FUNDTYPE=/*[[${IND_TYPE_FORBID_FUNDTYPE}]]*/; // 基金资产类型
        var IND_TYPE_FORBID_DEBTRATE=/*[[${IND_TYPE_FORBID_DEBTRATE}]]*/; // 债项评级
        var IND_TYPE_FORBID_BODYRATE=/*[[${IND_TYPE_FORBID_BODYRATE}]]*/; // 主体评级
        var IND_TYPE_FORBID_INDUSTRY=/*[[${IND_TYPE_FORBID_INDUSTRY}]]*/; // 负面行业清单
        var entityName = /*[[${entityName}]]*/'';
        var IND_TYPE_TOTAL_ENUM=/*[[${IND_TYPE_TOTAL_ENUM}]]*/'';
        var relateIndType=/*[[${IND_TYPE_LINK_ENCODE}]]*/'';
        var risk_math_switch=/*[[${risk_math_switch}]]*/'';

        //---add by jjpei----2019/03/30-----start-----------
        var workflowBaskRiskId=/*[[${workflowBaskRiskId}]]*/'';
        //---add by jjpei----2019/03/30-----end-----------
    </script>
    <script data-th-src="@{/js/invest/trade/transfer/common/ResoluteRiskMathComm.js}" type="text/javascript"></script>
</div>
</body>
</html>
