---
jixu:
  datasource:
    driverClassName: oracle.jdbc.driver.OracleDriver
    url: jdbc:oracle:thin:@192.168.70.219:1521/orcl
    username: tams_mast_jx_0529
    password: tams_mast_jx_0529
    defaultSchema: tams_mast_jx_0529
  #用户系统
  #1 jixu用户系统
  #2 joyin用户系统
  #3 joyinBatch用户系统
  user:
    type: 2

  #是否使用和joyin整合后的缩表版本,该参数为临时存在，在尚未完成缩表结构前,测试人员还是测试用原表进行功能测试
  #true 精简锁表版本
  #false 使用原始的jixu表结构
  joyintables:
    flag: true

  #主配置文件，配置了这个会优先读取里面的属性覆盖主配置文件的属性
  ##目标数据库的类型
  #Oracle=11;
  #MySQL=12;
  #SQLServer=13;
  #DB2=14;
  #Access=15;
  adapter:
    targetDB:
      dbType: 11

  ##activemq数据源配置
  activeMQ:
    serverURL: localhost
    serverPort: 61616
    username: admin
    password: admin
    maxCon: 100
    defaultDestinationName: jixuqueue

  ##是否同步数据到数据中心
  #0:不同步
  #1:同步数据
  #如果在StartDate和EndDate输入日期,则是同步一段区间内的数据
  #默认都是空,则是同步做账日的数据
  #DataCenter.StartDate=2017-07-19
  dataCenter:
    synchFlag: 0
    startDate:
    endDate:

  ##使用Hibernate或MyBatis框架
  #0:使用Hibernate框架
  #1:使用MyBatis框架
  frameWork:
    flag: 0

  ##0 jixu独立系统
  ##1 jixu调用joyin的主键生成系统
  keyGenerate:
    flag: 0

  #是否需要生成估值表,余额表等报表。外接入其它系统时，不需要几许生成报表
  genValreport:
    flag: false

##信评系统ip和端口配置
xinping:
  properties:
    urlIP: 127.0.0.1
    urlPort: 9191