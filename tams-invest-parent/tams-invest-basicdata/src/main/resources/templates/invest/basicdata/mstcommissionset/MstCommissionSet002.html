<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{MstCommissionSet002}">交易所交易费用设置新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title"> <span class="title-des">基本信息</span> （<span class="star-sign">*</span>必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <input type="hidden" id="batchSeq" name="batchSeq" data-th-value="${entity?.batchSeq}" >
							<input id="workflowId" name="workflowId" data-th-value="${entity?.workflowId}" type="hidden">
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <!-- add by wangguoxian 20190717 start -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstCommissionSet002.feeType}">费用类型</label>
                                        <div class="layui-input-inline input-inline">
                                              <select th:id="feeType" name="feeType" formatoption="true"
                                                        class="layui-input form-input input-select" 
                                                        data-th-placeholder="#{SysCommon.placeholder}"
                                                        data-th-initValue='${entity?.feeType}' required
                                                        data-th-data-result="${FEE_TYPE}">
                                                    </select>
                                        </div>
                                    </div>
                                    <!-- add by wangguoxian 20190717 end -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstCommissionSet002.secAcct}">证券账户</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="secAcctId" name="secAcctId"
							                             class="layui-input form-input input-select" 
							                             th:placeholder="#{SysCommon.placeholder}" multiple="true"
							                             th:data-url="@{/invest/basicdata/mstcommissionset/MstCommissionSet002/getSecAcctName}" allowClear="true"
							                             formatoption="true"
							                             th:initValue="${entity?.secAcctId}"></select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstCommissionSet002.tradeMarket}">交易场所</label>
                                        <div class="layui-input-inline input-inline">
                                              <select th:id="tradeMarket" name="tradeMarket" formatoption="false"
														class="layui-input form-input input-select" childrenIds="termType"
														data-th-placeholder="#{SysCommon.placeholder}"
														data-th-initValue='${entity?.tradeMarket}' required
														data-th-data-result="${TRADE_PLACE}">
													</select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstCommissionSet002.tradeType}">交易品种</label>
                                        <div class="layui-input-inline input-inline">
                                                 <select id="tradeType" name="tradeType" formatoption="false"
														class="layui-input form-input input-select" childrenIds="ps,chargeBasis"
														data-th-placeholder="#{SysCommon.placeholder}"
														data-th-initValue='${entity?.tradeType}' required
														data-th-data-result="${PINAN_ASSET_TYPE}">
													</select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style="display:none" id="tradeMarketMode_div">
                                        <label class="layui-form-label form-lable">交易市场</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="tradeMarketMode" name="tradeMarketMode" data-th-initValue='${entity?.tradeMarketMode}'
                                                    class="layui-input form-input input-select" data-th-data-result='${SHARES_TRADE_MARKET}' required
                                                    allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstCommissionSet002.ps}">交易方向</label>
                                        <div class="layui-input-inline input-inline">
                                             <select th:id="ps" name="ps" formatoption="false"
													multiple="true"	class="layui-input form-input input-select"
														data-th-placeholder="#{SysCommon.placeholder}"
														data-th-initValue='${entity?.ps}' required
													 parentIds="tradeType"	data-th-data-result="${PS}">
													</select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstCommissionSet002.termType}">期限品种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select th:id="termType" name="termType"
                                                    multiple="true"	class="layui-input form-input input-select"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.termType}' showAll="true"
                                                    parentIds="tradeMarket"	data-th-data-result="${TERM_TYPE_REBACK}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">资产分类一</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="windtypeone" name="windtypeone"  class="layui-input form-input input-select" childrenIds="windtypetwo" disabled
                                                    allowClear="true" data-th-data-result = '${WINDTYPEONE}' multiple="multiple" data-th-initValue='${entity?.windtypeone}'
                                                    formatoption="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">资产分类二</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="windtypetwo" name="windtypetwo"  class="layui-input form-input input-select" parentIds="windtypeone" disabled
                                                    allowClear="true" data-th-data-result = '${WINDTYPETWO}' multiple="multiple" data-th-initValue='${entity?.windtypetwo}'
                                                    formatoption="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstCommissionSet002.chargeType}">计费类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select th:id="chargeType" name="chargeType" formatoption="false" 
														class="layui-input form-input input-select"
														data-th-placeholder="#{SysCommon.placeholder}"
														data-th-initValue='${entity?.chargeType}' required
														data-th-data-result="${CHARGE_KIND}" allowClear="false" searchable="false"> 
													</select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstCommissionSet002.chargeBasis}">计费基数</label>
                                        <div class="layui-input-inline input-inline">
                                              <select th:id="chargeBasis" name="chargeBasis" formatoption="false"
														class="layui-input form-input input-select"
														data-th-placeholder="#{SysCommon.placeholder}"
														data-th-initValue='${entity?.chargeBasis}' 
													  parentIds="tradeType" 	data-th-data-result="${CHARGE_BASIS}">
													</select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstCommissionSet002.effDate}">生效日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="effDate" name="effDate" required
                                                   class="layui-input form-input input-dateSelect"
                                                   data-th-value='${#dates.format(entity?.effDate,"yyyy-MM-dd")}'
                                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" >
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item" id="grade_div1">
                                    <div class="form-inline-wrap" id="feeValueDiv" >
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstCommissionSet002.chargeValue}">费用值</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="chargeValue" name="chargeValue"
                                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                                   data-th-placeholder="#{SysCommon.placeholder}" required
                                                   data-th-value='${entity?.chargeValue}' data-textrange="2" maxlength="30">
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" id="feeRateDiv" style="display:none">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstCommissionSet002.chargeRate}">费率值</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="chargeRate" name="chargeRate" required
                                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.chargeRate}' data-textrange="8" maxlength="30">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstCommissionSet002.feeMaxi}">最大金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="feeMaxi" name="feeMaxi"
                                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                                   data-th-value='${entity?.feeMaxi}'
                                                   data-th-placeholder="#{SysCommon.placeholder}" data-textrange="2"
                                                   maxlength="30">
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstCommissionSet002.feeMini}">最小金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="feeMini" name="feeMini"
                                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                                   data-th-value='${entity?.feeMini}'
                                                   data-th-placeholder="#{SysCommon.placeholder}" data-textrange="2"
                                                   maxlength="30">
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item" >
                                    <!-- add by wangguoxian 20190717 start -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstCommissionSet002.isPayWithTrade}">是否随交易支付</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="checkbox" id="isPayWithTrade" name="isPayWithTrade"
                                                   lay-skin="switch"  lay-text="是|否"
                                                   th:value="${entity?.isPayWithTrade}" lay-filter="switchTest"
                                                   th:checked="${entity?.isPayWithTrade=='Y' ?true:false}" />
                                        </div>
                                    </div>
                                    <!-- add by wangguoxian 20190717 end -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">费用是否分档</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="isGrade" name="isGrade" data-th-initValue='${entity?.isGrade?:"N"}'
                                                    class="layui-input form-input input-select" data-th-data-result='${YES_OR_NO}' required
                                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption="false" allowClear="false">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="pro-module" id="grade_div2" style="display:none">
                            <h3 class="pro-module-title"> <span class="title-des">分档信息</span> （<span class="star-sign">*</span>必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <table class="layui-table" id="dataTable"></table>
                        </div>

                    </div>
                </div>
            </form>
	        <div class="layui-form-item">
                <div align="center" style="height:50px;padding-top: 10px;">
                    <a id="MstCommissionSet002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                    <a id="MstCommissionSet002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                    <a id="MstCommissionSet002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <!-- add by wangguoxian 20190717 start -->
        <script th:inline="javascript" type="text/javascript">
            var FEE_TYPE_B02 = /*[[${FEE_TYPE_B02}]]*/'';
            var FEE_TYPE_B05 = /*[[${FEE_TYPE_B05}]]*/'';
            var FEE_TYPE_B01 = /*[[${FEE_TYPE_B01}]]*/'';
            var FEE_TYPE_B07 = /*[[${FEE_TYPE_B07}]]*/'';
            var PINAN_ASSET_TYPE_F01 = /*[[${PINAN_ASSET_TYPE_F01}]]*/'';
            var PINAN_ASSET_TYPE_F11 = /*[[${PINAN_ASSET_TYPE_F11}]]*/'';
            // 场内基金改造 add by renping 20191117 start
            var PINAN_ASSET_TYPE_F02 = /*[[${PINAN_ASSET_TYPE_F02}]]*/'';
            // 场内基金改造 add by renping 20191117 end
            var CHARGE_KIND_1= /*[[${CHARGE_KIND_1}]]*/'';
            var CHARGE_BASIS_02= /*[[${CHARGE_BASIS_02}]]*/'';
            var YES_OR_NO = /*[[${YES_OR_NO}]]*/'';
            var windtypetwo=/*[[${windtypetwo}]]*/'';
            var chargeBasis=/*[[${entity?.chargeBasis}]]*/'';
        </script>
        <!-- add by wangguoxian 20190717 end -->
        <script data-th-src="@{/js/invest/basicdata/mstcommissionset/MstCommissionSet002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
