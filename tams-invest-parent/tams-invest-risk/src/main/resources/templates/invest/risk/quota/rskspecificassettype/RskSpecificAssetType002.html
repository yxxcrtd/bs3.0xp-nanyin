<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="#{RskSpecificAssetType001}">特定资产类型设置</title>
</head>
<body>
<div layout:fragment="content" id="RskSpecificAssetType002_DIV">
        <form class="layui-form joyin-form-wrap"
              id="submitForm">
            <input id="finprodId" name="finprodId"
                   data-th-value="${entity?.finprodId}" hidden>
            <input type="text" id="specificId" name="specificId"
                   class="layui-input form-input" data-th-value="${entity?.specificId}"
                   style="display: none">
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RskSpecificAssetType001.finprodId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <select id="finprodMarketId" name="finprodMarketId"
                                    class="layui-input form-input input-select"
                                    data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
                                    data-th-data-url="@{/invest/risk/quota/rskspecificassettype/RskSpecificAssetType001/getAssetIdOption}"
                                    data-th-initValue="*{entity?.finprodMarketId}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RskSpecificAssetType001.type1}">资产一级类型</label>
                        <div class="layui-input-inline input-inline">
                            <select id="type1" name="type1"
                                    th:initValue="*{entity?.type1}"
                                    class="layui-input form-input input-select"
                                    placeholder="请输入内容" childrenids="type2"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${RSK_AUTHORIZE_TYPE1}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RskSpecificAssetType001.type2}">资产二级类型</label>
                        <div class="layui-input-inline input-inline">
                            <select id="type2" name="type2"
                                    th:initValue="*{entity?.type2}"
                                    class="layui-input form-input input-select"
                                    childrenids="type3" parentids="type1"
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${RSK_AUTHORIZE_TYPE2}">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RskSpecificAssetType001.type3}">资产三级类型</label>
                        <div class="layui-input-inline input-inline">
                            <select id="type3" name="type3"
                                    th:initValue="*{entity?.type3}"
                                    class="layui-input form-input input-select"
                                    childrenids="type4" parentids="type2"
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${RSK_AUTHORIZE_TYPE3}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RskSpecificAssetType001.type4}">业务类型</label>
                        <div class="layui-input-inline input-inline">
                            <select id="type4" name="type4"
                                    th:initValue="*{entity?.type4}"
                                    class="layui-input form-input input-select"
                                    parentids="type3"
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${RSK_AUTHORIZE_TYPE4}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RskSpecificAssetType001.isBadasset}">是否不良资产</label>
                        <div class="layui-input-inline input-inline">
                            <input type="checkbox" id="isBadasset" name="isBadasset"
                                   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                   data-th-checked="${YES_OR_NO_Y} ==${entity?.isBadasset}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RskSpecificAssetType001.isRegulation}">是否国务院银行业监督管理机构另有规定</label>
                        <div class="layui-input-inline input-inline">
                            <input type="checkbox" id="isRegulation" name="isRegulation"
                                   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                   data-th-checked="${YES_OR_NO_Y} ==${entity?.isRegulation}">
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RskSpecificAssetType001.isCreditAsset}">是否信贷资产及其收受益权</label>
                        <div class="layui-input-inline input-inline">
                            <input type="checkbox" id="isCreditAsset" name="isCreditAsset"
                                   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                   data-th-checked="${YES_OR_NO_Y} ==${entity?.isCreditAsset}">
                        </div>
                    </div>

                    <div class="form-inline-wrap" id="isFlowLimited_div">
                        <label class="layui-form-label form-label-wrap">是否流动性受限</label>
                        <div class="layui-input-inline input-inline">
                            <input type="checkbox" id="isFlowLimited" name="isFlowLimited"
                                   lay-skin="switch" data-th-value="${YES}"
                                   lay-text="是|否" data-th-checked="${YES_OR_NO_Y} ==${entity?.isFlowLimited}">
                        </div>
                    </div>
                </div>
        </form>
    <div class="layui-col-md12" style="margin-top: 20px;">
        <div class="text-center">
            <a id="RskSpecificAssetType002_btn_save"
               class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a> <a
                id="RskSpecificAssetType002_btn_submit"
                class="layui-btn layui-btn-sm btn-submit"
                data-th-text="#{SysCommon.submit}">提交</a> <a
                id="RskSpecificAssetType002_btn_cancel"
                class="layui-btn layui-btn-sm btn-cancel"
                data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
    </script>
    <script data-th-src="@{/js/invest/risk/quota/rskspecificassettype/RskSpecificAssetType002.js}"
            type="text/javascript"></script>
</div>
</body>

</html>
