<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
    <title layout:title-pattern="$CONTENT_TITLE">兆尹科技</title>
    <link rel="icon" data-th-href="@{/public/images/favicon.ico}" type="image/x-icon"/>
    <link rel="stylesheet" data-th-href="@{/public/layui/css/layui.css}" media="all">
    <link rel="stylesheet" data-th-href="@{/public/font/iconfont.css}" media="all">
    <link rel="stylesheet" data-th-href="@{/public/font1/iconfont.css}" media="all">
    <link rel="stylesheet" data-th-href="@{/public/css/common.css}" media="all">
    <link id="themesLink" rel="stylesheet" data-th-href="@{/public/css/themes/{themes}.css(themes=${#strings.isEmpty(session.SESSION_MY_SKIN) ? 'blue' : session.SESSION_MY_SKIN})}" media="all">
    <script type="text/javascript" data-th-src="@{/public/layui/layui.all.js}"></script>
    <script data-th-inline="javascript" type="text/javascript">
        var basePath = /*[[@{/}]]*/'/';
        var pageId = /*[[${pageId}]]*/'pageId';
    </script>
</head>

<body>
<div class="layui-fluid">
    <!-- 画面内容 -->
    <div data-layout-fragment="content" id="printArea"></div>
    <div id="_tempPrint" style="position: absolute;text-align: center;top: 5px; left:5px;" data-th-if="${entity != null}">
        <a id="btn_print" class="layui-btn layui-btn-sm"><i class="iconfont icon-print"></i><span>&nbsp;&nbsp;打印</span></a>
        <a id="btn_close" class="layui-btn layui-btn-sm"><i class="iconfont icon-close"></i><span>&nbsp;&nbsp;关闭</span></a>
    </div>
    <div style="position: absolute;text-align: center;top: 5px; left:5px;" data-th-if="${entity == null}">
        无数据或当前业务类型不支持打印
    </div>
</div>
<script type="text/javascript" data-th-src="@{/public/js/jquery-1.9.1.min.js}"></script>
<script type="text/javascript" data-th-src="@{/public/js/jquery.PrintArea.js}"></script>
<script type="text/javascript" data-th-src="@{/public/js/jquery-ui.min.js}"></script>
<!-- 让IE8/9支持媒体查询，从而兼容栅格 -->
<script data-th-src="@{/public/js/html5.min.js}"></script>
<script data-th-src="@{/public/js/respond.min.js}"></script>
<script type="text/javascript">
    $("#btn_print").click(function () {
        $("#printArea").printArea();
    })
    $("#btn_close").click(function () {
        var mymessage = confirm("确认关闭");
        if (mymessage == true) {
            window.close()
        }
    })
</script>
<!-- javascript -->
<div data-layout-fragment="script"></div>
</body>

</html>
