<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
    .upload .layui-table th{
        padding: 6px 15px;
    }
    .upload .layui-table td{
        padding: 2px 15px;
    }
    </style>
</head>
<body>
    <div id="FileCommon_DIV" class="pro-module-wrap">
    	<style>
    		.mult-file-btn {
    			display: none;
    		}
            .show{
                overflow: auto;
                max-height: 200px;
            }
    	</style>
        <div class="pro-module">
            <h3 class="pro-module-title">
            	<span class="title-des" data-th-text="#{FileCommon}">附件信息</span>
            	<a class="layui-btn layui-btn-sm btn-create" id="multFileBtn"><i class="iconfont icon-found"></i><span>选择多文件</span></a>
            	<i class="iconfont icon-arrow-down pro-down-icon"></i>
            </h3>
            <div class="pro-module-item">
                <div class="layui-form-item" style="padding: 10px 10px 0 10px;text-align:center;">
                    <div class="show">
                        <div id="fileUploader" class="upload" th:disabled="${pageModel} eq ${pageModelReference}" th:data-data='${attachmentFiles}'
                             data-option="{muiltiple: true, autoUpload: true, type: 'list'}">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script data-th-inline="javascript" type="text/javascript">
    	var entityName_fileCommon = /*[[${entityName}]]*/'fielArea1';
    </script>
    <script data-th-src="@{/js/invest/riskredis/quota/common/FileCommon.js}" type="text/javascript"></script>
</body>
</html>
