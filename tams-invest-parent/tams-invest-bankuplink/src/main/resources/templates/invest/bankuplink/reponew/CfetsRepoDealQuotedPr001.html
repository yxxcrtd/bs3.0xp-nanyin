<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorator="~{layout/default}">
<head>
    <style type="text/css">
        .layui-tab-title li {
            display: inline-block;
            vertical-align: middle;
            font-size: 12px;
            position: relative;
            line-height: 30px;
            min-width: 55px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease 0s;
            padding: 0px 10px;
        }

        .form-lable {
            width: 35%;
            padding: 0px 10px 0px 0px;
        }

        .layui-tab-content {
            padding: 0px !important;
        }

        .select2-container--default .select2-results > .select2-results__options {
            max-height: 150px;
            overflow-y: auto;
        }

        /* span.select2-selection.select2-selection--single {
            max-width: 150px;
        } */

        .layui-form-item .select2-container {
            max-width: 100% !important
        }

        .position-col-width {
            width: 30%;
        }

        .position-col-width-zqzy {
            width: 22%;
        }

        .position-col-width-zqzy1 {
            width: 45%;
        }

        #positionsTable_zqzy_div {
            margin-top: -38px;
            margin-left: 40px;
            margin-bottom: 12px;
        }

        .form-lable {
            width: 25% !important;;
        }

        .grid-demo {
            background-color: #f5f5f5;
            border: 1px solid red;
            border-radius: 3px;
            padding: 5px;
        }

        .sgePortDiv {
            width: 100%;
            overflow: hidden;
            clear: both;
            padding-top: 8px;
            display: inline-block;
        }

        .form-label-wrap-radio {
            color: #444;
            padding: 0 10px 0 0;
            float: left;
            display: block;
            font-weight: 400;
            text-align: right;
        }

        .keywords {
            border-radius: 25px !important;
            width: 100%;
        }

        .sgePortDiv .layui-input-inline {
            width: 100%;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="layui-tab" lay-filter="tradePlatform" style="display: none">
        <ul class="layui-tab-title">
            <li class="layui-this ZLGL">指令执行</li>
            <li class="ZYQGLL">质押券管理</li>
            <li class="WTCX">委托查询</li>
            <li class="CJCX">成交查询</li>
        </ul>
        <div class="layui-tab-content">
            <!-- 指令执行 -->
            <div class="layui-tab-item layui-show">
                <div class="layui-col-md12 form-button-area zlgl-transfer-form">
                    <a id="cfetsRepoDealQuotedPr001_zlg1_tuihui" class="layui-btn layui-btn-sm"
                       data-th-text="#{cfetsRepoDealQuotedPr001.zlg1.tuihui}">放弃</a>
                    <a id="cfetsRepoDealQuotedPr001_zlg1_jieshou" class="layui-btn layui-btn-sm"
                       data-th-text="#{cfetsRepoDealQuotedPr001.zlg1.jieshou}">接收</a>
                </div>
                <div class='joyin-form-wrap joyin-filter-form condition-area curr-form zlgl-transfer-form'>
                    <form class="layui-form" id='searchForm_zlgl'>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-label"
                                       th:text="#{cfetsRepoDealQuotedPr001.zlg1.portfolioId}">组合代码</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" name="portfolioId_zlgl" id="portfolioId_zlgl" multiple="true"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/selectPortfolioId}"
                                            allowClear="true">
                                    </select>
                                </div>
                            </div>
                            <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-label"
                                       th:text="#{cfetsRepoDealQuotedPr001.zlg1.assetId}">资产代码</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="assetId_zlgl" name="assetId_zlgl"
                                           class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-data-url="@{/invest/asset/common/getAssetId(finprodType2=${FINPROD_TYPE_TG_F01})}"
                                           data-idfield="code" data-keyfield="code"
                                           data-th-data-effectivefieldsalias='|{"shortName":"#{FinBondTargetAsset002.finprodAbbr}","code":"#{FinBondTargetAsset002.finprodId}"}|'
                                    >
                                </div>
                            </div>
                            <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-label"
                                       th:text="#{CfetsBondDealQuotedPr001.zlgl.ps}">交易方向</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="ps_zlgl" name="ps_zlgl"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            data-th-data-result='${PS}' allowClear="true" formatoption="true"></select>
                                </div>
                            </div>
                            <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-label"
                                       th:text="#{CfetsBondDealQuotedPr001.zlgl.invManagerId}">投资经理</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" name="invManagerId_zlgl" id="invManagerId_zlgl"
                                            class="layui-input form-input input-select"
                                            allowClear="true" placeholder="请输入内容"
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-data-url="@{/invest/trade/investtrade/commanddispatcher/TrdCommandDispatcher001/getManagers}">
                                    </select>
                                </div>
                            </div>
                            <!-- 单选框 -->
                            <div class="form-inline-wrap-radio" style="padding-top: 3px;margin-left:20px">
                                <label class="layui-form-label form-label"
                                       th:text="#{CfetsBondDealQuotedPr001.zlgl.zlglStatus}">指令状态</label>
                                <label class="form-label-wrap-radio">
                                    <input type="radio" name="zlglStatus" value="01" title="全部" checked>
                                </label>
                                <label class="form-label-wrap-radio">
                                    <input type="radio" name="zlglStatus" value="02"
                                           th:title="#{CfetsRepoDealQuotedPr001.zlgl.two}">
                                </label>
                                <label class="form-label-wrap-radio">
                                    <input type="radio" name="zlglStatus" value="03"
                                           th:title="#{CfetsRepoDealQuotedPrice001.zlgl.three}">
                                </label>
                                <label class="form-label-wrap-radio">
                                    <input type="radio" name="zlglStatus" value="04"
                                           th:title="#{CfetsRepoDealQuotedPrice001.zlgl.four}">
                                </label>
                            </div>
                        </div>
                    </form>
                </div>
                <!-- 指令执行列表 -->
                <div>
                    <table class="layui-table" id="zlzxTable"></table>
                </div>
            </div>
            <!-- 质押券管理 -->
            <div class="layui-tab-item">
                <div class="layui-col-md12 form-button-area zyqgl-transfer-form">
                </div>
                <div class='joyin-form-wrap joyin-filter-form condition-area curr-form zyqgl-transfer-form'>
                    <form class="layui-form" id="searchForm_zyqgl">
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{cfetsRepoDealQuotedPr001.zlg1.portfolioId}">组合代码</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="portfolioId_zyqgl" name="portfolioId_zyqgl"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容"
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
                                            multiple="true">
                                    </select>
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{cfetsRepoDealQuotedPr001.zlg1.secAcctId}">证券账户</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="secAcctId_zyqgl" name="secAcctId_zyqgl"
                                           class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-data-url="@{/invest/basicdata/mstsecuritiesaccount/MstSecuritiesAccount001/getSecAcctId}"
                                           data-idfield="code" data-keyfield="name"
                                           data-th-data-effectivefieldsalias='|{"code":"#{MstSecuritiesAccount001.secAcctId}","shortName":"#{MstSecuritiesAccount001.secAcctName}"}|'>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <!-- 质押券管理 -->
                <div>
                    <table class="layui-table" id="zyqglTable"></table>
                </div>
            </div>
            <!-- 委托查询 -->
            <div class="layui-tab-item">
                <span>交易方式</span>
                <a id="cfetsRepoDealQuotedPre001_wtcx_duihua" class="layui-btn layui-btn-sm"
                   data-th-text="#{CfetsRepoDealQuotedPr001.wtcx.duihua}">对话</a>
                <!--                <a id="cfetsRepoDealQuotedPr001_wtcx_qingqiu" class="layui-btn layui-btn-sm"
                                   data-th-text="#{CfetsRepoDealQuotedPr001.wtcx.qingqiu}">请求</a>-->
                <!-- 委托对话报价查询 -->
                <div class="duihua">
                    <div class="layui-col-md12 form-button-area wtcxdh-transfer-form">
                    </div>
                    <div class='joyin-form-wrap joyin-filter-form condition-area curr-form wtcxdh-transfer-form'>
                        <form class="layui-form" id="searchForm_wtcxdh">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md3 layui-col-xs3 layui-col-sm3 layui-col-lg3">
                                    <div class="layui-inline">
                                        <label class="layui-form-label">回购期限(天)</label>
                                        <div class="layui-input-inline" style="width: 60px;">
                                            <input type="text" id="termStart_wtdh" name="term"
                                                   class="layui-input form-input" style="width: 60px;"
                                                   placeholder="请输入内容"
                                                   data-fixtype="2" data-textrange="2"
                                                   th:placeholder="#{SysCommon.placeholder}">
                                        </div>
                                        <div class="layui-form-mid">-</div>
                                        <div class="layui-input-inline" style="width: 60px;">
                                            <input type="text" id="termend_wtdh" name="term"
                                                   class="layui-input form-input" style="width: 60px;"
                                                   placeholder="请输入内容"
                                                   data-fixtype="2" data-textrange="2"
                                                   th:placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md3 layui-col-xs3 layui-col-sm3 layui-col-lg3">
                                    <label class="layui-form-label form-label">本方</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ouPartyId" name="ouPartyId"
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result='${PS}' allowClear="true"
                                                formatoption="true"></select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md3 layui-col-xs3 layui-col-sm3 layui-col-lg3">
                                    <label class="layui-form-label form-label">对手方</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="counterId" name="counterId"
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result='${PS}' allowClear="true"
                                                formatoption="true"></select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md3 layui-col-xs3 layui-col-sm3 layui-col-lg3">
                                    <label class="layui-form-label form-label">对手方机构</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="duishoufangjigou_wtdh" name="duishoufangjigou_wtdh"
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result='${PS}' allowClear="true"
                                                formatoption="true"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item" style="padding-top: 0px;">
                                <div class="form-inline-wrap-radio">
                                    <label class="layui-form-label form-label"
                                           th:text="交易状态">交易状态</label>
                                    <label class="form-label-wrap-radio">
                                        <input type="radio" name="dayOfferStatus" value="whole" title="全部" checked>
                                    </label>
                                    <label class="form-label-wrap-radio">
                                        <input type="radio" name="dayOfferStatus" value="undo"
                                               th:title="#{CfetsRepoDealQuotedPrice001.dayOffer.searchArea.unDeal}">
                                    </label>
                                    <label class="form-label-wrap-radio">
                                        <input type="radio" name="dayOfferStatus" value="done"
                                               th:title="#{CfetsRepoDealQuotedPrice001.dayOffer.searchArea.done}">
                                    </label>
                                    <label class="layui-form-label form-label"
                                           th:text="本方方向">本方方向</label>
                                    <label class="form-label-wrap-radio">
                                        <input type="radio" name="benfangSide" value="whole" title="全部" checked>
                                    </label>
                                    <label class="form-label-wrap-radio">
                                        <input type="radio" name="benfangSide" value="03"
                                               th:title="#{CfetsRepoDealQuotedPr001.wtdh.four}">
                                    </label>
                                    <label class="form-label-wrap-radio">
                                        <input type="radio" name="benfangSide" value="04"
                                               th:title="#{CfetsRepoDealQuotedPr001.wtdh.five}">
                                    </label>
                                </div>
                                <div class="form-inline-wrap-btn">
                                    <a id="cfetsRepoDealQuotedPr001_wtdh_chenxiao"
                                       class="layui-btn layui-btn-sm layui-btn-warm">撤销</a>
                                    <a id="cfetsRepoDealQuotedPrice001_wtdh_xiugai"
                                       class="layui-btn layui-btn-sm">修改</a>
                                    <a id="cfetsRepoDealQuotedPrice001_wtdh_jujue"
                                       class="layui-btn layui-btn-sm">拒绝</a>
                                    <a id="cfetsRepoDealQuotedPrice001_wtdh_chengjiao"
                                       class="layui-btn layui-btn-sm">成交</a>
                                    <a id="cfetsRepoDealQuotedPrice001_wtdh_export"
                                       class="layui-btn layui-btn-sm">导出</a>
                                </div>
                            </div>
                        </form>
                    </div>
                    <!-- 委托对话报价查询 -->
                    <div>
                        <table class="layui-table" id="wtdhbjTable"></table>
                    </div>
                </div>
            </div>
            <!-- 成交查询 -->
            <div class="layui-tab-item">
                <div class="layui-col-md12 form-button-area cjcx_transfer-form">
                    <a id="cfetsRepoDealQuotedPr001_cjcx_chexiao" class="layui-btn layui-btn-sm">撤销</a>
                    <a id="cfetsRepoDealQuotedPr001_cjcx_dayin" class="layui-btn layui-btn-sm">导出PDF单据</a>
                    <a id="cfetsRepoDealQuotedPr001_cjcx_zyqzh" class="layui-btn layui-btn-sm">质押券置换</a>
                </div>
                <div class='joyin-form-wrap joyin-filter-form condition-area curr-form cjcx_transfer-form'>
                    <form class="layui-form" id="searchForm_cjcx">
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-label"
                                       th:text="#{cfetsRepoDealQuotedPr001.zlg1.assetId}">资产代码</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" name="assetId_cjcx" id="assetId_cjcx"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-data-url="@{/invest/asset/common/getAssetId(finprodType2='F01')}"
                                            data-idfield="code" data-keyfield="code"
                                            data-th-data-effectivefieldsalias='|{"shortName":"#{cfetsRepoDealQuotedPr001.zlg1.assetAbbr}","code":"#{cfetsRepoDealQuotedPr001.zlg1.assetId}"}|'>
                                    </select>
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-label">交易日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="tradeDate" name="tradeDate"
                                           class="layui-input form-input input-dateRangeSelect"
                                           placeholder="请输入时间区间"
                                           data-th-placeholder="#{SysCommon.placeholder}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{CSTPSelect001.matchStatus}">匹配状态</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="matchStatus" name="matchStatus"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容"
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-data-result='${MATCH_STATUS}' allowClear="true"
                                            formatoption="true" multiple="true"></select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item" style="padding-top: 0px;">
                            <div class="form-inline-wrap-radio">
                                <label class="layui-form-label form-label"
                                       th:text="交易方式">交易方式</label>
                                <label class="form-label-wrap-radio">
                                    <input type="radio" name="tradeMode" value="01" title="全部" checked>
                                </label>
                                <label class="form-label-wrap-radio">
                                    <input type="radio" name="tradeMode" value="02"
                                           th:title="#{CfetsRepoDealQuotedPr001.cjcx.two}">
                                </label>
                                <label class="form-label-wrap-radio">
                                    <input type="radio" name="tradeMode" value="03"
                                           th:title="#{CfetsRepoDealQuotedPr001.cjcx.three}">
                                </label>
                                <label class="layui-form-label form-label"
                                       th:text="本方方向">本方方向</label>
                                <label class="form-label-wrap-radio">
                                    <input type="radio" name="benfangSide" value="01" title="全部" checked>
                                </label>
                                <label class="form-label-wrap-radio">
                                    <input type="radio" name="benfangSide" value="03"
                                           th:title="#{CfetsRepoDealQuotedPr001.wtdh.four}">
                                </label>
                                <label class="form-label-wrap-radio">
                                    <input type="radio" name="benfangSide" value="04"
                                           th:title="#{CfetsRepoDealQuotedPr001.wtdh.five}">
                                </label>
                            </div>
                        </div>
                    </form>
                </div>
                <!-- 质押券管理 -->
                <div>
                    <table class="layui-table" id="cjcxTable"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var entrustStatusUnAccept = /*[[${entrustStatusUnAccept}]]*/'';
        var entrustStatusAccept = /*[[${entrustStatusAccept}]]*/'';
        var quoteTypeDialog = /*[[${quoteTypeDialog}]]*/'';
        var quoteTypeRequest = /*[[${quoteTypeRequest}]]*/'';
        var ibuFlag_startDialogueQuoteWithNoEntrust = /*[[${ibuFlag_startDialogueQuoteWithNoEntrust}]]*/'';
        var ps_pay_name = /*[[${ps_pay_name}]]*/'';
        var ps_sell_name = /*[[${ps_sell_name}]]*/'';
        var unSendStatus = /*[[${unSendStatus}]]*/'';
        var quoteRoleTypeEnquiry = /*[[${quoteRoleTypeEnquiry}]]*/'';
        var quoteRoleTypeReply = /*[[${quoteRoleTypeReply}]]*/'';
        var tradeStatusPending = /*[[${tradeStatusPending}]]*/'';
        var sendStatus_fail = /*[[${sendStatus_fail}]]*/'';
        var sendStatus_unsend = /*[[${sendStatus_unsend}]]*/'';
        var sendStatus_send = /*[[${sendStatus_send}]]*/'';
        var quoteStatus_added = /*[[${quoteStatus_added}]]*/'';
        var repoTopic = /*[[${repoTopic}]]*/'';
    </script>
    <script
            data-th-src="@{/js/invest/bankuplink/reponew/CfetsRepoDealQuotedPr001.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
