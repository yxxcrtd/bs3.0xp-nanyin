<!DOCTYPE html>
<html style="height:80%;" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml" layout:decorator="~{layout/default}">
<meta charset="UTF-8" />
<head>
</head>
<body>
<div layout:fragment="content" id="CfetsBondDealQuotedPriceMuti001_bodydiv">
    <style type="text/css">
        .layui-form-radio {
            line-height: 24px;
            padding-right: 0px;
            margin: 0px;
        }
        .layui-form-radio div {
            font-size: 12px;
        }
        .layui-form-radio i{
            font-size: 14px;
        }
    </style>
    <div class="joyin-form-wrap">
        <form class="layui-form pro-module-form" id="submitForm">
            <input type="hidden" id="businessId" name="businessId" th:value="${businessId?: ''}">
            <input type="hidden" id="CfetsBondDealQuotedPriceMuti001_hidden_entrustId" th:value="${entity?.entrustId}" />
            <input type="hidden" id="CfetsBondDealQuotedPriceMuti001_hidden_finprodId" th:value="${entity?.finprodId}" />
            <input type="hidden" id="CfetsBondDealQuotedPriceMuti001_hidden_quotaPageModel" name="quotaPageModel" th:value="${entity?.quotaPageModel}" />
            <input type="hidden" id="CfetsBondDealQuotedPriceMuti001_settleCcy" name="settleCcy" />
            <input type="hidden" id="CfetsBondDealQuotedPriceMuti001_hidden_isRight" name="isRight" th:value="${entity?.isRight}" />
            <input type="hidden" id="CfetsBondDealQuotedPriceMuti001_hidden_assetTypeOne" name="assetTypeOne" th:value="${entity?.assetTypeOne}" />
            <input type="hidden" id="CfetsBondDealQuotedPriceMuti001_hidden_calculateField" th:value="${entity?.calculateField}" />
            <input type="hidden" id="CfetsBondDealQuotedPriceMuti001_hidden_entrustAmt" name="entrustAmt" th:value="${entity?.entrustNum}" />
            <input type="hidden" id="CfetsBondDealQuotedPriceMuti001_hidden_quoteId" name="quoteId" th:value="${entity?.quoteId}" />
            <input type="hidden" id="CfetsBondDealQuotedPriceMuti001_responseMySide" name="responseMySide"/>
            <input type="hidden" id="CfetsBondDealQuotedPriceMuti001_hidden_workflowId" name="workflowId" th:value="${entity?.workflowId}" />
            <input type="hidden" id="CfetsBondDealQuotedPriceMuti001_cpriceAmt" name="cpriceAmt" />
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{CfetsBondDealQuotedPriceMuti.portfolioSeries}">组合系列</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <select disabled id="CfetsBondDealQuotedPriceMuti001_portfolioSeries" name="portfolioSeries"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                required data-th-data-result="${PORTFOLIO_SERIES}"
                                data-th-initvalue="${entity?.portfolioSeries}">
                        </select>
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{CfetsBondDealQuotedPriceSingle.finprodId}">资产代码</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <select disabled
                                type="text"
                                id="CfetsBondDealQuotedPriceMuti001_finprodId"
                                name="finprodMarketId"
                                class="layui-input form-input input-select"
                                allowClear="true"
                                placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                required="required"
                                data-formatoption="true"
                                data-th-data-url="@{/invest/bankuplink/bond/CfetsBondDealQuotedPriceSingle/getfinprodIdForAdd}"
                                data-th-initvalue="${entity?.finprodMarketId}"
                        ></select>
                    </div>
                </div>

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.ps}">交易方向</label>
                    <div class="layui-input-inline input-inline">
                        <select required disabled type="text" id="CfetsBondDealQuotedPriceMuti001_ps" name="ps"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                th:data-result='${PS}' allowClear="true" formatoption="true"
                                th:initValue="${entity?.ps}"></select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.settleType}">清算类型</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="CfetsBondDealQuotedPriceMuti001_settleType" name="settleType"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                th:data-result='${CLEAR_TYPE}' allowClear="true" formatoption="true"
                                th:initValue="${entity?.settleType}"></select>
                    </div>
                </div>

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{CfetsBondDealQuotedPriceSingle.settleSpeed}" >清算速度</label>
                    <div class="layui-input-inline input-inline" >
                        <select required type="text" id="CfetsBondDealQuotedPriceMuti001_settleSpreed" name="settleSpreed"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                th:data-result='${ACCOUNT_SPEED}' allowClear="true" formatoption="true"
                                th:initValue="${entity?.settleSpreed}"></select>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.tradeDate}">交易日期</label>
                    <div class="layui-input-inline input-inline buss-inline-wrap" >
                        <input disabled type="text" id="CfetsBondDealQuotedPriceMuti001_tradeDate" name="tradeDate"
                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                               th:placeholder="#{SysCommon.placeholder}"
                               th:value="${platDate}">
                    </div>
                </div>

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.settleMethod}">结算方式</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="CfetsBondDealQuotedPriceMuti001_settleMethod" name="settleMethod"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                th:data-result='${SETT_MODE}' allowClear="true" formatoption="true"
                                th:initValue="${entity?.settleMethod}"></select>
                    </div>
                </div>

            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.settleDate}">结算日期</label>
                    <div class="layui-input-inline input-inline buss-inline-wrap" >
                        <input disabled type="text" id="CfetsBondDealQuotedPriceMuti001_settleDate" name="settleDate"
                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                               th:placeholder="#{SysCommon.placeholder}"
                               th:value="${#dates.format(entity?.settleDate,'yyyy-MM-dd')}">
                    </div>
                </div>

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.bondPrinamt}">券面总额(万元)</label>
                    <div class="layui-input-inline input-inline">
                        <input required type="text" id="CfetsBondDealQuotedPriceMuti001_avaNum" name="avaNum"
                               class="layui-input form-input text-number" placeholder="请输入内容"
                               data-fixtype="2" data-textrange="2"
                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.avaNumStr}">
                        <span class="input-right-show">万元</span>
                    </div>
                </div>
            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap"  style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.unitCprice}">净价</label>
                    <div class="layui-input-inline input-inline">
                        <input required type="text" id="CfetsBondDealQuotedPriceMuti001_unitCprice" name="price"
                               class="layui-input form-input text-number" placeholder="请输入内容"
                               data-fixtype="2" data-textrange="4"
                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.price}">
                        <span class="input-right-show">元</span>
                        <label id ="deviationDegree"></label>
                    </div>
                </div>
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.unitInt}">应计利息</label>
                    <div class="layui-input-inline input-inline">
                        <input required disabled type="text" id="CfetsBondDealQuotedPriceMuti001_unitInt" name="unitInt" data-textrange="5" data-th-value="${entity?.unitInt}" class="layui-input form-input text-number" placeholder="请输入">
                        <span class="input-right-show">元</span>
                    </div>
                </div>
            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap"  style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.fprice}">全价</label>
                    <div class="layui-input-inline input-inline">
                        <input required disabled type="text" id="CfetsBondDealQuotedPriceMuti001_unitFprice" name="unitFprice" data-textrange="4" data-th-value="${entity?.unitFprice}" class="layui-input form-input text-number" placeholder="请输入">
                        <span class="input-right-show">元</span>
                    </div>
                </div>
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.intAmt}">应计利息总额</label>
                    <div class="layui-input-inline input-inline">
                        <input required disabled type="text" id="CfetsBondDealQuotedPriceMuti001_intAmt" name="intAmt" data-th-value="${entity?.intAmt}" class="layui-input form-input text-number" placeholder="请输入">
                        <span class="input-right-show">元</span>
                    </div>
                </div>
            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap"  style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.exerYield}">行权收益率</label>
                    <div class="layui-input-inline input-inline buss-inline-wrap">
                        <input required disabled type="text" id="CfetsBondDealQuotedPriceMuti001_exerYield" name="exerYield"
                               class="layui-input form-input text-number"
                               data-fixtype="2" data-textrange="4" th:value="${entity?.exerYield}">
                        <span class="input-right-show">%</span>
                    </div>
                </div>
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.matureYield}">到期收益率</label>
                    <div class="layui-input-inline input-inline buss-inline-wrap">
                        <input required disabled type="text" id="CfetsBondDealQuotedPriceMuti001_matureYield" name="matureYield"
                               class="layui-input form-input text-number"
                               data-fixtype="2" data-textrange="4" th:value="${entity?.matureYield}">
                        <span class="input-right-show">%</span>
                    </div>
                </div>
            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.fprinceAmt}">结算金额</label>
                    <div class="layui-input-inline input-inline">
                        <input required disabled type="text" id="CfetsBondDealQuotedPriceMuti001_fpriceAmt" name="fpriceAmt" data-th-value="${entity?.fpriceAmt}" class="layui-input form-input text-number" placeholder="请输入">
                        <span class="input-right-show">元</span>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice002.my}">本方</label>
                    <div class="layui-input-inline input-inline">
                        <select required disabled type="text" id="CfetsBondDealQuotedPriceMuti001_mySide" name="mySide"
                                class="layui-input form-input input-select"
                                th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
                                th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryMySideList}" allowClear="true"
                                formatoption="true" th:initValue="${entity?.mySide}"></select>
                    </div>
                </div>
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap"
                           th:text="#{CfetsBondDealQuotedPriceSingle.myTradeId}">本方交易员</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="CfetsBondDealQuotedPriceMuti001_mySideTrader" name="mySideTrader"
                                class="layui-input form-input input-select"
                                th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
                                th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryMySideTraderList}" allowClear="true"
                                formatoption="true" th:initValue="${entity?.mySideTrader}"></select>
                    </div>
                </div>
            </div>



            <div class="layui-form-item">

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.counterId}">交易对手</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="CfetsBondDealQuotedPriceMuti001_counterId" name="counterId"
                                class="layui-input form-input input-select"
                                th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
                                th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryCounterSideList}" allowClear="true"
                                formatoption="true"
                                th:initValue="${entity?.counterId}"></select>
                    </div>
                </div>
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.counterTradeId}">对手方交易员</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="CfetsBondDealQuotedPriceMuti001_counterTrader" name="counterTrader"
                                class="layui-input form-input input-select" parentIds="CfetsBondDealQuotedPriceMuti001_counterId"
                                th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
                                th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryMySideTraderList}" allowClear="true"
                                formatoption="true"
                                th:initValue="${entity?.counterTrader}"></select>
                    </div>
                </div>
            </div>

            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des" th:text="#{CfetsBondDealQuotedPriceSingle.remark}">备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="layui-form-item">
                                <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                    <textarea id="CfetsBondDealQuotedPriceMuti001_remark" name="remark" maxlength="200" th:text="${entity?.remark}"
                                              class="layui-textarea" placeholder="请输入内容"
                                              th:placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pro-module">
                <h3 class="pro-module-title">
                    <span class="title-des" data-th-utext="#{BussRepoSecPtl.ptlDistribution}">组合分配</span>
                    <i class="iconfont icon-arrow-down pro-down-icon"></i>
                </h3>

                <div class="layui-form-item" id = "distributionMuti001_DIV" style="display:none;">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                               data-th-utext="#{BussRepoSecPtl.distribution}">分配方式</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="cfetsQuoTedCommon_distribution"
                                    class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    allowClear="true" formatoption="true"
                                    data-th-data-result='${DISTRIBUTION}'>
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <a  id="cfetsQuoTedCommon_btn_autoAllocation"  class="layui-btn layui-btn-sm"> 计算 </a>
                        &nbsp;&nbsp;&nbsp;&nbsp;
                        <a id="CfetsQuotedCommon001_dzh_add_btn" class="layui-btn layui-btn-sm" >添加</a>
                    </div>
                </div>
                <div class="pro-module-item pro-item-wrap">
                    <div><!-- 对话报价 -->
                        <div>
                            <table class="layui-table" id="cfetsQuoTedCommonTable"
                                   name="cfetsBondDealDialogueQuoteDtoList"></table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                <div class="text-center" style="display: none;">
                    <a id="EtribBondInfo003_btn_fileupload" class="layui-btn layui-btn-sm"
                       data-th-text="#{EtribBondInfo003.fileUpload}">附件上传</a>
                    <a id="EtribBondInfo003_btn_riskcal" class="layui-btn layui-btn-sm"
                       data-th-text="#{EtribBondInfo003.riskcal}">风险试算</a>
                    <a id="EtribBondInfo003_btn_save" class="layui-btn layui-btn-sm btn-save" style="display: none;"
                       data-th-text="#{SysCommon.save}">保存</a>
                    <a id="EtribBondInfo003_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                       style="display: none;"
                       data-th-text="#{SysCommon.submit}">提交</a>
                </div>
                <div id="baseRiskMathComm" class="page-component" style="display: none;"
                     th:data-path="@{/component/common/BaseRiskMathComm/init}"
                     th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
                <div id="fileUpload" class="page-component" style="display: none;"
                     th:data-path="@{/component/core/FileCommon/init}"
                     th:data-params="|{entityName: 'FileCommon',businessId?: ''}|"></div>
            </div>

        </form>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var mySideTrader = /*[[${mySideTrader}]]*/'';
        var counterTrader = /*[[${counterTrader}]]*/'';
        var ouTraderIdCanEditFlag = /*[[${ouTraderIdCanEditFlag}]]*/'';
        var ACCOUNT_SPEED_0 = /*[[${ACCOUNT_SPEED_0}]]*/'';
        var ACCOUNT_SPEED_1 = /*[[${ACCOUNT_SPEED_1}]]*/'';
        var ACCOUNT_SPEED_2 = /*[[${ACCOUNT_SPEED_2}]]*/'';
        var calcTypeUnitCprice = /*[[${calcTypeUnitCprice}]]*/'';
        var calcTypeYield = /*[[${calcTypeYield}]]*/'';
        var calcTypeExecYield = /*[[${calcTypeExecYield}]]*/'';
        var yesNoFlag_yes = /*[[${yesNoFlag_yes}]]*/'';
        var assetTypeOne_abs = /*[[${assetTypeOne_abs}]]*/'';
        var ibuFlag_startDialogueQuoteWithNoEntrust = /*[[${ibuFlag_startDialogueQuoteWithNoEntrust}]]*/'';
        var mySideInit = /*[[${entity?.mySide}]]*/'';
        var mySideTraderInit = /*[[${entity?.mySideTrader}]]*/'';
        var PRICE_MODEL = /*[[${PRICE_MODEL}]]*/'';
        var PRICE_MODEL_PRM01 = /*[[${PRICE_MODEL_PRM01}]]*/'';
        var workflowId = /*[[${workflowId}]]*/'';
        var assetTypeOne = /*[[${assetTypeOne}]]*/'';
        var quotaPageModel = /*[[${quotaPageModel}]]*/'';
        var CCY_CNY = /*[[${CCY_CNY}]]*/'';
        var cfetsBondDealDialogueQuoteDtoList = /*[[${cfetsBondDealDialogueQuoteDtoList}]]*/'';
    </script>
    <script data-th-src="@{/js/component/autocoupon/AutoCoupon.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/bankuplink/bond/CfetsBondDealQuotedPriceMuti001.js}" type="text/javascript"></script>
</div>
</body>
</html>
