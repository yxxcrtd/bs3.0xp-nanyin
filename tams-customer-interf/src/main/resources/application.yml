server:
  port: 28080
  address: 0.0.0.0
#主配置文件，配置了这个会优先读取里面的属性覆盖主配置文件的属性
spring:
  jmx:
    enabled: false
  profiles:
    active: dev #非微服务使用 yitihua-jicheng
  application:
    name: customerInterfService #服务名称
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    driverClassName: oracle.jdbc.driver.OracleDriver
    validationQuery: SELECT 1 FROM DUAL

application:
  cache:
    file: classpath:ehcache_customInterf.xml
---
spring:
  profiles: dev
  thymeleaf:
    cache: false
  datasource:
    url: jdbc:oracle:thin:@(DESCRIPTION=(ADDRESS_LIST=(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.90.111)(PORT=1521))(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.90.112)(PORT=1521))(LOAD_BALANCE=no)(FAILOVER=on))(CONNECT_DATA=(SERVICE_NAME=tamsdbpdb)))
    username: tams212
    password: tams212
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.jdbc.ReadTimeout=50000
shiro:
  casEnable: false
  allowUrl: /interf/**
  jwtEnable: true #非微服务配置为false
base:
  datasource:
    url: jdbc:oracle:thin:@(DESCRIPTION=(ADDRESS_LIST=(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.90.111)(PORT=1521))(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.90.112)(PORT=1521))(LOAD_BALANCE=no)(FAILOVER=on))(CONNECT_DATA=(SERVICE_NAME=tamsdbpdb)))
    username: tams212
    password: tams212
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.jdbc.ReadTimeout=50000
log:
  path: /home/tams/logs/service/tams-interf
  level: INFO
#在INFO 级别下使用mybatis的自定义日志工具打印sql至控制台（不输出到日志文件）
#mybatis:
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
eureka:
  client:
    enabled: true #是否启用eureka客户端，如果启用，则需要有eureka服务器，默认为true
    serviceUrl:
      defaultZone: http://127.0.0.1:8761/eureka/
  instance:
    ip-address: 127.0.0.1 #填写本地IP地址  生产配置主机名hostname
    prefer-ip-address: false # true时获取第一个虚拟网卡的IP地址，可能是个虚拟IP导致无法访问

jixu:
  datasource:
    driverClassName: oracle.jdbc.driver.OracleDriver
    url: jdbc:oracle:thin:@(DESCRIPTION=(ADDRESS_LIST=(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.90.111)(PORT=1521))(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.90.112)(PORT=1521))(LOAD_BALANCE=no)(FAILOVER=on))(CONNECT_DATA=(SERVICE_NAME=tamsdbpdb)))
    username: tams212
    password: tams212
    defaultSchema: tams212
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.jdbc.ReadTimeout=50000
  #用户系统
  #1 jixu用户系统
  #2 joyin用户系统
  #3 joyinBatch用户系统
  user:
    type: 3

  #是否使用和joyin整合后的缩表版本,该参数为临时存在，在尚未完成缩表结构前,测试人员还是测试用原表进行功能测试
  #true 精简锁表版本
  #false 使用原始的jixu表结构
  joyintables:
    flag: true

  #主配置文件，配置了这个会优先读取里面的属性覆盖主配置文件的属性
  ##目标数据库的类型
  #Oracle=11;
  #MySQL=12;
  #SQLServer=13;
  #DB2=14;
  #Access=15;
  adapter:
    targetDB:
      dbType: 11

  ##activemq数据源配置
  activeMQ:
    serverURL: localhost
    serverPort: 61616
    username: admin
    password: admin
    maxCon: 100
    defaultDestinationName: jixuqueue

  ##是否同步数据到数据中心
  #0:不同步
  #1:同步数据
  #如果在StartDate和EndDate输入日期,则是同步一段区间内的数据
  #默认都是空,则是同步做账日的数据
  #DataCenter.StartDate=2017-07-19
  dataCenter:
    synchFlag: 0
    startDate:
    endDate:

  ##使用Hibernate或MyBatis框架
  #0:使用Hibernate框架
  #1:使用MyBatis框架
  frameWork:
    flag: 0

  ##0 jixu独立系统
  ##1 jixu调用joyin的主键生成系统
  keyGenerate:
    flag: 0

  #是否需要生成估值表,余额表等报表。外接入其它系统时，不需要几许生成报表
  genValreport:
    flag: false

  ##报表源文件地址
  report:
    reportSourceFolder: D:/apache-tomcat-8.0.52-32bit/wtpwebapps/jixu/reports
    ##生成报表存放地址
    reportExportFolder: D:/PwWorkSpace/jixu/OutputReports
    ##如果前面两个字段是Report.Common,则放入特殊报表池
    ##最后一个字段ValuationReport必须和前端传给后端的报表ID(名字)相匹配
    commonReports:
      ValuationReport: 财务估值表.jasper
      AcctBalanceReport: 科目余额表.jasper
      IncomeReport: 利润表.jasper
      AssetBalanceReport: 资产负债表.jasper
      FundCustodyFee: 基金托管费.jasper
      CustodyFeesChild: 托管费子表.jasper
      YGZTaiZhang: 营改增台账.jasper
