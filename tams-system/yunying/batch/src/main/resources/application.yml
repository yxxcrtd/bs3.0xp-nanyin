server:
  port: 8084
  address: 0.0.0.0
spring:
  application:
    name: BATCH-SERVER #服务名称
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  profiles:
    active: dtx1    #一体化使用yitihua-jicheng
  thymeleaf:
    cache: false
  #数据源配置
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    driverClassName: oracle.jdbc.driver.OracleDriver
    validationQuery: SELECT 1 FROM DUAL
    testOnBorrow: true
    testOnReturn: true
    testOnCreate: true
    testWhileIdle: true
    minEvictableIdleTimeMillis: 1800000
    removeAbandonedTimeout: 300
    initialSize: 10
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 600000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: false
  activemq:
    active: false
    systemId: valuation_batch
    brokerUrl: tcp://localhost:61616
    user: system
    password: manager
    maximumRedeliveries: 10
    initialRedeliveryDelay: 1
    backOffMultiplier: 2
    useExponentialBackOff: true
    maximumRedeliveryDelay: -1
#base数据源配置  
base:
  datasource:
    driverClassName: oracle.jdbc.driver.OracleDriver
    validationQuery: SELECT 1 FROM DUAL
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
  casEnable: false        
#interf数据源配置
interf:
  datasource:
    driverClassName: oracle.jdbc.driver.OracleDriver
    validationQuery: SELECT 1 FROM DUAL
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    testWhileIdle: true
    type: org.apache.commons.dbcp2.BasicDataSource
#用户系统
#1 jixu用户系统
#2 joyin用户系统
#3 joyinBatch用户系统
jixu:
  user:
    type: 3
#应用配置
application:
  chb:
    #由于一二期直连调用组件包，组件包不能访问缓存，故在此配置同三期一致的路径
    filepath: /home/tams/svr_nb_prod/sharedata/chb/send/CB/
    #由于一二期直连调用组件包，组件包不能访问缓存，故在此配置同三期一致的路径
    download-file-path: /home/tams/svr_nb_prod/sharedata/chb/recive/CB/
    maxSqlNum: 1000
    msg-start-time: 0600
    msg-end-time: 2200
    reportCbFeedBackHandleCountOneTime: 10000
    isExceptionWhenSendTimeout: 01
  cache:
    file: classpath:ehcache_batch.xml
  sysCode: TAMS
  sessionTimeout: 1800000 #超时自动退出
  interfMaxCorePoolSize: 20 #上游接口解析读取文件处理最大线程数
  maxDataCountOneTimeForInvestholdInfo : 50 #上游接口解析读取文件处理中持有信息批量查询单次最大查询主键数（江苏银行50）
  reportInterfIsNeedOkFile: 01 #上游接口解析读取文件处理中，是否需要.ok传输完成标志文件（1：需要 0：不需要）
  reportInterfOkFileExtension: ok #上游接口解析读取文件处理中，传输完成标志文件的扩展名（默认为ok）
  reportInsertCount: 15 #数据批量一次性insert条数
  reportSelectOrDeleteCount: 50 #数据批量一次查询或者删除条数
  reportSelectOrDeleteCountForShenFen: 100 #数据批量一次查询或者删除条数(身份信息用)
  reportInsertLongCount: 10 #数据批量一次性insert条数(单条数据字段较多)
  reportInterfFileEncoding: UTF-8 #上游接口文件编码格式
  reportInterfOneTimeDataCount: 1000 #上游接口解析读取文件处理,单线程处理数据条数
  reportInterfOneTimeSqlLdrDataCount: 200000 #上游接口解析读取文件处理,单次sqlldr处理最大数据条数
  reportInterfOneTimeSqlLdrCommitCount: 10000 #上游接口解析读取文件处理,单次sqlldr处理单次提交数
  reportInterfSplitCharacter: '|' #上游txt文件解析分割符
  reportCbFeedBackHandleCountOneTime: 10000 #中债反馈文件内容单次处理数据条数
batch:
  properties:
    chunkNumber: 100 #writer提交频率
    concurrency: 20 #processor并发数
    queueCapacity: 20 #任务组信息最大队列数
    maxJobPoolSize: 5 #job线程池
    maxExeUser: 2 #最大并发用户数
    maxThreadPerUser: 5 #任务并发数
    sleeptime: 20000 #轮询时间
    maxSqlNum: 50 #批量提交数
    needProcessLog: false #process是否记录正常日志
    enableServerDoubleAlive: false #是否启用双活
    serverName: SERVER1 #服务器名称
    serverDownTime: 600000 #判断已经宕机的时间（毫秒） 数据库服务器当前时间与上次更新时间对比，如果毫秒数超过这个设置，认为宕机
    notifyIntervalTime: 30000 #通知没有宕机的时间间隔， 服务器单独线程，间隔这个毫秒刷新SYS_SERVER_PRI的UPDATE_TIME，标识没有宕机
threadpool:
  corePoolSize: 20 #核心线程数
  maxPoolSize: 600 #最大线程数
  queueCapacity: 600 #线程队列大小
  keepAliveSeconds: 60 #线程池维护线程所允许的空闲时间（秒）
  namePrefix: batch-thread- #线程池中的线程的名称前缀

