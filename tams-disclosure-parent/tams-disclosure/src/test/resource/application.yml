  reportInterfOneTimeDataCount: 1000 #上游接口解析读取文件处理,单线程处理数据条数
  reportInterfOneTimeSqlLdrDataCount: 200000 #上游接口解析读取文件处理,单次sqlldr处理最大数据条数
