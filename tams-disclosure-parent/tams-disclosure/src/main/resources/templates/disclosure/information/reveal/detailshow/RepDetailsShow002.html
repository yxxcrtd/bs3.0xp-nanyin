<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="~{layout/default}">
<body>
<div layout:fragment="content">
	<div id="showtable"></div>
</div>
</body>
<div layout:fragment="script">
	<script data-th-src="@{/js/disclosure/report.js}" type="text/javascript"></script>
	<script data-th-inline="javascript" type="text/javascript">
		var repId = [[${repId}]];
		var uri = [[${uri}]];

		function showTable(){
			$("#showtable").append("加载中");
			var $container = $("#showtable");

			Joyin.ajax(basePath + 'disclosure/information/reveal/detailshow/RepDetailsShow001/previewReport', {repid:repId,uri:uri}, function(result) {
				$container.html(result);
			});
		}

		$(function () {
			/**
			 * 画面加载完成
			 */
			$(function() {
				showTable();
			});
		});
	</script>
</div>
</html>
