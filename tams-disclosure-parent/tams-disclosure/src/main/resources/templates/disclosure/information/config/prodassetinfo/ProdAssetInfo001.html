<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{ProdAssetInfo001}">产品资产组合情况维护</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="form-button-area">
                <a id="ProdAssetInfo001_btn_add" class="layui-btn layui-btn-sm btn-create"
                    data-th-text="#{SysCommon.create}">新建</a>
                <a id="ProdAssetInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default"
                    data-th-text="#{SysCommon.delete}" style="display: none;">删除</a>
                <a id="ProdAssetInfo001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
            </div>
            <div class='joyin-form-wrap joyin-filter-form condition-area'>
                <form class="layui-form" id="searchForm">
                    <input type="hidden" id="finprodIds">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">产品主代码</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" name="prodId" id="prodId"
                                        class="layui-input form-input input-select" allowClear="true"
                                        placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        formatoption=true multiple="true"
                                        data-th-data-url="@{/disclosure/information/config/prodassetinfo/ProdAssetInfo001/queryProdIdInfo}">
                                </select>
                            </div>
                            <div class="layui-inline">
                                <button type="button" class="layui-btn layui-btn-sm btn-default"
                                        id="ProdAssetInfo001_btn_treeAdd" style="
										text-align: center;
    									width: 30px;
    									height: 24px;
    									line-height: 24px;
    									position: absolute;
    									top: -9px;
    									right: -35px;
    									z-index:2;">
                                    <i class="iconfont icon-add"></i>
                                </button>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">生效日</label>
                            <div class="layui-input-inline input-inline">
                                <input id="effDate" name='effDate'
                                       class="layui-input form-input input-dateRangeSelect"
                                       placeholder="请选择时间区间"
                                       data-th-placeholder="#{SysCommon.placeholder}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">生效截止日期</label>
                            <div class="layui-input-inline input-inline">
                                <input id="effEndDate" name='effEndDate'
                                       class="layui-input form-input input-dateRangeSelect"
                                       placeholder="请选择时间区间"
                                       data-th-placeholder="#{SysCommon.placeholder}">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">数据状态</label>
                            <div class="layui-input-inline input-inline">
                                <select id="dataStatus"
                                        name="dataStatus"
                                        class="input-select"
                                        data-th-data-result='${DIS_DATA_STATUS_ED}'
                                        placeholder="请选择"
                                        data-th-initvalue="${dataStatus}"
                                        allowClear="true"
                                        data-th-placeholder="#{SysCommon.selectplaceholder}">
                                </select>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/disclosure/information/config/prodassetinfo/ProdAssetInfo001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
