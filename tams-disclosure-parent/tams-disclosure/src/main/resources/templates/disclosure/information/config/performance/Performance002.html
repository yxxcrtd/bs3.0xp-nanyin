<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<html>
<head>
    <title data-th-text="产品业绩比较基准新建"></title>
    <style>
        .mst-lable{
            width: 30%;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <input type="hidden" name="uuid" id="uuid" data-th-value="${entity?.uuid}"/>
            <!--            <input type="hidden" name="workflowId" id="workflowId" data-th-value="${entity?.workflowId}"/>-->
            <input type="text" id="expDateO" name="expDateO" class="layui-input form-input" data-th-value='${#dates.format(entity?.expDateO,"yyyy-MM-dd")}' style = "display: none">
            <input type="text" id="effDateO" name="effDateO" class="layui-input form-input" data-th-value='${#dates.format(entity?.effDateO,"yyyy-MM-dd")}' style = "display: none">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-label-wrap mst-lable" style="width: 40% !important;" data-th-text="#{ProElementAdj001.prodId}">子产品代码</label>
                                    <div class="layui-input-inline input-inline" style="width: 20% !important;">
                                        <select id="prodId" name="prodId" class="input-select"
                                                data-th-initValue="${entity?.prodId}" formatoption="true" data-selection="id"
                                                data-th-data-url="@{/disclosure/information/config/performance/Performance001/getProdIdlist}"
                                                placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                                                allowClear="true" required>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-label-wrap mst-lable" style="width: 40% !important;"
                                           data-th-text="业绩比较基准生效日">业绩比较基准生效日</label>
                                    <div class="layui-input-inline input-inline" style="width: 20% !important;">
                                        <input id="effDate" name="effDate"
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间"
                                               data-th-value="${#dates.format(entity?.effDate,'yyyy-MM-dd')}"
                                               required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-label-wrap mst-lable" style="width: 40% !important;"
                                           data-th-text="业绩比较基准生效截止日">业绩比较基准生效截止日</label>
                                    <div class="layui-input-inline input-inline" style="width: 20% !important;">
                                        <input id="expDate" name="expDate"
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间"
                                               data-th-value="${#dates.format(entity?.expDate,'yyyy-MM-dd')}"
                                               required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-label-wrap mst-lable" style="width: 40% !important;"
                                           data-th-text="#{Performance001.zzxz}">中债新综合全价指数收益率</label>
                                    <div class="layui-input-inline input-inline" style="width: 20% !important;">
                                        <input type="text" id="zzqj" name="zzqj"
                                               onkeyup="if(this.value < 0){
                                                       this.value= 0;
                                                   }else if (value > 100) {
                                                    this.value= '';
                                                  }else{
                                                      this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/) // 只能输入小数点后2位
                                                   }"
                                               data-th-value='${entity?.zzqj}' required
                                               class="layui-input form-input text-number" data-textrange='2'
                                               placeholder="请输入内容">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-label-wrap mst-lable" style="width: 40% !important;"
                                           data-th-text="#{Performance001.zzxzh}">中债新综合财富指数（1-3年）收益率【系数】</label>
                                    <div class="layui-input-inline input-inline" style="width: 20% !important;">
                                        <input type="text" id="zzcf" name="zzcf"
                                               onkeyup="if(this.value < 0){
                                                       this.value= 0;
                                                   }else if (value > 100) {
                                                    this.value= '';
                                                  }else{
                                                      this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/) // 只能输入小数点后2位
                                                   }"
                                               data-th-value="${entity?.zzcf}" data-textrange="2" required placeholder="请输入内容"
                                               class="layui-input form-input text-number" >
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-label-wrap mst-lable" style="width: 40% !important;"
                                           data-th-text="#{Performance001.zzzs}">中证500指数收益率【系数】</label>
                                    <div class="layui-input-inline input-inline" style="width: 20% !important;">
                                        <input type="text" id="zz500" name="zz500"
                                               onkeyup="if(this.value < 0){
                                                       this.value= 0;
                                                   }else if (value > 100) {
                                                    this.value= '';
                                                  }else{
                                                      this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/) // 只能输入小数点后2位
                                                   }"
                                               data-th-value='${entity?.zz500}' required
                                               class="layui-input form-input text-number" data-textrange='2'
                                               placeholder="请输入内容">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-label-wrap mst-lable" style="width: 40% !important;"
                                           data-th-text="#{Performance001.hszs}">沪深300指数收益率【系数】</label>
                                    <div class="layui-input-inline input-inline" style="width: 20% !important;">
                                        <input type="text" id="hs300" name="hs300"
                                               onkeyup="if(this.value < 0){
                                                       this.value= 0;
                                                   }else if (value > 100) {
                                                    this.value= '';
                                                  }else{
                                                      this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/) // 只能输入小数点后2位
                                                   }"
                                               data-th-value='${entity?.hs300}' required
                                               class="layui-input form-input text-number" data-textrange='2'
                                               placeholder="请输入内容">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="layui-form-item">
            <div align="center" style="height:50px;padding-top: 10px;">
                <a id="Performance002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="Performance002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="Performance002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var workflowId = /*[[${workflowId}]]*/'';
        var expDateO = /*[[${expDateO}]]*/'';
        var effDateO = /*[[${effDateO}]]*/'';
    </script>
    <script data-th-src="@{/js/disclosure/information/config/performance/Performance002.js}" type="text/javascript"></script>
</div>
</body>
</html>
