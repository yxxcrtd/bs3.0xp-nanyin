<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorator="~{layout/default}">
<head>
	<title>新建产品分红到期计划</title>
</head>
<body>
<div layout:fragment="content">
	<form class="layui-form joyin-form-wrap" id="submitForm"
		  style="background: #ffffff; padding: 10px 0;">

		<div class="layui-form-item" style="display: none;">
<!--			<input id="operateType" name="operateType" class="layui-input form-input" placeholder="请输入"  data-th-value="${entity?.operateType}"> -->
			<input id="bonusPlanId" name="bonusPlanId" class="layui-input form-input" placeholder="主键id"  data-th-value="${entity?.bonusPlanId}">
<!--			<input id="priId"  name="priId" class="layui-input form-input" data-th-value="${priId}" placeholder="主键id">-->
		</div>

		<div class="layui-form-item">
			<div class="layui-inline layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11">
				<label class="layui-form-label form-lable" >子产品代码<i class="iconfont must" style="display: inline;">*</i></label>
				<div class="layui-input-inline input-inline">
					<select id="prodId" name="prodId"
							class="layui-input form-input input-select" placeholder="请选择"
							data-th-data-url='@{/disclosure/information/config/prodbonusplanmanage/ProdBonusplanManager002/getPrdInfoSelect}'
							allowClear="true"
							data-th-initValue='${entity?.prodId}'>
					</select>
				</div>

			</div>

		</div>
		<div class="layui-form-item">
			<div class="layui-inline layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11">
				<label class="layui-form-label form-lable" >
					产品名称<i class="iconfont must" style="display: inline;">*</i></label>
				<div class="layui-input-inline input-inline">
					<input type="text" id="prodName" name="prodName" placeholder=""
						   class="layui-input form-input"
						   data-th-Value="${entity?.prodName}" required disabled="disabled">
				</div>
			</div>
		</div>

		<div class="layui-form-item">
			<div class="layui-inline layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11">
				<label class="layui-form-label form-lable" >
					分红方式<i class="iconfont must" style="display: inline;">*</i></label>
				<div class="layui-input-inline input-inline">
					<select id="bonusMode" name="bonusMode" class="layui-input form-input input-select"
							placeholder="请选择" data-th-data-result='${DIS_BONUS_MODE}'
							data-th-initvalue="${entity?.bonusMode}" allowClear="true">
					</select>
				</div>

			</div>
		</div>

		<div class="layui-form-item">
			<div class="layui-inline layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11">
				<label class="layui-form-label form-lable required" >
					收益分配基准日<i class="iconfont must" style="display: inline;">*</i>
				</label>
				<div class="layui-input-inline input-inline">
					<input id="settDate" name="settDate" placeholder="请选择时间" type="datetime"
						   data-th-Value="${entity?.settDateStr}"
						   class="layui-input form-input input-dateSelect" value="" lay-verify="required"
						   autocomplete="off" lay-key="1" title="日期格式 [yyyy-MM-dd]">
					<div class="time-icon"><i class="iconfont icon-date"></i></div>
				</div>
			</div>
		</div>
		<div class="layui-form-item">
			<div class="layui-inline layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11">
				<label class="layui-form-label form-lable" >
					现金红利发放日<i class="iconfont must" style="display: inline;">*</i></label>
				<div class="layui-input-inline input-inline">
					<input id="paymentDate" name="paymentDate" placeholder="请选择时间" type="datetime"
						   data-th-Value="${entity?.paymentDateStr}"  required
						   class="layui-input form-input input-dateSelect" value=""
						   autocomplete="off" lay-key="2" title="日期格式 [yyyy-MM-dd]">
					<div class="time-icon"><i class="iconfont icon-date"></i></div>
				</div>
			</div>
		</div>


		<div class="layui-form-item">
			<div class="layui-inline layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11">
				<label class="layui-form-label form-lable" >
					业绩报酬<i class="iconfont must" style="display: inline;">*</i></label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="achievement" name="achievement" placeholder=""
							   class="layui-input form-input "
							   maxLength="200"
							   data-th-Value="${entity?.achievement}" >
				</div>
			</div>
		</div>

		<div class="layui-form-item">
			<div class="layui-inline layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11">
				<label class="layui-form-label form-lable" >
					超额业绩报酬收取比例（%）<i class="iconfont must" style="display: inline;">*</i></label>
				<div class="layui-input-inline input-inline">
					<input type="text" id="excessAchievementProp" name="excessAchievementProp" placeholder=""
						   class="layui-input form-input " maxLength="5"
						   onkeyup="if(this.value < 0){
							   this.value= 0;
						   }else if (value >= 100) {
							this.value= 100;
						  }else{
							  this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/) // 只能输入小数点后两位
						   }"
						   data-th-Value="${entity?.excessAchievementProp}" >
				</div>
			</div>
		</div>

		<div class="layui-form-item">
			<div class="layui-inline layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11">
				<label class="layui-form-label form-lable" >
					业绩比较基准<i class="iconfont must" style="display: inline;">*</i></label>
				<div class="layui-input-inline input-inline">
					<input type="text" id="achievementBasis" name="achievementBasis" placeholder=""
						   class="layui-input form-input "
						   maxLength="100"
						   data-th-Value="${entity?.achievementBasis}" >
				</div>
			</div>
		</div>

		<div class="layui-form-item">
			<div class="layui-inline layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11">
				<label class="layui-form-label form-lable" >
					业绩比较基准比例（%）<i class="iconfont must" style="display: inline;">*</i></label>
				<div class="layui-input-inline input-inline">
					<input type="text" id="achievementBasisProp" name="achievementBasisProp" placeholder=""
						   class="layui-input form-input "
						   maxLength="5"
						   onkeyup="if(this.value < 0){
							   this.value= 0;
						   }else if (value >= 100) {
							this.value= 100;
						  }else{
							  this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/) // 只能输入小数点后两位
						   }"
						   data-th-Value="${entity?.achievementBasisProp}" >
				</div>
			</div>
		</div>


		<div class="layui-col-md11" style="margin: 50px;">
			<div class="text-center">
				<a id="ProdBonusplanManager002_btn_save"
				   class="layui-btn layui-btn-sm btn-save"
				   data-th-text="#{SysCommon.save}">保存</a> <a
					id="ProdBonusplanManager002_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</div>

	</form>

</div>
<div layout:fragment="script">
	<script th:inline="javascript" type="text/javascript">
		var indexName = /*[[${indexName}]]*/'';
		var priId = /*[[${priId}]]*/'';
		//$("#priId").val(priId);
	</script>
	<script
			data-th-src="@{/js/disclosure/information/config/prodbonusplanmanage/ProdBonusplanManager002.js}"
			type="text/javascript"></script>
</div>
</body>
</html>
