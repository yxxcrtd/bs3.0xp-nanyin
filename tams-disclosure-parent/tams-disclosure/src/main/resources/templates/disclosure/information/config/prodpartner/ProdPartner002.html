<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title>合作机构信息新建</title>
    <style>
        .mst-lable{
            width: 20%;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="layui-form-item">
                    <div >
                        <input type="text" id="prodPartenerId" name="prodPartenerId" class="layui-input form-input" data-th-value="${entity?.prodPartenerId}" style = "display: none">
                        <label class="layui-form-label form-lable mst-lable">产品全称</label>
                        <div class="layui-input-inline input-inline">
                            <select id="prodName" name="prodName"
                                    class="layui-input form-input input-select"
                                    data-th-data-url="@{/disclosure/information/config/prodpartner/ProdPartner001/queryProdIdInfo}"
                                    required="required" allowClear="true" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" searchable="true"
                                    data-th-initValue='${entity?.prodId}'>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable">产品主代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input"
                                   data-th-placeholder="#{SysCommon.placeholder}" id="prodId"
                                   name="prodId" data-th-value="${entity?.prodId}" disabled required="required"/>
                        </div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable">合作机构</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input"
                                   data-th-placeholder="#{SysCommon.placeholder}" id="partnerName"
                                   name="partnerName" data-th-value="${entity?.partnerName}" required="required"/>
                        </div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable">生效日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="effDate" name="effDate"
                                   class="layui-input form-input input-dateSelect" required="required"
                                   data-th-value='${#dates.format(entity?.effDate,"yyyy-MM-dd")}'
                                   placeholder="请选择时间">
                        </div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable">生效日截止日期</label>
                        <div class="layui-input-inline input-inline">
                            <input id="effEndDate" name="effEndDate"
                                   class="layui-input form-input input-dateSelect" required="required"
                                   data-th-value='${#dates.format(entity?.effEndDate,"yyyy-MM-dd")}'
                                   placeholder="请选择时间">
                        </div>
                    </div>
                </div>
            </form>
            <div class="layui-col-md10" style="margin:30px 0;">
                <div class="text-center">
                    <a id="ProdPartner002_btn_save" class="layui-btn layui-btn-sm btn-save"
                       data-th-text="#{SysCommon.save}">保存</a>
                    <a id="ProdPartner002_btn_submit"
                       class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                    <a id="ProdPartner002_btn_cancel"
                       class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/disclosure/information/config/prodpartner/ProdPartner002.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
