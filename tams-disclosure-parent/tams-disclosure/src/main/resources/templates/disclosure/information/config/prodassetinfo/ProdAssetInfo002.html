<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title>产品资产组合新建</title>
    <style>
        .form-inline-wrap{
            width: 49%;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <div class="pro-module-item">
                                <input type="text" id="prodAssetId" name="prodAssetId" class="layui-input form-input" data-th-value="${entity?.prodAssetId}" style = "display: none">
                                <div class="layui-form-item">
                                        <div class="form-inline-wrap" style="width:49%">
                                            <label class="layui-form-label form-label-wrap mst-lable" style="width:40%">产品名称</label>
                                            <div class="layui-input-inline input-inline" style="width:50%">
                                                <select id="prodName" name="prodName"
                                                        class="layui-input form-input input-select"
                                                        data-th-data-url="@{/disclosure/information/config/prodassetinfo/ProdAssetInfo001/queryProdIdInfo}"
                                                        required="required" allowClear="true" placeholder="请输入内容"
                                                        data-th-placeholder="#{SysCommon.placeholder}" searchable="true"
                                                        data-th-initValue='${entity?.prodId}'>
                                                </select>
                                            </div>
                                    </div>

                                    <div class="form-inline-wrap" style="width:49%">
                                        <label class="layui-form-label form-label-wrap mst-lable" style="width:40%">产品主代码</label>
                                        <div class="layui-input-inline input-inline" style="width:50%">
                                            <input type="text" class="layui-input form-input"
                                                   data-th-placeholder="#{SysCommon.placeholder}" id="prodId"
                                                   name="prodId" data-th-value="${entity?.prodId}" disabled required="required"/>
                                        </div>
                                    </div>
                                </div>

                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style="width:49%">
                                        <label class="layui-form-label form-label-wrap mst-lable" style="width:40%">穿透前固定收益类资产占总资产比例</label>
                                        <div class="layui-input-inline input-inline" style="width:50%">
                                            <input type="text" id="fixPreRatio" name="fixPreRatio"
                                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                                   data-th-placeholder="#{SysCommon.placeholder}" required
                                                   data-th-value='${entity?.fixPreRatio}' data-textrange="2" maxlength="10">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style="width:49%">
                                        <label class="layui-form-label form-label-wrap mst-lable" style="width:40%">穿透后固定收益类资产占总资产比例</label>
                                        <div class="layui-input-inline input-inline" style="width:50%">
                                            <input type="text" id="fixAfterRatio" name="fixAfterRatio"
                                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                                   data-th-placeholder="#{SysCommon.placeholder}" required
                                                   data-th-value='${entity?.fixAfterRatio}' data-textrange="2" maxlength="10">
                                        </div>
                                    </div>
                                </div>


                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style="width:49%">
                                        <label class="layui-form-label form-label-wrap mst-lable" style="width:40%">穿透前权益类资产占总资产比例</label>
                                        <div class="layui-input-inline input-inline" style="width:50%">
                                            <input type="text" id="equityPreRatio" name="equityPreRatio"
                                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                                   data-th-placeholder="#{SysCommon.placeholder}" required
                                                   data-th-value='${entity?.equityPreRatio}' data-textrange="2" maxlength="10">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style="width:49%">
                                        <label class="layui-form-label form-label-wrap mst-lable" style="width:40%">穿透后权益类资产占总资产比例</label>
                                        <div class="layui-input-inline input-inline" style="width:50%">
                                            <input type="text" id="equityAfterRatio" name="equityAfterRatio"
                                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                                   data-th-placeholder="#{SysCommon.placeholder}" required
                                                   data-th-value='${entity?.equityAfterRatio}' data-textrange="2" maxlength="10">
                                        </div>
                                    </div>
                                </div>

                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style="width:49%">
                                        <label class="layui-form-label form-label-wrap mst-lable" style="width:40%">穿透前商品及金融衍生品类资产占总资产比例</label>
                                        <div class="layui-input-inline input-inline" style="width:50%">
                                            <input type="text" id="fdPreRatio" name="fdPreRatio"
                                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                                   data-th-placeholder="#{SysCommon.placeholder}" required
                                                   data-th-value='${entity?.fdPreRatio}' data-textrange="2" maxlength="10">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style="width:49%">
                                        <label class="layui-form-label form-label-wrap mst-lable" style="width:40%">穿透后商品及金融衍生品类资产占总资产比例</label>
                                        <div class="layui-input-inline input-inline" style="width:50%">
                                            <input type="text" id="fdAfterRatio" name="fdAfterRatio"
                                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                                   data-th-placeholder="#{SysCommon.placeholder}" required
                                                   data-th-value='${entity?.fdAfterRatio}' data-textrange="2" maxlength="10">
                                        </div>
                                    </div>
                                </div>

                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style="width:49%">
                                        <label class="layui-form-label form-label-wrap mst-lable" style="width:40%">穿透前混合类资产占总资产比例</label>
                                        <div class="layui-input-inline input-inline" style="width:50%">
                                            <input type="text" id="mixPreRatio" name="mixPreRatio"
                                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                                   data-th-placeholder="#{SysCommon.placeholder}" required
                                                   data-th-value='${entity?.mixPreRatio}' data-textrange="2" maxlength="10">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style="width:49%">
                                        <label class="layui-form-label form-label-wrap mst-lable" style="width:40%">穿透后混合类资产占总资产比例</label>
                                        <div class="layui-input-inline input-inline" style="width:50%">
                                            <input type="text" id="mixAfterRatio" name="mixAfterRatio"
                                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                                   data-th-placeholder="#{SysCommon.placeholder}" required
                                                   data-th-value='${entity?.mixAfterRatio}' data-textrange="2" maxlength="10">
                                        </div>
                                    </div>
                                </div>

                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style="width:49%">
                                        <label class="layui-form-label form-label-wrap mst-lable" style="width:40%">生效日</label>
                                        <div class="layui-input-inline input-inline" style="width:50%">
                                            <input id="effDate" name="effDate"
                                                   class="layui-input form-input input-dateSelect" required="required"
                                                   data-th-value='${#dates.format(entity?.effDate,"yyyy-MM-dd")}'
                                                   placeholder="请选择时间">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style="width:49%">
                                        <label class="layui-form-label form-label-wrap mst-lable" style="width:40%">生效日截止日期</label>
                                        <div class="layui-input-inline input-inline" style="width:50%">
                                            <input id="effEndDate" name="effEndDate"
                                                   class="layui-input form-input input-dateSelect" required="required"
                                                   data-th-value='${#dates.format(entity?.effEndDate,"yyyy-MM-dd")}'
                                                   placeholder="请选择时间">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
            <div class="layui-col-md10" style="margin:30px 0;">
                <div class="text-center">
                    <a id="ProdAssetInfo002_btn_save" class="layui-btn layui-btn-sm btn-save"
                       data-th-text="#{SysCommon.save}">保存</a>
                    <a id="ProdAssetInfo002_btn_submit"
                       class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                    <a id="ProdAssetInfo002_btn_cancel"
                       class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/disclosure/information/config/prodassetinfo/ProdAssetInfo002.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
