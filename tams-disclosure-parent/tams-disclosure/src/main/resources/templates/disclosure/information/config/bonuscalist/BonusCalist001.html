<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<html>
<html>
<head>
    <title data-th-text="分红计算清单维护">分红计算清单维护</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin:10px;">
            <a id="BonusCalist001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a>
            <a id="BonusCalist001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default"><i class="iconfont icon-import"></i><span>导入</span></a>
            <a id="BonusCalist001_btn_submit" class="layui-btn layui-btn-sm btn-submit">批量审批</a>
            <a id="BonusCalist001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default" data-th-text="#{SysCommon.delete}">删除</a>
            <a id="BonusCalist001_btn_calculate" class="layui-btn layui-btn-sm  btn-default" data-th-text="产品分红计算">产品分红计算</a>
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
<!--                <input type="hidden" name="redemptionId" id="redemptionId" data-th-value="${entity?.redemptionId}" />-->
                <input type="hidden" id="finprodIds">
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-lable"
                               data-th-text="子产品代码">子产品代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="prodId" name="prodId"
                                    class="layui-input form-input input-select" allowClear="true"
                                    placeholder="请输入"
                                    data-th-placeholder="#{SysCommon.selectplaceholder}"
                                    formatoption=true multiple="true"
                                    data-th-data-url="@{/disclosure/information/config/repProdIndex/RepProdIndex001/queryProdIdInfo}">
                            </select>
                        </div>
                        <div class="layui-inline">
                            <button type="button" class="layui-btn layui-btn-sm btn-default"
                                    id="RepProdIndex001_btn_treeAdd" style="
										text-align: center;
    									width: 30px;
    									height: 24px;
    									line-height: 24px;
    									position: absolute;
    									top: -9px;
    									right: -35px;
    									z-index:2;">
                                <i class="iconfont icon-add"></i>
                            </button>
                        </div>
                    </div>
                        <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="收益分配基准日">收益分配基准日</label>
                            <div class="layui-input-inline input-inline">
                                <input  id="profitBaseDate" name="profitBaseDate" class="layui-input form-input input-dateSelect" placeholder="请选择时间">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="#{ProElementAdj001.dataStatus}">数据状态</label>
                            <div class="layui-input-inline input-inline">
                                <select id="dataStatus" name="dataStatus" class="layui-input form-input input-select" allowClear="true"
                                        data-th-data-result="${MAINTAIN_STATUS}" searchable="false" data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
                    </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/disclosure/information/config/bonuscalist/BonusCalist001.js}" type="text/javascript"></script>
</div>
</body>
</html>
