<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<html>
<head>
    <title data-th-text="">产品费率优惠新增</title>
    <style type="text/css">
        .mst-lable{
            width: 30%;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"> <span class="title-des">基本信息</span> （<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item" >
                            <input type="hidden" id="prodDiscountId" name="prodDiscountId" class="layui-input form-input" placeholder="主键id"  data-th-value="${entity?.prodDiscountId}">
                            <div class="layui-form-item">
                                <div >
                                    <label class="layui-form-label form-lable mst-lable">产品登记编码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="prodRegistNo" name="prodRegistNo" class="input-select"
                                                data-th-initValue="${entity?.prodRegistNo}" formatoption="false"
                                                data-th-data-url="@{/disclosure/information/config/proelementadj/ProElementAdj002/getRegistNo}"
                                                placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                                                allowClear="true" required>
                                        </select>
                                    </div>
                                </div>


                            </div>
                            <div class="layui-form-item">
                                <div >
                                    <label class="layui-form-label form-lable mst-lable" >子产品代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="prodId" name="prodId" class="input-select"
                                                data-th-initValue="${entity?.prodId}"
                                                data-th-data-url="@{/disclosure/information/config/proelementadj/ProElementAdj002/getProdId}"
                                                parentIds="prodRegistNo" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                                                allowClear="true" required>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div >
                                    <label class="layui-form-label form-lable mst-lable">此产品优惠调整描述文字</label>
                                    <div class="layui-input-inline input-inline">
                                        <textarea  maxlength="500" id="prodDisRemark" name="prodDisRemark"
                                               class="layui-textarea" placeholder="一产多费时,此字段未非空必填字段,一费多产时,此字段为空,不必填字段"
                                                th:text="${entity?.prodDisRemark}"
                                                  data-th-value="${entity?.prodDisRemark}"></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div >
                                    <label class="layui-form-label form-lable mst-lable">优惠的费用</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" maxLength="500" id="feename" name="feename"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.feename}"  required>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div >
                                    <label class="layui-form-label form-lable mst-lable" >优惠前费率</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="preFeerate" name="preFeerate"
                                               class="layui-input form-input" placeholder="请输入内容" required
                                               data-th-placeholder="#{SysCommon.placeholder}" maxLength="500"
                                               data-th-value="${entity?.preFeerate}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div >
                                    <label class="layui-form-label form-lable mst-lable" >优惠后费率</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="afterFeerate" name="afterFeerate"
                                               class="layui-input form-input" placeholder="请输入内容" required
                                               data-th-placeholder="#{SysCommon.placeholder}" maxLength="500"
                                               data-th-value="${entity?.afterFeerate}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item" >
                                <div >
                                    <label class="layui-form-label form-lable mst-lable" >优惠起始时间</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="startDate" name="startDate"
                                               class="layui-input form-input"
                                               placeholder="请选择时间" required
                                               data-th-value="${entity?.startDate}" maxLength="500"
                                               data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>

                                <div class="layui-form-item" >
                                    <div  >
                                        <label class="layui-form-label form-lable mst-lable" >优惠截止时间</label>
                                        <div class="layui-input-inline input-inline">
                                            <input id="endDate" name="endDate"
                                                   class="layui-input form-input"
                                                   placeholder="请选择时间" required
                                                   data-th-value="${entity?.endDate}" maxLength="500"
                                                   data-th-placeholder="#{SysCommon.placeholder}"/>
                                        </div>
                                    </div>
                                </div>
                            </div>
<!--                            <div class="layui-form-item">-->
<!--                                <div >-->
<!--                                    <label class="layui-form-label form-lable mst-lable" >本次优惠前费率</label>-->
<!--                                    <div class="layui-input-inline input-inline">-->
<!--                                        <input type="text"  id="thisPreFeerate" name="thisPreFeerate"-->
<!--                                               class="layui-input form-input" placeholder="请输入内容"-->
<!--                                               data-th-placeholder="#{SysCommon.placeholder}" maxLength="500"-->
<!--                                               data-th-value="${entity?.thisPreFeerate}">-->
<!--                                    </div>-->
<!--                                </div>-->
<!--                            </div>-->
<!--                            <div class="layui-form-item">-->

<!--                                <div >-->
<!--                                    <label class="layui-form-label form-lable mst-lable" >本次优惠后费率</label>-->
<!--                                    <div class="layui-input-inline input-inline">-->
<!--                                        <input type="text"  id="thisAfterFeerate" name="thisAfterFeerate"-->
<!--                                               class="layui-input form-input" placeholder="请输入内容"-->
<!--                                               data-th-placeholder="#{SysCommon.placeholder}" maxLength="500"-->
<!--                                               data-th-value="${entity?.thisAfterFeerate}">-->
<!--                                    </div>-->
<!--                                </div>-->

<!--                            </div>-->
<!--                            <div class="layui-form-item">-->
<!--                                <div >-->
<!--                                    <label class="layui-form-label form-lable mst-lable" >本次优惠结束后费率</label>-->
<!--                                    <div class="layui-input-inline input-inline">-->
<!--                                        <input type="text" id="thisEndFeerate" name="thisEndFeerate"-->
<!--                                               class="layui-input form-input" placeholder="请输入内容"-->
<!--                                               data-th-placeholder="#{SysCommon.placeholder}" maxLength="500"-->
<!--                                               data-th-value="${entity?.thisEndFeerate}">-->
<!--                                    </div>-->
<!--                                </div>-->
<!--                            </div>-->
                            <div class="layui-form-item">
                                <div >
                                    <label class="layui-form-label form-lable mst-lable" >对此费率优惠调整描述文字</label>
                                    <div class="layui-input-inline input-inline">
                                        <textarea  maxlength="500" id="feeDisRemark" name="feeDisRemark"
                                               class="layui-textarea" placeholder="一费多产时,此字段未非空必填字段,一产多费时,此字段为空,不必填字段"
                                                th:text="${entity?.feeDisRemark}"
                                                  data-th-value="${entity?.feeDisRemark}"></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div >
                                    <label class="layui-form-label form-lable mst-lable" >报告发布日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="rptIssueDate" name="rptIssueDate"
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间"
                                               data-th-value="${#dates.format(entity?.rptIssueDate,'yyyy-MM-dd')}"
                                               required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="layui-form-item">
            <div align="center" style="height:50px;padding-top: 10px;">
                <a id="ProdFeediscount002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="ProdFeediscount002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="ProdFeediscount002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="script">
    <script data-th-src="@{/js/disclosure/information/config/prodfeediscount/ProdFeediscount002.js}" type="text/javascript"></script>
</div>
</body>
</html>
