<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorator="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>分红表单维护</title>
</head>

<body>
	<div layout:fragment="content">
		<div id="oldBtnDiv" class="form-button-area" >
			<a id="ProdBonusplanManager001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
			<!--<a id="ProdBonusplanManager001_btn_export" class="layui-btn layui-btn-sm btn-export btn-default">导出</a>-->
			<a id="ProdBonusplanManager001_btn_design" class="layui-btn layui-btn-sm btn-create"><i class="iconfont icon-add"></i>新建</a>
			<a id="ProdBonusplanManager001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default" data-th-text="#{SysCommon.delete}">删除</a>

		</div>
        
		<div class="joyin-form-wrap joyin-filter-form condition-area">			
            <form class="layui-form" id="searchForm">
				<input type="hidden" id="finprodIds">
                <div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable" >子产品名称</label>
						<div class="layui-input-inline input-inline">
							<select id="finprodId" name="finprodId"
									class="layui-input form-input input-select" placeholder="请选择"
									data-th-data-url='@{/disclosure/information/config/prodbonusplanmanage/ProdBonusplanManager002/getPrdInfoSelect}'
									allowClear="true"  multiple="multiple" >
							</select>
						</div>
						<div class="layui-inline">
							<button type="button" class="layui-btn layui-btn-sm btn-default"
									id="ProdBonusplanManager001_btn_treeChildrenAdd" style="
										text-align: center;
    									width: 30px;
    									height: 24px;
    									line-height: 24px;
    									position: absolute;
    									top: -9px;
    									right: -35px;
    									z-index:2;">
								<i class="iconfont icon-add"></i>
							</button>
						</div>
					</div>
					<!--<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable" >产品全称</label>
						<div class="layui-input-inline input-inline">
							<select id="finprodId1" name="finprodId1"
									class="layui-input form-input input-select" placeholder="请选择"
									data-th-data-url='@{/disclosure/information/config/disprodplanmanage/DisProdPlanManage002/getMontherAndCommonProdId}'
									allowClear="true"  multiple="multiple" >
							</select>
						</div>
						<div class="layui-inline">
							<button type="button" class="layui-btn layui-btn-sm btn-default"
									id="ProdBonusplanManager001_btn_treeAdd" style="
										text-align: center;
    									width: 30px;
    									height: 24px;
    									line-height: 24px;
    									position: absolute;
    									top: -9px;
    									right: -35px;
    									z-index:2;">
								<i class="iconfont icon-add"></i>
							</button>
						</div>
					</div>-->
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">收益分配基准日</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="settDate" name="settDate"
								   placeholder="请选择日期区间"
								   class="layui-input form-input input-dateRangeSelect"
								   allowClear="true">
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">现金红利发放日</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="paymentDate" name="paymentDate"
								   placeholder="请选择日期区间"
								   class="layui-input form-input input-dateRangeSelect"
								   allowClear="true">
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">分红方式</label>
						<div class="layui-input-inline input-inline">
							<select id="bonusMode" name="bonusMode" class="layui-input form-input input-select"
									placeholder="请选择" data-th-data-result="${DIS_BONUS_MODE}"  allowClear="true"  multiple="multiple">
							</select>
						</div>
					</div>

					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">数据状态</label>
						<div class="layui-input-inline input-inline">
							<select id="dataStatus" name="dataStatus" class="layui-input form-input input-select"
									placeholder="请选择" data-th-data-result="${DIS_DATA_STATUS_ED}" allowClear="true">
							</select>
						</div>
					</div>
				</div>                                            
			</form>
		</div>
		<div style="display: none;">
			<table class="layui-table" id="dataTable"></table>
        </div>
        <div >
			<table class="layui-table" id="dataTable2"></table>
           <!--  <marquee direction="up" behavior="scroll" scrollamount="1" scrolldelay="0" loop="-1" width="1000" height="50" bgcolor="#0099FF" hspace="10" vspace="10"> -->	
        </div>
		<div id="isModelSelect" style="text-align: center;display:none;">
        <a id="ProdBonusplanManager001_btn_submit" class="layui-btn layui-btn-sm btn-submit">确认</a>
             <a id="ProdBonusplanManager001_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>           
        </div>
        <div style="height:20px;"></div>
	</div>
</body>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
		var file = [[${file}]];
	</script>
        <script data-th-inline="javascript" type="text/javascript">
		    var isModelSelect = /*[[${isModelSelect}]]*/;
		    var REPORT_SERVER_URL = [[${REPORT_SERVER_URL}]];
		    var REPORT_USERNAME = [[${REPORT_USERNAME}]];
		    var REPORT_PASSWORD = [[${REPORT_PASSWORD}]];
		    var REPORT_SERVER_PATH = [[${REPORT_SERVER_PATH}]];
		</script>
      <script data-th-src="@{/js/disclosure/report.js}"
            type="text/javascript"></script>
         <script
        data-th-src="@{/js/disclosure/information/config/prodbonusplanmanage/ProdBonusplanManager001.js}"
        type="text/javascript"></script>  
</div>

</html>
