<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorator="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>产品计划排期</title>
</head>

<body>
	<div layout:fragment="content">
		<div id="oldBtnDiv" class="form-button-area"export="false">
			<!--<a id="DisProdPlanManage001_btn_import" class="layui-btn layui-btn-sm btn-create">导入</a>-->
			<a id="DisProdPlanManage001_btn_export" class="layui-btn layui-btn-sm btn-export btn-default">导出</a>
			<a id="DisProdPlanManage001_btn_design" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-add"></i>新建</a>
        </div>
        
		<div class="joyin-form-wrap joyin-filter-form condition-area">			
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">开放期起始日</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="openStartDate" name="openStartDate"
								   placeholder="请选择日期区间"
								   class="layui-input form-input input-dateRangeSelect"
								   allowClear="true">
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">开放期结束日</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="openEndDate" name="openEndDate"
								   placeholder="请选择日期区间"
								   class="layui-input form-input input-dateRangeSelect"
								   allowClear="true">
						</div>
					</div>

					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">运作起始日</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="operationStartDate" name="operationStartDate"
								   placeholder="请选择日期区间"
								   class="layui-input form-input input-dateRangeSelect"
								   allowClear="true">
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">自动赎回日</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="autoRedeemDate" name="autoRedeemDate"
								   placeholder="请选择日期区间"
								   class="layui-input form-input input-dateRangeSelect"
								   allowClear="true">
						</div>
					</div>

					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">数据状态</label>
						<div class="layui-input-inline input-inline">
							<select id="dataStatus" name="dataStatus" class="layui-input form-input input-select"
									placeholder="请选择" data-th-data-result="${DIS_DATA_STATUS}" allowClear="true">
							</select>
						</div>
					</div>
				</div>                                            
			</form>
		</div>
		<div style="display: none;">
			<table class="layui-table" id="dataTable"></table>
        </div>
        <div >
			<table class="layui-table" id="dataTable2"></table>
           <!--  <marquee direction="up" behavior="scroll" scrollamount="1" scrolldelay="0" loop="-1" width="1000" height="50" bgcolor="#0099FF" hspace="10" vspace="10"> -->	
        </div>
		<div id="isModelSelect" style="text-align: center;display:none;">
        <a id="DisProdPlanManage001_btn_submit" class="layui-btn layui-btn-sm btn-submit">确认</a>
             <a id="DisProdPlanManage001_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>           
        </div>
        <div style="height:20px;"></div>
	</div>
</body>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
		var file = [[${file}]];
	</script>
        <script data-th-inline="javascript" type="text/javascript">
		    var isModelSelect = /*[[${isModelSelect}]]*/;
		    var REPORT_SERVER_URL = [[${REPORT_SERVER_URL}]];
		    var REPORT_USERNAME = [[${REPORT_USERNAME}]];
		    var REPORT_PASSWORD = [[${REPORT_PASSWORD}]];
		    var REPORT_SERVER_PATH = [[${REPORT_SERVER_PATH}]];
		</script>
      <script data-th-src="@{/js/disclosure/report.js}"
            type="text/javascript"></script>
         <script
        data-th-src="@{/js/disclosure/information/config/disprodplanmanage/DisProdPlanManage001.js}"
        type="text/javascript"></script>  
</div>

</html>
