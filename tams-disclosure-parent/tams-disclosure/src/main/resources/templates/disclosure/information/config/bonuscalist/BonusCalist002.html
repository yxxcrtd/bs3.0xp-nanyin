<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="分红计算清单新建">分红计算清单新建</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
        <input type="text" id="dataStatus" name="dataStatus" data-th-value='${entity?.status}' hidden>
        <input type="hidden" name="bonusListId" id="bonusListId" data-th-value="${entity?.bonusListId}" />
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="子产品代码">子产品代码</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" id="prodId" name="prodId" data-selection="id"
                            class="layui-input form-input input-select" allowClear="true"
                            placeholder="请输入"
                            data-th-placeholder="#{SysCommon.selectplaceholder}"
                            formatoption=true required  data-th-initValue="${entity?.prodId}"
                            data-th-data-url="@{/disclosure/information/config/repProdIndex/RepProdIndex002/queryProdIdInfo2}">
                    </select>
                </div>
                <div class="layui-inline">
                    <button type="button" class="layui-btn layui-btn-sm btn-default"
                            id="RepProdIndex001_btn_treeAdd" style="
										text-align: center;
    									width: 30px;
    									height: 24px;
    									line-height: 24px;
    									position: absolute;
    									top: -9px;
    									right: -35px;
    									z-index:2;">
                        <i class="iconfont icon-add"></i>
                    </button>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="产品登记编码">产品登记编码</label>
                <div class="layui-input-inline input-inline">
                    <select id="prodRegistNo" name="prodRegistNo" class="input-select"
                            data-th-initValue="${entity?.prodRegistNo}" formatoption="false"
                            data-th-data-url="@{/disclosure/information/config/proelementadj/ProElementAdj002/getRegistNo}"
                            placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                            allowClear="true">
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="产品名称">产品名称</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="prodName" name="prodName"
                           class="layui-input form-input" placeholder="请选择"
                           data-th-value="${entity?.prodName}" disabled="disabled">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="产品资产净值">产品资产净值</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="prodAssets" name="prodAssets" onkeyup="if(this.value < 0){
                                                          this.value= 0;
                                                         }else if (value >= Math.pow(10,15)){
                                                             this.value= '';
                                                         }else{
                                                    this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/)}" data-th-value='${entity?.prodAssets}'
                           class="layui-input form-input text-number"  data-textrange='2' maxlength=18
                           placeholder="请输入内容">
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="#{Bonus002.qmye}">产品期末余额(份额)</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="prodEndBalance" name="prodEndBalance" onkeyup="if(this.value < 0){
                                                          this.value= 0;
                                                         }else if (value >= Math.pow(10,15)){
                                                             this.value= '';
                                                         }else{
                                                    this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/)}"  data-th-value='${entity?.prodEndBalance}'
                           class="layui-input form-input text-number" data-textrange='2' maxlength=18
                           placeholder="请输入内容">
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="单位净值">单位净值</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="unitNum" name="unitNum" onkeyup="if(this.value < 0){
                                                          this.value= 0;
                                                         }else if (value >= Math.pow(10,6)){
                                                             this.value= '';
                                                         }else{
                                                    this.value= value.toString().match(/^\d+(?:\.\d{0,4})?/)}"  data-th-value='${entity?.unitNum}'
                           class="layui-input form-input text-number" data-textrange='4' maxlength=11
                           placeholder="请输入内容" required>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="上一收益分配基准日">上一收益分配基准日</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="lastProfitBaseDate" name="lastProfitBaseDate"
                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-value='${#dates.format(entity?.lastProfitBaseDate,"yyyy-MM-dd")}'
                    >
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="本期收益分配基准日">本期收益分配基准日</label>
                <div class="layui-input-inline input-inline">
                    <input required type="text" id="profitBaseDate" name="profitBaseDate"
                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-value='${#dates.format(entity?.profitBaseDate,"yyyy-MM-dd")}'
                    >
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="运行天数">运行天数</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="runDays" name="runDays" placeholder=""
                           class="layui-input form-input "  lay-verify="integer"
                           onkeyup="value=value.replace(/[^\d]/g,'')"
                           maxlength="10"
                           data-th-Value="${entity?.runDays}" >

                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="可供分配利润">可供分配利润</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="avaiProfit" name="avaiProfit" onkeyup="if(this.value < 0){
                                                          this.value= 0;
                                                         }else if (value >= Math.pow(10,15)){
                                                             this.value= '';
                                                         }else{
                                                    this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/)}" data-th-value='${entity?.avaiProfit}'
                           class="layui-input form-input text-number" data-textrange='2'  maxlength=18 required
                           placeholder="请输入内容">
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="业绩比较基准">业绩比较基准</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" name="perBase" id="perBase"
                           data-th-value="${entity?.perBase}"
                           class="layui-input form-input" placeholder="请输入内容"
                           data-th-placeholder="#{SysCommon.placeholder}">
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="业绩比较基准收益">业绩比较基准收益</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="perBaseProfit" name="perBaseProfit" onkeyup="if(this.value < 0){
                                                          this.value= 0;
                                                         }else if (value >= Math.pow(10,15)){
                                                             this.value= '';
                                                         }else{
                                                    this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/)}" data-th-value='${entity?.perBaseProfit}'
                           class="layui-input form-input text-number" data-textrange='2'  maxlength=18
                           placeholder="请输入内容">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="超出部分">超出部分</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="exceed" name="exceed" onkeyup="if(this.value < 0){
                                                          this.value= 0;
                                                         }else if (value >= Math.pow(10,15)){
                                                             this.value= '';
                                                         }else{
                                                    this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/)}" data-th-value='${entity?.exceed}'
                           class="layui-input form-input text-number" data-textrange='2'  maxlength=18
                           placeholder="请输入内容">
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="业绩报酬">业绩报酬</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="perFee" name="perFee" onkeyup="if(this.value < 0){
                                                          this.value= 0;
                                                         }else if (value >= Math.pow(10,15)){
                                                             this.value= '';
                                                         }else{
                                                    this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/)}" data-th-value='${entity?.perFee}'
                           class="layui-input form-input text-number" data-textrange='2'  maxlength=18
                           placeholder="请输入内容">
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="应分配分红金额">应分配分红金额</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="disBonusMoney" name="disBonusMoney" onkeyup="if(this.value < 0){
                                                          this.value= 0;
                                                         }else if (value >= Math.pow(10,15)){
                                                             this.value= '';
                                                         }else{
                                                    this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/)}" data-th-value='${entity?.disBonusMoney}'
                           class="layui-input form-input text-number" data-textrange='2'  maxlength=18
                           placeholder="请输入内容" required>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="单位分红">单位分红</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="unitBonus" name="unitBonus" onkeyup="if(this.value < 0){
                                                          this.value= 0;
                                                         }else if (value >=  Math.pow(10,13)){
                                                             this.value= '';
                                                         }else{
                                                    this.value= value.toString().match(/^\d+(?:\.\d{0,4})?/)}" data-th-value='${entity?.unitBonus}'
                           class="layui-input form-input text-number" data-textrange='4'  maxlength=18 required
                           placeholder="请输入内容">
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="收益率">收益率</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="yield" name="yield" onkeyup="if(this.value < 0){
                                                          this.value= 0;
                                                         }else if (value >= Math.pow(10,13)){
                                                             this.value= '';
                                                         }else{
                                                    this.value= value.toString().match(/^\d+(?:\.\d{0,4})?/)}" data-th-value='${entity?.yield}'
                           class="layui-input form-input text-number" data-textrange='4'  maxlength=18
                           placeholder="请输入内容">
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
        <div class="text-center">
            <a id="BonusCalist002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="BonusCalist002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="BonusCalist002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/disclosure/information/config/bonuscalist/BonusCalist002.js}" type="text/javascript"></script>
</div>
</body>

</html>
