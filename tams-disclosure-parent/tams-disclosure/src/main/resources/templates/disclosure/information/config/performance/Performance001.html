<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<html>
<html>
<head>
    <title data-th-text="#{Performance001}">产品业绩比较基准维护</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin:10px;">
            <a id="Performance001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a>
            <a id="Performance001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default"><i class="iconfont icon-import"></i><span>导入</span></a>
            <a id="Performance001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default" data-th-text="#{SysCommon.delete}">删除</a>
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <input type="hidden" id="finprodIds">
                <!--                <input type="hidden" name="redemptionId" id="redemptionId" data-th-value="${entity?.redemptionId}" />-->
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{ProElementAdj001.prodId}">子产品名称</label>
                        <div class="layui-input-inline input-inline">
                            <select id="prodId" name="prodId" class="input-select"
                                    data-th-initValue="${entity?.prodId}" formatoption="true" multiple data-selection="id"
                                    data-th-data-url="@{/disclosure/information/config/performance/Performance001/getProdIdlist}"
                                    placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                                    allowClear="true">
                            </select>
                        </div>
                        <div class="layui-inline">
                            <button type="button" class="layui-btn layui-btn-sm btn-default"
                                    id="Performance001_btn_treeChildrenAdd" style="
										text-align: center;
    									width: 30px;
    									height: 24px;
    									line-height: 24px;
    									position: absolute;
    									top: -9px;
    									right: -35px;
    									z-index:2;">
                                <i class="iconfont icon-add"></i>
                            </button>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">生效日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="effDate" name="effDate"
                                   class="layui-input form-input input-dateSelect"
                                   placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"/>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">生效截止日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="expDate" name="expDate"
                                   class="layui-input form-input input-dateSelect"
                                   placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"/>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/disclosure/information/config/performance/Performance001.js}" type="text/javascript"></script>
</div>
</body>
</html>
