<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="产品超额业务报酬信息维护-新建">产品超额业务报酬信息维护-新建</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="子产品代码">子产品代码</label>
                <div class="layui-input-inline input-inline">
                    <select id="prodId" name="prodId" class="input-select"
                            data-th-initValue="${entity?.prodId}"
                            data-th-data-url="@{/disclosure/information/config/repFloatFee/RepFloatFee002/queryProdIdInfo2}"
                            placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                            allowClear="true"
                            formatoption="false" required>
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="产品名称">产品名称</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="prodName" name="prodName"
                           class="layui-input form-input" placeholder="请选择"
                           data-th-value="${entity?.prodName}" disabled="disabled" required>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap"
                       th:text="确认日">确认日</label>
                <div class="layui-input-inline input-inline">
                    <input required type="text" id="affirmDate" name="affirmDate"
                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-value='${#dates.format(entity?.affirmDate,"yyyy-MM-dd")}'
                    >
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">业务代码</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" id="businessCode" name="businessCode"
                           class="layui-input form-input input-select" placeholder="请选择"
                           data-th-placeholder="#{SysCommon.selectplaceholder}"
                           data-th-initValue="${entity?.businessCode}"
                           data-th-data-result='${BUSINESS_CODE}' disabled="disabled" required>
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="确认份额">确认份额</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="affirmNum" name="affirmNum" data-th-value='${entity?.affirmNum}'
                           class="layui-input form-input text-number" onkeyup="if(this.value < 0){
                                                          this.value= 0;
                                                         }else if (value >= 1000000000000000){
                                                             this.value= '';
                                                         }else{
                                                    this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/)}"
                           data-textrange='2' data-fixtype='2' maxlength=18
                           placeholder="请输入内容" required>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="确认金额">确认金额</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="affirmAmt" name="affirmAmt" data-th-value='${entity?.affirmAmt}'
                           class="layui-input form-input text-number"
                           onkeyup="if(this.value < 0){
                                                          this.value= 0;
                                                         }else if (value >= 1000000000000000){
                                                             this.value= '';
                                                         }else{
                                                    this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/)}"
                           data-textrange='2' data-fixtype='2' maxlength=18
                           placeholder="请输入内容" required>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" data-th-text="超额报酬">超额报酬</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="aboveAmt" name="aboveAmt" data-th-value='${entity?.aboveAmt}'
                           class="layui-input form-input text-number"
                           onkeyup="if(this.value < 0){
                                                          this.value= 0;
                                                         }else if (value >= 1000000000000000){
                                                             this.value= '';
                                                         }else{
                                                    this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/)}"
                           data-textrange='2' data-fixtype='2' maxlength=18
                           placeholder="请输入内容" required>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
        <div class="text-center">
            <a id="RepFloatFee002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="RepFloatFee002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="RepFloatFee002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/disclosure/information/config/repFloatFee/RepFloatFee002.js}" type="text/javascript"></script>
</div>
</body>

</html>
