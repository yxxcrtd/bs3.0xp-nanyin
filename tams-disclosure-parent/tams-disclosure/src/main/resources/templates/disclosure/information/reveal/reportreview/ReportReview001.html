<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>报表复核管理</title>
</head>

<body>

</body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
        <button type="button" class="layui-btn layui-btn-sm btn-delete btn-default" id="ReportReview001_btn_back"><i class="iconfont icon-reverse_audit"></i>退回 </button>
        <button type="button" class="layui-btn layui-btn-sm btn-delete btn-default" id="ReportReview001_btn_push_reveal"><i class="iconfont icon-circle-correct_fill"></i>复核并推送待披露 </button>
        <button type="button" class="layui-btn layui-btn-sm btn-delete btn-default" id="ReportReview001_btn_push_tg"><i class="iconfont icon-circle-correct_fill"></i>复核并推送托管复核 </button>
        <button type="button" class="layui-btn layui-btn-sm btn-delete btn-default" id="ReportReview001_btn_export"><i class="iconfont icon-export"></i>导出 </button>
        <button type="button" class="layui-btn layui-btn-sm btn-delete btn-default" id="ReportReview001_btn_export_file"><i class="iconfont icon-export"></i>导出报表文件 </button>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <input type="hidden" id="finprodIds">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable" >产品全称</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="pProdId" name="pProdId"
                                class="layui-input form-input input-select" allowClear="true"
                                placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                formatoption=true multiple
                                data-th-data-url="@{/disclosure/information/config/repprodinfo/ProdInfo001/queryPprodIds}">
                        </select>
                    </div>
                    <div class="layui-inline">
                        <button type="button" class="layui-btn layui-btn-sm btn-default"
                                id="ReportReview001_btn_treeAdd" style="
										text-align: center;
    									width: 30px;
    									height: 24px;
    									line-height: 24px;
    									position: absolute;
    									top: -9px;
    									right: -35px;
    									z-index:2;">
                            <i class="iconfont icon-add"></i>
                        </button>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable" >子产品名称</label>
                    <div class="layui-input-inline input-inline">
                        <select id="prodId" name="prodId"
                                class="layui-input form-input input-select" placeholder="请选择"
                                data-th-data-url='@{/disclosure/information/config/repreportcheck/ReportCheck001/getProdIdList}'
                                allowClear="true"  multiple="multiple" >
                        </select>
                    </div>
                    <div class="layui-inline">
                        <button type="button" class="layui-btn layui-btn-sm btn-default"
                                id="ReportReview001_btn_treeChildrenAdd" style="
										text-align: center;
    									width: 30px;
    									height: 24px;
    									line-height: 24px;
    									position: absolute;
    									top: -9px;
    									right: -35px;
    									z-index:2;">
                            <i class="iconfont icon-add"></i>
                        </button>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable" >报表名称</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="reportName" name="reportName" formatoption="false"
                                class="layui-input form-input input-select"  placeholder="请选择"
                                data-th-data-url="@{/disclosure/information/reveal/reportreview/ReportReview001/getReportNameList}" allowClear="true">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable" >报表类别</label>
                    <div class="layui-input-inline input-inline">
                        <select id="reportType" name="reportType" class="layui-input form-input input-select" allowClear="true" multiple
                                data-th-data-result="${DIS_REPORT_STYLE}" searchable="false" data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">复核状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="reviewStatus" name="reviewStatus"
                               class="layui-input form-input input-select" allowClear="true"
                               data-th-data-result="${REVIEW_STATUS}"  multiple
                               data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable" >复核时间</label>
                    <div class="layui-input-inline input-inline">
                        <input  id="reviewTime" name="reviewTime" class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">报告期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="reportDate" name="reportDate"
                               placeholder="请选择时间区间"
                               class="layui-input form-input input-dateRangeSelect" value="">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/disclosure/information/reveal/reportreview/ReportReview001.js}" type="text/javascript"></script>
</div>

</html>
