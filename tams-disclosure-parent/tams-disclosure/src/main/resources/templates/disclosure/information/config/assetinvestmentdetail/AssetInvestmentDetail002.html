<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<html>
<head>
    <title>前十名资产投资明细新建</title>
    <style type="text/css">
        .form-inline-wrap{
            width:30%
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"> <span class="title-des">基本信息</span> （<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable" data-th-text="产品名称">产品名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="prodId" name="prodId" class="input-select"
                                                data-th-initValue="${entity?.prodId}"
                                                data-th-data-url="@{/disclosure/information/config/accountamount/AccountAmount002/findProdId}"
                                                placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                                                allowClear="true" required>
                                        </select>
                                    </div>
                                </div>

                                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                                    <label class="layui-form-label form-lable" data-th-text="日期">日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  id="pubDate" name="pubDate" class="layui-input form-input input-dateSelect"
                                                placeholder="请选择时间"
                                                data-th-value="${#dates.format(entity?.pubDate,'yyyy-MM-dd')}"
                                                required="required"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                    </div>
                                </div>

                                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable" data-th-text="资产代码">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="assetCode" name="assetCode"  class="layui-input form-input" allowClear="true" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" th:value="${entity?.assetCode}" required>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable" data-th-text="资产名称">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="assetName" name="assetName"  class="layui-input form-input" allowClear="true" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" th:value="${entity?.assetCode}" required>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="公允价值（元）">公允价值（元）</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="fairValue" name="fairValue"
                                               data-th-value="${entity?.fairValue}" data-textrange="2" required
                                               class="layui-input form-input text-number" >
                                    </div>
                                </div>

                                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="占产品资产比例">占产品资产比例</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="pdDrop" name="pdDrop"
                                               data-th-value="${entity?.pdDrop}" data-textrange="2" required
                                               class="layui-input form-input text-number" >
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="layui-form-item">
            <div align="center" style="height:50px;padding-top: 10px;">
                <a id="AssetInvestmentDetail002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="AssetInvestmentDetail002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="script">
    <script data-th-src="@{/js/disclosure/information/config/assetinvestmentdetail/AssetInvestmentDetail002.js}" type="text/javascript"></script>
</div>
</body>
</html>
