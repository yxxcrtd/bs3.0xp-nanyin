<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="产品交易信息-新建">产品交易信息-新建</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                <label class="layui-form-label form-lable">产品主代码</label>
                <div class="layui-input-inline input-inline">
                    <select id="prodId" name="prodId" class="input-select"
                            data-th-initValue="${entity?.prodId}"
                            data-th-data-url="@{/disclosure/information/config/prodfeedealInterf/SvrProdFeeDealInterf002/queryProdIdInfo2}"
                            placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                            allowClear="true"  data-selection="id" required>
                    </select>
                </div>
            </div>
            <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                <label class="layui-form-label form-lable">产品全称</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="prodName" name="prodName"
                           class="layui-input form-input" placeholder="请选择"
                           data-th-value="${entity?.prodName}" disabled="disabled" required>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                <label class="layui-form-label form-label-wrap"
                       th:text="支付日">支付日</label>
                <div class="layui-input-inline input-inline">
                    <input required type="text" id="payDate" name="payDate"
                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                           th:placeholder="#{SysCommon.placeholder}"
                           th:value='${#dates.format(entity?.payDate,"yyyy-MM-dd")}'>
                </div>
            </div>
            <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                <label class="layui-form-label form-lable"
                       data-th-text="费用类型">费用类型</label>
                <div class="layui-input-inline input-inline">
                    <select id="feeType" name="feeType"
                           class="layui-input form-input input-select"
                           data-th-data-result='${FEE_TYPE_REP}'
                           data-th-initValue='${entity?.feeType}'
                           allowClear="true"
                           placeholder="请输入内容"
                           data-th-placeholder="#{SysCommon.placeholder}" required>
                    </select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                <label class="layui-form-label form-lable">费用金额</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="amt" name="amt" data-th-value='${entity?.paidFee}'
                           class="layui-input form-input text-number" data-textrange='2' data-fixtype='2' maxlength=17
                           placeholder="请输入内容">
                </div>
            </div>
            <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                <label class="layui-form-label form-lable" data-th-text="#{SvrProdFeeDealInterf002.accrual}">自成立以来发生额（贷方）</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="accrual" name="accrual" data-th-value='${entity?.accrual}'
                           class="layui-input form-input text-number" data-textrange='2' data-fixtype='2' maxlength=17
                           placeholder="请输入内容">
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
        <div class="text-center">
            <a id="SvrProdFeeDealInterf002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="SvrProdFeeDealInterf002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="SvrProdFeeDealInterf002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/disclosure/information/config/prodfeedealInterf/SvrProdFeeDealInterf002.js}" type="text/javascript"></script>
</div>
</body>

</html>
