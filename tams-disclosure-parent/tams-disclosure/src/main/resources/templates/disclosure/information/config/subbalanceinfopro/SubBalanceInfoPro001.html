<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<html>
<html>
<head>
    <title data-th-text="#{SubBalanceInfoPro001}">科目余额信息维护</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin:10px;">
            <a id="SubBalanceInfoPro001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a>
            <a id="SubBalanceInfoPro001_btn_import" class="layui-btn layui-btn-sm"><i class="iconfont icon-import"></i><span>导入</span></a>
            <a id="SubBalanceInfoPro001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="产品名称">产品名称</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="booksetId" name="booksetId" formatoption="true" multiple
                                    class="layui-input form-input input-select"  placeholder="请输入内容" data-th-value='${entity?.booksetId}'
                                    data-th-data-url="@{/disclosure/information/config/profailureinfo/ProFailureInfo001/getRePord}" allowClear="true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="科目号">科目号</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="subjectNo" name="subjectNo" formatoption="true" multiple
                                    class="layui-input form-input input-select"  placeholder="请输入内容" data-th-value='${entity?.subjectNo}'
                                    data-th-data-url="@{/disclosure/information/config/subbalanceinfopro/SubBalanceInfoPro001/findSubjectNo}" allowClear="true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="日期">日期</label>
                        <div class="layui-input-inline input-inline">
                            <input  id="balanceDate" name="balanceDate" class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{ProElementAdj001.dataStatus}">数据状态</label>
                        <div class="layui-input-inline input-inline">
                            <select id="status" name="status" class="layui-input form-input input-select" allowClear="true"
                                    data-th-data-result="${MAINTAIN_STATUS}" searchable="false" data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/disclosure/information/config/subbalanceinfopro/SubBalanceInfoPro001.js}" type="text/javascript"></script>
</div>
</body>
</html>
