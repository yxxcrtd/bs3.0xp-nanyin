<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<html>
<head>
    <title>科目发生额信息维护新建</title>
    <style type="text/css">
        .form-inline-wrap{
            width:30%
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"> <span class="title-des">基本信息</span> （<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable" data-th-text="产品名称">产品名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="booksetId" name="booksetId" class="input-select"
                                                data-th-initValue="${entity?.booksetId}"
                                                data-th-data-url="@{/disclosure/information/config/accountamount/AccountAmount002/findProdId}"
                                                placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                                                allowClear="true" required>
                                        </select>
                                    </div>
                                </div>

                                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="产品开始日期">产品开始日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="dateStart" name="dateStart"
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间"
                                               data-th-value="${#dates.format(entity?.dateStart,'yyyy-MM-dd')}"
                                               required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>

                                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="产品开始日期">产品开始日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="dateEnd" name="dateEnd"
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间"
                                               data-th-value="${#dates.format(entity?.dateEnd,'yyyy-MM-dd')}"
                                               required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable" data-th-text="科目号">科目号</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="subjectNo" name="subjectNo" class="layui-input form-input input-select" allowClear="true"
                                                data-th-initValue="${entity?.subjectNo}" data-th-data-result="${SUBJECT_NO}" searchable="false" data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>

                                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="科目发生额">科目发生额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tdyODAmt" name="tdyODAmt" onkeyup="if(this.value < 0){
                                                          this.value= 0;
                                                         }else{
                                                    this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/)}"
                                               data-th-value="${entity?.tdyODAmt}" data-textrange="2" required
                                               class="layui-input form-input text-number" >
                                    </div>
                                </div>


                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="layui-form-item">
            <div align="center" style="height:50px;padding-top: 10px;">
                <a id="AccountAmount002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="AccountAmount002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="AccountAmount002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="script">
    <script data-th-src="@{/js/disclosure/information/config/accountamount/AccountAmount002.js}" type="text/javascript"></script>
</div>
</body>
</html>
