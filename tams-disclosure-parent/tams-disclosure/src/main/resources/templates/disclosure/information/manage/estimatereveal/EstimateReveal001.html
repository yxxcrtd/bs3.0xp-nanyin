<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>预计披露</title>
</head>
<body>

</body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
        <button type="button" class="layui-btn layui-btn-sm btn-default" id="EstimateReveal001_btn_export"><i class="iconfont icon-export"></i>导出</button>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
      <form class="layui-form" id="searchForm"> 
          <input type="hidden" name="confromPage" id="confromPage" data-th-value="${confromPage}">
          <input type="hidden" id="revealEndDateHidden" name="revealEndDateHidden" data-th-value="${searchDate}">
          <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">产品</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" id="prodId" name="prodId" formatoption="true" multiple
                            class="layui-input form-input input-select"  placeholder="请输入内容" data-th-value='${entity?.prodId}'
                            data-th-data-url="@{/disclosure/information/config/repreportcheck/ReportCheck001/getProdIdList}" allowClear="true">
                    </select>
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">披露截止日</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="revealEndDate" name="revealEndDate" placeholder="请选择、支持区间" 
                        class="layui-input form-input input-dateRangeSelect" value="">
                </div>
            </div>
              <div class="layui-inline layui-col-md4">
                  <label class="layui-form-label form-lable">报表名称</label>
                  <div class="layui-input-inline input-inline">
                      <select id="repName" name="repName"
                              class="layui-input form-input input-select"
                              data-th-formatoption="false"
                              data-th-data-result="${REPORT_NAME}" allowClear="true"
                              placeholder="请输入内容" data-th-initValue="${entity?.repId}">
                      </select>
                  </div>
              </div>
            

		</div>
	  	<div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">作业名称</label>
                <div class="layui-input-inline input-inline">
                    <select id="jobId" name="jobId" class="layui-input form-input input-select"
                        placeholder="请选择，可复选" data-th-data-result="${JOBID_LIST}" allowClear="true"
                        multiple="multiple" data-th-placeholder="#{SysCommon.placeholder}"
                        data-th-initValue='${jobId}'>
                    </select>
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">报表类别</label>
                <div class="layui-input-inline input-inline">
                    <select id="repType" name="repType" class="layui-input form-input input-select"
                        placeholder="请选择，可复选" data-th-data-result="${REPORT_STYLE}" allowClear="true"
                        multiple="multiple" data-th-placeholder="#{SysCommon.placeholder}"
                        data-th-initValue='${repType}'>
                    </select>
                </div>
            </div>
        </div>
      </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/disclosure/information/manage/estimatereveal/EstimateReveal001.js}" type="text/javascript"></script>
</div>
</html>
