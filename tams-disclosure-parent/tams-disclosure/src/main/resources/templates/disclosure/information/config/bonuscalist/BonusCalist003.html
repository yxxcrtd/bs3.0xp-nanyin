<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="产品分红计算条件">产品分红计算条件</title>
    <style>
        .mst-lable{
            width: 30%;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
        <input type="hidden" id="finprodIds">
        <input type="text" id="dataStatus" name="dataStatus" data-th-value='${entity?.status}' hidden>
        <input type="hidden" name="bonusListId" id="bonusListId" data-th-value="${entity?.bonusListId}" />
        <div class="layui-form-item">
            <div>
                <label class="layui-form-label form-lable mst-lable" style="width: 30% !important;" data-th-text="本期收益分配基准日">本期收益分配基准日</label>
                <div class="layui-input-inline input-inline">
                    <input required type="text" id="profitBaseDate" name="profitBaseDate"
                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-value='${#dates.format(entity?.profitBaseDate,"yyyy-MM-dd")}'
                    >
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div>
                <label class="layui-form-label form-lable mst-lable" style="width: 30% !important;" data-th-text="子产品代码">子产品代码</label>
                <div class="layui-input-inline input-inline">
                    <select id="prodId" name="prodId" class="input-select"
                            data-th-initValue="${entity?.prodId}" multiple required
                            data-th-data-url="@{/disclosure/information/config/bonuscalist/BonusCalist002/getProdId}"
                            placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                            allowClear="true">
                    </select>
                </div>
                <div class="layui-inline">
                    <button type="button" class="layui-btn layui-btn-sm btn-default"
                            id="RepProdIndex001_btn_treeAdd" style="
										text-align: center;
    									width: 30px;
    									height: 24px;
    									line-height: 24px;
    									position: absolute;
    									top: -9px;
    									right: -35px;
    									z-index:2;">
                        <i class="iconfont icon-add"></i>
                    </button>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
        <div class="text-center">
            <a id="BonusCalist003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            <a id="BonusCalist003_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="提交计算">提交计算</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/disclosure/information/config/bonuscalist/BonusCalist003.js}" type="text/javascript"></script>
</div>
</body>

</html>
