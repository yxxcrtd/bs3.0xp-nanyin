<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<html>
<head>
    <title>前十大投资者信息维护新建</title>
    <style type="text/css">
        .form-inline-wrap {
            width: 30%
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">基本信息</span> （<span
                                class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable" data-th-text="产品名称">产品名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="booksetId" name="booksetId" class="input-select"
                                                data-th-initValue="${entity?.booksetId}"
                                                data-th-data-url="@{/disclosure/information/config/investmentInfo/InvestmentInfo002/findProdId}"
                                                placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                                                allowClear="true" required>
                                        </select>
                                    </div>
                                </div>

                                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                                    <label class="layui-form-label form-lable" data-th-text="年度">年度</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="indexYear" name="indexYear" required
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value="${entity?.indexYear}"
                                               data-option="{type:'year',format:'yyyy'}" placeholder="请选择"
                                               data-th-placeholder="请选择日期">
                                    </div>
                                </div>

                                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable" data-th-text="指标类型">指标类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="indexType" name="indexType"
                                                class="layui-input form-input input-select" allowClear="true"
                                                data-th-initValue="${entity?.indexType}"
                                                data-th-data-result="${DIS_INDEX_TYPE}" searchable="false"
                                                data-th-placeholder="#{SysCommon.placeholder}" required>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">

                                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="排名">排名</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tzRank" name="tzRank" onkeyup="if(this.value < 0){
                                                          this.value= 1;
                                                         }else if(this.value > 100){
                                                     this.value=100
                                                    }"
                                               data-th-value="${entity?.tzRank}" required
                                               class="layui-input form-input text-number" data-fixtype='1'
                                               data-textrange='0'>
                                    </div>
                                </div>

                                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable" data-th-text="类别">类别</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="tzType" name="tzType" class="layui-input form-input input-select"
                                                allowClear="true"
                                                data-th-data-result="${DIS_TZ_TYPE}" searchable="false"
                                                data-th-placeholder="#{SysCommon.placeholder}" required
                                                data-th-initValue="${entity?.tzType}">
                                        </select>
                                    </div>
                                </div>

                                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="持有份额（份）">持有份额（份）</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="holdShare" name="holdShare" onkeyup="if(this.value < 0){
                                                          this.value= 0;
                                                         }else{
                                                    this.value= value.toString().match(/^\d{1,28}(?:\.\d{0,2})?/)}"
                                               data-th-value="${entity?.holdShare}" required
                                               class="layui-input form-input text-number">
                                    </div>
                                </div>

                            </div>

                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable" >
                                        占总份额比例（%）</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="proportionShare" name="proportionShare" onkeyup="if(this.value < 0){
                                                          this.value= 0;
                                                         }else{
                                                    this.value= value.toString().match(/^\d{1,28}(?:\.\d{0,2})?/)}"
                                               data-th-value="${entity?.proportionShareStr}" required
                                               class="layui-input form-input text-number">
                                    </div>
                                </div>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="id" name="id" data-th-value="${entity?.id}" hidden>
                                </div>
                            </div>


                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="layui-form-item">
            <div align="center" style="height:50px;padding-top: 10px;">
                <a id="InvestmentInfo002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                   data-th-text="#{SysCommon.submit}">提交</a>
                <a id="InvestmentInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                   data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="script">
    <script data-th-src="@{/js/disclosure/information/config/investmentInfo/InvestmentInfo002.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
