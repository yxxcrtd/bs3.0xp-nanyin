<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<html>
<head>
    <title data-th-text="#{ProElementAdj002}">产品要素调整新建</title>
    <style>
        .mst-lable{
            width: 30%;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <input type="hidden" name="prodAdjustId" id="prodAdjustId" data-th-value="${entity?.prodAdjustId}"/>
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"> <span class="title-des">基本信息</span> （<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-lable mst-lable" data-th-text="#{ProElementAdj001.prodRegistNo}">产品登记编码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="prodRegistNo" name="prodRegistNo" class="input-select"
                                                data-th-initValue="${entity?.prodRegistNo}" data-th-formatoption="false"
                                                data-th-data-url="@{/disclosure/information/config/proelementadj/ProElementAdj002/getRegistNo}"
                                                placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                                                allowClear="true" required>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-lable mst-lable" data-th-text="#{ProElementAdj001.prodId}">子产品代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="prodId" name="prodId" class="input-select"
                                                data-th-initValue="${entity?.prodId}" formatoption="false"
                                                data-th-data-url="@{/disclosure/information/config/proelementadj/ProElementAdj002/getProdId}"
                                                placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                                                allowClear="true" required>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-label-wrap mst-lable"
                                           data-th-text="调整此产品要素原因">调整此产品要素原因</label>
                                    <div class="layui-input-inline input-inline">
                                        <textarea id="adjReason" name="adjReason" onkeyup="this.value=value.match(/^.{1,500}/)" th:text="${entity?.adjReason}"
                                                  class="layui-textarea" placeholder="请输入内容"  data-th-value="${entity?.adjReason}"
                                                  th:placeholder="#{SysCommon.placeholder}"></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-label-wrap mst-lable"
                                           data-th-text="#{ProElementAdj001.prodAdjRemark}">描述文字1</label>
                                    <div class="layui-input-inline input-inline">
                                        <textarea id="prodAdjRemark" name="prodAdjRemark" maxlength="500" th:text="${entity?.prodAdjRemark}"
                                                  class="layui-textarea" placeholder="请输入内容"  data-th-value="${entity?.prodAdjRemark}"
                                                  th:placeholder="#{SysCommon.placeholder}"></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-label-wrap mst-lable"
                                           data-th-text="#{ProElementAdj001.prodAdjRemark2}">描述文字2</label>
                                    <div class="layui-input-inline input-inline">
                                        <textarea id="prodAdjRemark2" name="prodAdjRemark2" maxlength="500" th:text="${entity?.prodAdjRemark2}"
                                                  class="layui-textarea" placeholder="请输入内容" data-th-value="${entity?.prodAdjRemark2}"
                                                  th:placeholder="#{SysCommon.placeholder}"></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-label-wrap mst-lable"
                                           data-th-text="#{ProElementAdj001.adjField}">调整要素</label>
                                    <div class="layui-input-inline input-inline">
                                        <textarea id="adjField" name="adjField" maxlength="500" th:text="${entity?.adjField}"
                                                  class="layui-textarea" placeholder="请输入内容"  required data-th-value="${entity?.adjField}"
                                                  th:placeholder="#{SysCommon.placeholder}"></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-label-wrap mst-lable"
                                           data-th-text="#{ProElementAdj001.preAdjust}">调整前</label>
                                    <div class="layui-input-inline input-inline">
                                        <textarea id="preAdjust" name="preAdjust" maxlength="500" th:text="${entity?.preAdjust}"
                                                  class="layui-textarea" placeholder="请输入内容"  required data-th-value="${entity?.preAdjust}"
                                                  th:placeholder="#{SysCommon.placeholder}"></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-label-wrap mst-lable"
                                           data-th-text="#{ProElementAdj001.afterAdjust}">调整后</label>
                                    <div class="layui-input-inline input-inline">
                                        <textarea id="afterAdjust" name="afterAdjust" maxlength="500" th:text="${entity?.afterAdjust}"
                                                  class="layui-textarea" placeholder="请输入内容"  required data-th-value="${entity?.afterAdjust}"
                                                  th:placeholder="#{SysCommon.placeholder}"></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-label-wrap mst-lable"
                                           data-th-text="#{ProElementAdj002.effDate}">生效时间</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="effDate" name="effDate"
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间"
                                               data-th-value="${#dates.format(entity?.effDate,'yyyy-MM-dd')}"
                                               required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-label-wrap mst-lable"
                                           data-th-text="#{ProElementAdj001.adjReason2}">对此要素调整（原因）</label>
                                    <div class="layui-input-inline input-inline">
                                        <textarea id="adjReason2" name="adjReason2" maxlength="500" th:text="${entity?.adjReason2}"
                                                  class="layui-textarea" placeholder="请输入内容"  data-th-value="${entity?.adjReason2}"
                                                  th:placeholder="#{SysCommon.placeholder}"></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-label-wrap mst-lable"
                                           data-th-text="#{ProElementAdj002.fieldAdjRemark}">调整此要素（补充说明文1）</label>
                                    <div class="layui-input-inline input-inline">
                                        <textarea id="fieldAdjRemark" name="fieldAdjRemark" onkeyup="this.value=value.match(/^.{1,500}/)" th:text="${entity?.fieldAdjRemark}"
                                                  class="layui-textarea" placeholder="请输入内容"  data-th-value="${entity?.fieldAdjRemark}"
                                                  th:placeholder="#{SysCommon.placeholder}"></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-label-wrap mst-lable"
                                           data-th-text="#{ProElementAdj002.fieldAdjRemark2}">调整此要素（补充说明文2）</label>
                                    <div class="layui-input-inline input-inline">
                                        <textarea id="fieldAdjRemark2" name="fieldAdjRemark2" onkeyup="this.value=value.match(/^.{1,500}/)" th:text="${entity?.fieldAdjRemark2}"
                                                  class="layui-textarea" placeholder="请输入内容" data-th-value="${entity?.fieldAdjRemark2}"
                                                  th:placeholder="#{SysCommon.placeholder}"></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-label-wrap mst-lable"
                                           data-th-text="#{ProElementAdj002.rptIssueDate}">报告发布日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="rptIssueDate" name="rptIssueDate"
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间"
                                               data-th-value="${#dates.format(entity?.rptIssueDate,'yyyy-MM-dd')}"
                                               required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="layui-form-item">
            <div align="center" style="height:50px;padding-top: 10px;">
                <a id="ProElementAdj002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="ProElementAdj002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="ProElementAdj002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="script">
    <script data-th-src="@{/js/disclosure/information/config/proelementadj/ProElementAdj002.js}" type="text/javascript"></script>
</div>
</body>
</html>
