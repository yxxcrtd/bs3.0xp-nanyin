<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorator="~{layout/default}">
<head>
	<title>新建指标</title>
</head>
<body>
<div layout:fragment="content">
	<form class="layui-form joyin-form-wrap" id="submitForm"
		  style="background: #ffffff; padding: 10px 0;">
		<div class="layui-form-item" style="display: none;">
			<input id="operateType" name="operateType"
				   class="layui-input form-input" placeholder="请输入"
				   data-th-value="${entity?.operateType}">
		</div>
		<div class="layui-form-item">
			<div class="layui-inline layui-col-md8">
				<label class="layui-form-label form-lable" style="width: 150px;">
					<i class="iconfont must" style="display: inline;">*</i> 报表文本代码
				</label>
				<div class="layui-input-inline input-inline">
					<input type="text" id="id" name="id" placeholder="请输入内容" onKeyUp="value=value.replace(/[^\u0030-\u0039\u0041-\u005a\u0061-\u007a\u0020-\u0026\u0028-\u007B\u007D\u007E]/g,'')"
						   class="layui-input form-input" maxlength="20" data-th-Value="${entity?.id}">
				</div>
			</div>
		</div>
		<div class="layui-form-item">
			<div class="layui-inline layui-col-md8">
				<label class="layui-form-label form-lable" style="width: 150px;">
					<i class="iconfont must" style="display: inline;">*</i> 报表文本名称
				</label>
				<div class="layui-input-inline input-inline">
					<input type="text" id="indexName" name="indexName" maxlength="100"
						   placeholder="请输入内容" class="layui-input form-input"
						   data-th-Value="${entity?.indexName}">
				</div>
			</div>
		</div>
		<div class="layui-form-item">
			<div class="layui-inline layui-col-md8">
				<label class="layui-form-label form-lable" style="width: 150px;">指标描述</label>
				<div class="layui-input-inline input-inline">
						<textarea name="indexDescribe"
								  data-th-text="${entity?.indexDescribe}" class="layui-textarea"
								  placeholder="请输入内容" maxlength="1000"
								  data-th-placeholder="#{SysCommon.placeholder}"></textarea>
				</div>
			</div>
		</div>
	</form>

	<div class="layui-col-md11" style="margin: 50px;">
		<div class="text-center">
			<a id="ReportContentEnum002_btn_save"
			   class="layui-btn layui-btn-sm btn-save"
			   data-th-text="#{SysCommon.save}">保存</a> <a
				id="ReportContentEnum002_btn_submit"
				class="layui-btn layui-btn-sm btn-submit"
				data-th-text="#{SysCommon.submit}">提交</a> <a
				id="ReportContentEnum002_btn_cancel"
				class="layui-btn layui-btn-sm btn-cancel"
				data-th-text="#{SysCommon.cancel}">取消</a>
		</div>
	</div>
</div>
<div layout:fragment="script">
	<script
			data-th-src="@{/js/disclosure/information/config/reportcontentenum/ReportContentEnum002.js}"
			type="text/javascript"></script>
</div>
</body>
</html>
