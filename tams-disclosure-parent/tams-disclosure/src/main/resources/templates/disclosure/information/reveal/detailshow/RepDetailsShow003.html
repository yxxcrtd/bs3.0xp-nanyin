<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<div class="pro-module">
	<h3 class="pro-module-title">
		<span class="title-des">模板预览</span>
	</h3>
</div>
<div layout:fragment="content">
	<div id="showtable"></div>
</div>
</body>
<div layout:fragment="script">
	<script data-th-src="@{/js/disclosure/report.js}" type="text/javascript"></script>
	<script data-th-inline="javascript" type="text/javascript">
		var repId = [[${repId}]];

		function showTable(){
			$("#showtable").append("加载中");
			var $container = $("#showtable");
			Joyin.ajax(basePath + 'disclosure/information/reveal/detailshow/RepDetailsShow001/previewReport', {repid:repId}, function(result) {
				$container.html(result);
			});
		}

		$(function () {
			/**
			 * 画面加载完成
			 */
			$(function() {
				showTable();
			});
		});
	</script>
</div>
</html>
