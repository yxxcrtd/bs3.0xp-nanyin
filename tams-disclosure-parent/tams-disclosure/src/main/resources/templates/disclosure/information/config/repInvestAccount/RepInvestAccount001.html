<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="投资账户信息维护">投资账户信息维护</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="RepInvestAccount001_btn_add" class="layui-btn layui-btn-sm btn-create" >新建</a>
        <a id="RepInvestAccount001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default" >删除</a>
        <a id="RepInvestAccount001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable"
                           data-th-text="产品名称">产品名称</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="prodId" name="prodId"
                                class="layui-input form-input input-select" allowClear="true"
                                placeholder="请输入"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                formatoption=true multiple="true"
                                data-th-data-url="@{/disclosure/information/config/repInvestAccount/RepInvestAccount001/queryProdIdInfo}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="账号">账号</label>
<!--                    <div class="layui-input-inline input-inline">-->
<!--                        <input type="text" id="accountNum" name="accountNum" class="layui-input form-input" placeholder="请输入内容">-->
<!--                    </div>-->
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="accountNum" name="accountNum"  data-selection="id"
                                class="layui-input form-input input-select"  placeholder="请输入内容" data-th-value='${entity?.accountNum}'
                                data-th-data-url="@{/disclosure/information/config/repInvestAccount/RepInvestAccount001/queryAccountNum}" allowClear="true">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable" data-th-text="账户名称">账户名称</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="accountName" name="accountNum"  data-selection="text"
                                class="layui-input form-input input-select"  placeholder="请输入内容" data-th-value='${entity?.accountNum}'
                                data-th-data-url="@{/disclosure/information/config/repInvestAccount/RepInvestAccount001/queryAccountNum}" allowClear="true">
                        </select>

                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable">数据状态</label>
                    <div class="layui-input-inline input-inline">
                        <select name="status" id="status"
                                class="layui-input form-input input-select"
                                placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                data-th-initValue='${entity?.status}'
                                data-th-data-result='${MAINTAIN_STATUS}'>
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script charset="utf-8" data-th-src="@{/js/disclosure/information/config/repInvestAccount/RepInvestAccount001.js}" type="text/javascript"></script>
</div>
</body>
</html>
