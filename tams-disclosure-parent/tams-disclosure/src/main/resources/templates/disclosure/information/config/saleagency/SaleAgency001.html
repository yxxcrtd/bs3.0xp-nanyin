<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title>代销机构维护</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="form-button-area">
                <a id="SaleAgency001_btn_add" class="layui-btn layui-btn-sm btn-create"
                    data-th-text="#{SysCommon.create}">新建</a>
                <a id="SaleAgency001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
                    data-th-text="#{SysCommon.delete}" style="display: none;">删除</a>
            </div>
            <div class='joyin-form-wrap joyin-filter-form condition-area'>
                <form class="layui-form" id="searchForm">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">代销机构</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" name="agencyId" id="agencyId"
                                        class="layui-input form-input input-select" allowClear="true"
                                        placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        formatoption=true multiple="true"
                                        data-th-data-url="@{/disclosure/information/config/saleagency/SaleAgency001/querySaleAgency}">
                                </select>
                            </div>
                        </div>

                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">产品系列</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" name="prodSeries" id="prodSeries"
                                        class="layui-input form-input input-select" allowClear="true"
                                        placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        formatoption=true multiple="true"
                                        data-th-data-result='${PROD_SERIES}'>
                                </select>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/disclosure/information/config/saleagency/SaleAgency001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
