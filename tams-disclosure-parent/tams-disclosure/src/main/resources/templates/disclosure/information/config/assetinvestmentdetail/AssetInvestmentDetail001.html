<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<html>
<html>
<head>
    <title>前十名资产投资明细</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area"  style="margin:10px;">
            <a id="AssetInvestmentDetail001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a>
            <a id="AssetInvestmentDetail001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default"><i class="iconfont icon-import"></i><span>导入</span></a>
            <a id="AssetInvestmentDetail001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default" data-th-text="#{SysCommon.delete}">删除</a>
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <input type="hidden" id="finprodIds">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="产品全称">产品全称</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="prodId" name="prodId" formatoption="true" multiple
                                    class="layui-input form-input input-select"  placeholder="请输入内容" data-th-value='${entity?.prodId}'
                                    data-th-data-url="@{/disclosure/information/config/subbalanceinfopro/SubBalanceInfoPro001/getRePord}" allowClear="true">
                            </select>
                        </div>
                        <div class="layui-inline">
                            <button type="button" class="layui-btn layui-btn-sm btn-default"
                                    id="AccountAmount001_btn_treeAdd" style="
										text-align: center;
    									width: 30px;
    									height: 24px;
    									line-height: 24px;
    									position: absolute;
    									top: -9px;
    									right: -35px;
    									z-index:2;">
                                <i class="iconfont icon-add"></i>
                            </button>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="资产代码">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="assetCode" name="assetCode"  class="layui-input form-input" allowClear="true" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}" th:value="${entity?.assetCode}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="日期">日期</label>
                        <div class="layui-input-inline input-inline">
                            <input  id="pubDate" name="pubDate" class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="数据状态">数据状态</label>
                        <div class="layui-input-inline input-inline">
                            <select id="status" name="status" class="layui-input form-input input-select" allowClear="true"
                                    data-th-data-result="${MAINTAIN_STATUS}" searchable="false" data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/disclosure/information/config/assetinvestmentdetail/AssetInvestmentDetail001.js}" type="text/javascript"></script>
</div>
</body>
</html>
