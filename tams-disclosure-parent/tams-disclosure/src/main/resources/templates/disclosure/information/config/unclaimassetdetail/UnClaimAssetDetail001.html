<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="#{UnClaimAssetDetail001}">非标债权类资产明细维护</title>
</head>
<body>
<div layout:fragment="content" id="UnClaimAssetDetail001_DIV">
    <div class="form-button-area">
        <a id="UnClaimAssetDetail001_btn_add" class="layui-btn layui-btn-sm btn-create"
           data-th-text="#{SysCommon.create}">新建</a>
        <a id="UnClaimAssetDetail001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
           data-th-text="#{SysCommon.delete}" style="display: none">删除</a>
        <a id="UnClaimAssetDetail001_btn_import" class="layui-btn layui-btn-sm btn-import"
        >导入</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form " id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{UnClaimAssetDetail002.prodId}">产品代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" name="prodId" id="prodId"
                                class="layui-input form-input input-select" allowClear="true"
                                placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption=true multiple="true"
                                data-th-data-url="@{/disclosure/information/config/unclaimassetdetail/UnClaimAssetDetail001/getProdInfo}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{UnClaimAssetDetail002.effDate}">生效日期</label>
                    <div class="layui-input-inline input-inline">
                        <input name="effDate" id= "effDate" class="layui-input form-input input-dateSelect"
                               placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}">
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{UnClaimAssetDetail002.effEndDate}">生效截止日期</label>
                    <div class="layui-input-inline input-inline">
                        <input name="effEndDate" id="effEndDate" class="layui-input form-input input-dateSelect"
                               placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{UnClaimAssetDetail002.dataStatus}">数据状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="dataStatus" name="dataStatus"
                                class=" input-select"
                                data-th-data-result = '${MAINTAIN_STATUS}'
                                allowClear="true"></select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">

    </script>
    <script data-th-src="@{/js/disclosure/information/config/unclaimassetdetail/UnClaimAssetDetail001.js}" type="text/javascript"></script>

</div>
</body>

</html>
