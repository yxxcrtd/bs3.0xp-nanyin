<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{ProdPartner001}">合作机构信息维护</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="form-button-area">
                <a id="ProdPartner001_btn_add" class="layui-btn layui-btn-sm btn-create"
                    data-th-text="#{SysCommon.create}">新建</a>
                <a id="ProdPartner001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
                    data-th-text="#{SysCommon.delete}" style="display: none;">删除</a>
                <a id="ProdPartner001_btn_import" class="layui-btn layui-btn-sm ">导入</a>
            </div>
            <div class='joyin-form-wrap joyin-filter-form condition-area'>
                <form class="layui-form" id="searchForm">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">产品主代码</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" name="prodId" id="prodId"
                                        class="layui-input form-input input-select" allowClear="true"
                                        placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        formatoption=true multiple="true"
                                        data-th-data-url="@{/disclosure/information/config/prodpartner/ProdPartner001/queryProdIdInfo}">
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">生效日</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="effDate" name="effDate"
                                       class="layui-input form-input input-dateSelect"
                                       placeholder="请输入内容"
                                       data-th-placeholder="#{SysCommon.placeholder}"/>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">生效截止日期</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="effEndDate" name="effEndDate"
                                       class="layui-input form-input input-dateSelect"
                                       placeholder="请输入内容"
                                       data-th-placeholder="#{SysCommon.placeholder}"/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">数据状态</label>
                            <div class="layui-input-inline input-inline">
                                <select id="dataStatus"
                                        name="dataStatus"
                                        class="input-select"
                                        data-th-data-result='${DIS_DATA_STATUS_ED}'
                                        placeholder="请选择"
                                        data-th-initvalue="${dataStatus}"
                                        allowClear="true"
                                        data-th-placeholder="#{SysCommon.selectplaceholder}">
                                </select>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/disclosure/information/config/prodpartner/ProdPartner001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
