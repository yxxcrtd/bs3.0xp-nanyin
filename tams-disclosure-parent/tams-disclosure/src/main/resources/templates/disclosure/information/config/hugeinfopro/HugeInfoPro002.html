<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<html>
<head>
    <title data-th-text="#{HugeInfoPro002}">巨额赎回信息维护新建</title>
    <style type="text/css">
        .form-inline-wrap{
            width:30%
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"> <span class="title-des">基本信息</span> （<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable" data-th-text="#{ProElementAdj001.prodRegistNo}">产品登记编码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="prodRegistNo" name="prodRegistNo" class="input-select"
                                                data-th-initValue="${entity?.prodRegistNo}"
                                                data-th-data-url="@{/disclosure/information/config/proelementadj/ProElementAdj002/getRegistNo}"
                                                placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                                                allowClear="true" required>
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable" data-th-text="#{ProElementAdj001.prodId}">子产品代码</label>
                                    <div class="layui-input-inline input-inline">
<!--                                        <select type="text" id="prodId" name="prodId" formatoption="true" required-->
<!--                                                class="layui-input form-input input-select"  placeholder="请输入内容" data-th-value='${entity?.prodId}' data-th-initVale="${entity?.prodId}"-->
<!--                                                data-th-data-url="@{/disclosure/information/config/proelementadj/ProElementAdj002/getProdId}" allowClear="true">-->
<!--                                        </select>-->
                                        <select id="prodId" name="prodId" class="input-select"
                                                data-th-initValue="${entity?.prodId}"
                                                data-th-data-url="@{/disclosure/information/config/proelementadj/ProElementAdj002/getProdId}"
                                                placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                                                allowClear="true" required>
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="巨额赎回日期">巨额赎回日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="dealDate" name="dealDate"
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间"
                                               data-th-value="${#dates.format(entity?.dealDate,'yyyy-MM-dd')}"
                                               required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="触发的情形说明文字">触发的情形说明文字</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" maxlength="500" id="triggerRemark" name="triggerRemark"
                                               class="layui-input form-input" placeholder="请输入内容" required
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.triggerRemark}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{HugeInfoPro002.rejectRemark}">拒绝赎回说明（文字）</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" maxlength="500" id="rejectRemark" name="rejectRemark"
                                               class="layui-input form-input" placeholder="请输入内容" required
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.rejectRemark}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{ProElementAdj002.rptIssueDate}">报告发布日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="rptIssueDate" name="rptIssueDate"
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间"
                                               data-th-value="${#dates.format(entity?.rptIssueDate,'yyyy-MM-dd')}"
                                               required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>
                            </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="layui-form-item">
            <div align="center" style="height:50px;padding-top: 10px;">
                <a id="HugeInfoPro002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="HugeInfoPro002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="HugeInfoPro002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="script">
    <script data-th-src="@{/js/disclosure/information/config/hugeinfopro/HugeInfoPro002.js}" type="text/javascript"></script>
</div>
</body>
</html>
