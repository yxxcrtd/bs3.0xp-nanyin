<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="产品费用交易信息维护">产品费用交易信息维护</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="SvrProdFeeDealInterf001_btn_add" class="layui-btn layui-btn-sm btn-create" >新建</a>
        <a id="SvrProdFeeDealInterf001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default" >删除</a>
        <a id="SvrProdFeeDealInterf001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <input type="hidden" id="finprodIds">
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable"
                           data-th-text="产品名称">产品名称</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="prodId" name="prodId"
                                class="layui-input form-input input-select" allowClear="true" multiple="multiple"
                                placeholder="请输入"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                formatoption=true
                                data-th-data-url="@{/disclosure/information/config/prodfeedealInterf/SvrProdFeeDealInterf001/queryProdIdInfo}">
                        </select>
                    </div>
                    <div class="layui-inline">
                        <button type="button" class="layui-btn layui-btn-sm btn-default"
                                id="SvrProdFeeDealInterf001_btn_treeAdd" style="
										text-align: center;
    									width: 30px;
    									height: 24px;
    									line-height: 24px;
    									position: absolute;
    									top: -9px;
    									right: -35px;
    									z-index:2;">
                            <i class="iconfont icon-add"></i>
                        </button>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="费用类型">费用类型</label>
                    <div class="layui-input-inline input-inline">
                        <select formatoption="true" type="text"
                                id="feeType" name="feeType"
                                class="layui-input form-input input-select"
                                data-th-data-result='${FEE_TYPE_REP}'
                                allowClear="true"
                                placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable" data-th-text="支付日">支付日</label>
                    <div class="layui-input-inline input-inline">
                        <input id='payDate' name='payDate' class="layui-input form-input input-dateRangeSelect"
                               placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable">数据状态</label>
                    <div class="layui-input-inline input-inline">
                        <select name="status" id="status"
                                class="layui-input form-input input-select"
                                placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                data-th-initValue='${entity?.status}'
                                data-th-data-result='${MAINTAIN_STATUS}'>
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var yes = /*[[${_yes}]]*/'';
        var no = /*[[${_no}]]*/'';
    </script>
    <script data-th-src="@{/js/disclosure/jquery.validate.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/disclosure/joyinvalid.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/disclosure/report-common.js}" type="text/javascript"></script>
    <!-- 先引用 -->
    <script data-th-src="@{/js/disclosure/moment-with-locales.min.js}" type="text/javascript"></script>
    <!-- 再引用日期组件 -->
    <script data-th-src="@{/js/disclosure/lunar.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/disclosure/fullcalendar.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/disclosure/zh-cn.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/disclosure/information/config/prodfeedealInterf/SvrProdFeeDealInterf001.js}" type="text/javascript"></script>
</div>
</body>
</html>
