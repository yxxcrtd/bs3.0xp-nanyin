<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<html>
<html>
<head>
    <title data-th-text="#{ProdFeediscount001}">产品费率优惠</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin:10px;">
            <a id="ProdFeediscount001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a>
            <a id="ProdFeediscount001_btn_import" class="layui-btn layui-btn-sm"><i class="iconfont icon-import"></i><span>导入</span></a>
            <a id="ProdFeediscount001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <input hidden type="text" id="prodDiscountId" data-th-value="${entity?.prodDiscountId}" style="display:none;">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" >产品登记编码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="prodRegistNo" name="prodRegistNo" formatoption="false" multiple
                                    class="layui-input form-input input-select"  placeholder="请输入内容" data-th-value='${entity?.prodRegistNo}'
                                    data-th-data-url="@{/disclosure/information/config/proelementadj/ProElementAdj001/getRegistNoList}" allowClear="true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" >子产品代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="prodId" name="prodId" formatoption="true" multiple
                                    class="layui-input form-input input-select"  placeholder="请输入内容" data-th-value='${entity?.prodId}'
                                    data-th-data-url="@{/disclosure/information/config/proelementadj/ProElementAdj001/getProdIdlist}" allowClear="true">
                            </select>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" >费率名称</label>
                        <div class="layui-input-inline input-inline">
                            <select id="feename" name="feename" class="input-select"
                                    data-th-initValue="${entity?.feename}" formatoption="false" multiple
                                    data-th-data-url="@{/disclosure/information/config/prodfeediscount/ProdFeediscount001/getProdFeenameSelect}"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.selectplaceholder}"
                                    allowClear="true">
                            </select>
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                            <label class="layui-form-label form-lable" >发布日期</label>
                            <div class="layui-input-inline input-inline">
                                <input  id="rptIssueDate" name="rptIssueDate" class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" >数据状态</label>
                            <div class="layui-input-inline input-inline">
                                <select id="dataStatus" name="dataStatus" class="layui-input form-input input-select" allowClear="true"
                                        data-th-data-result="${DIS_DATA_STATUS}" searchable="false" data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/disclosure/information/config/prodfeediscount/ProdFeediscount001.js}" type="text/javascript"></script>
</div>
</body>
</html>
