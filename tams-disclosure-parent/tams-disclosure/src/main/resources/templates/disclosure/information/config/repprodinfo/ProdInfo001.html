<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<meta charset="UTF-8">
<title data-th-text="">产品基本信息</title>
</head>
<body>
<div layout:fragment="content">
    <!-- 画面内容 -->
    <div class="form-button-area" >
        <a id="ProdInfo001_btn_design" class="layui-btn layui-btn-sm btn-create"
           data-th-text="#{SysCommon.create}">新建</a>
        <a id="ProdInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default"
           data-th-text="#{SysCommon.delete}">删除</a>
        <a id="ProdInfo001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
        <a id="ProdInfo001_btn_issueStatusMan" class="layui-btn layui-btn-sm btn-import btn-default">发行状态管理</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <input type="hidden" id="finprodIds">

            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable" >产品全称</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="prodId" name="prodId"
                                class="layui-input form-input input-select" allowClear="true" multiple="multiple"
                                placeholder="请输入"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                formatoption=true
                                data-th-data-url="@{/disclosure/information/config/repprodinfo/ProdInfo001/queryPprodIds}">
                        </select>
                    </div>
                    <div class="layui-inline">
                        <button type="button" class="layui-btn layui-btn-sm btn-default"
                                id="ProdInfo001_btn_add" style="
										text-align: center;
    									width: 30px;
    									height: 24px;
    									line-height: 24px;
    									position: absolute;
    									top: -9px;
    									right: -35px;
    									z-index:2;">
                            <i class="iconfont icon-add"></i>
                        </button>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable" >子产品名称</label>
                    <div class="layui-input-inline input-inline">
                        <select id="prodName" name="prodName"
                                class="layui-input form-input input-select" placeholder="请选择"
                                data-th-data-url='@{/disclosure/information/config/repprodinfo/ProdInfo001/queryPprodName}'
                                allowClear="true"  multiple="multiple" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                   <!-- <label class="layui-form-label form-lable" >产品登记编码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="regCode"
                               class="layui-input form-input" placeholder="请选择"
                               allowClear="true">
                    </div>-->
                    <label class="layui-form-label form-lable" >产品登记编码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="prodRegistNo" name="prodRegistNo" formatoption="false" multiple
                                class="layui-input form-input input-select"  placeholder="请输入内容" data-th-value='${entity?.prodRegistNo}'
                                data-th-data-url="@{/disclosure/information/config/repprodinfo/ProdInfoCommon/getRegistNoList}" allowClear="true">
                        </select>
                    </div>

                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">募集起始日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="raiseStrdate"
                               class="layui-input form-input input-dateRangeSelect">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable" >产品成立日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="setDate"
                               class="layui-input form-input input-dateRangeSelect">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable" >募集方式</label>
                    <div class="layui-input-inline input-inline">
                        <select id="raiseType"  class="input-select" multiple="true"
                                data-th-data-result="${DIS_RAISE_TYPE}" placeholder="请选择" allowClear="true">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" >是否分级产品</label>
                    <div class="layui-input-inline input-inline">
                        <select id="isGrade"  class="input-select" multiple="true"
                                data-th-data-result="${YES_NO}" placeholder="请选择" allowClear="true">
                        </select>
                    </div>
                </div>

                <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" >产品运作方式</label>
                    <div class="layui-input-inline input-inline">
                        <select id="profitType"  class="input-select" multiple="true"
                                data-th-data-result="${DIS_PROFIT_TYPE}" placeholder="请选择" allowClear="true">
                        </select>
                    </div>
                </div>

                <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" >数据状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="status"  class="input-select" multiple="true"
                                data-th-data-result="${MAINTAIN_STATUS}" placeholder="请选择" allowClear="true">
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>

<div layout:fragment="script">
    <script data-th-src="@{/js/disclosure/information/config/repprodinfo/ProdInfo001.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
