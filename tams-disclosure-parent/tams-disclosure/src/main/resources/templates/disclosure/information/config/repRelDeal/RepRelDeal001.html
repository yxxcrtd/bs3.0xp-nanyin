<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="关联交易情况维护">关联交易情况维护</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="RepRelDeal001_btn_add" class="layui-btn layui-btn-sm btn-create" >新建</a>
        <a id="RepRelDeal001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default" >删除</a>
        <a id="RepRelDeal001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <input type="hidden" id="finprodIds">
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable"
                           data-th-text="产品全称">产品全称</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="prodId" name="prodId"
                                class="layui-input form-input input-select" allowClear="true"
                                placeholder="请输入"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                formatoption=true multiple="true"
                                data-th-data-url="@{/disclosure/information/config/repRelDeal/RepRelDeal001/queryProdIdInfo}">
                        </select>
                    </div>
                    <div class="layui-inline">
                        <button type="button" class="layui-btn layui-btn-sm btn-default"
                                id="RepRelDeal001_btn_treeAdd" style="
										text-align: center;
    									width: 30px;
    									height: 24px;
    									line-height: 24px;
    									position: absolute;
    									top: -9px;
    									right: -35px;
    									z-index:2;">
                            <i class="iconfont icon-add"></i>
                        </button>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable" data-th-text="生效日期">生效日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id='effdate' name='effdate' class="layui-input form-input input-dateRangeSelect"
                               placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}">
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable" data-th-text="生效截止日期">生效截止日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id='effdelidate' name='effdelidate' class="layui-input form-input input-dateRangeSelect"
                               placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable">数据状态</label>
                    <div class="layui-input-inline input-inline">
                        <select name="status" id="status"
                                class="layui-input form-input input-select"
                                placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                data-th-initValue='${entity?.status}'
                                data-th-data-result='${MAINTAIN_STATUS}'>
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/disclosure/information/config/repRelDeal/RepRelDeal001.js}" type="text/javascript"></script>
</div>
</body>
</html>
