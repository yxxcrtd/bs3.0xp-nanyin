
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{BatchGenReport001}">报表查询展示</title>
<script th:inline="javascript">
</script>
</head>

<body>
<div layout:fragment="content">
	<div class="layui-row layui-col-space15">
		<div class="layui-col-md3" style="width: 22%">
		    <div class="joyin-form-wrap">
		      <form class="layui-form" id="proidSearchForm"> 
                   <div class="layui-form-item" >
                         <input type="text" id="reportCode" name="reportCode"
			                        class="layui-input form-input input-fuzzy-text"
			                        placeholder="输入报表名称或关键字"
			                        data-eventfunc="serachKey">
                   </div>
		      </form>
		    </div> 
		    <div class="layui-input" style="border: 1px solid #dbdbdb; scroll-y: auto; scroll-x: hidden; overflow-y: scroll;" data-checkall="false"
		    id='typeDatatree'  data-checkable='false' data-roottitle='披露报表'
		    data-th-url='|@{/disclosure/information/reveal/detailshow/RepDetailsShow001/getRepGroup}'></div>
	    </div>
	   	<div class="layui-col-md9" style="width: 78%">
	   		<div class="joyin-form-wrap condition-area" id="showSearch" style="height: 50px;">
		    </div>
		    <div class="layui-inline layui-col-md-offset9" style="margin-top: 10px">
				<button class="layui-btn layui-btn-sm " id="btnGenReport" ><i class="iconfont icon-save"></i>批量生成</button>
           	</div>
			<div>
		        <form class="layui-form joyin-form-wrap" id="submitForm">
                    <input id="nodes" type="hidden">
                    <div class="layui-form-item">
                        <label class="layui-form-label form-lable mst-lable">产品名称</label>
                        <div class="layui-input-block input-inline">
                            <input type="checkbox" lay-skin="switch" data-th-lay-text="#{SystemActorRole001.expandAll}" id="expandAll" data-ignore=true>
                            <div class="layui-input" style="border: 1px solid #dbdbdb; scroll-y: auto; scroll-x: hidden; height: 219px; overflow-y: scroll;" id='tree'
                                 data-th-url='|@{/disclosure/information/config/reportcontentenum/ReportContentEnum004/getAllProdIds}'
                            </div>
                        </div>
                    </div>
		        </form>
    		</div>
			<div class="layui-tab layui-tab-card">
	        	<div id="showtable" style="overflow:auto"></div>
	    	</div>
	    	
	    	
	    </div>
    </div>
</div>
</body>
<div layout:fragment="script">
  	<script data-th-src="@{/js/disclosure/information/reveal/genreport/BatchGenReport001.js}" type="text/javascript"></script>
	<script data-th-src="@{/js/disclosure/report.js}" type="text/javascript"></script>
	<script data-th-inline="javascript" type="text/javascript">
		var REPORT_SERVER_URL = [[${REPORT_SERVER_URL}]];
	    var REPORT_USERNAME = [[${REPORT_USERNAME}]];
	    var REPORT_PASSWORD = [[${REPORT_PASSWORD}]];
	    var REPORT_SERVER_PATH = [[${REPORT_SERVER_PATH}]];
	    var cureDate = [[${cureDate}]];
	</script>
</div>

</html>
