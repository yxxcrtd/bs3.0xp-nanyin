<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="关联交易情况维护-新建">关联交易情况维护-新建</title>
    <style>
        .mst-lable{
            width: 30%;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <form class=" layui-form joyin-form-wrap pro-module-form" id="submitForm">
        <input type="text" id="uuid" name="uuid" data-th-value='${entity?.uuid}' hidden>
        <div class="layui-form-item">
            <div >
                <label class="layui-form-label form-label-wrap mst-lable" style="width: 470px !important;" data-th-text="产品名称">产品名称</label>
                <div class="layui-input-inline input-inline">
                    <select id="prodId" name="prodId" class="input-select"
                            data-th-initValue="${entity?.prodId}"
                            data-th-data-url="@{/disclosure/information/config/repRelDeal/RepRelDeal002/queryProdIdInfo2}"
                            placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                            allowClear="true" required>
                    </select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div >
                <label class="layui-form-label form-label-wrap mst-lable" style="width: 470px !important;" data-th-text="产品主代码">产品主代码</label>
                <div class="layui-input-inline input-inline" >
                    <input type="text" id="prodName" name="prodName"
                           class="layui-input form-input" placeholder="请选择"
                           data-th-value="${entity?.prodId}" disabled="disabled" required>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div >
                <label class="layui-form-label form-label-wrap mst-lable" style="width: 470px !important;" data-th-text="投资于关联方发行的证券、关联方作为融资人的非标准化债权类资产业务交易金额">投资于关联方发行的证券、关联方作为融资人的非标准化债权类资产业务交易金额</label>
                <div class="layui-input-inline input-inline" >
                    <input type="text" id="creditorAmt" name="creditorAmt" data-th-value='${entity?.creditorAmt}'
                           class="layui-input form-input text-number" data-textrange='2' data-fixtype='2' maxlength=18
                           onkeyup="if(this.value < 0){
                                         this.value= 0;
                                     }else if (value > Math.pow(10,15)) {
                                         this.value= '';
                                     }else{
                                         this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/) // 只能输入小数点后两位
                                           }"
                           placeholder="请输入内容" required>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div >
                <label class="layui-form-label form-label-wrap mst-lable" style="width: 470px !important;" data-th-text="投资于关联方承销的证券交易金额">投资于关联方承销的证券交易金额</label>
                <div class="layui-input-inline input-inline" >
                    <input type="text" id="bondAmt" name="bondAmt" data-th-value='${entity?.bondAmt}'
                           class="layui-input form-input text-number" data-textrange='2' data-fixtype='2' maxlength=18
                           onkeyup="if(this.value < 0){
                                         this.value= 0;
                                     }else if (value > Math.pow(10,15)) {
                                         this.value= '';
                                     }else{
                                         this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/) // 只能输入小数点后两位
                                           }"
                           placeholder="请输入内容" required>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div >
                <label class="layui-form-label form-label-wrap mst-lable" style="width: 470px !important;" data-th-text="与关联方作为交易对手开展的投融资业务交易金额">与关联方作为交易对手开展的投融资业务交易金额</label>
                <div class="layui-input-inline input-inline" >
                    <input type="text" id="investAmt" name="investAmt" data-th-value='${entity?.investAmt}'
                           class="layui-input form-input text-number" data-textrange='2' data-fixtype='2' maxlength=18
                           onkeyup="if(this.value < 0){
                                         this.value= 0;
                                     }else if (value > Math.pow(10,15)) {
                                         this.value= '';
                                     }else{
                                         this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/) // 只能输入小数点后两位
                                           }"
                           placeholder="请输入内容" required>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div >
                <label class="layui-form-label form-label-wrap mst-lable" style="width: 470px !important;" data-th-text="投资关联方作为管理人的资产管理产品交易金额">投资关联方作为管理人的资产管理产品交易金额</label>
                <div class="layui-input-inline input-inline">
                    <input type="text"  id="assetAmt" name="assetAmt" data-textrange='2' data-fixtype='2' maxlength=18
                           onkeyup="if(this.value < 0){
                                         this.value= 0;
                                     }else if (value > Math.pow(10,15)) {
                                         this.value= '';
                                     }else{
                                         this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/) // 只能输入小数点后两位
                                           }"
                           class="layui-input form-input text-number" placeholder="请输入内容"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-value="${entity?.assetAmt}" required>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div >
                <label class="layui-form-label form-label-wrap mst-lable" style="width: 470px !important;" data-th-text="支付关联方托管费">支付关联方托管费</label>
                <div class="layui-input-inline input-inline" >
                    <input type="text" id="trustFee" name="trustFee" data-th-value='${entity?.trustFee}'
                           class="layui-input form-input text-number" data-textrange='2' data-fixtype='2' maxlength=18
                           onkeyup="if(this.value < 0){
                                         this.value= 0;
                                     }else if (value > Math.pow(10,15)) {
                                         this.value= '';
                                     }else{
                                         this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/) // 只能输入小数点后两位
                                           }"
                           placeholder="请输入内容" required>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div >
                <label class="layui-form-label form-label-wrap mst-lable" style="width: 470px !important;" data-th-text="支付关联方代销费">支付关联方代销费</label>
                <div class="layui-input-inline input-inline" >
                    <input type="text" id="sellFee" name="sellFee" data-th-value='${entity?.sellFee}'
                           class="layui-input form-input text-number" data-textrange='2' data-fixtype='2' maxlength=18
                           onkeyup="if(this.value < 0){
                                         this.value= 0;
                                     }else if (value > Math.pow(10,15)) {
                                         this.value= '';
                                     }else{
                                         this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/) // 只能输入小数点后两位
                                           }"
                           placeholder="请输入内容" required>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div >
                <label class="layui-form-label form-label-wrap mst-lable" style="width: 470px !important;" data-th-text="发生其他关联交易金额">发生其他关联交易金额</label>
                <div class="layui-input-inline input-inline" >
                    <input type="text" id="otherFee" name="otherFee" data-th-value='${entity?.otherFee}'
                           class="layui-input form-input text-number" data-textrange='2' data-fixtype='2' maxlength=18
                           onkeyup="if(this.value < 0){
                                         this.value= 0;
                                     }else if (value > Math.pow(10,15)) {
                                         this.value= '';
                                     }else{
                                         this.value= value.toString().match(/^\d+(?:\.\d{0,2})?/) // 只能输入小数点后两位
                                           }"
                           placeholder="请输入内容" required>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div >
                <label class="layui-form-label form-label-wrap mst-lable" style="width: 470px !important;"
                       th:text="生效日">生效日</label>
                <div class="layui-input-inline input-inline" >
                    <input required type="text" id="effdate" name="effdate"
                           class="layui-input form-input input-dateSelect" placeholder="请选择时间"
                           th:placeholder="#{SysCommon.placeholder}"
                           th:value='${#dates.format(entity?.effdate,"yyyy-MM-dd")}'>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div >
                <label class="layui-form-label form-label-wrap mst-lable" style="width: 470px !important;"
                       th:text="生效截止日期">生效截止日期</label>
                <div class="layui-input-inline input-inline" >
                    <input required type="text" id="effdelidate" name="effdelidate"
                           class="layui-input form-input input-dateSelect" placeholder="请选择时间"
                           th:placeholder="#{SysCommon.placeholder}"
                           th:value='${#dates.format(entity?.effdelidate,"yyyy-MM-dd")}'>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
        <div class="text-center">
            <a id="RepRelDeal002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="RepRelDeal002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="RepRelDeal002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var sysDate = /*[[${sysDate}]]*/'';
    </script>
    <script data-th-src="@{/js/disclosure/information/config/repRelDeal/RepRelDeal002.js}" type="text/javascript"></script>
</div>
</body>

</html>
