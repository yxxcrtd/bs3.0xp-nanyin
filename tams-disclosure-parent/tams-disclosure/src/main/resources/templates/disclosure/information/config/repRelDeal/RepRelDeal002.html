<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="关联交易情况维护-新建">关联交易情况维护-新建</title>
</head>
<body>
<div layout:fragment="content">
    <form class=" layui-form joyin-form-wrap pro-module-form" id="submitForm">
        <input type="text" id="uuid" name="uuid" data-th-value='${entity?.uuid}' hidden>
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap" data-th-text="产品名称">产品名称</label>
                <div class="layui-input-inline input-inline">
                    <select id="prodId" name="prodId" class="input-select"
                            data-th-initValue="${entity?.prodId}"
                            data-th-data-url="@{/disclosure/information/config/repRelDeal/RepRelDeal002/queryProdIdInfo2}"
                            placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                            allowClear="true" required>
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap" data-th-text="产品主代码">产品主代码</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="prodName" name="prodName"
                           class="layui-input form-input" placeholder="请选择"
                           data-th-value="${entity?.prodId}" disabled="disabled" required>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap" data-th-text="期间投资关联机构发行证券交易金额">期间投资关联机构发行证券交易金额</label>
                <div class="layui-input-inline input-inline" >
                    <input type="text" id="bankTransAmt" name="bankTransAmt" data-th-value='${entity?.bankTransAmt}'
                           class="layui-input form-input text-number" data-textrange='2' data-fixtype='2' maxlength=17
                           placeholder="请输入内容" required>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap" th:utext="期间投资关联机构承销证券交易金额">期间投资关联机构承销证券交易金额</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="orgTransAmt" name="orgTransAmt" data-th-value='${entity?.orgTransAmt}'
                           class="layui-input form-input text-number" data-textrange='2' data-fixtype='2' maxlength=17
                           placeholder="请输入内容" required>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap" data-th-text="期间关联方作为交易对手的投融资业务的交易金额">期间关联方作为交易对手的投融资业务的交易金额</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="investTransAmt" name="investTransAmt" data-th-value='${entity?.investTransAmt}'
                           class="layui-input form-input text-number" data-textrange='2' data-fixtype='2' maxlength=17
                           placeholder="请输入内容" required>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap" data-th-text="关联方提供服务的交易金额">关联方提供服务的交易金额</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" maxlength="500" id="relateamount" name="relateamount"
                           class="layui-input form-input" placeholder="请输入内容"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-value="${entity?.relateamount}" required>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap"
                       th:text="生效日">生效日</label>
                <div class="layui-input-inline input-inline">
                    <input required type="text" id="effdate" name="effdate"
                           class="layui-input form-input input-dateSelect" placeholder="请选择时间"
                           th:placeholder="#{SysCommon.placeholder}"
                           th:value='${#dates.format(entity?.effdate,"yyyy-MM-dd")}'>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap"
                       th:text="生效截止日期">生效截止日期</label>
                <div class="layui-input-inline input-inline">
                    <input required type="text" id="effdelidate" name="effdelidate"
                           class="layui-input form-input input-dateSelect" placeholder="请选择时间"
                           th:placeholder="#{SysCommon.placeholder}"
                           th:value='${#dates.format(entity?.effdelidate,"yyyy-MM-dd")}'>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
        <div class="text-center">
            <a id="RepRelDeal002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="RepRelDeal002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="RepRelDeal002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var sysDate = /*[[${sysDate}]]*/'';
    </script>
    <script data-th-src="@{/js/disclosure/information/config/repRelDeal/RepRelDeal002.js}" type="text/javascript"></script>
</div>
</body>

</html>
