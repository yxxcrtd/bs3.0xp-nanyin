<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="投资账户信息维护-新建">投资账户信息维护-新建</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">产品主代码</label>
                <div class="layui-input-inline input-inline">
                    <select id="prodId" name="prodId" class="input-select"
                            data-th-initValue="${entity?.prodId}"
                            data-th-data-url="@{/disclosure/information/config/repInvestAccount/RepInvestAccount002/queryProdIdInfo2}"
                            placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                            allowClear="true" formatoption="false" required>
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">产品名称</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="prodName" name="prodName"
                           class="layui-input form-input" placeholder="请选择"
                           data-th-value="${entity?.prodName}" disabled="disabled" required>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">账户类型</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="accountType" name="accountType"
                           class="layui-input form-input input-select" placeholder="请选择"
                           data-th-placeholder="#{SysCommon.selectplaceholder}"
                           data-th-initValue="${entity?.accountType}"
                           data-th-data-result='${ACCOUNT_TYPE}' disabled="disabled" required>

                    </input>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">账号</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="accountNum" name="accountNum"
                           class="layui-input form-input" placeholder="请选择"
                           data-th-value="${entity?.accountNum}" required>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">账户名称</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="accountName" name="accountName"
                           class="layui-input form-input" placeholder="请选择"
                           data-th-value="${entity?.accountName}" required>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">开户单位</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="accountOpener" name="accountOpener"
                           class="layui-input form-input" placeholder="请选择"
                           data-th-value="${entity?.accountOpener}" required>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
        <div class="text-center">
            <a id="RepInvestAccount002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="RepInvestAccount002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="RepInvestAccount002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script charset="utf-8" data-th-src="@{/js/disclosure/information/config/repInvestAccount/RepInvestAccount002.js}" type="text/javascript"></script>
</div>
</body>

</html>
