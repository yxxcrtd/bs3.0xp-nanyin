<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <meta charset="utf-8">
    <title>新建产品基本信息</title>
</head>
<body>

<div class="container" layout:fragment="content">
    <style type="text/css">
        .layui-table {
            width: 100% !important;
        }

        .trast-list-left {
            float: left;
            width: 60%;
        }

        .trast-list-right {
            float: left;
            width: 30%;
            position: relative;
        }

        .trast-list-left .layui-table-view {
            height: 200px !important;
        }

        .trast-list-left .layui-table-view .layui-table-box .layui-table-body {
            height: 156px !important;
        }

        .trast-list-show {
            position: absolute;
            top: 10px;
            right: 15px;
        }

        .trast-icon-wrap {
            text-align: right;
        }

        .trast-icon-wrap i {
            color: #666;
            background: #d9ecff;
            font-size: 25px;
        }

        .trast-print-wrap {
            border: 1px solid #ddd;
        }

        .trast-print-wrap h3 {
            padding: 10px 0 10px 10px;
            border-bottom: 1px solid #ddd;
            color: #999;
        }

        .trast-print-wrap ul {
            padding: 0 10px 10px 10px;
        }

        .trast-print-wrap ul li {
            padding-top: 10px;
        }

        .trast-print-wrap ul li a {
            color: #999;
        }

        table thead tr th {
            background-color: #d9ecff;
        }

        .ptl-table .layui-table-view .layui-table-box .layui-table-header table thead tr th
        {
            padding: 1px 0;
            text-align: center;
        }

        .ptl-table .layui-table-view .layui-table-box .layui-table-body {
            height: 300px !important;
        }

        .input-radio-inline .layui-form-radio {
            margin: 0;
        }

        .input-radio-inline .layui-form-radio .layui-icon {
            color: #6d9ed9;
            font-size: 18px;
        }
    </style>


    <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
        <div class="pro-module-wrap" id="prodView">
            <div class="pro-module">
                <h3 class="pro-module-title">
                    <span class="title-des">产品基础信息</span>
                </h3>
                <div class="pro-module-item pro-item-wrap">
                    <div class="layui-form-item">
                        <input type="hidden" id="status" name="status" class="layui-input form-input" placeholder="数据状态"  data-th-value="${entity?.status}">
                        <input type="hidden" id="issueStatus" name="issueStatus" class="layui-input form-input" placeholder="发行状态"  data-th-value="${entity?.issueStatus}">
                        <input type="hidden" id="repProdType" name="repProdType" class="layui-input form-input" placeholder="信批产品类别"  data-th-value="${entity?.repProdType}">
                        <input type="hidden" id="pdStatus2" name="pdStatus2" class="layui-input form-input" placeholder=""  data-th-value="${entity?.pdStatus}">
                        <input type="hidden" id="oldRaiseAmt" name="oldRaiseAmt" class="layui-input form-input text-number" placeholder=""  data-th-value="${entity?.raiseAmt}">
                        <input type="hidden" id="prodTypeGlobal" name="prodTypeGlobal" class="layui-input form-input" placeholder="产品类型"  data-th-value="${entity?.prodType}">
                        <input type="hidden" id="openFreqGlobal" name="openFreqGlobal" class="layui-input form-input" placeholder="开放频率"  data-th-value="${entity?.openFreq}">


                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap">子产品代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" name="prodId" id="prodId"
                                       maxlength="30"  required
                                       data-th-value="${entity?.prodId}"
                                       class="layui-input form-input" placeholder="请输入内容"
                                       data-th-placeholder="#{SysCommon.placeholder}">
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap">子产品名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" name="prodName" id="prodName"
                                       maxlength="200"  required
                                       data-th-value="${entity?.prodName}"
                                       class="layui-input form-input" placeholder="请输入内容"
                                       data-th-placeholder="#{SysCommon.placeholder}">
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap ">子产品成立日期</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="setDate" name="setDate" required
                                       data-th-value='${#dates.format(entity?.setDate,"yyyy-MM-dd")}'
                                       class="layui-input form-input input-dateSelect"/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap">产品状态</label>
                            <div class="layui-input-inline input-inline">


                                <div th:if="${entity?.pdStatus==null}">
                                    <select id="pdStatus" name="pdStatus" required placeholder="请选择"
                                            data-th-initValue="${entity?.pdStatus==null?'01':entity?.pdStatus}"
                                            class="layui-input form-input input-select" disabled
                                            data-th-data-result="${DIS_PROD_STATUS}">
                                    </select>
                                </div>
                                <div th:if="${entity?.pdStatus !=null}">
                                    <select id="pdStatus" name="pdStatus" required placeholder="请选择"
                                            data-th-initValue="${entity?.pdStatus==null?'01':entity?.pdStatus}"
                                            class="layui-input form-input input-select"
                                            data-th-data-result="${DIS_PROD_STATUS}">
                                    </select>
                                </div>

                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap">产品系列</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" name="prodSeries" id="prodSeries"
                                       data-th-value="${entity?.prodSeries}"
                                       maxlength="100"  required
                                       class="layui-input form-input" placeholder="请输入内容"
                                       data-th-placeholder="#{SysCommon.placeholder}">
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap">产品名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" name="pProdName" id="pProdName"
                                       maxlength="200"  required
                                       data-th-value="${entity?.pProdName}"
                                       class="layui-input form-input" placeholder="请输入内容"
                                       data-th-placeholder="#{SysCommon.placeholder}">
                            </div>
                        </div>

                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap">产品简称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" name="prodAbbr" id="prodAbbr"
                                       maxlength="100"  required
                                       data-th-value="${entity?.prodAbbr}"
                                       class="layui-input form-input" placeholder="请输入内容"
                                       data-th-placeholder="#{SysCommon.placeholder}">
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap">产品登记编码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" name="prodRe" id="prodRe"
                                       maxlength="15"  required
                                       data-th-value="${entity?.prodRe}"
                                       class="layui-input form-input" placeholder="请输入内容"
                                       data-th-placeholder="#{SysCommon.placeholder}">
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap">产品主代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" name="pProdId" id="pProdId"
                                       maxlength="30"  required
                                       data-th-value="${entity?.pProdId}"
                                       class="layui-input form-input" placeholder="请输入内容"
                                       data-th-placeholder="#{SysCommon.placeholder}">
                            </div>
                        </div>
                    </div>

                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">募集起始日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="raiseStrdate" name="raiseStrdate" required
                                   data-th-value='${#dates.format(entity?.raiseStrdate,"yyyy-MM-dd")}'
                                   class="layui-input form-input input-dateSelect"/>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap ">募集结束日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="raiseEnddate" name="raiseEnddate" required
                                   data-th-value='${#dates.format(entity?.raiseEnddate,"yyyy-MM-dd")}'
                                   class="layui-input form-input input-dateSelect"/>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">产品募集金额</label>
                        <div class="layui-input-inline input-inline">
                            <input class="layui-input form-input text-number" name="raiseAmt" id="raiseAmt"
                                   data-th-value="${entity?.raiseAmt}"
                                   maxlength="15"  required  placeholder="请输入内容"
                                   onkeyup="if(this.value < 0){
                                                   this.value= 0;
                                               }else{
                                                  this.value= value.toString().match(/^\d+(?:\.\d{0,4})?/) // 只能输入小数点后4位
                                               }"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap ">产品成立日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="pSetDate" name="pSetDate" required
                                   data-th-value='${#dates.format(entity?.pSetDate,"yyyy-MM-dd")}'
                                   class="layui-input form-input input-dateSelect"/>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap ">产品到期日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="mdate" name="mdate" required
                                   data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
                                   class="layui-input form-input input-dateSelect"/>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">募集方式</label>
                        <div class="layui-input-inline input-inline">
                            <select id="raiseType" name="raiseType"  required
                                    data-th-initValue="${entity?.raiseType}"
                                    placeholder="请选择"
                                    class="layui-input form-input input-select"
                                    data-th-data-result="${DIS_RAISE_TYPE}"
                            ></select>
                        </div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">产品类型</label>
                        <div class="layui-input-inline input-inline">
                            <select id="prodType" name="prodType" required
                                    data-th-initValue="${entity?.prodType}"
                                    placeholder="请选择"   childrenIds="issuingWay"
                                    class="layui-input form-input input-select"
                                    data-th-data-result="${DIS_PROD_TYPE}"
                            ></select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">发行方式</label>
                        <div class="layui-input-inline input-inline">
                            <select id="issuingWay" name="issuingWay"  required
                                    data-th-initValue="${entity?.issuingWay}" placeholder="请选择"
                                    class="layui-input form-input input-select"  childrenIds="profitType"
                                    data-th-data-result="${ISSUING_WAY}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">开放频率</label>
                        <div class="layui-input-inline input-inline">
                            <select id="openFreq" name="openFreq" placeholder="请选择"
                                    data-th-initValue="${entity?.openFreq}"
                                    class="layui-input form-input input-select"
                                    data-th-data-result="${OPEN_FREQ}">
                            </select>
                        </div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">固定持有天数</label>
                        <div class="layui-input-inline input-inline">
                            <input type="number" name="holdday" id="holdday"
                                   data-th-value="${entity?.holdday}" maxlength="5"
                                   class="layui-input form-input" placeholder="请输入内容"
                                   onkeyup="if(this.value < 0){
                                                   this.value= 0;
                                               }else{
                                                  this.value= value.toString().match(/^\d+(?:\.\d{0,4})?/) // 只能输入小数点后4位
                                               }"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>

                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">产品运作方式</label>
                        <div class="layui-input-inline input-inline">
                            <select id="profitType" name="profitType"  required
                                    data-th-initValue="${entity?.profitType}"  placeholder="请选择"
                                    class="layui-input form-input input-select"
                                    data-th-data-result="${DIS_PROFIT_TYPE}"
                                    parentIds="issuingWay"
                            ></select>

                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">是否客户周期型产品</label>
                        <div class="layui-input-inline input-inline">
                            <select id="isPeriod" name="isPeriod" required  placeholder="请选择"
                                    data-th-initValue="${entity?.isPeriod}"
                                    class="layui-input form-input input-select"
                                    data-th-data-result="${YES_NO}"
                            ></select>
                        </div>
                    </div>

                </div>

                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">是否分级产品</label>
                        <div class="layui-input-inline input-inline">
                            <select id="isGrade" name="isGrade"  required  placeholder="请选择"
                                    data-th-initValue="${entity?.isGrade}"
                                    class="layui-input form-input input-select"
                                    data-th-data-result="${YES_NO}"
                            ></select>
                        </div>
                    </div>

                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">是否指数型产品</label>
                        <div class="layui-input-inline input-inline">
                            <select id="isIndex" name="isIndex" required  placeholder="请选择"
                                    data-th-initValue="${entity?.isIndex}"
                                    class="layui-input form-input input-select"
                                    data-th-data-result="${YES_NO}"
                            ></select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">投资性质</label>
                        <div class="layui-input-inline input-inline">
                            <select id="natureInvest" name="natureInvest" required
                                    data-th-initValue="${entity?.natureInvest}" placeholder="请选择"
                                    class="layui-input form-input input-select"
                                    data-th-data-result="${DIS_INVEST_TYPE}"
                            ></select>
                        </div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">产品托管人名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="acctChnname" id="acctChnname"
                                   data-th-value="${entity?.acctChnname}" required
                                   class="layui-input form-input" placeholder="请输入内容"
                                   maxlength="50"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">托管部门</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="trustpart" id="trustpart" required
                                   data-th-initValue="${entity?.trustpart==null?'南京银行资产托管部':entity?.trustpart}"
                                   data-th-value="${entity?.trustpart==null?'南京银行资产托管部':entity?.trustpart}"
                                   class="layui-input form-input" placeholder="请输入内容"
                                   maxlength="100"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>

                </div>
            </div>

            <div class="pro-module">
                <h3 class="pro-module-title">
                    <span class="title-des">业绩比较基准</span>
                </h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap">产品业绩比较基准</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" name="performCompare" id="performCompare"
                                       data-th-value="${entity?.performCompare}"
                                       class="layui-input form-input" placeholder="请输入内容"
                                       data-th-placeholder="#{SysCommon.placeholder}">
                            </div>
                        </div>
                    </div>
                    <!--<div class="layui-form-item" id="performDiv" >
                        <div class="form-inline-wrap" >
                            <div class="layui-input-inline input-inline" style="padding-left:15%;">
                                 <table id="mockTradeTable" class="layui-table"></table>
                            </div>
                        </div>
                    </div>-->
                    <div class="layui-form-item" id="performDiv">
                        <table id="mockTradeTable" class="layui-table"></table>
                    </div>

                </div>
            </div>


        </div>
    </form>
    <div class="layui-col-md11" style="margin: 10px;">
        <div class="text-center">
            <a id="ProdInfo002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="ProdInfo002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
            <a id="ProdInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var issuePartyId_New = [[${issuePartyId_New}]];
        var basicChangeList = [[${entity?.basicChangeList}]];
        var QUOTA_CODE = [[${QUOTA_CODE}]];
        var isIndexUpdate = [[${entity?.isIndex}]];

    </script>
    <script data-th-src="@{/js/disclosure/information/config/repprodinfo/ProdInfo002.js}"
            type="text/javascript"></script>
</div>

</body>
</html>
