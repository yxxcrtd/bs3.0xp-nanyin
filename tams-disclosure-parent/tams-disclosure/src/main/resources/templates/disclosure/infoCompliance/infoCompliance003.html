<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title>信披合规管理</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm"
          style="background: #ffffff; padding: 10px 0;">
        <input type="hidden" id="pageModel" name="pageModel" th:value="${pageModel}" />
        <input id="seqno" name="seqno" type="hidden" data-th-value="${seqno}">
        <div class="layui-form-item">
            <label class="layui-form-label form-label-wrap">对选中的【审核通过】的模板进行开发状态变更</label>
        </div>
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap">开发状态<i class="iconfont must" style="display: inline;">*</i></label>
                <div class="layui-input-inline input-inline">
                    <select id="infoDevStatus" name="infoDevStatus" class="layui-input form-input input-select"
                            data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${INFO_DEV_STATUS}" allowClear="true">
                    </select>
                </div>
            </div>

        </div>

        <div class="layui-col-md11" style="margin: 50px;">
            <div class="text-center">
                <a id="InfoCompliance003_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="InfoCompliance003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>

    </form>

</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var indexName = /*[[${indexName}]]*/'';
        var priId = /*[[${priId}]]*/'';
        //$("#priId").val(priId);
    </script>
    <script data-th-src="@{/js/disclosure/infoCompliance/infoCompliance003.js}" type="text/javascript"></script>
</div>
</body>
</html>
