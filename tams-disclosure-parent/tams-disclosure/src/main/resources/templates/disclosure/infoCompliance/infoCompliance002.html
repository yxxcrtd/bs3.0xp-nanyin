<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title>信披合规管理</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm"
          style="background: #ffffff; padding: 10px 0;">
        <input type="hidden" id="pageModel" name="pageModel" th:value="${pageModel}" />
        <input type="hidden" id="viewFlag" name="viewFlag" data-th-value="${viewFlag}">
        <input type="hidden" id="seqno" name="seqno" data-th-value="${entity?.seqno}">
        <input type="hidden" id="userName" name="userName" data-th-value="${user?.userName}">
        <input type="hidden" id="realName" name="realName" data-th-value="${user?.realName}">

        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title">
                    <span class="title-des">基本信息<i class="iconfont must" style="display: inline;">*</i></span>
                    <i class="iconfont icon-arrow-down pro-down-icon"></i>
                </h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap">类型<i class="iconfont must" style="display: inline;">*</i></label>
                            <div class="layui-input-inline input-inline">
                                <select id="infoType" name="infoType" class="layui-input form-input input-select" th:initValue="${entity?.infoType}"
                                        data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${INFO_TYPE}" allowClear="true">
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap">报表/模板名称<i class="iconfont must" style="display: inline;">*</i></label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" name ="infoName" id="infoName" data-th-placeholder="#{SysCommon.placeholder}"
                                       class="layui-input form-input" maxlength="100" data-th-value="${entity?.infoName}"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-component" th:data-path="@{/disclosure/infoCompliance/uploadFile001/init}"
             th:data-params="|{viewFlag:'${viewFlag ?: ''}',fileType: '01', businessId: '${seqno ?: ''}'}|"></div>

        <div class="page-component" th:data-path="@{/disclosure/infoCompliance/uploadFile002/init}"
             th:data-params="|{viewFlag:'${viewFlag ?: ''}',fileType: '02', businessId: '${seqno ?: ''}'}|"></div>

        <div class="pro-module-wrap">
            <div class="pro-module">
                <div class="pro-module-item" style="padding:8px">
                    <div class="layui-form-item">
                        <label style="float: left">备注<i class="iconfont must" style="display: inline;">*</i></label>
                        <div class="layui-input-inline input-inline" style="margin:0 10px;width: 80%!important;">
                            <textarea id="remark" name="remark" maxlength="500" th:text="${entity?.remark}"
                                      class="layui-textarea" placeholder="请输入内容"
                                      th:placeholder="#{SysCommon.placeholder}"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>

       <!-- <div data-th-if="${showEdit}" class="page-component" th:data-path="@{/disclosure/infoCompliance/uploadFile003/init}"
             th:data-params="|{fileType: '03',businessId: '${seqno ?: ''}', editable:'${editable ?: false}'}|"></div>-->

        <div class="pro-module-wrap" id="commentContent" style="display: none">
            <div class="pro-module">
                <h3 class="pro-module-title">
                    <span class="title-des">修订意见<i class="iconfont must" style="display: inline;">*</i></span>
                    <i class="iconfont icon-arrow-down pro-down-icon"></i>
                </h3>
                <div class="pro-module-item" style="padding: 8px;">
                    <div class="layui-form-item" data-th-if="${comments != null and !comments.isEmpty()}">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th style="width: 100px">审批人</th>
                                    <th style="width: 180px">修改时间</th>
                                    <th style="width: calc(100% - 280px)">修订意见</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr data-th-each="item : ${comments}">
                                    <td data-th-text="${item.createUser}"></td>
                                    <td data-th-text="${#dates.format(item.createTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
                                    <td><div style="max-height: 60px;overflow-y:scroll;word-break:break-word;" data-th-text="${item.comment}"></div></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="layui-form-item" id="commentDiv" style="display: none">
                        <label style="float: left">修订意见<i class="iconfont must" style="display: inline;">*</i></label>
                        <div class="layui-input-inline input-inline" style="margin:0 10px;width: 80%!important;">
                            <textarea data-th-data-ignore="true" id="comment" name="comment" maxlength="500"
                                      class="layui-textarea" placeholder="请输入内容"
                                      th:placeholder="#{SysCommon.placeholder}"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-col-md11" style="margin: 50px;">
            <div class="text-center">
                <a id="InfoCompliance002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="InfoCompliance002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="InfoCompliance002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>

    </form>

</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/disclosure/infoCompliance/infoCompliance002.js}" type="text/javascript"></script>
</div>
</body>
</html>
