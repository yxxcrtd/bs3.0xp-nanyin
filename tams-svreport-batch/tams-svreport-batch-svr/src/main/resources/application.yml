server:
  port: 8084
spring:
  application:
    name: SVREPORT-BATCH-SERVER #服务名称
  profiles:
    active: dev
  datasource:
    driverClassName: oracle.jdbc.driver.OracleDriver
#     driverClassName: com.ibm.db2.jcc.DB2Driver
#     validationQuery: SELECT 1 FROM SYSIBM.SYSDUMMY1
batch:
  sysCode: REP
  properties:
    chunkNumber: 100
    concurrency: 10
    queueCapacity: 50
    maxExeUser: 5
    maxThreadPerUser: 4 #定时任务并发数
application:
    reportSelectOrDeleteCountForShenFen: 100 #数据批量一次查询或者删除条数(身份信息用)
    reportCbFeedBackHandleCountOneTime: 10000 #中债反馈文件内容单次处理数据条数
    interfMaxCorePoolSize: 20 #上游接口解析读取文件处理最大线程数
    maxDataCountOneTimeForInvestholdInfo : 50 #上游接口解析读取文件处理中持有信息批量查询单次最大查询主键数（江苏银行50）
    reportInterfIsNeedOkFile: '01' #上游接口解析读取文件处理中，是否需要.ok传输完成标志文件（01：需要 02：不需要）
    reportInterfOkFileExtension: ok #上游接口解析读取文件处理中，传输完成标志文件的扩展名（默认为ok）
    reportInsertCount: 15 #数据批量一次性insert条数
    reportSelectOrDeleteCount: 50 #数据批量一次查询或者删除条数
    reportInsertLongCount: 10 #数据批量一次性insert条数(单条数据字段较多)
    reportInterfFileEncoding: UTF-8 #上游接口文件编码格式
    reportInterfOneTimeDataCount: 1000 #上游接口解析读取文件处理,单线程处理数据条数
    reportInterfOneTimeSqlLdrDataCount: 200000 #上游接口解析读取文件处理,单次sqlldr处理最大数据条数
    reportInterfOneTimeSqlLdrCommitCount: 10000 #上游接口解析读取文件处理,单次sqlldr处理单次提交数
    reportInterfSplitCharacter: '|' #上游txt文件解析分割符
eureka:
  instance:
    hostname: ${spring.cloud.client.ipAddress}
    instanceId: ${spring.cloud.client.ipAddress}:${server.port}
    preferIpAddress: true
  client:
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
      defaultZone: http://192.168.70.146:1111/eureka/

---
spring:
  profiles: dev
  datasource:
    url: jdbc:oracle:thin:@(DESCRIPTION=(ADDRESS_LIST=(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.90.111)(PORT=1521))(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.90.112)(PORT=1521))(LOAD_BALANCE=no)(FAILOVER=on))(CONNECT_DATA=(SERVICE_NAME=tamsdbpdb)))
    username: tams212
    password: tams212
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    reportSqlldrDatabaseName: 192.168.70.78:1521:orcl #sqlldr用数据库连接，必须保持这种格式
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.net.ReadTimeout=50000 # 批处理不加该配置

#base数据库配置
base:
  datasource:
    driverClassName: oracle.jdbc.driver.OracleDriver
    url: jdbc:oracle:thin:@(DESCRIPTION=(ADDRESS_LIST=(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.90.111)(PORT=1521))(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.90.112)(PORT=1521))(LOAD_BALANCE=no)(FAILOVER=on))(CONNECT_DATA=(SERVICE_NAME=tamsdbpdb)))
    username: tams212
    password: tams212
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    validationQuery: SELECT 1 FROM DUAL
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.net.ReadTimeout=50000 # 批处理不加该配置

#interf数据库配置
interf:
  datasource:
    driverClassName: oracle.jdbc.driver.OracleDriver
    url: jdbc:oracle:thin:@(DESCRIPTION=(ADDRESS_LIST=(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.90.111)(PORT=1521))(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.90.112)(PORT=1521))(LOAD_BALANCE=no)(FAILOVER=on))(CONNECT_DATA=(SERVICE_NAME=tamsdbpdb)))
    username: tams212
    password: tams212
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    validationQuery: SELECT 1 FROM DUAL
    type: org.apache.commons.dbcp2.BasicDataSource  # interf 数据源和stress 数据源必须添加
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.net.ReadTimeout=50000 # 批处理不加该配置


