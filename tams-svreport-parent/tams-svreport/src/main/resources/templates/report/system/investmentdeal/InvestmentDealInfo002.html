<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
  <title>投资交易信息新建</title>
</head>
<body>
<div layout:fragment="content">
  <form class="layui-form joyin-form-wrap" id="submitForm"style="padding:0 0 5px 0;" >

    <div class="layui-form-item">

      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">行内交易编码</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="tradeCode" name="tradeCode"
                 data-th-value="${entity?.tradeCode}" class="layui-input form-input"
                 placeholder="请输入内容" disabled required >
        </div>
      </div>

      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">产品代码</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="prodId" name="prodId"
                 data-th-value="${entity?.prodId}" class="layui-input form-input"
                 placeholder="请输入内容" required>
        </div>
      </div>

    </div>

    <div class="layui-form-item">

      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">行内资产/负债编码</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="assetCode" name="assetCode"
                 data-th-value="${entity?.assetCode}" class="layui-input form-input"
                 placeholder="请输入内容">
        </div>
      </div>

      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">币种</label>
        <div class="layui-input-inline input-inline">
          <select  id="ccy" name="ccy"
                   data-th-initValue="${entity?.ccy}"
                   class="layui-input form-input input-select"
                   data-th-data-result="${CURRENCY_CHB}" required
          ></select>
        </div>
      </div>

    </div>

    <div class="layui-form-item">

      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">发生金额</label>
        <div class="layui-input-inline input-inline">
          <input type="text" data-fixtype="2" unit="1"
                 class="layui-input form-input text-money" id="amt"
                 name="amt" data-th-value="${entity?.amt}"
                 data-moneymemory="" data-th-data-textrange="2"
                 required="required">
        </div>
      </div>

      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">数量</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="num" name="num"
                 data-th-value='${entity?.num}'
                 class="layui-input form-input text-number" required/>
        </div>
      </div>

    </div>

    <div class="layui-form-item">

      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">资产计量方式</label>
        <div class="layui-input-inline input-inline">
          <select  id="assetMethod" name="assetMethod"
                   data-th-initValue="${entity?.assetMethod}"
                   class="layui-input form-input input-select"
                   data-th-data-result="${SVR_ASSET_METHOD}"
          ></select>
        </div>
      </div>

      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">资金流动类型</label>
        <div class="layui-input-inline input-inline">
          <select  id="curAssetType" name="curAssetType"
                   data-th-initValue="${entity?.curAssetType}"
                   class="layui-input form-input input-select"
                   data-th-data-result="${SVR_FUND_FLOW_TYPE}" required
          ></select>
        </div>
      </div>

    </div>

    <div class="layui-form-item">

      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">资金流动类型说明</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="curAssetdetType" name="curAssetdetType"
                 data-th-value="${entity?.curAssetdetType}" class="layui-input form-input"
                 placeholder="请输入内容" required>
        </div>
      </div>

      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">交易日</label>
        <div class="layui-input-inline input-inline">
          <input type="text" name="dealdate" id="dealdate"
                 class="layui-input form-input input-dateSelect"
                 data-th-value='${#dates.format(entity?.dealdate,"yyyy-MM-dd")}'
                 required>
        </div>
      </div>

    </div>

    <div class="layui-form-item">

      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">交易对手</label>
        <div class="layui-input-inline input-inline">
          <select id="tradeCounter" name="tradeCounter"
                  data-th-data-url='@{/svreport/system/investmentdeal/InvestmentDealInfo002/getTradeCounter}'
                  data-th-data-formatoption=true
                  class="input-select" placeholder="请选择"
                  data-th-placeholder="#{SysCommon.selectplaceholder}"
                  allowClear="true"
                  data-th-initValue="${entity?.tradeCounter}"
                  >
          </select>
        </div>
      </div>

      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">交易对手方类型</label>
        <div class="layui-input-inline input-inline">
          <select  id="rivalPartyType" name="rivalPartyType"
                   data-th-initValue="${entity?.rivalPartyType}"
                   class="layui-input form-input input-select"
                   data-th-data-result="${COUNTER_TYPE}" required
          ></select>
        </div>
      </div>

    </div>

    <div class="layui-form-item">

      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">单位成交价格（全价）</label>
        <div class="layui-input-inline input-inline">
          <input type="text" data-fixtype="4" unit="1"
                 class="layui-input form-input text-money" id="unitPriceFull"
                 name="unitPriceFull" data-th-value="${entity?.unitPriceFull}"
                 data-th-data-textrange="4"
                 >
        </div>
      </div>

      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">单位成交价格（净价）</label>
        <div class="layui-input-inline input-inline">
          <input type="text" data-fixtype="4" unit="1"
                 class="layui-input form-input text-money" id="unitPriceNet"
                 name="unitPriceNet" data-th-value="${entity?.unitPriceNet}"
                  data-th-data-textrange="4"
                 >
        </div>
      </div>

    </div>

    <div class="layui-form-item">

      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">到期收益率</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="endRate" name="endRate"
                 th:value="${entity?.endRate}"
                 class="layui-input form-input text-number" data-textrange="5"/>
          <span class="input-right-show">%</span>
        </div>
      </div>

      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">成交编号/合同号</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="contractCode" name="contractCode"
                 th:data-th-value="${entity?.contractCode}" class="layui-input form-input"
                 placeholder="请输入内容" required>
        </div>
      </div>

    </div>

    <div class="layui-form-item">

      <div class="form-inline-wrap">
        <label class="layui-form-label form-label-wrap">备注</label>
        <div class="layui-input-inline input-inline" style="width:81%">
          <input type="text" id="remark" name="remark"  data-th-value="${entity?.remark}"
                 class="layui-input form-input" placeholder="请输入内容"
                 data-th-placeholder="#{SysCommon.placeholder}">
        </div>
      </div>

    </div>


  </form>
  <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
    <div class="text-center">
      <a id="ChbMstCounterParty002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
      <a id="ChbMstCounterParty002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
    </div>
  </div>
</div>
<div layout:fragment="script">
  <script data-th-inline="javascript" type="text/javascript">
    var COUNTER_TYPE = [[${COUNTER_TYPE}]];

  </script>
  <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/system/investmentdeal/InvestmentDealInfo002.js}" type="text/javascript"></script>
</div>
</body>

</html>
