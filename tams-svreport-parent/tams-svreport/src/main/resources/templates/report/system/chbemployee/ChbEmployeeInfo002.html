<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
  <title data-th-text="#{ChbEmployeeInfo002}">从业人员信息新建</title>
</head>
<body>
<div layout:fragment="content">
  <form class="layui-form joyin-form-wrap" id="submitForm"style="padding:0 0 5px 0;" >
    <div class="layui-form-item">
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">身份证号码</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="identifyNumber" name="identifyNumber" data-th-value="${entity?.identifyNumber}" class="layui-input form-input" placeholder="请输入内容">
          <input type="hidden" id="type" name="type" data-th-value="${entity?.type}" class="layui-input form-input" >
          <input type="hidden" id="oldIdentifyNumber" name="oldIdentifyNumber" data-th-value="${entity?.oldIdentifyNumber}" class="layui-input form-input" >
          <input type="hidden" id="oldEmployeeType" name="oldEmployeeType" data-th-value="${entity?.oldEmployeeType}" class="layui-input form-input" >
        </div>
      </div>
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">从业人员类型</label>
        <div class="layui-input-inline input-inline">
          <select id="employeeType" name="employeeType" data-th-initValue="${entity?.employeeType}"
                  data-th-data-result='${SVR_EMPLOYEE_TYPE}'
                  data-th-data-formatoption=true data-th-data-parentids="orgCode" class="input-select"
                  placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                  allowClear="true"
                  >
          </select>
        </div>
      </div>
    </div>

    <div class="layui-form-item">
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">姓名</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="employeeName" name="employeeName" data-th-value="${entity?.employeeName}"
                 class="layui-input form-input" placeholder="请输入内容">
        </div>
      </div>
      <div class="form-inline-wrap">
        <label class="layui-form-label form-label-wrap" >性别</label>
        <div class="layui-input-inline input-inline">
          <select id="employeeSex"  data-th-initValue="${entity?.employeeSex}"
                  data-th-data-result='${SVR_SEX}'
                  data-th-data-formatoption=true
                  class="input-select" placeholder="请选择"
                  data-th-placeholder="#{SysCommon.selectplaceholder}"
                  allowClear="true"
                  >
          </select>
        </div>
      </div>
    </div>

    <div class="layui-form-item">
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">发行机构代码</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="issuePartyId" name="issuePartyId" data-th-value="${entity?.issuePartyId}"
                 class="layui-input form-input" placeholder="请输入内容">
        </div>
      </div>
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">所属总行或分支行</label>
        <div class="layui-input-inline input-inline">
          <select id="belongsBank"  data-th-initValue="${entity?.belongsBank}"
                  data-th-data-result='${SVR_BELONGS_BANK}'
                  data-th-data-formatoption=true  class="input-select" placeholder="请选择"
                  data-th-placeholder="#{SysCommon.selectplaceholder}"
                  allowClear="true" >
          </select>
        </div>
      </div>
    </div>

    <div class="layui-form-item">
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">所属区域</label>
        <div class="layui-input-inline input-inline">
          <select id="belongsPlace"  data-th-initValue="${entity?.belongsPlace}"
                  data-th-data-result='${SVR_BUY_PLACE}'
                  data-th-data-formatoption=true  class="input-select" placeholder="请选择"
                  data-th-placeholder="#{SysCommon.selectplaceholder}"
                  allowClear="true" >
          </select>
        </div>
      </div>
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">具体单位名称</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="companyName" name="companyName" data-th-value="${entity?.companyName}"
                 class="layui-input form-input" placeholder="请输入内容">
        </div>
      </div>
    </div>

    <div class="layui-form-item">
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">所属部门</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="belongsDept" name="belongsDept" data-th-value="${entity?.belongsDept}"
                 class="layui-input form-input" placeholder="请输入内容">
        </div>
      </div>
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">职位</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="position" name="position" data-th-value="${entity?.position}"
                 class="layui-input form-input" placeholder="请输入内容">
        </div>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">首次参加工作时间</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="firsttime2work" name="firsttime2work"
                 placeholder="请选择日期"
                 class="layui-input form-input"
                 data-th-Value="${entity?.firsttime2work}">
        </div>
      </div>
      <div class="form-inline-wrap">
        <label class="layui-form-label form-label-wrap" >首次从事理财业务时间</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="firsttime2finwork" name="firsttime2finwork"
                 placeholder="请选择日期"
                 class="layui-input form-input"
                 data-th-Value="${entity?.firsttime2finwork}">
        </div>
      </div>
    </div>

    <div class="layui-form-item">
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">学历</label>
        <div class="layui-input-inline input-inline">
          <select id="education"  data-th-initValue="${entity?.education}"
                  data-th-data-result='${SVR_EDUCATION}'
                  data-th-data-formatoption=true  class="layui-input form-input input-select" placeholder="请选择"
                  data-th-placeholder="#{SysCommon.selectplaceholder}"
                  allowClear="true" >
          </select>
        </div>
      </div>
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">学位</label>
        <div class="layui-input-inline input-inline">
          <select id="academicDegree"  data-th-initValue="${entity?.academicDegree}"
                  data-th-data-result='${SVR_ACADEMIC_DEGREE}'
                  data-th-data-formatoption=true  class="layui-input form-input input-select" placeholder="请选择"
                  data-th-placeholder="#{SysCommon.selectplaceholder}"
                  allowClear="true" >
          </select>
        </div>
      </div>
    </div>

    <div class="layui-form-item">
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">专业技术职称</label>
        <div class="layui-input-inline input-inline">
          <select id="professionalTitle"  data-th-initValue="${entity?.professionalTitle}"
                  data-th-data-result='${SVR_PROFESSIONAL_TITLE}'
                  data-th-data-formatoption=true  class="input-select" placeholder="请选择"
                  data-th-placeholder="#{SysCommon.selectplaceholder}"
                  allowClear="true" >
          </select>
        </div>
      </div>
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">理财专业证书</label>
        <div class="layui-input-inline input-inline">
          <select id="finProfessionalCrtf"  data-th-initValue="${entity?.finProfessionalCrtf}"
                  data-th-data-result='${SVR_FIN_PROFESSIONAL_CRTF}'
                  data-th-data-formatoption=true  class="input-select" placeholder="请选择"
                  data-th-placeholder="#{SysCommon.selectplaceholder}"
                  allowClear="true" multiple="true">
          </select>
        </div>
      </div>
    </div>

    <div class="layui-form-item">
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">理财登记培训证书编号</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="finTrainingNo" name="finTrainingNo" data-th-value="${entity?.finTrainingNo}"
                 class="layui-input form-input" placeholder="请输入内容">
        </div>
      </div>
      <div class="form-inline-wrap">
        <label class="layui-form-label form-label-wrap" >所获奖励</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="awards" name="awards" data-th-value="${entity?.awards}"
                 class="layui-input form-input" placeholder="请输入内容">
        </div>
      </div>
    </div>

    <div class="layui-form-item">
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">办公电话</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="officeTel" name="officeTel" data-th-value="${entity?.officeTel}"
                 class="layui-input form-input" placeholder="请输入内容">
        </div>
      </div>
      <div class="form-inline-wrap">
        <label class="layui-form-label form-label-wrap" >移动电话</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="mobileTel" name="mobileTel" data-th-value="${entity?.mobileTel}"
                 class="layui-input form-input" placeholder="请输入内容">
        </div>
      </div>
    </div>

    <div class="layui-form-item">
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">电子邮箱</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="mail" name="mail" data-th-value="${entity?.mail}"
                 class="layui-input form-input" placeholder="请输入内容">
        </div>
      </div>
      <div class="form-inline-wrap">
        <label class="layui-form-label form-label-wrap" >登记业务分类</label>
        <div class="layui-input-inline input-inline">
          <select id="regBusiType"  data-th-initValue="${entity?.regBusiType}"
                  data-th-data-result='${SVR_REG_BUSI_TYPE}'
                  data-th-data-formatoption=true  class="input-select" placeholder="请选择"
                  data-th-placeholder="#{SysCommon.selectplaceholder}"
                  allowClear="true" multiple="true">
          </select>
        </div>
      </div>
    </div>

    <div class="layui-form-item">
      <div class="form-inline-wrap">
        <label class="layui-form-label form-label-wrap" >登记人员类别</label>
        <div class="layui-input-inline input-inline">
          <select id="regEmployeeType"  data-th-initValue="${entity?.regEmployeeType}"
                  data-th-data-result='${SVR_REG_EMPLOYEE_TYPE}'
                  data-th-data-formatoption=true  class="input-select" placeholder="请选择"
                  data-th-placeholder="#{SysCommon.selectplaceholder}"
                  allowClear="true" multiple="true">
          </select>
        </div>
      </div>
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">备注</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="remark" name="remark" data-th-value="${entity?.remark}"
                 class="layui-input form-input" placeholder="请输入内容">
        </div>
      </div>
    </div>

  </form>
  <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
    <div class="text-center">
      <a id="ChbEmployeeInfo002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
      <a id="ChbEmployeeInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
    </div>
  </div>
</div>
<div layout:fragment="script">
  <!--<script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>-->
  <script data-th-src="@{/js/report/system/chbemployee/ChbEmployeeInfo002.js}" type="text/javascript"></script>
</div>
</body>

</html>
