<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
  <title data-th-text="#{MstBondCreditRating002}">债券评级信息新建</title>
</head>
<body>
<div layout:fragment="content">
  <form class="layui-form joyin-form-wrap" id="submitForm"style="padding:0 0 5px 0;" >
    <div class="layui-form-item">
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">债券代码</label>
        <div class="layui-input-inline input-inline">
          <!--<input type="text" id="oCode" name="oCode" data-th-value="${entity?.oCode}" class="layui-input form-input" placeholder="请输入内容">-->
          <select id="oCode" name="oCode"
                  data-th-data-url='@{/svreport/system/mstbond/MstBondCreditRating001/getoCode}'
                  data-th-data-formatoption=true data-th-data-parentids="orgCode"
                  class="input-select" placeholder="请选择"
                  data-th-placeholder="#{SysCommon.selectplaceholder}"
                  allowClear="true"
                  data-th-initValue="${entity?.oCode}"
                  >
          </select>
          <input type="hidden" id="type" name="type" data-th-value="${entity?.type}" class="layui-input form-input" >
          <input type="hidden" id="oldGradeOrgId" name="oldGradeOrgId" data-th-value="${entity?.oldGradeOrgId}" class="layui-input form-input" >
          <input type="hidden" id="oldGradeDateStr" name="oldGradeDateStr" data-th-value="${entity?.oldGradeDateStr}" class="layui-input form-input" >
          <input type="hidden" id="oldOType" name="oldOType" data-th-value="${entity?.oldOType}" class="layui-input form-input" >
        </div>
      </div>
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">评级机构</label>
        <div class="layui-input-inline input-inline">
          <select id="gradeOrgId" name="gradeOrgId" data-th-initValue="${entity?.gradeOrgId}"
                  data-th-data-result='${GRADE_PARTY}'
                  data-th-data-formatoption=true data-th-data-parentids="orgCode" class="input-select"
                  placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                  allowClear="true"
                  >
          </select>
        </div>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">评级日期</label>
        <div class="layui-input-inline input-inline">
          <!--<input id="gradeDate" type="text" name="gradeDate"
                 class="layui-input form-input input-dateSelect"
                 placeholder="请选择启用日期"
                 data-th-value="${entity?.gradeDate}"/>-->
          <input type="text" id="gradeDate" name="gradeDate"
                 placeholder="请选择日期"
                 class="layui-input form-input input-dateSelect"
                 data-th-Value="${entity?.gradeDateStr}" allowClear="true">
        </div>
      </div>
      <div class="form-inline-wrap">
        <label class="layui-form-label form-label-wrap" >评级类型</label>
        <div class="layui-input-inline input-inline">
          <select id="oType"  data-th-initValue="${entity?.oType}"
                  data-th-data-result='${MAIN_GRADE_TYPE}'
                  data-th-data-formatoption=true
                  class="input-select" placeholder="请选择"
                  data-th-placeholder="#{SysCommon.selectplaceholder}"
                  allowClear="true"
                  >
          </select>
        </div>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">评级结果</label>
        <div class="layui-input-inline input-inline">
          <select id="gradeResult"  data-th-initValue="${entity?.gradeResult}"
                  data-th-data-result='${CHB_BODY_GRADE}'
                  data-th-data-formatoption=true  class="input-select" placeholder="请选择"
                  data-th-placeholder="#{SysCommon.selectplaceholder}"
                  allowClear="true" >
          </select>
        </div>
      </div>
    </div>
  </form>
  <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
    <div class="text-center">
      <a id="MstBondCreditRating002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
      <a id="MstBondCreditRating002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
    </div>
  </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/system/mstbond/MstBondCreditRating002.js}" type="text/javascript"></script>
</div>
</body>

</html>
