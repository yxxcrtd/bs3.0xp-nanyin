<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="#{ChbPrdBaseinfo002}">产品基本信息新建</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm" style="padding:0 0 5px 0;">
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">产品代码</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="prodId" name="prodId" data-th-value="${entity?.prodId}"
                           class="layui-input form-input" required="true">
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">产品名称</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="prodName" name="prodName" data-th-value="${entity?.prodName}"
                           class="layui-input form-input" required="true">
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">募集起始日期</label>
                <div class="layui-input-inline input-inline">
                    <input id="raiseVdate" type="text" name="raiseVdate"
                           class="layui-input form-input input-dateSelect"
                           placeholder="请选择募集起始日期" required="true"
                           data-th-value="${entity?.raiseVdateStr}"/>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">募集结束日期</label>
                <div class="layui-input-inline input-inline">
                    <input id="raiseEnddate" type="text" name="raiseEnddate"
                           class="layui-input form-input input-dateSelect"
                           placeholder="请选择募集结束日期" required="true"
                           data-th-value="${entity?.raiseEnddateStr}"/>
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">起息日</label>
                <div class="layui-input-inline input-inline">
                    <input id="vdate" type="text" name="vdate"
                           class="layui-input form-input input-dateSelect"
                           placeholder="请选择起息日" required="true"
                           data-th-value="${entity?.vdateStr}"/>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">到期日</label>
                <div class="layui-input-inline input-inline">
                    <input id="mdate" type="text" name="mdate"
                           class="layui-input form-input input-dateSelect"
                           placeholder="请选择到期日" required="true"
                           data-th-value="${entity?.mdateStr}"/>
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">管理方式</label>
                <div class="layui-input-inline input-inline">
                    <select id="manageType" data-th-initValue="${entity?.manageType}"
                            data-th-data-result='${SVR_PRO_STYLE}' data-th-data-formatoption=true class="input-select"
                            placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true"
                            required="true">
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">是否为结构化（分级）产品</label>
                <div class="layui-input-inline input-inline">
                    <select id="isConstracte" data-th-initValue="${entity?.isConstracte}"
                            data-th-data-result='${YES_NO}' data-th-data-formatoption=true class="input-select"
                            placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true"
                            required="true">
                    </select>
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">业绩比较基准上限%</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="yieldHigh" name="yieldHigh" data-th-value="${entity?.yieldHigh}"
                           class="layui-input form-input">
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">业绩比较基准下限%</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="yieldLow" name="yieldLow" data-th-value="${entity?.yieldLow}"
                           class="layui-input form-input">
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">业绩比较基准说明</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="yieldRemark" name="yieldRemark" data-th-value="${entity?.yieldRemark}"
                           class="layui-input form-input">
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">开放模式</label>
                <div class="layui-input-inline input-inline">
                    <select id="openMode" data-th-initValue="${entity?.openMode}" data-th-data-result='${SVR_OPEN_MODE}'
                            data-th-data-formatoption=true class="input-select" placeholder="请选择"
                            data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true">
                    </select>
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">规律开放周期</label>
                <div class="layui-input-inline input-inline">
                    <select id="openCircle" data-th-initValue="${entity?.openCircle}"
                            data-th-data-result='${SVR_REGULAR_OPEN_CYCLE}' data-th-data-formatoption=true
                            class="input-select" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                            allowClear="true">
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">其他规律开放周期（天）</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="openCircleDays" name="openCircleDays"
                           data-th-value="${entity?.openCircleDays}" class="layui-input form-input">
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">无规律开放说明</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="ruleComment" name="ruleComment" data-th-value="${entity?.ruleComment}"
                           class="layui-input form-input">
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">首次开放周期起始日</label>
                <div class="layui-input-inline input-inline">
                    <input id="firstOpenDay" type="text" name="firstOpenDay"
                           class="layui-input form-input input-dateSelect"
                           placeholder="请选择首次开放周期起始日"
                           data-th-value="${entity?.firstOpenDayStr}"/>
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">节假日是否开放</label>
                <div class="layui-input-inline input-inline">
                    <select id="holidayOnFlag" data-th-initValue="${entity?.holidayOnFlag}"
                            data-th-data-result='${YES_NO}' data-th-data-formatoption=true class="input-select"
                            placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true">
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">平均开放次数（年化）</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="avgOpenCount" name="avgOpenCount" data-th-value="${entity?.avgOpenCount}"
                           class="layui-input form-input">
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">开放期业务</label>
                <div class="layui-input-inline input-inline">
                    <select id="openBuss" data-th-initValue="${entity?.openBuss}" data-th-data-result='${SVR_OPEN_BUSS}'
                            data-th-data-formatoption=true class="input-select" placeholder="请选择"
                            data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true">
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">开放业务说明</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="openBussRemark" name="openBussRemark"
                           data-th-value="${entity?.openBussRemark}" class="layui-input form-input">
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">资金托管账号</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="busiAcctNo" name="busiAcctNo" data-th-value="${entity?.busiAcctNo}"
                           class="layui-input form-input" required="true">
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">资金托管账户</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="acctName" name="acctName" data-th-value="${entity?.acctName}"
                           class="layui-input form-input" required="true">
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">产品类型</label>
                <div class="layui-input-inline input-inline">
                    <select id="prodtype" data-th-initValue="${entity?.prodtype}" data-th-data-result='${SVR_PRODTYPE}'
                            data-th-data-formatoption=true class="input-select" placeholder="请选择"
                            data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" required="true">
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">计息基础</label>
                <div class="layui-input-inline input-inline">
                    <select id="basic" data-th-initValue="${entity?.basic}" data-th-data-result='${BASIS}'
                            data-th-data-formatoption=true class="input-select" placeholder="请选择"
                            data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" required="true">
                    </select>
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">受托职责</label>
                <div class="layui-input-inline input-inline">
                    <select id="fiduciaryDuty" data-th-initValue="${entity?.fiduciaryDuty}"
                            data-th-data-result='${SVR_FIDUCIARY_DUTY}' data-th-data-formatoption=true
                            class="input-select" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                            allowClear="true" required="true">
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">客户类型</label>
                <div class="layui-input-inline input-inline">
                    <select id="customerType" data-th-initValue="${entity?.customerType}"
                            data-th-data-result='${SVR_PBC_CUSTTYPE}' data-th-data-formatoption=true
                            class="input-select" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                            allowClear="true" required="true">
                    </select>
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">是否母行划转产品</label>
                <div class="layui-input-inline input-inline">
                    <select id="isTransfer" data-th-initValue="${entity?.isTransfer}" data-th-data-result='${YES_NO}'
                            data-th-data-formatoption=true class="input-select" placeholder="请选择"
                            data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" required="true">
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">现金管理类产品-是否完全符合</label>
                <div class="layui-input-inline input-inline">
                    <select id="isFullyCompliant" data-th-initValue="${entity?.isFullyCompliant}"
                            data-th-data-result='${YES_NO}' data-th-data-formatoption=true class="input-select"
                            placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true"
                            required="true">
                    </select>
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">是否养老理财</label>
                <div class="layui-input-inline input-inline">
                    <select id="isYllccp" data-th-initValue="${entity?.isYllccp}" data-th-data-result='${YES_NO}'
                            data-th-data-formatoption=true class="input-select" placeholder="请选择"
                            data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" required="true">
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">是否收益权转让产品</label>
                <div class="layui-input-inline input-inline">
                    <select id="isSyqzccp" data-th-initValue="${entity?.isSyqzccp}" data-th-data-result='${YES_NO}'
                            data-th-data-formatoption=true class="input-select" placeholder="请选择"
                            data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" required="true">
                    </select>
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">发行状态</label>
                <div class="layui-input-inline input-inline">
                    <select id="issuingStatus" data-th-initValue="${entity?.issuingStatus}"
                            data-th-data-result='${ISSUE_STATUS}' data-th-data-formatoption=true class="input-select"
                            placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true">
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable"></label>
                <div class="layui-input-inline input-inline">
                    <input type="hidden" id="type" name="type" data-th-value="${entity?.type}"
                           class="layui-input form-input">
                    <input type="hidden" id="dataUuid" name="dataUuid" data-th-value="${entity?.dataUuid}"
                           class="layui-input form-input">
                </div>
            </div>
        </div>

    </form>
    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
        <div class="text-center">
            <a id="ChbPrdBaseinfo002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="ChbPrdBaseinfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/report/system/chbprd/ChbPrdBaseinfo002.js}" type="text/javascript"></script>
</div>
</body>

</html>
