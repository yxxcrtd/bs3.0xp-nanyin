<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="~{layout/default}">
<head>
    <meta charset="utf-8">
    <title data-th-text="#{proRegistCodeManage004}">产品登记通知书批量上传</title>
    <link rel="stylesheet" type="text/css" data-th-href="@{/css/report/report.css}">
    <style>
        .input-checkbox .layui-form-checkbox{margin-top: 0;height: 23px;}
        .layui-form-checkbox i { height: 23px; }
    </style>
</head>

<body>

<div layout:fragment="content">
    <div >
        <form class="layui-form joyin-form-wrap pro-module-form"
              id="submitForm">
            <div class="page-component"
                 th:data-path="@{/component/core/FileCommon/init}"
                 th:data-params="|{entityName: 'fileCommonDto',businessId:'${entity?.finprodId?:''}'}|">
            </div>
            <div class="row text-center" style="margin: 30px;">
                <a id="ProRegistCodeManage004_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="ProRegistCodeManage004_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/report/system/proregistcodemanage/ProRegistCodeManage004.js}" type="text/javascript"></script>
</div>
</body>
</html>
