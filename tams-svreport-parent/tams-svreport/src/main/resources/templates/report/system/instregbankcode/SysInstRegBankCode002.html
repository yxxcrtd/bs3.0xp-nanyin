<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="~{layout/default}">

<head>
    <meta charset="utf-8">
    <title data-th-text="#{SysInstRegBankCode002}">机构登记银行代码新建修改</title>
    <link rel="stylesheet" type="text/css" data-th-href="@{/css/report/report.css}">
</head>
<body>
<div layout:fragment="content">
    <form id="SysInstRegBankCode002_newForm" class="layui-form joyin-form-wrap">
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md12">
                <label class="layui-form-label form-lable">机构代码</label>
                <div class="layui-input-inline input-inline ">
                    <input type="text" id="SysInstRegBankCode002_orgCode" name="orgCode" class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}"  data-th-initValue="${entity?.orgCode}" data-th-data-result='${orgCodeDataList}' required>
                </div>
            </div>
        </div>
        <div class="layui-form-item" >
            <div class="layui-inline layui-col-md12">
                <label class="layui-form-label form-lable">登记银行代码</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="SysInstRegBankCode002_registBankCode"
                           name="registBankCode" data-th-value="${entity?.registBankCode}"
                           class="layui-input form-input" placeholder="请输入内容" required>
                </div>
            </div>
        </div>
        <div class="layui-form-item" >
            <div class="layui-inline layui-col-md12">
                <label class="layui-form-label form-lable">总行机构代码</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="SysInstRegBankCode002_pbcBankCode" name="pbcBankCode"
                           data-th-value="${entity?.pbcBankCode}" class="layui-input form-input"
                           onKeyUp="value=value.replace(/[^\a-\z\A-\Z0-9]/g,'')" onblur="checkPbcBankCode();"
                           placeholder="请输入14位的数字和英文组合" required>
                    <span ><font id="pbcBankCodeErrText" color="#FF0000"></font></span>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md12">
                <label class="layui-form-label form-lable">是否理财子公司</label>
                <div class="layui-input-inline input-inline ">
                    <input type="text" id="SysInstRegBankCode002_isFinSubCompany" name="isFinSubCompany"
                           class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-value="${isFinSubCompany}" data-th-data-result='${IS_FIN_SUB_COMPANY}' required
                           onchange="upperCase(this.value)">
                </div>
            </div>
        </div>
        <div class="layui-form-item" id="fregistBankCode_div">
            <div class="layui-inline layui-col-md12">
                <label class="layui-form-label form-lable">母行登记银行代码</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="SysInstRegBankCode002_fregistBankCode"
                           name="fregistBankCode"
                           data-th-initValue="${entity?.fregistBankCode}"
                           class="layui-input form-input" placeholder="请输入内容"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           required/>
                </div>

            </div>
        </div>
    </form>
    <div class="layui-col-md11" style="margin:15px;">
        <div class="text-center">
            <a id="SysInstRegBankCode002_BTN_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
            <a id="SysInstRegBankCode002_BTN_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
        </div>
    </div>
</div>
</body>
<div layout:fragment="script">
    <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/report/system/instregbankcode/SysInstRegBankCode002.js}" type="text/javascript"></script>
</div>
</html>
