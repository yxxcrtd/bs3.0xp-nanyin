<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
  <title>债券折扣率配置新建</title>
</head>
<body>
<div layout:fragment="content">
  <form class="layui-form joyin-form-wrap" id="submitForm"style="padding:0 0 5px 0;" >

    <div class="layui-form-item">

      <div class="form-inline-wrap" style="display: none">
        <label class="layui-form-label form-label-wrap">id</label>
        <div class="layui-input-inline input-inline">
          <input  type="text" id="datauuid" name="datauuid"
                  class="layui-input form-input "
                  th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.datauuid}">
        </div>
      </div>

      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">债券类型</label>
        <div class="layui-input-inline input-inline">
          <select id="secType" name="secType" class="layui-input form-input input-select"
                  data-th-data-result='${SVR_BOND_TYPE}'
                  data-th-initValue="${entity?.secType}"  disabled>
          </select>
        </div>
      </div>

      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">发行方式</label>
        <div class="layui-input-inline input-inline">
          <select id="issueType" name="issueType" class="layui-input form-input input-select"
                   data-th-data-result="${SVR_ISSUE_MODE_FUND}" allowClear="true"
                  data-th-placeholder="#{SysCommon.placeholder}" data-th-initValue="${entity?.issueType}" multiple="multiple" disabled>
          </select>
        </div>
      </div>

    </div>

    <div class="layui-form-item">

      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">评级类型</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="gradeType" name="gradeType"
                 class="layui-input form-input input-select"
                 data-th-data-result="${SVR_GRADE_TYPE}" data-th-initValue="${entity?.gradeType}" allowClear="true" disabled>
        </div>
      </div>

      <div class="form-inline-wrap">
        <label class="layui-form-label form-label-wrap">折扣率（%）</label>
        <div class="layui-input-inline input-inline">
          <input  type="text" id="discountRate" name="discountRate"
                  class="layui-input form-input text-number"
                  th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.discountRate}">
        </div>
      </div>

    </div>

  </form>
  <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
    <div class="text-center">
      <a id="ChbSecDiscountRate002_btn_save" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
      <a id="ChbSecDiscountRate002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
    </div>
  </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/system/bonddiscountrate/ChbSecDiscountRate002.js}" type="text/javascript"></script>
</div>
</body>

</html>
