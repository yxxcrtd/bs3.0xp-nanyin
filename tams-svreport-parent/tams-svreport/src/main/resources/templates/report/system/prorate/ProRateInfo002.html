<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
  <title data-th-text="#{ProRateInfo002}">产品费率信息新建</title>
</head>
<body>
<div layout:fragment="content">
  <form class="layui-form joyin-form-wrap" id="submitForm"style="padding:0 0 5px 0;" >
    <div class="layui-form-item">
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">产品代码</label>
        <div class="layui-input-inline input-inline">
          <select id="prod_id" name="prod_id"
                  data-th-data-url='@{/svreport/system/prorate/ProRateInfo001/getProdID}'
                  data-th-data-formatoption=true data-th-data-parentids="orgCode"
                  class="input-select" placeholder="请选择"
                  data-th-placeholder="#{SysCommon.selectplaceholder}"
                  allowClear="true" multiple="multiple"
                  data-th-initValue="${entity?.prodId}">
          </select>
        </div>
      </div>
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">信披费用类型</label>
        <div class="layui-input-inline input-inline">
          <select id="ProRegistCodeManage001_prdFeeType" name="getPrdFeeType" data-th-data-url='@{/svreport/system/prorate/ProRateInfo001/getPrdFeeType}' data-th-data-formatoption=true data-th-data-parentids="orgCode" class="input-select" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" multiple="multiple">
          </select>
        </div>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="form-inline-wrap">
        <label class="layui-form-label form-label-wrap" >费率</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="feeRate" name="feeRate" class="layui-input form-input"
                 placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" maxlength="32"
                 data-th-value="${entity?.feeRate}">
        </div>
      </div>
    </div>

    <div class="layui-form-item">
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">启用日期</label>
        <div class="layui-input-inline input-inline">
          <input id="date" type="text" name="date"
                 class="layui-input form-input input-dateSelect"
                 placeholder="请选择启用日期"
                 data-th-value="${entity?.startDate}"/>
        </div>
      </div>

    </div>
  </form>
  <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
    <div class="text-center">
      <a id="ProRateInfo002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
      <a id="ProRateInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
    </div>
  </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/system/prorate/ProRateInfo002.js}" type="text/javascript"></script>
</div>
</body>

</html>
