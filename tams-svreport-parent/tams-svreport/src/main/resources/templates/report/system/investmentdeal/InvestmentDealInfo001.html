<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ChbMstCounterParty001}">投资交易信息维护</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/report/report.css}">
<style>
.input-checkbox .layui-form-checkbox{margin-top: 0;height: 23px;}
.layui-form-checkbox i { height: 23px; }
</style>
</head>

<body>
  <div layout:fragment="content">
    <div class="form-button-area" filter="false">
<!--      <a id="InvestmentDealInfo001_btn_add" class="layui-btn layui-btn-sm btn-create" >新建</a>-->
      <a id="InvestmentDealInfo001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
    </div>
    <div class="joyin-form-wrap condition-area">
        <form class="layui-form" id="searchForm">
          <div class="layui-form-item">

            <div class="layui-inline layui-col-md3">
              <label class="layui-form-label form-lable">产品</label>
              <div class="layui-input-inline input-inline">
                <select id="prodId" name="prodId"
                        data-th-data-url='@{/svreport/system/investmentdeal/InvestmentDealInfo001/getProdId}'
                        data-th-data-formatoption=true
                        class="input-select" placeholder="请选择"
                        data-th-placeholder="#{SysCommon.selectplaceholder}"
                        allowClear="true"
                        data-th-initValue="${entity?.prodId}"
                        multiple="true">
                </select>
              </div>
            </div>

            <div class="layui-inline layui-col-md3">
              <label class="layui-form-label form-lable">行内交易编码</label>
              <div class="layui-input-inline input-inline">
                <input type="text" id="tradeCode" name="tradeCode"
                       data-th-value="${entity?.tradeCode}" class="layui-input form-input"
                       placeholder="请输入内容">
                </select>

              </div>
            </div>

            <div class="layui-inline layui-col-md4">
              <label class="layui-form-label form-lable">行内资产/负债编码</label>
              <div class="layui-input-inline input-inline">
                <select id="assetCode" name="assetCode"  class="input-select"
                        data-th-data-url='@{/chb/assetinfodetail/AssetInfoDetail001/getAssetCode}'
                        initvalue="" placeholder="请选择"
                        data-th-placeholder="#{SysCommon.selectplaceholder}"
                        allowClear="true" multiple="multiple">
                </select>

              </div>
            </div>

          </div>

          <div class="layui-form-item">

            <div class="layui-inline layui-col-md3">
              <label class="layui-form-label form-lable">交易日</label>
              <div class="layui-input-inline input-inline">
                <input id="dealdate" name="dealdate" type="text"
                       class="layui-input form-input input-dateRangeSelect" placeholder="请选择日期区间"
                       />
              </div>
            </div>

            <div class="layui-inline layui-col-md3">
              <label class="layui-form-label form-lable">数据状态</label>
              <div class="layui-input-inline input-inline">
                <select id="status" name="status"
                        data-th-data-result='${DATA_STATUS}'
                        data-th-data-formatoption=true data-th-data-parentids="orgCode" class="input-select"
                        placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                        allowClear="true"
                        multiple="true">
                </select>

              </div>
            </div>

          </div>

        </form>
        </div>
    <table class="layui-table" id="InvestmentDealInfo001_prorate"></table>
  </div>
<div layout:fragment="script">
  <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/system/investmentdeal/InvestmentDealInfo001.js}" type="text/javascript"></script>
</div>
</body>
</html>
