<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
  <title data-th-text="#{DisRelOrg002}">关联机构信息新建</title>
</head>
<body>
<div layout:fragment="content">
  <form class="layui-form joyin-form-wrap" id="submitForm"style="padding:0 0 5px 0;" >
    <div class="layui-form-item">
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">关联机构代码</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="relorgId" name="relorgId" data-th-value="${entity?.relorgId}" class="layui-input form-input" placeholder="请输入内容">
        </div>
      </div>
      <div class="form-inline-wrap">
        <label class="layui-form-label form-lable">关联机构代码名称</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="organName" name="organName" data-th-value="${entity?.organName}" class="layui-input form-input" placeholder="请输入内容">
        </div>
      </div>
    </div>

  </form>
  <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
    <div class="text-center">
      <a id="DisRelOrg002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
      <a id="DisRelOrg002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
    </div>
  </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/system/disrelorg/DisRelOrg002.js}" type="text/javascript"></script>
</div>
</body>

</html>
