<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ProRateInfo001}">产品费率信息</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/report/report.css}">
<style>
.input-checkbox .layui-form-checkbox{margin-top: 0;height: 23px;}
.layui-form-checkbox i { height: 23px; }
</style>
</head>

<body>
  <div layout:fragment="content">
    <div class="form-button-area" filter="false">
      <a id="ProRateInfo001_btn_add" class="layui-btn layui-btn-sm btn-create" >新建</a>
      <a id="ProRateInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default" >批量删除</a>
      <a id="ProRateInfo001_btn_export" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
    </div>
    <div class="joyin-form-wrap condition-area">
        <form class="layui-form" id="searchForm">
          <div class="layui-form-item">
            <div class="layui-inline layui-col-md3">
              <label class="layui-form-label form-lable">产品</label>
              <div class="layui-input-inline input-inline">
                <select id="prod_id" name="prod_id"
                        data-th-data-url='@{/svreport/system/prorate/ProRateInfo001/getProdID}'
                        data-th-data-formatoption=true data-th-data-parentids="orgCode"
                        class="input-select" placeholder="请选择"
                        data-th-placeholder="#{SysCommon.selectplaceholder}"
                        allowClear="true" multiple="multiple"
                        data-th-initValue="${entity?.prodId}">
                </select>
              </div>
            </div>
            <div class="layui-inline layui-col-md3">
              <label class="layui-form-label form-lable">信披费用类型</label>
              <div class="layui-input-inline input-inline">
                <select id="ProRegistCodeManage001_prdFeeType" name="getPrdFeeType" data-th-data-url='@{/svreport/system/prorate/ProRateInfo001/getPrdFeeType}' data-th-data-formatoption=true data-th-data-parentids="orgCode" class="input-select" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" multiple="multiple">
                </select>

              </div>
            </div>
            <div class="layui-inline layui-col-md3">
              <label class="layui-form-label form-lable">数据状态</label>
              <div class="layui-input-inline input-inline">
                <select id="ProRegistCodeManage002_dataStatus" name="getDataStatus" data-th-data-url='@{/svreport/system/prorate/ProRateInfo001/getDataStatus}' data-th-data-formatoption=true data-th-data-parentids="orgCode" class="input-select" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" multiple="multiple">
                </select>

              </div>
            </div>
          </div>

        </form>
        </div>
    <table class="layui-table" id="ProRateInfo001_prorate"></table>
  </div>
<div layout:fragment="script">
  <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/system/prorate/ProRateInfo001.js}" type="text/javascript"></script>
</div>
</body>
</html>
