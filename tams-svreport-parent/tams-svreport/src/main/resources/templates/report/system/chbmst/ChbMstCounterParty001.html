<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ChbMstCounterParty001}">交易对手接口数据</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/report/report.css}">
<style>
.input-checkbox .layui-form-checkbox{margin-top: 0;height: 23px;}
.layui-form-checkbox i { height: 23px; }
</style>
</head>

<body>
  <div layout:fragment="content">
    <div class="form-button-area" filter="false">
      <a id="ChbMstCounterParty001_btn_add" class="layui-btn layui-btn-sm btn-create" >新建</a>
      <a id="ChbMstCounterParty001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default" >删除</a>
      <a id="ChbMstCounterParty001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
    </div>
    <div class="joyin-form-wrap condition-area">
        <form class="layui-form" id="searchForm">
          <div class="layui-form-item">
            <div class="layui-inline layui-col-md3">
              <label class="layui-form-label form-lable">交易对手</label>
              <div class="layui-input-inline input-inline">
                <select id="counterId" name="counterId"
                        data-th-data-url='@{/svreport/system/chbmst/ChbMstCounterParty001/getCounterId}'
                        data-th-data-formatoption=true data-th-data-parentids="orgCode"
                        class="input-select" placeholder="请选择"
                        data-th-placeholder="#{SysCommon.selectplaceholder}"
                        allowClear="true"
                        data-th-initValue="${entity?.counterId}"
                        multiple="true">
                </select>
              </div>
            </div>
            <div class="layui-inline layui-col-md3">
              <label class="layui-form-label form-lable">交易对手二级类型</label>
              <div class="layui-input-inline input-inline">
                <select id="counterType2" name="counterType2"
                        data-th-data-result='${SVR_CUSTOMER_TYPE2}'
                        data-th-data-formatoption=true data-th-data-parentids="orgCode" class="input-select"
                        placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                        allowClear="true"
                        multiple="true">
                </select>

              </div>
            </div>
            <div class="layui-inline layui-col-md3">
              <label class="layui-form-label form-lable">数据状态</label>
              <div class="layui-input-inline input-inline">
                <select id="status" name="status"
                        data-th-data-result='${MAINTAIN_STATUS}'
                        data-th-data-formatoption=true data-th-data-parentids="orgCode" class="input-select"
                        placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}"
                        allowClear="true"
                        multiple="true">
                </select>

              </div>
            </div>
          </div>

        </form>
        </div>
    <table class="layui-table" id="ChbMstCounterParty001_prorate"></table>
  </div>
<div layout:fragment="script">
  <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/system/chbmst/ChbMstCounterParty001.js}" type="text/javascript"></script>
</div>
</body>
</html>
