<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>销售结算资金交易信息维护</title>
</head>
<body>

</body>
<div layout:fragment="content">
    <div class="form-button-area" >
        <a id="SalesTransactionMaintenance001_btn_add" class="layui-btn layui-btn-sm"><i class="layui-btn layui-btn-sm btn-create"></i><span>新建</span></a>
        <a id="SalesTransactionMaintenance001_btn_delete" class="layui-btn layui-btn-sm"><i class="layui-btn layui-btn-sm btn-delete"></i><span>删除</span></a>
        <a id="SalesTransactionMaintenance001_btn_import" class="layui-btn layui-btn-sm"><i class="layui-btn layui-btn-sm btn-import"></i><span>导入</span></a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">销售结算资金流动方向</label>
                    <div class="layui-input-inline input-inline">
                        <select id="tradePs" name="tradePs" class="input-select"
                                allowClear="true" data-th-data-result='${TRADE_PS}'
                                data-th-formatoption="false" placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">提供销售结算资金服务机构代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="institutionCode" name="institutionCode" class="layui-input form-input input-select"
                                data-th-data-url="@{/report/submitmaintenance/salestransactionmaintenance/SalesTransactionMaintenance001/getInstitutionCode}"
                                allowClear="true" placeholder="请输入内容">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">数据状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="dataStatus" class="input-select" name="dataStatus"
                                allowClear="true" data-th-data-result='${MAINTAIN_STATUS}'
                                data-th-initvalue="${dataStatus}" placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">产品登记编码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="prdRegistCode" name="prdRegistCode"
                               class="layui-input form-input"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">销售结算资金交易流水号</label>
                    <div class="layui-input-inline input-inline">
                        <select id="tradeNo" name="tradeNo" class="layui-input form-input input-select"
                                data-th-data-url="@{/report/submitmaintenance/salestransactionmaintenance/SalesTransactionMaintenance001/getTradeNo}"
                                allowClear="true" placeholder="请输入内容">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">销售结算资金交易日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tradeVdate" name="tradeVdate" placeholder="请选择、支持区间"
                               class="layui-input form-input input-dateRangeSelect"
                               data-th-value="|${sysDate} - ${sysDate}|"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/report/submitmaintenance/salestransactionmaintenance/SalesTransactionMaintenance001.js}" type="text/javascript"></script>
</div>
</html>
