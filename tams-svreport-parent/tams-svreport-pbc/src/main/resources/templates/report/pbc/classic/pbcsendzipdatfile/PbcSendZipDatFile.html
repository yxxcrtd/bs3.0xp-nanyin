<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="~{layout/default}">

<head>
    <title data-th-text="#{PbcSendZipDatFile}">新人行报送文件管理表</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="form-button-area" export="false">
			<a id="PbcSendZipDatFile_btn_prdImport" class="layui-btn layui-btn-sm btn-export btn-default">导入产品资产管理</a>
			<a id="PbcSendZipDatFile_btn_staticTemplateImport" class="layui-btn layui-btn-sm btn-export btn-default">导入统计模板数据</a>
			<a id="PbcSendZipDatFile_btn_sendFileDownLoad" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-hand"></i>下载报送文件</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">报送类型</label>
						<div class="layui-input-inline input-inline">
							<select id="reporttype" class="input-select"
								data-th-data-result='${DAT_ZIP_TYPE}'
								data-th-initvalue="${datZipType}" placeholder="请选择"
								data-th-placeholder="#{SysCommon.selectplaceholder}"
								allowClear="true" multiple="multiple">
							</select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">报送状态</label>
						<div class="layui-input-inline input-inline">
							<select id="sendStatus" name="sendStatus" class="input-select"
								data-th-data-result='${SUBMIT_STATUS}'
								data-th-initvalue="${zipSendStatus}" placeholder="请选择"
								data-th-placeholder="#{SysCommon.selectplaceholder}"
								allowClear="true" multiple="multiple">
							</select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">反馈状态</label>
						<div class="layui-input-inline input-inline">
							<select id="submitFeedbackStatus" class="input-select"
									data-th-data-result='${SVR_PBC_SUBMIT_FEEDBACK_STATUS}'
									placeholder="请选择"
									data-th-placeholder="#{SysCommon.selectplaceholder}"
									data-th-initvalue="${returnZipSendStatus}" allowClear="true"
									multiple="multiple">
							</select>
						</div>
					</div>
				</div>
			</form>
		</div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
								</script>
        <script data-th-src="@{/js/report/pbc/classic/pbcsendzipdatfile/PbcSendZipDatFile.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
    </div>
</body>

</html>
