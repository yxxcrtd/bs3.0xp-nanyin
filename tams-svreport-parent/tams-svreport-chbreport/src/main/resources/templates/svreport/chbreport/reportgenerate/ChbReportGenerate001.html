<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <meta charset="utf-8">
    <title>报告生成管理</title>
    <style>
        .input-btn-append a{
            background: #ffff;
            color: #4893e6;
            line-height:20px;
        }
        .joyin-form-container{
            background:#fff;
        }
        .report-colla-wrap .layui-table-body table{
            width:100%;
        }
        .report-colla-wrap .layui-table-body table tbody tr td .layui-table-cell{
            width:auto;
            float:left;
            height: 24px;
            line-height: 24px;
        }

    </style>
    <style type="text/css">
        #aaa{
            text-align: right;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="layui-col-md3" style="width: 22%;margin-top:-5px">
        <div class="joyin-form-wrap joyin-form-container">
            <form class="layui-form" id="schemeForm">
            </form>
        </div>
        <div class="layui-collapse">
            <div class="layui-colla-item" style="padding: 0">
                <div class="layui-row layui-colla-title" style="margin: 0; line-height: 30px;height:30px;">
                    <div class="layui-col-md6">
                        <span>披露报告</span>
                    </div>
                    <div class="layui-col-md3 layui-col-md-offset3">

                    </div>
                </div>
                <!--左表格  -->
                <div class="layui-colla-content layui-show report-colla-wrap" style="padding: 0">
                    <table class="layui-table" id="dataTable"></table>
                </div>
            </div>
        </div>
    </div>
    <div class="layui-col-md9" style="width: 78%;margin-top: -9px;" >
        <div class="layui-tab layui-tab-card" lay-filter="tabContainer">
            <div class="layui-tab-content" style="padding: 0">
                <!--右表  -->
                <div class="layui-tab-item layui-show">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md6" id="reportTypeDiv" style="display:none;">
                            <label class="layui-form-label form-lable" style="width: 80px;">报告类型</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" id="reportType"
                                        name="reportType" placeholder="请选择报告类型" allowClear="true" data-th-data-result="${CHB_DISCLOSURE_REPORT_TYPE}" >
                                    <option></option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md6" id="endDateDiv">
                            <label class="layui-form-label form-lable" style="width: 80px;" id="endDateLabel">日期</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input input-dateSelect" id="endDate" name="endDate" placeholder="请选择日期">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md6">
                            <label class="layui-form-label form-lable" style="width: 80px;">产品代码</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="prodId" name="prodId"
                                        allowClear="true"
                                        class="layui-input form-input input-select"
                                        data-th-data-url="@{/svreport/chbreport/reportgenerate/ChbReportGenerate001/queryPrdInfoPage}"
                                        formatoption="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.selectplaceholder}">
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md6" id="yearDiv" style="display:none;">
                            <label class="layui-form-label form-lable" style="width: 80px;" id="endDateLabel">查询年份</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" id="year" name="year" placeholder="请查询年份">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md6" id="emptyDiv">
                            <label class="layui-form-label form-lable" style="width: 80px;">&nbsp;</label>
                        </div>
                        <div class="layui-inline layui-col-md6">
                            <label class="layui-form-label form-lable" style="width: 80px;" id="endDateLabel">&nbsp;&nbsp;</label>
                            <!--<span id="span" style="line-height: 26px;display: inline-block; font-size: 12px;"></span>-->
                            <div style="display: inline-block;">
                                <button type="button" class="layui-btn layui-btn-sm btn-search" id="ChbReportGenerate001_btn_search">查询</button>
                                <button type="button" class="layui-btn layui-btn-sm btn-create" id="ChbReportGenerate001_btn_add">生成</button>
                            </div>
                        </div>
                    </div>
                    <div id="detailTableDiv">
                        <table class="layui-table" id="detailTable"></table>
                    </div>
                    <div id="dqTipsDiv" class="layui-form-item" style="display:none;border:1px solid #408080;">
                        <div class="layui-inline layui-col-md12">
                            <label class="layui-form-label form-lable" style="width: 30px;">注：</label>
                            <label class="layui-form-label form-lable" style="text-align: left;">1）一季度报：4月第一个工作日生成；</label></div>
                        <div class="layui-inline layui-col-md12">
                            <label class="layui-form-label form-lable" style="width: 30px;">&nbsp;&nbsp;</label>
                            <label class="layui-form-label form-lable" style="text-align: left;">2）二季度报：7月第一个工作日生成；</label></div>
                        <div class="layui-inline layui-col-md12">
                            <label class="layui-form-label form-lable" style="width: 30px;">&nbsp;&nbsp;</label>
                            <label class="layui-form-label form-lable" style="text-align: left;">3）上半年报：7月第一个工作日生成；</label></div>
                        <div class="layui-inline layui-col-md12">
                            <label class="layui-form-label form-lable" style="width: 30px;">&nbsp;&nbsp;</label>
                            <label class="layui-form-label form-lable" style="text-align: left;">4）三季度报：10月第一个工作日生成；</label></div>
                        <div class="layui-inline layui-col-md12">
                            <label class="layui-form-label form-lable" style="width: 30px;">&nbsp;&nbsp;</label>
                            <label class="layui-form-label form-lable" style="text-align: left;">5）四季度报：1月第一个工作日生成；</label></div>
                        <div class="layui-inline layui-col-md12">
                            <label class="layui-form-label form-lable" style="width: 30px;">&nbsp;&nbsp;</label>
                            <label class="layui-form-label form-lable" style="text-align: left;">6）下半年报：1月第一个工作日生成；</label></div>
                        <div class="layui-inline layui-col-md12">
                            <label class="layui-form-label form-lable" style="width: 30px;">&nbsp;&nbsp;</label>
                            <label class="layui-form-label form-lable" style="text-align: left;">7）年报：1月第一个工作日生成。</label></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var CHB_DISCLOSURE_REPORT_01 =/*[[${CHB_DISCLOSURE_REPORT_01}]]*/'';
        var CHB_DISCLOSURE_REPORT_02 =/*[[${CHB_DISCLOSURE_REPORT_02}]]*/'';
        var CHB_DISCLOSURE_REPORT_03 =/*[[${CHB_DISCLOSURE_REPORT_03}]]*/'';
        var CHB_DISCLOSURE_REPORT_04 =/*[[${CHB_DISCLOSURE_REPORT_04}]]*/'';
        var CHB_DISCLOSURE_REPORT_05 =/*[[${CHB_DISCLOSURE_REPORT_05}]]*/'';
    </script>
    <script data-th-src="@{/js/svreport/chbreport/reportgenerate/ChbReportGenerate001.js}" type="text/javascript"></script>
</div>
</body>
</html>
