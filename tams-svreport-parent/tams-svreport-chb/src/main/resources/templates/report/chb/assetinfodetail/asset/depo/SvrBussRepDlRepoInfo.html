<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:id="|${entityName}_div|"  class="pro-module-wrap">
        <div class="pro-module">
            <h3 class="pro-module-title"><span class="title-des" data-th-text="#{BussRepDlRepoInfo}">存款类资产中债报送</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
            <div class="pro-module-item">  
                <div class="layui-form-item">
                        <input th:id="|${entityName}_type6|" th:name="|${entityName}.type6|" hidden>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepDlRepoInfo.repAssetType}" >二级资产类别</label>
                            <div class="layui-input-inline input-inline">
                                <select th:id="|${entityName}_repAssetType|" th:name="|${entityName}.repAssetType|" th:initValue="${entity?.repAssetType?:ASSET_TYPE_SECOND_LEVEL_INIT}"  
                                    class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  required data-th-data-result="${SVR_ASSET_TYPE_SECOND_LEVEL}">
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepDlRepoInfo.repTradeMarket}" >交易流通场所</label>
                            <div class="layui-input-inline input-inline">
                                <select th:id="|${entityName}_repTradeMarket|" th:name="|${entityName}.repTradeMarket|" th:initValue="${entity?.repTradeMarket}"  
                                    class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${TRADE_MARKET}">
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-form-item">
                        <div class="form-inline-wrap" style="width:100%;">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepDlRepoInfo.repRemark}"  style=" width: 11.9%;">备注</label>
                            <div class="layui-input-inline input-inline" style="width:81%!important;">
                                <input th:id="|${entityName}_repRemark|" th:name="|${entityName}.repRemark|" th:value="${entity?.repRemark}" data-th-text="${entity?.repRemark}" class="layui-input form-input" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" ></input>
                            </div>
                        </div>
                    </div>
                </div>
        </div>
    </div>
    <script data-th-inline="javascript" type="text/javascript">
        var type6_01 = /*[[${type6_01}]]*/'01';
        var type6_02 = /*[[${type6_02}]]*/'02';
        var type6Element = /*[[${type6Element}]]*/'type6';
        var entityName_BussRepDlRepoInfo = /*[[${entityName}]]*/'';
    </script>
    <script data-th-src="@{/js/report/chb/assetinfodetail/asset/depo/SvrBussRepDlRepoInfo.js}" type="text/javascript"></script>
</body>

</html>
