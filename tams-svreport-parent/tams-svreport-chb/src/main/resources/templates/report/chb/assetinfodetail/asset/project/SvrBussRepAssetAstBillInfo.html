<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:id="|${entityName}_div|" class="pro-module-wrap">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des"
                                           data-th-text="#{SvrBussRepAssetAstBillInfo}">维护信息-票据类资产/信用证类资产</span>（<span
                class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
        <div class="pro-module-item">

            <div class="layui-form-item" >

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetAstBillInfo.isRight}">是否为收/受益权</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_isRight|" th:name="|${entityName}.isRight|"
                                th:initValue="${entity?.isRight}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetAstBillInfo.isResale}">是否属于买入返售</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_isResale|" th:name="|${entityName}.isResale|"
                                th:initValue="${entity?.isResale}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetAstBillInfo.notstandSecType}">类型</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_notstandSecType|" th:name="|${entityName}.notstandSecType|"
                                th:initValue="${entity?.notstandSecType}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                                parentIds="assetType2"
                                data-th-data-result="${SVR_ASSET_TYPE_BILL_LETTERCREDIT}">
                        </select>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetAstBillInfo.notstandSecNum}">数量</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_notstandSecNum|" th:name="|${entityName}.notstandSecNum|"
                               required="required"
                               th:value="${entity?.notstandSecNum}" data-textrange="0" maxlength="6"
                               class="layui-input form-input text-number"/>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetAstBillInfo.amt}">合计金额</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_amt|" th:name="|${entityName}.amt|"
                               required="required"
                               th:value="${entity?.amt}" data-textrange="2"
                               class="layui-input form-input text-number"/>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetAstBillInfo.remainTerm}">加权剩余期限（天）</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_remainTerm|" th:name="|${entityName}.remainTerm|"
                               th:value="${entity?.remainTerm}" data-textrange="2" required="required"
                               class="layui-input form-input text-number"/>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetAstBillInfo.maxRemainTerm}">最长剩余期限（天）</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_maxRemainTerm|"
                               th:name="|${entityName}.maxRemainTerm|" required="required"
                               th:value="${entity?.maxRemainTerm}" data-textrange="0"
                               class="layui-input form-input text-number"/>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetAstBillInfo.minRemainTerm}">最短剩余期限（天）</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_minRemainTerm|"
                               th:name="|${entityName}.minRemainTerm|" required="required"
                               th:value="${entity?.minRemainTerm}" data-textrange="0"
                               class="layui-input form-input text-number"/>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">起息日</label>
                    <div class="layui-input-inline input-inline">

                        <input type="text" id="vdate" name="vdate" required
                               data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'

                               class="layui-input form-input input-dateSelect" />
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">到期日</label>
                    <div class="layui-input-inline input-inline">

                        <input type="text" id="mdate" name="mdate" required
                               data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
                               class="layui-input form-input input-dateSelect" />
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetAstBillInfo.assetYield}">贴现利率</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetYield|" th:name="|${entityName}.assetYield|"
                               th:value="${entity?.assetYield}"
                               class="layui-input form-input text-number" required="required" data-textrange="5"/>
                        <span class="input-right-show">%</span>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetAstBillInfo.industryShares}">行业一级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_industryShares|" th:name="|${entityName}.industryShares|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}"
                                th:initValue="${entity?.industryShares}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetAstBillInfo.industryShares2}">行业二级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_industryShares2|" th:name="|${entityName}.industryShares2|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_SECOND_LEVEL}"
                                th:initValue="${entity?.industryShares2}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap" style="width:100%;">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepAssetAstBillInfo.remark}"
                           style=" width: 11.9%;">备注</label>
                    <div class="layui-input-inline input-inline" style="width:81%!important;">
                        <input th:id="|${entityName}_remark|" th:name="|${entityName}.remark|"
                               th:value="${entity?.remark}"
                               data-th-value="${entity?.remark}"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"></input>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repPrivateprdFlag}">投向地方政府融资平台的部分</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repPrivateprdFlag|" th:name="|${entityName}.repPrivateprdFlag|"
                                th:initValue="${entity?.repPrivateprdFlag}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                required="required"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repPppflag}">公共PPP</label>
                    <div class="layui-input-inline input-inline">
                        <input type="checkbox" th:id="|${entityName}_pppflag|" th:name="|${entityName}.pppflag|"
                               lay-skin="switch" data-th-value="${SVR_YES_OR_NO}" lay-text="是|否"
                               data-th-checked="${SVR_YES_OR_NO} ==${entity?.pppflag}" required="required">
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repBondtostockFlag}">是否投向市场化债转股相关产品的部分</label>
                    <div class="layui-input-inline input-inline">
                        <input type="checkbox" th:id="|${entityName}_bondtostockFlag|" th:name="|${entityName}.bondtostockFlag|"
                               lay-skin="switch" data-th-value="${SVR_YES_OR_NO}" lay-text="是|否"
                               data-th-checked="${SVR_YES_OR_NO} ==${entity?.bondtostockFlag}">
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType1}" >新人行一级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_pbcAssetType1|" th:name="|${entityName}.pbcAssetType1|" th:initValue="${entity?.pbcAssetType1}"
                                th:childrenIds="|${entityName}_pbcAssetType2|"
                                class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SVR_PBC_ASSET_TYPE_1}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType2}" >新人行二级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_pbcAssetType2|" th:name="|${entityName}.pbcAssetType2|" th:initValue="${entity?.pbcAssetType2}"
                                th:childrenIds="|${entityName}_pbcAssetType3|" th:parentIds="|${entityName}_pbcAssetType1|"
                                class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SVR_PBC_ASSET_TYPE_2}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType3}" >新人行三级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_pbcAssetType3|" th:name="|${entityName}.pbcAssetType3|" th:initValue="${entity?.pbcAssetType3}"
                                th:parentIds="|${entityName}_pbcAssetType2|"
                                class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SVR_PBC_ASSET_TYPE_3}">
                        </select>
                    </div>
                </div>

            </div>

        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var entityName_BussRepAssetAstBillInfo = /*[[${entityName}]]*/'';
    var CHB_ASSET_TYPE_PROJECT_1201 = /*[[${CHB_ASSET_TYPE_PROJECT_1201}]]*/'';
    var CHB_ASSET_TYPE_PROJECT_1210 = /*[[${CHB_ASSET_TYPE_PROJECT_1210}]]*/'';
</script>
<script data-th-src="@{/js/report/chb/assetinfodetail/asset/project/SvrBussRepAssetAstBillInfo.js}"
        type="text/javascript"></script>
</body>

</html>
