<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
<style>
.buss-inline-wrap .select2-container{
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}
</style>
</head>
<body>
<div class="pro-module-wrap" th:id="|${entityName}_div|">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">维护信息-金融衍生品</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
        <div class="pro-module-item">

			<div class="layui-form-item">

				<div class=" form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{SvrBussRepFinanciallInfo.assetName}">名称</label>
					<div class="layui-input-inline input-inline">
						<input type="text"
							   class="layui-input form-input" id="assetName"
							   th:name="|${entityName}.assetName|" data-th-value="${entity?.assetName}"
							   required="required">
					</div>
				</div>

				<div class=" form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{SvrBussRepFinanciallInfo.nomCapi}">名义本金</label>
					<div class="layui-input-inline input-inline">
						<!--add by mashukai FIX BUG TISHKBS-1465发行金额设为必填 20201110 start -->
						<input type="text" data-fixtype="2" unit="1"
							   class="layui-input form-input text-money" id="issueAmt"
							   th:name="|${entityName}.nomCapi|" data-th-value="${entity?.nomCapi}"
							   data-moneymemory="" data-th-data-textrange="2"
							   required="required">
						<!--add by mashukai FIX BUG TISHKBS-1465发行金额设为必填 20201110 end -->
						<span class="input-right-show">元</span>
					</div>
				</div>

			</div>

			<div class="layui-form-item">

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{SvrBussRepFinanciallInfo.targetType3}">标的类别</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_targetType3|" th:name="|${entityName}.targetType3|" data-th-data-result="${SVR_TARGET_TYPE}" th:initValue="${entity?.targetType3}" class="layui-input form-input input-select"
								placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
								allowClear="true" multiple="true">
						</select>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{SvrBussRepFinanciallInfo.holdPurpose}">持有目的</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_holdPurpose|" th:name="|${entityName}.holdPurpose|" data-th-data-result="${SVR_HOLD_PURPOSE}" th:initValue="${entity?.holdPurpose}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
					</div>
				</div>

			</div>

            <div class="layui-form-item">

                <div class="form-inline-wrap" style="width: 100% !important;">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{SvrBussRepFinanciallInfo.remark}" style="width: 12%;">备注</label>
					<div class="layui-input-inline input-inline" style="width: 86% !important;">
						<input th:id="|${entityName}_remark|" th:name="|${entityName}.remark|" placeholder="请输入内容" class="layui-input form-input"data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.remark}" maxlength="128" style="width: 100%!important;">
						</input>
					</div>
				</div>

            </div>

			<div class="layui-form-item">

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap">到期日</label>
					<div class="layui-input-inline input-inline">

						<input type="text" th:id="|${entityName}_mdate|" th:name="|${entityName}.mdate|" required
							   data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
							   class="layui-input form-input input-dateSelect" />
					</div>
				</div>

			</div>

			<div class="layui-form-item">

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType1}" >新人行一级分类</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_pbcAssetType1|" th:name="|${entityName}.pbcAssetType1|" th:initValue="${entity?.pbcAssetType1}"
								th:childrenIds="|${entityName}_pbcAssetType2|"
								class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SVR_PBC_ASSET_TYPE_1}">
						</select>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType2}" >新人行二级分类</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_pbcAssetType2|" th:name="|${entityName}.pbcAssetType2|" th:initValue="${entity?.pbcAssetType2}"
								th:childrenIds="|${entityName}_pbcAssetType3|" th:parentIds="|${entityName}_pbcAssetType1|"
								class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SVR_PBC_ASSET_TYPE_2}">
						</select>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType3}" >新人行三级分类</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_pbcAssetType3|" th:name="|${entityName}.pbcAssetType3|" th:initValue="${entity?.pbcAssetType3}"
								th:parentIds="|${entityName}_pbcAssetType2|"
								class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SVR_PBC_ASSET_TYPE_3}">
						</select>
					</div>
				</div>

			</div>

        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var TRADE_MARKET_99 = /*[[${TRADE_MARKET_99}]]*/'';
    var entityName = /*[[${entityName}]]*/'';
    var FLAG_YES = /*[[${FLAG_YES}]]*/'';
</script>
<script data-th-src="@{/js/report/chb/assetinfodetail/asset/financiall/SvrBussRepFinanciallInfo.js}" type="text/javascript"></script>
</body>
</html>
