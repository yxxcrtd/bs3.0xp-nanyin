<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <meta charset="utf-8">
    <title>理财产品资产负债表</title>
</head>

<body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
        <a id="SvrFinAssetLiabilityStatementQuery001_btn_export"
            class="layui-btn layui-btn-sm btn-export btn-default">导出</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">产品代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="prodId" name="prodId"
                                allowClear="true"
                                class="layui-input form-input input-select" maxLength="32"
                                data-th-data-url="@{/chb/finassetliabilitystatement/FinAssetLiabilityStatementQuery001/getPrdBaseinfo}"
                                formatoption="true" placeholder="请输入内容" multiple="true"
                                data-th-placeholder="#{SysCommon.selectplaceholder}">
                        </select>
<!--                        <select id="prodId" name="prodId"-->
<!--                                data-th-data-url='@{/chb/finassetliabilitystatement/FinAssetLiabilityStatementQuery001/getPrdBaseinfo}'-->
<!--                                data-th-data-formatoption=true class="input-select" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" multiple="multiple">-->
<!--                        </select>-->
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">报告期</label>
                    <div class="layui-input-inline input-inline" >
                        <input type="text" class="layui-input form-input" id="month_reportDate" name="reportDate"
                               placeholder="请选择日期">
                    </div>
                </div>
            </div>
        </form>
    </div>

    <div>
        <table class="layui-table" id="dataTable">
        </table>
    </div>
</div>
</body>

<div layout:fragment="script">
    <script data-th-src="@{/js/report/chb/finassetliabilitystatement/FinAssetLiabilityStatementQuery001.js}"
            type="text/javascript"></script>
</div>

</html>
