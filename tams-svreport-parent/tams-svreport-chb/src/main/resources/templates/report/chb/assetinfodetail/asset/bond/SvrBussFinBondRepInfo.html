<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:id="|${entityName}_div|" class="pro-module-wrap">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des" data-th-text="#{BussFinBondRepInfo}">维护信息-债券类资产/理财直接融资工具/同业存单</span>（<span
                class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
        <div class="pro-module-item">

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{BussFinBondRepInfo.code}">代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetCode|" th:name="|${entityName}.assetCode|"
                               th:value="${entity?.assetCode}" class="layui-input form-input" maxlength="32"
                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required/>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{BussFinBondRepInfo.name}">名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repAssetName|" th:name="|${entityName}.repAssetName|"
                               th:value="${entity?.repAssetName}" class="layui-input form-input" maxlength="32"
                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required/>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{BussFinBondRepInfo.chbSectype}">具体类别</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repSectype|" th:name="|${entityName}.repSectype|"
                                data-th-data-result="${SVR_SEC_DETAIL_TYPE}" th:initValue="${entity?.repSectype}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{BussFinBondRepInfo.issueMode}">发行方式</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repIssueMode|" th:name="|${entityName}.repIssueMode|"
                                th:initValue="${entity?.repIssueMode}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${ISSUE_TYPE}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{BussFinBondRepInfo.partyGrade}">主体评级</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repPartyGrade|" th:name="|${entityName}.repPartyGrade|"
                                data-th-data-result="${CHB_BODY_GRADE}" th:initValue="${entity?.repPartyGrade}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" >
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{BussFinBondRepInfo.partyType1}">发行机构类型（按规模划分）</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repPartyType1|" th:name="|${entityName}.repPartyType1|"
                                data-th-data-result="${SVR_PARTY_TYPE1}" th:initValue="${entity?.repPartyType1}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" >
                        </select>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{BussFinBondRepInfo.partyType3}">发行机构类型（按技术领域划分）</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repPartyType3|" th:name="|${entityName}.repPartyType3|"
                                th:initValue="${entity?.repPartyType3}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_PARTY_TYPE3}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{BussFinBondRepInfo.partyType2}">发行机构类型（按经济类型划分）</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repPartyType2|" th:name="|${entityName}.repPartyType2|"
                                data-th-data-result="${SVR_PARTY_TYPE2}" th:initValue="${entity?.repPartyType2}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" >
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{BussFinBondRepInfo.industryLevel2}">发行机构所属行业</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repIndustryLevel2|" th:name="|${entityName}.repIndustryLevel2|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}" th:initValue="${entity?.repIndustryLevel2}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" >
                        </select>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{BussFinBondRepInfo.registOrg}">登记托管机构</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repRegistOrg|" th:name="|${entityName}.repRegistOrg|"
                                th:initValue="${entity?.repRegistOrg}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_REGIST_ORG}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{BussFinBondRepInfo.registorgComment}">登记托管机构说明</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repRegistorgComment|" th:name="|${entityName}.repRegistorgComment|"
                               th:value="${entity?.repRegistorgComment}" class="layui-input form-input" maxlength="32"
                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required/>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap" style="width:100%;">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{BussFinBondRepInfo.remark}"
                           style=" width: 11.9%;">备注</label>
                    <div class="layui-input-inline input-inline" style="width:81%!important;">
                        <input th:id="|${entityName}_repRemark|" th:name="|${entityName}.repRemark|"
                               th:value="${entity?.repRemark}"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">到期日</label>
                    <div class="layui-input-inline input-inline">

                        <input type="text" id="repMdate" name="repMdate" required
                               data-th-value='${#dates.format(entity?.repMdate,"yyyy-MM-dd")}'
                               class="layui-input form-input input-dateSelect" />
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{BussFinBondRepInfo.isFbzb}">是否非标转标资产</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repIsFbzb|" th:name="|${entityName}.repIsFbzb|"
                                th:initValue="${entity?.repIsFbzb}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{BussFinBondRepInfo.bankCapital}">银行资本补充工具</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repBankCapital|" th:name="|${entityName}.repBankCapital|"
                                th:initValue="${entity?.repBankCapital}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{BussFinBondRepInfo.bankSecZxzq}">是否专项债券</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_bankSecZxzq|" th:name="|${entityName}.bankSecZxzq|"
                                th:initValue="${entity?.bankSecZxzq}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{BussFinBondRepInfo.isPpn}">是否PPN等低流动性债券</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_isPpn|" th:name="|${entityName}.isPpn|"
                                th:initValue="${entity?.isPpn}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType1}" >新人行一级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repPbcAssetType1|" th:name="|${entityName}.repPbcAssetType1|" th:initValue="${entity?.repPbcAssetType1}"
                                th:childrenIds="|${entityName}_repPbcAssetType2|"
                                class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SVR_PBC_ASSET_TYPE_1}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType2}" >新人行二级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repPbcAssetType2|" th:name="|${entityName}.repPbcAssetType2|" th:initValue="${entity?.repPbcAssetType2}"
                                th:childrenIds="|${entityName}_repPbcAssetType3|" th:parentIds="|${entityName}_repPbcAssetType1|"
                                class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SVR_PBC_ASSET_TYPE_2}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType3}" >新人行三级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repPbcAssetType3|" th:name="|${entityName}.repPbcAssetType3|" th:initValue="${entity?.repPbcAssetType3}"
                                th:parentIds="|${entityName}_repPbcAssetType2|"
                                class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SVR_PBC_ASSET_TYPE_3}">
                        </select>
                    </div>
                </div>

            </div>

        </div>

    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var entityName_BussFinBondRepInfo = /*[[${entityName}]]*/'';
    var AssetTypeInit = /*[[${AssetTypeInit}]]*/'';
    var issuerElement = /*[[${issuerElement}]]*/'';
    var PARTY_TYPE2_01 = /*[[${PARTY_TYPE2_01}]]*/'01';
    var PARTY_TYPE2_02 = /*[[${PARTY_TYPE2_02}]]*/'02';
    var PARTY_TYPE2_03 = /*[[${PARTY_TYPE2_03}]]*/'03';
    var PARTY_TYPE2_99 = /*[[${PARTY_TYPE2_99}]]*/'99';
    var FINPROD_TYPE_TG_F18 = /*[[${FINPROD_TYPE_TG_F18}]]*/'F18';
    var SVR_PARTY_TYPE1_01 = /*[[${SVR_PARTY_TYPE1_01}]]*/'01';
</script>
<script data-th-src="@{/js/report/chb/assetinfodetail/asset/bond/SvrBussFinBondRepInfo.js}"
        type="text/javascript"></script>
</body>

</html>
