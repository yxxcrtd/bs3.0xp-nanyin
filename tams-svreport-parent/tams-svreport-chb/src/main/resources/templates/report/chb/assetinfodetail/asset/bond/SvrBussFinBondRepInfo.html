<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:id="|${entityName}_div|"  class="pro-module-wrap">
        <div class="pro-module">
            <h3 class="pro-module-title"><span class="title-des" data-th-text="#{BussFinBondRepInfo}">中债报送</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
            <div class="pro-module-item">
                <div class="layui-form-item" th:id="|${entityName}_content_one_div|">
                        <input th:id="|${entityName}_finprodType2|" th:name="|${entityName}.finprodType2|"  th:value="${INT_ASSET_TYPE}" hidden>
                        <div class="form-inline-wrap" th:id="|${entityName}_repAssetType_div|" style="display: none">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{BussFinBondRepInfo.repAssetType}" >资产/负债类别</label>
                            <div class="layui-input-inline input-inline">
                                <select th:id="|${entityName}_repAssetType|" th:name="|${entityName}.repAssetType|" th:initValue="${entity?.repAssetType}"
                                    class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SVR_ASSET_TYPE_SECOND_LEVEL}">
                                </select>
                            </div>
                        </div>
                      <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{BussFinBondRepInfo.repSectype}" >具体类别</label>
                            <div class="layui-input-inline input-inline">
                                <select th:id="|${entityName}_repSectype|" th:name="|${entityName}.repSectype|" th:initValue="${entity?.repSectype}"
                                    class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${SVR_SEC_DETAIL_TYPE}">
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{BussFinBondRepInfo.repPartyType1}" >发行机构类型（按规模划分）</label>
                            <div class="layui-input-inline input-inline">
                                <select th:id="|${entityName}_repPartyType1|" th:name="|${entityName}.repPartyType1|" th:initValue="${entity?.repPartyType1}"
                                    class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SVR_PARTY_TYPE1}">
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap" th:id="|${entityName}_repInstitSize_div|" style="display: none">
                            <label class="layui-form-label form-label-wrap"
                                   data-th-text="#{BussRepOther.repInstitSize}">人行机构规模</label>
                            <div class="layui-input-inline input-inline">
                                <select th:id="|${entityName}_repInstitSize|" th:name="|${entityName}.repInstitSize|"
                                        th:initValue="${entity?.repInstitSize}" class="layui-input form-input input-select"
                                        placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-data-result="${INSTIT_SIZE}">
                                </select>
                            </div>
                        </div>
                 </div>
                 <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{BussFinBondRepInfo.repPartyType2}" >发行机构类型（按经济类型划分）</label>
                            <div class="layui-input-inline input-inline">
                                <select th:id="|${entityName}_repPartyType2|" th:name="|${entityName}.repPartyType2|" th:initValue="${entity?.repPartyType2}"
                                    class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SVR_PARTY_TYPE2}">
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{BussFinBondRepInfo.repPartyType3}" >发行机构类型（按技术领域划分）</label>
                            <div class="layui-input-inline input-inline">
                                <select th:id="|${entityName}_repPartyType3|" th:name="|${entityName}.repPartyType3|" th:initValue="${entity?.repPartyType3}"
                                    class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SVR_PARTY_TYPE3}">
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{BussFinBondRepInfo.repIndustry}" >发行机构所属行业</label>
                            <div class="layui-input-inline input-inline buss-inline-wrap" style="width: 30%!important;display: inline-block;">
                            <select th:id="|${entityName}_repIndustry|"
                                th:name="|${entityName}.repIndustry|"
                                th:childrenIds ="|${entityName}_repIndustryLevel2|"
                                th:initValue="${entity?.repIndustry}"
                                data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                            </select>
                        </div>
                        <div class="layui-input-inline input-inline buss-inline-wrap" style="width: 30%!important;display: inline-block;">
                            <select th:id="|${entityName}_repIndustryLevel2|"
                                th:name="|${entityName}.repIndustryLevel2|"
                                th:initValue="${entity?.repIndustryLevel2}"
                                data-th-data-result="${INSTITUTION_INDUSTRY_SECOND_LEVEL}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                            </select>
                        </div>
                           <!--  <div class="layui-input-inline input-inline">
                                <select th:id="|${entityName}_repIndustry|" th:name="|${entityName}.repIndustry|" th:initValue="${entity?.repIndustry}"
                                    class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}">
                                </select>
                            </div> -->
                        </div>
                  </div>
                  
                  
                  <!-- modify by wj 20200407 债权类标的 修改增加字段。 START -->
                  
					<div class="form-inline-wrap" th:id="|${entityName}_repFinancialComissue_div|" >
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{BussFinBondRepInfo.repFinancialComissue}">是否由金融资产投资公司发行</label>
							<div class="layui-input-inline input-inline">
								<input type="checkbox" 
								 th:id="|${entityName}_repFinancialComissue|" th:name="|${entityName}.repFinancialComissue|"
									lay-skin="switch" lay-filter="repFinancialComissue" 
									data-th-value="${YES}" lay-text="是|否"
									data-th-checked="${YES} ==${entity?.repFinancialComissue}" required="required"
									>
							</div>
					</div>
					<div class="form-inline-wrap" th:id="|${entityName}_repBankSecCapital_div|" >
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{BussFinBondRepInfo.repBankSecCapital}">是否商业银行二级资本债</label>
							<div class="layui-input-inline input-inline">
								<input type="checkbox" th:id="|${entityName}_repBankSecCapital|" th:name="|${entityName}.repBankSecCapital|"
									lay-skin="switch" lay-filter="repBankSecCapital"
									data-th-value="${YES}" lay-text="是|否" required="required"
									data-th-checked="${YES} ==${entity?.repBankSecCapital}" >
							</div>
					</div>
					<div class="form-inline-wrap" th:id="|${entityName}_repBankSecPerpetual_div|" >
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{BussFinBondRepInfo.repBankSecPerpetual}">是否商业银行永续债</label>
							<div class="layui-input-inline input-inline">
								<input type="checkbox" th:id="|${entityName}_repBankSecPerpetual|" th:name="|${entityName}.repBankSecPerpetual|" 
									lay-skin="switch" lay-filter="repBankSecPerpetual"
									data-th-value="${YES}" lay-text="是|否" required="required"
									data-th-checked="${YES} ==${entity?.repBankSecPerpetual}" >
							</div>
					</div>

					<!-- modify by wj 20200407 债权类标的 修改增加字段。 END!! -->
                  
                  <div class="layui-form-item">
                  	<div class="form-inline-wrap" th:id="|${entityName}_repSecNature_div|" >
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{BussFinBondRepInfo.repSecNature}">债券性质</label>
							<div class="layui-input-inline input-inline">
								 <select th:id="|${entityName}_repSecNature|" th:name="|${entityName}.repSecNature|" th:initValue="${entity?.repSecNature}"
                                    class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${REP_SEC_NATURE}">
                                </select>
                            
							</div>
					</div>
                        <!-- <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{BussFinBondRepInfo.repIndustryLevel2}" >发行机构所属行业二级分类</label>
                            <div class="layui-input-inline input-inline">
                                <select th:id="|${entityName}_repIndustryLevel2|" th:name="|${entityName}.repIndustryLevel2|" th:initValue="${entity?.repIndustryLevel2}"
                                    class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${INSTITUTION_INDUSTRY_SECOND_LEVEL}">
                                </select>
                             </div>
                         </div> -->
                         <!-- <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{BussFinBondRepInfo.repRegistOrg}" >登记托管机构</label>
                            <div class="layui-input-inline input-inline">
                                <select th:id="|${entityName}_repRegistOrg|" th:name="|${entityName}.repRegistOrg|" th:initValue="${entity?.repRegistOrg}"
                                    class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${CHB_REGIST_ORG_INV}">
                                </select>
                                </div>
                         </div> -->
                         <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{BussRepAssetAstBillInfo.repTradeMarket}">交易流通场所</label>
                        <div class="layui-input-inline input-inline">
                            <select th:id="|${entityName}_repTradeMarket|" th:name="|${entityName}.repTradeMarket|"
                                th:initValue="${entity?.repTradeMarket}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${TRADE_MARKET}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap" style="width:100%;">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{BussFinBondRepInfo.repRegistorgComment}" style=" width: 11.9%;">登记托管机构说明</label>
                            <div class="layui-input-inline input-inline" style="width:81%!important;">
                                <input th:id="|${entityName}_repRegistorgComment|" th:name="|${entityName}.repRegistorgComment|"
                                th:value="${entity?.repRegistorgComment}"
                                 class="layui-input form-input" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" >
                            </div>
                        </div>
                        <div class="form-inline-wrap" th:id="|${entityName}_repPrivateprdFlag_div|" style="display: none">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repPrivateprdFlag}">投向地方政府融资平台的部分</label>
                            <div class="layui-input-inline input-inline">
                                <input type="checkbox" th:id="|${entityName}_repPrivateprdFlag|" th:name="|${entityName}.repPrivateprdFlag|"
                                       lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                       data-th-checked="${YES} ==${entity?.repPrivateprdFlag}" required="required">
                            </div>
                        </div>
                        <div class="form-inline-wrap" th:id="|${entityName}_repBondtostockFlag_div|" style="display: none">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repBondtostockFlag}">投向市场化债转股相关产品的部分</label>
                            <div class="layui-input-inline input-inline">
                                <input type="checkbox" th:id="|${entityName}_repBondtostockFlag|" th:name="|${entityName}.repBondtostockFlag|"
                                       lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                       data-th-checked="${YES} ==${entity?.repBondtostockFlag}">
                            </div>
                        </div>
                    </div>
                      <div class="layui-form-item" th:id="|${entityName}_project_other_div|" style="display: none">
                          <div class="form-inline-wrap">
                              <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repPrivatefundFlag}">投向金融资产投资公司或其附属机构发行的私募股权投资基金</label>
                              <div class="layui-input-inline input-inline">
                                  <input type="checkbox" th:id="|${entityName}_repPrivatefundFlag|" th:name="|${entityName}.repPrivatefundFlag|"
                                         lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                         data-th-checked="${YES} ==${entity?.repPrivatefundFlag}" required="required">
                              </div>
                          </div>
                          <div class="form-inline-wrap">
                              <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repPppflag}">投向“公共私营合作项目”（PPP）的部分</label>
                              <div class="layui-input-inline input-inline">
                                  <input type="checkbox" th:id="|${entityName}_repPppflag|" th:name="|${entityName}.repPppflag|"
                                         lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                         data-th-checked="${YES} ==${entity?.repPppflag}" required="required">
                              </div>
                          </div>
                          <div class="form-inline-wrap">
                              <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepOther.repSmallcredit}">小微企业信贷资产流转和收益权转让</label>
                              <div class="layui-input-inline input-inline">
                                  <input type="checkbox" th:id="|${entityName}_repSmallcredit|" th:name="|${entityName}.repSmallcredit|"
                                         lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                         data-th-checked="${YES} ==${entity?.repSmallcredit}">
                              </div>
                          </div>
                      </div>
                    <div class="layui-form-item">
                    <div class="form-inline-wrap" style="width:100%;">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepAssetCreditNonstdInfo.repRemark}" style=" width: 11.9%;">备注</label>
                        <div class="layui-input-inline input-inline" style="width:81%!important;">
                            <input th:id="|${entityName}_repRemark|" th:name="|${entityName}.repRemark|"
                            th:value="${entity?.repRemark}"
                             class="layui-input form-input" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" >
                        </div>
                </div>
           </div>
    </div>
    <script data-th-inline="javascript" type="text/javascript">
        var entityName_BussFinBondRepInfo = /*[[${entityName}]]*/'';
        var AssetTypeInit = /*[[${AssetTypeInit}]]*/'';
        var issuerElement = /*[[${issuerElement}]]*/'';
        var PARTY_TYPE2_01 = /*[[${PARTY_TYPE2_01}]]*/'01';
        var PARTY_TYPE2_02 = /*[[${PARTY_TYPE2_02}]]*/'02';
        var PARTY_TYPE2_03 = /*[[${PARTY_TYPE2_03}]]*/'03';
        var PARTY_TYPE2_99 = /*[[${PARTY_TYPE2_99}]]*/'99';
        var FINPROD_TYPE_TG_F18 = /*[[${FINPROD_TYPE_TG_F18}]]*/'F18';
        var SVR_PARTY_TYPE1_01 = /*[[${SVR_PARTY_TYPE1_01}]]*/'01';
    </script>
    <script data-th-src="@{/js/report/chb/assetinfodetail/asset/bond/SvrBussFinBondRepInfo.js}" type="text/javascript"></script>
</body>

</html>
