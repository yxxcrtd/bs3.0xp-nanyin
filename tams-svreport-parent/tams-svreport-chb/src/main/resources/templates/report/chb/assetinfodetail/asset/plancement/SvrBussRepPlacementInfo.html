<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <style>
        .buss-inline-wrap .select2-container {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div class="pro-module-wrap" th:id="|${entityName}_div|">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">维护信息-拆放同业/买入返售（资产）||同业拆入/卖出回购（负债）</span>（<span
                class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
        <div class="pro-module-item">

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">起息日</label>
                    <div class="layui-input-inline input-inline">

                        <input type="text" id="vdate" name="vdate" required
                               data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'

                               class="layui-input form-input input-dateSelect" />
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">到期日</label>
                    <div class="layui-input-inline input-inline">

                        <input type="text" id="mdate" name="mdate" required
                               data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
                               class="layui-input form-input input-dateSelect" />
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepPlacementInfo.rivalPartyCode}">交易对手代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_rivalPartyCode|" th:name="|${entityName}.rivalPartyCode|"
                               th:value="${entity?.rivalPartyCode}" class="layui-input form-input" maxlength="32"
                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required/>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepPlacementInfo.rivalParty}">对手方</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_rivalParty|" th:name="|${entityName}.rivalParty|"
                               th:value="${entity?.rivalParty}" class="layui-input form-input" maxlength="32"
                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required/>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepPlacementInfo.rivalPartyType}">对手方类型</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_rivalPartyType|" th:name="|${entityName}.rivalPartyType|"
                                data-th-data-result="${SVR_RIVAL_PARTY_TYPE}" th:initValue="${entity?.rivalPartyType}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap" th:id="|${entityName}_assetYield|">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepPlacementInfo.assetYield}">年利率%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetYield|" th:name="|${entityName}.assetYield|"
                               th:value="${entity?.assetYield}" required
                               class="layui-input form-input text-number" data-textrange="5"/>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepPlacementInfo.basis}">计息基础</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_basis|" th:name="|${entityName}.basis|"
                                th:initValue="${entity?.basis}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_BASIS}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepPlacementInfo.targetType1}">回购标的类别</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_targetType1|" th:name="|${entityName}.targetType1|"
                                data-th-data-result="${BONDREP_TYPE}" th:initValue="${entity?.targetType1}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" >
                        </select>
                    </div>
                </div>

                <div class=" form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepPlacementInfo.targetAmt}">回购类标的金额</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" data-fixtype="2" unit="1"
                               class="layui-input form-input text-money" id="issueAmt"
                               th:name="|${entityName}.issueAmt|" data-th-value="${entity?.targetAmt}"
                               data-moneymemory="" data-th-data-textrange="2">
                        <span class="input-right-show">元</span>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap" style="width:100%;">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepPlacementInfo.remark}"
                           style=" width: 11.9%;">备注</label>
                    <div class="layui-input-inline input-inline" style="width:81%!important;">
                        <input th:id="|${entityName}_remark|" th:name="|${entityName}.remark|"
                               th:value="${entity?.remark}"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepPlacementInfo.checkCode}">对应资管计划代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_checkCode|" th:name="|${entityName}.checkCode|"
                               th:value="${entity?.checkCode}" class="layui-input form-input" maxlength="32"
                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required/>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType1}" >新人行一级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_pbcAssetType1|" th:name="|${entityName}.pbcAssetType1|" th:initValue="${entity?.pbcAssetType1}"
                                th:childrenIds="|${entityName}_pbcAssetType2|"
                                class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SVR_PBC_ASSET_TYPE_1}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType2}" >新人行二级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_pbcAssetType2|" th:name="|${entityName}.pbcAssetType2|" th:initValue="${entity?.pbcAssetType2}"
                                th:childrenIds="|${entityName}_pbcAssetType3|" th:parentIds="|${entityName}_pbcAssetType1|"
                                class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SVR_PBC_ASSET_TYPE_2}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType3}" >新人行三级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_pbcAssetType3|" th:name="|${entityName}.pbcAssetType3|" th:initValue="${entity?.pbcAssetType3}"
                                th:parentIds="|${entityName}_pbcAssetType2|"
                                class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SVR_PBC_ASSET_TYPE_3}">
                        </select>
                    </div>
                </div>

            </div>

        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var TRADE_MARKET_99 = /*[[${TRADE_MARKET_99}]]*/'';
    var entityName = [[${entityName}]];
    var FLAG_YES = /*[[${FLAG_YES}]]*/'';
</script>
<script data-th-src="@{/js/report/chb/assetinfodetail/asset/plancement/SvrBussRepPlacementInfo.js}"
        type="text/javascript"></script>
</body>

</html>
