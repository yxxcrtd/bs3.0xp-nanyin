<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
<style>
.buss-inline-wrap .select2-container{
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}
</style>
</head>
<body>
<div class="pro-module-wrap" th:id="|${entityName}_div|">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">QDII拆出/逆回购资产</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
        <div class="pro-module-item">
			<div class="layui-form-item">
						<div class=" form-inline-wrap">
							<label class="layui-form-label form-label-wrap"
								   data-th-text="#{BussRepQDIIdemolitionInfo.assetCode}">行内资产/负债编码</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="finprodMarketId"
									   name="finprodMarketId" class="layui-input form-input"
									   maxlength="18"
									   data-th-value="${entity?.assetCode}">
								<!-- 增加快捷录入功能 by 赵东东 2019.10.12 start -->
								<!--
                                                                <a id="FinPlanNetAsset002_btn_quickInput" class="layui-btn layui-btn-sm form-input-text">快录</a>
                                -->
								<!-- 增加快捷录入功能 by 赵东东 2019.10.12 end -->
							</div>
				</div>
				<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-lable"
						   data-th-text="#{BussRepQDIIdemolitionInfo.vDate}">起息日</label>
					<div class="layui-input-inline input-inline">
						<input id="vdate" name="vdate"
							   class="layui-input form-input input-dateRangeSelect"
							   placeholder="请选择时间区间"
							   data-th-placeholder="#{SysCommon.placeholder}">
					</div>
				</div>
				<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-lable"
						   data-th-text="#{BussRepQDIIdemolitionInfo.mDate}">到期日</label>
					<div class="layui-input-inline input-inline">
						<input id="mdate" name="mdate"
							   class="layui-input form-input input-dateRangeSelect"
							   placeholder="请选择时间区间"
							   data-th-placeholder="#{SysCommon.placeholder}">
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepQDIIdemolitionInfo.issuePartyId}" style="line-height: normal!important;">发行机构代码</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_repPartyCode|" th:name="|${entityName}.repPartyCode|" th:value="${entity?.repPartyCode}" class="layui-input form-input" maxlength="32" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required/>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepQDIIdemolitionInfo.repTradeMarket}" style="line-height: normal!important;">交易流通场所</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_repTradeMarket|" th:name="|${entityName}.repTradeMarket|" data-th-data-result="${TRADE_MARKET}" th:initValue="${entity?.repTradeMarket}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
					</div>
				</div>
				<div class=" form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{BussRepQDIIdemolitionInfo.ccy}">币种</label>
					<div class="layui-input-inline input-inline">
						<select type="text" id="ccy" name="ccy"
								class="layui-input form-input input-select"
								data-th-data-result='${CURRENCY_CHB}' formatoption="true"
								required="required" allowClear="true" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='*{entity?.ccy?:CCY_default}'>
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepQDIIdemolitionInfo.countryAreaName}">所属国家或地区</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_repCapiInvest|" th:name="|${entityName}.repCapiInvest|" data-th-data-result="${SVR_COUNTRY_AREA}" th:initValue="${entity?.repCapiInvest}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{SvrBussRepPlacementInfo.rivalParty}">对手方</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_rivalParty|" th:name="|${entityName}.rivalParty|" th:value="${entity?.rivalParty}" class="layui-input form-input" maxlength="32" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required/>
					</div>
				</div>
				<div class="form-inline-wrap" th:id="|${entityName}_rate_div|">
					<label class="layui-form-label form-label-wrap" data-th-text="#{BussRepQDIIdemolitionInfo.assetYield}">年利率</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_rate|" th:name="|${entityName}.rate|"   th:value="${entity?.rate}"  required
							   class="layui-input form-input text-number" data-textrange="4"/>
						<span class="input-right-show begin-show">%<a id="FinInterestFactor_btn_calRate" class="layui-btn layui-btn-sm form-input-text" >计算</a></span>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="form-inline-wrap" th:id="|${entityName}_basis_div|">
					<label class="layui-form-label form-label-wrap" data-th-text="#{BussRepQDIIdemolitionInfo.basis}" >计息基础</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_basis|" th:name="|${entityName}.basis|" th:initValue="${entity?.basis?:BASIS_INIT}"
								class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SVR_BASIS}">
						</select>
					</div>
				</div>
			</div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style="width: 100% !important;">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepQDIIdemolitionInfo.remark}" style="width: 12%;">备注</label>
					<div class="layui-input-inline input-inline" style="width: 86% !important;">
						<input th:id="|${entityName}_repRemark|" th:name="|${entityName}.repRemark|" placeholder="请输入内容" class="layui-input form-input"data-th-placeholder="#{SysCommon.placeholder}" data-th-text="${entity?.repRemark}" maxlength="128" style="width: 100%!important;">
						</input>
					</div>
				</div>
            </div>
        </div>
    </div>
</div>
<SCRIPT DATA-TH-INLINE="JAVASCRIPT" TYPE="TEXT/JAVASCRIPT">
	var TRADE_MARKET_99 = /*[[${TRADE_MARKET_99}]]*/'';
	var entityName = /*[[${entityName}]]*/'';
	var FLAG_YES = /*[[${FLAG_YES}]]*/'';
</script>
<script data-th-src="@{/js/report/chb/assetinfodetail/asset/qdiidemolition/SvrBussRepQDIIdemolitionInfo.js}" type="text/javascript"></script>
</body>

</html>
