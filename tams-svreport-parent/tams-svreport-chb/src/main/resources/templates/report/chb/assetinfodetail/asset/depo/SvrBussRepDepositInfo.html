<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:id="|${entityName}_div|"  class="pro-module-wrap">
        <div class="pro-module">
            <h3 class="pro-module-title"><span class="title-des" data-th-text="#{BussRepDepositInfo}">存款类资产中债报送</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
            <div class="pro-module-item">  
                <div class="layui-form-item">
                        <input th:id="|${entityName}_type6|" th:name="|${entityName}.type6|" hidden>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepDepositInfo.repAssetType}" >二级资产类别</label>
                            <div class="layui-input-inline input-inline">
                                <select th:id="|${entityName}_repAssetType|" th:name="|${entityName}.repAssetType|" th:initValue="${entity?.repAssetType}"  
                                    class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SVR_ASSET_TYPE_SECOND_LEVEL}">
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepDepositInfo.repTradeMarket}" >交易流通场所</label>
                            <div class="layui-input-inline input-inline">
                                <select th:id="|${entityName}_repTradeMarket|" th:name="|${entityName}.repTradeMarket|" th:initValue="${entity?.repTradeMarket}"  
                                    class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${TRADE_MARKET}">
                                </select>
                            </div>
                        </div>
                        <!-- 存款类型 中债新增字段 20200402 start-->
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepDepositInfo.repDepoType}" >存款类型</label>
                            <div class="layui-input-inline input-inline">
                                <select th:id="|${entityName}_repDepoType|" th:name="|${entityName}.repDepoType|" th:initValue="${entity?.repDepoType}"  
                                    class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SVR_DEPO_TYPE}">
                                </select>
                            </div>
                        </div>
                        <!-- 存款类型 中债新增字段 20200402 end-->
                    </div>
                    <div class="layui-form-item">
	                    <!-- <div class="form-inline-wrap">
	                        <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepDepositInfo.repIsStruct}" >是否为结构性<br>存款</label>
	                        <div class="layui-input-inline input-inline">
	                               <input type="checkbox"  th:id="|${entityName}_repIsStruct|" th:name="|${entityName}.repIsStruct|" data-th-checked="${YES} ==${entity?.repIsStruct}" 
	                                lay-skin="switch" lay-filter = "repIsStruct" data-th-value="${YES}" lay-text="是|否"  required>
	                        </div>
                        </div> -->
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepDepositInfo.repTargetType}" >结构性存款<br>挂钩标的类别</label>
                            <div class="layui-input-inline input-inline">
                                <select th:id="|${entityName}_repTargetType|" th:name="|${entityName}.repTargetType|" th:initValue="${entity?.repTargetType}"  multiple="true" 
                                    class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SVR_TARGET_TYPE}">
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap"
	                            data-th-text="#{BussRepDepositInfo.repTarget}">结构性存款<br>挂钩标的</label>
	                        <div class="layui-input-inline input-inline">
	                        	<input type="text" th:id="|${entityName}_repTarget|" th:name="|${entityName}.repTarget|"  data-th-value="${entity?.repTarget}"
                                class="layui-input form-input" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
	                        </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-form-item">
                        <div class="form-inline-wrap" style="width:100%;">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{BussRepDepositInfo.repRemark}"  style=" width: 11.9%;">备注</label>
                            <div class="layui-input-inline input-inline" style="width:81%!important;">
                                <input type="text" th:id="|${entityName}_repRemark|" th:name="|${entityName}.repRemark|"  data-th-value="${entity?.repRemark}"
                                class="layui-input form-input" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                            </div>
                        </div>
                    </div>
                </div>
                </div>
        </div>
    </div>
    <script data-th-inline="javascript" type="text/javascript">
        var type6_01 = /*[[${type6_01}]]*/'01';
        var type6_02 = /*[[${type6_02}]]*/'02';
        var type6Element = /*[[${type6Element}]]*/'type6';
        var SVR_DEPO_TYPE_06 = /*[[${SVR_DEPO_TYPE_06}]]*/'06';
        var SVR_ASSET_TYPE_SECOND_LEVEL_1002 = /*[[${SVR_ASSET_TYPE_SECOND_LEVEL_1002}]]*/'1002';
        var SVR_ASSET_TYPE_SECOND_LEVEL_1003 = /*[[${SVR_ASSET_TYPE_SECOND_LEVEL_1003}]]*/'1003';
        var entityName_BussRepDepositInfo = /*[[${entityName}]]*/'';
    </script>
    <script data-th-src="@{/js/report/chb/assetinfodetail/asset/depo/SvrBussRepDepositInfo.js}" type="text/javascript"></script>
</body>

</html>
