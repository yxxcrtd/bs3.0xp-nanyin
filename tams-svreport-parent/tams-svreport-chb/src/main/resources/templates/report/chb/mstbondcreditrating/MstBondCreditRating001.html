<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<meta charset="UTF-8">
<title data-th-text="#{MstBondCreditRating001}">债券评级信息</title>
</head>
<body>
	<div layout:fragment="content">
		<!-- 画面内容 -->
		<div class="form-button-area" >
			<a id="MstBondCreditRating001_btn_add" class="layui-btn layui-btn-sm btn-create"
			   data-th-text="#{SysCommon.create}">新建</a>
			<a id="MstBondCreditRating001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
			   data-th-text="#{SysCommon.delete}">删除</a>
			<a id="MstBondCreditRating001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
		</div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable" data-th-text="#{MstBondCreditRating001.oObject}">评级对象</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="oObject" name="oObject"
								class="layui-input form-input input-select" placeholder="请选择"
								data-th-data-result="${MAIN_GRADE_TYPE}" allowClear="true">
						</div>
					</div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable" data-th-text="#{MstBondCreditRating001.oName}">债券名称</label>
						 <div class="layui-input-inline input-inline">
                            <input type="text" id="oName" name="oName" class="layui-input form-input input-select"  multiple="true"
                            	placeholder="请输入内容" data-th-data-url="@{/invest/basicdata/mstmarketmanagement/MstMarketManagement001/getFinprodName}"
                            	data-th-data-effectivefieldsalias='|{"code":"#{MstMarketManagement001.secId}","shortName":"#{MstMarketManagement001.finprodName}"}|'
                             		data-th-placeholder="#{SysCommon.placeholder}">                            
                        </div>
					</div>
					<div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable" data-th-text="#{MstBondCreditRating001.shortLongTerm}">评级类型</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="shortLongTerm" name="shortLongTerm"
								   class="layui-input form-input input-select" placeholder="请选择"
								   data-th-data-result="${LONG_SHORT_TERM}" allowClear="true">
						</div>
					</div>
				</div>
				<div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                	<label class="layui-form-label form-lable" data-th-text="#{MstBondCreditRating001.gradeDate}">评级日期</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="gradeDate" name="gradeDate"
								class="layui-input form-input input-dateRangeSelect"  data-th-value = '${gradeDate}'
								placeholder="请选择、支持区间"  >
						</div>
                	</div>
					<div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable" data-th-text="#{MstBondCreditRating001.status}">数据状态</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="status" name="status"
								   class="layui-input form-input input-select" placeholder="请选择"
								   data-th-data-result="${MAINTAIN_STATUS}" allowClear="true">
						</div>
					</div>
				</div>
			</form>
		</div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
	</div>

	<div layout:fragment="script">
		<script data-th-src="@{/js/report/chb/mstbondcreditrating/MstBondCreditRating001.js}"
				type="text/javascript"></script>
	</div>
</body>
</html>
