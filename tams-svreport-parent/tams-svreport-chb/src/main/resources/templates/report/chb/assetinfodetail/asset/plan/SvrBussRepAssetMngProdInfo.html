<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <style>
        .buss-inline-wrap .select2-container {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div class="pro-module-wrap" th:id="|${entityName}_div|">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">资产管理产品</span>（<span class="star-sign">*</span>必填）<i
                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
        <div class="pro-module-item">


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.assetName}">资管及委外资产名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetName|"
                               th:name="|${entityName}.assetName|"
                               th:value="${entity?.assetName}"
                               data-fixtype="2" class="layui-input form-input" required/>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.financialComissue}"
                           style="line-height: normal!important;">是否由金融资产投资公司发行</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_financialComissue|" th:name="|${entityName}.financialComissue|"
                                th:initValue="${entity?.financialComissue}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.partyCode}"
                           style="line-height: normal!important;">资管计划发起人机构编码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_partyCode|" th:name="|${entityName}.partyCode|"
                               th:value="${entity?.partyCode}" class="layui-input form-input" maxlength="32"
                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required/>
                    </div>
                </div>
            </div>


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.checkCode}"
                           style="line-height: normal!important;">资管及委外资产登记编码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_checkCode|" data-th-maxlength="85"
                               th:name="|${entityName}.checkCode|" th:value="${entity?.checkCode}"
                               class="layui-input form-input" maxlength="300" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"/>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.managerId}"
                           style="line-height: normal!important;">管理人</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_managerId|" th:name="|${entityName}.managerId|"
                               th:value="${entity?.managerId}" class="layui-input form-input" required="required"
                               maxlength="100"/>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.trusteeId}"
                           style="line-height: normal!important;">托管人</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_trusteeId|" th:name="|${entityName}.trusteeId|"
                               th:value="${entity?.trusteeId}" class="layui-input form-input" required="required"
                               maxlength="100"/>
                    </div>
                </div>

            </div>


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.amt}"
                           style="line-height: normal!important;">金额</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_amt|"
                               th:name="|${entityName}.amt|" placeholder="请输入内容" data-pattern=""
                               data-fixtype="2" class="layui-input form-input text-money"
                               th:value="${entity?.amt}" data-moneymemory="" required
                               data-th-data-textrange="2">
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.truActType}">资金实际投向</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_truActType|" th:name="|${entityName}.truActType|"
                                data-th-data-result="${SVR_TRU_ACT_TYPE}" th:initValue="${entity?.truActType}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.investType}">资金运用方式</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_investType|"
                               th:name="|${entityName}.investType|" th:value="${entity?.investType}"
                               class="layui-input form-input" maxlength="150" required/>
                    </div>
                </div>
            </div>


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.capUseIndu}">资金运作一级行业</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_capUseIndu|" th:name="|${entityName}.capUseIndu|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}"
                                th:initValue="${entity?.capUseIndu}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.capUseInduLevel2}">资金运作二级行业</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_capUseInduLevel2|" th:name="|${entityName}.capUseInduLevel2|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_SECOND_LEVEL}"
                                th:initValue="${entity?.capUseInduLevel2}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.proProperty}">资管计划属性</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_proProperty|" th:name="|${entityName}.proProperty|"
                                data-th-data-result="${SVR_PRO_PROPERTY}"
                                th:initValue="${entity?.proProperty}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>

            </div>


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.rateFlag}"
                           style="line-height: normal!important;">是否有预期收益率</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_rateFlag|" th:name="|${entityName}.rateFlag|"
                                th:initValue="${entity?.rateFlag}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.maxRate}"
                           style="line-height: normal!important;">预期最高收益率</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_maxRate|"
                               th:name="|${entityName}.maxRate|" placeholder="请输入内容" data-pattern=""
                               data-fixtype="2" class="layui-input form-input text-number"
                               th:value="${entity?.maxRate}" data-th-data-textrange="3">
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.minRate}"
                           style="line-height: normal!important;">预期最低收益率</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_minRate|"
                               th:name="|${entityName}.minRate|" placeholder="请输入内容" data-pattern=""
                               data-fixtype="2" class="layui-input form-input text-number"
                               th:value="${entity?.minRate}" data-th-data-textrange="3">
                    </div>
                </div>

            </div>


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.buyStruct}">购买结构</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_buyStruct|" th:name="|${entityName}.buyStruct|"
                                data-th-data-result="${SVR_BUY_STRUCT}" th:initValue="${entity?.buyStruct}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.manageType}">管理方式</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_manageType|" th:name="|${entityName}.manageType|"
                                data-th-data-result="${SVR_MANAGE_STYLE}" th:initValue="${entity?.manageType}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.mgrFeeRate}"
                           style="line-height: normal!important;">管理费率%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_mgrFeeRate|"
                               th:name="|${entityName}.mgrFeeRate|" placeholder="请输入内容" data-pattern=""
                               data-fixtype="2" class="layui-input form-input text-number"
                               th:value="${entity?.mgrFeeRate}" data-th-data-textrange="3" required>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.truFeeRate}"
                           style="line-height: normal!important;">托管费率%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_truFeeRate|" th:name="|${entityName}.truFeeRate|"
                               placeholder="请输入内容" data-pattern="" data-fixtype="2"
                               class="layui-input form-input text-number" th:value="${entity?.truFeeRate}"
                               data-th-data-textrange="3" required>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.tradeFeeRate}"
                           style="line-height: normal!important;">交易相关合计费率%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_tradeFeeRate|"
                               th:name="|${entityName}.tradeFeeRate|" placeholder="请输入内容" data-pattern=""
                               data-fixtype="2" class="layui-input form-input text-number"
                               th:value="${entity?.tradeFeeRate}" data-th-data-textrange="3" required>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.agencyFeeRate}"
                           style="line-height: normal!important;">中介服务机构合计费率%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_agencyFeeRate|"
                               th:name="|${entityName}.agencyFeeRate|" placeholder="请输入内容" data-pattern=""
                               data-fixtype="2" class="layui-input form-input text-number"
                               th:value="${entity?.agencyFeeRate}" data-th-data-textrange="3" required>
                    </div>
                </div>

            </div>


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepAssetMngProdInfo.otherFeeRate}"
                           style="line-height: normal!important;">其他合计费率%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_otherFeeRate|"
                               th:name="|${entityName}.otherFeeRate|" placeholder="请输入内容" data-pattern=""
                               data-fixtype="2" class="layui-input form-input text-number"
                               th:value="${entity?.otherFeeRate}" data-th-data-textrange="3" required>
                    </div>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable"
                       data-th-text="#{SvrBussRepAssetMngProdInfo.privateprdFlag}">投向金融资产投资公司发行的私募资产管理产品</label>
                <div class="layui-input-inline input-inline">
                    <select th:id="|${entityName}_privateprdFlag|" th:name="|${entityName}.privateprdFlag|"
                            th:initValue="${entity?.privateprdFlag}" class="layui-input form-input input-select"
                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                            data-th-data-result="${SVR_YES_OR_NO}">
                    </select>

                </div>


            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style="width: 100% !important;">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{SvrBussRepAssetMngProdInfo.remark}"
                           style="width: 12%;">备注</label>
                    <div class="layui-input-inline input-inline" style="width: 86%!important">
                        <input th:id="|${entityName}_remark|" th:name="|${entityName}.remark|"
                               th:value="${entity?.remark}" class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"></input>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var BussRepAssetMngProdInfo_entityName = [[${entityName}]];
    var FLAG_YES = /*[[${FLAG_YES}]]*/'';
    var SVR_ASSET_TYPE_SECOND_LEVEL = /*[[${SVR_ASSET_TYPE_SECOND_LEVEL}]]*/'';
    var TRADE_MARKET_99 = /*[[${TRADE_MARKET_99}]]*/'';
    var FINPROD_TYPE_TG_F18 = /*[[${FINPROD_TYPE_TG_F18}]]*/'F18';
    var INT_ASSET_TYPE = /*[[${INT_ASSET_TYPE}]]*/'';
</script>
<script data-th-src="@{/js/report/chb/assetinfodetail/asset/plan/SvrBussRepAssetMngProdInfo.js}"
        type="text/javascript"></script>
</body>

</html>
