<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <meta charset="utf-8">
    <title data-th-text="#{MstBondCreditRating002}">新建科目</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
        <div class="pro-module">
            <div class="pro-module-item">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{MstBondCreditRating001.oName}">债券名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="oName" name="oName" class="layui-input form-input"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-value="${entity?.oName}" required>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{MstBondCreditRating001.oCode}">债券代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="oCode" name="oCode" class="layui-input form-input"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-value="${entity?.oCode}" required>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{MstBondCreditRating001.oObject}">评级对象</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="oObject" name="oObject" class="layui-input form-input input-select"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result='${MAIN_GRADE_TYPE}'
                                   data-th-value="${entity?.oObject}" required>
                        </div>

                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{MstBondCreditRating001.gradeOrgId}">评级机构</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="gradeOrgId" name="gradeOrgId" class="layui-input form-input input-select"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result='${GRADE_PARTY}'
                                   data-th-value="${entity?.gradeOrgId}" required>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{MstBondCreditRating001.shortLongTerm}">评级类型</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="shortLongTerm" name="shortLongTerm" class="layui-input form-input input-select"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result='${LONG_SHORT_TERM}'
                                   data-th-value="${entity?.shortLongTerm}" required>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{MstBondCreditRating001.gradeResult}">评级结果</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="gradeResult" name="gradeResult" class="layui-input form-input input-select"
                                   placeholder="请输入内容"  data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result='${MAIN_GRADE_RESULT}'
                                   data-th-value="${entity?.gradeResult}" required>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">

                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{MstBondCreditRating001.source}">评级来源</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="source" name="source" class="layui-input form-input input-select"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result='${GRADE_SOURCE_TYPE}'
                                   data-th-value="${entity?.source}" required >
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{MstBondCreditRating001.gradeDate}">评级日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="gradeDate" name="gradeDate"
                                   class="layui-input form-input input-dateSelect"
                                   data-th-value="${entity?.gradeDate}" >
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md11" style="margin: 10px;">
        <div class="text-center">
            <a id="MstBondCreditRating002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
            <a id="MstBondCreditRating002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/report/chb/mstbondcreditrating/MstBondCreditRating002.js}"
            type="text/javascript"></script>
</div>

</body>
</html>
