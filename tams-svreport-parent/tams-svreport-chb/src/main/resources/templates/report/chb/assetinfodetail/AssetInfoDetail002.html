<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorator="~{layout/default}">
<head>
	<title data-th-text="#{AssetInfoDetail002}">资产基本信息维护</title>
</head>
<body>
<div layout:fragment="content" id="AssetInfoDetail002_DIV">
	<div class="pro-module-container page-step">
		<form class="layui-form joyin-form-wrap pro-module-form"
			  id="submitForm">

			<input id="assetUuid" name="assetUuid"
				   data-th-value="${entity?.assetUuid}" hidden>
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
								class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item pro-item-wrap">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" >资产代码</label>
									<div class="layui-input-inline input-inline">

										<input type="text" name="assetCode" id="assetCode" required
											   style=" width: 100%!important; display: inline-block;"
											   data-th-value="${entity?.assetCode}" maxlength="18"
											   class="layui-input form-input" placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}">
									</div>
								</div>
								<div class="form-inline-wrap">

									<label class="layui-form-label form-label-wrap ">资产名称</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="assetName"

											   data-th-value="${entity?.assetName}" required
											   class="layui-input form-input" placeholder="请输入内容"

											   data-th-placeholder="#{SysCommon.placeholder}" >
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap">起息日</label>
									<div class="layui-input-inline input-inline">

										<input type="text" id="vdate" name="vdate" required
											   data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'

											   class="layui-input form-input input-dateSelect" />
									</div>
								</div>

							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap" id="mdate_div">

									<label class="layui-form-label form-label-wrap ">到期日</label>
									<div class="layui-input-inline input-inline">

										<input type="text" id="mdate" name="mdate" required
											   data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
											   class="layui-input form-input input-dateSelect" />
									</div>
								</div>
								<div class="form-inline-wrap" >

									<label class="layui-form-label form-label-wrap ">资产一级分类</label>
									<div class="layui-input-inline input-inline">
										<select  id="orgAssetType1" name="orgAssetType1"
												 data-th-initValue="${entity?.orgAssetType1}"
												 class="layui-input form-input input-select"

												 data-th-data-result="${FINPROD_TYPE_TG}" required
										></select>
									</div>
								</div>
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap">资产二级分类</label>
									<div class="layui-input-inline input-inline">
										<select  id="orgAssetType2" name="orgAssetType2"
												 data-th-initValue="${entity?.orgAssetType2}"
												 class="layui-input form-input input-select"
												 data-th-data-result="${CUSTOM_ASSET_TYPE_TWO}"
										></select>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap">资产三级分类</label>
									<div class="layui-input-inline input-inline">
										<select  id="orgAssetType3" name="orgAssetType3"
												 data-th-initValue="${entity?.orgAssetType3}"
												 class="layui-input form-input input-select"
												 data-th-data-result="${CUSTOM_ASSET_TYPE_THREE}"
										></select>
									</div>
								</div>
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap">资产四级分类</label>
									<div class="layui-input-inline input-inline">
										<select  id="orgAssetType4" name="orgAssetType4"
												 data-th-initValue="${entity?.orgAssetType4}"
												 class="layui-input form-input input-select"
												 data-th-data-result="${CUSTOM_ASSET_TYPE_FOUR}"
										></select>
									</div>
								</div>
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap">资产五级分类</label>
									<div class="layui-input-inline input-inline">
										<select  id="orgAssetType5" name="orgAssetType5"
												 data-th-initValue="${entity?.orgAssetType5}"
												 class="layui-input form-input input-select"
												 data-th-data-result="${CUSTOM_ASSET_TYPE_FIVE}"
										></select>
									</div>
								</div>
							</div>
							<div class="layui-form-item">


								<!--<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap">资产负债类别</label>
									<div class="layui-input-inline input-inline">
										<select  id="assetType" name="assetType"
												 data-th-initValue="${entity?.assetType}"
												 class="layui-input form-input input-select"
												 data-th-data-result="${SVR_ASSETDEBT_TYPE}"
										></select>
									</div>

								</div>-->
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap">资产负债二级类别</label>
									<div class="layui-input-inline input-inline">
										<select  id="assetType2" name="assetType2"
												 data-th-initValue="${entity?.assetType2}"
												 class="layui-input form-input input-select"

												 data-th-data-result="${SVR_ASSET_TYPE_SECOND_LEVEL}" required
										></select>
									</div>
								</div>
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap">币种</label>
									<div class="layui-input-inline input-inline">
										<select  id="ccy" name="ccy"
												 data-th-initValue="${entity?.ccy}"
												 class="layui-input form-input input-select"
												 data-th-data-result="${CURRENCY_CHB}" required
										></select>
									</div>
								</div>
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap">交易流通场所</label>
									<div class="layui-input-inline input-inline">
										<select  id="tradeMarket" name="tradeMarket"
												 data-th-initValue="${entity?.tradeMarket}"
												 class="layui-input form-input input-select"
												 data-th-data-result="${SVR_TRADE_MARKET}" required
										></select>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

			<div class="pro-module">

				<div class="businessDeptClass" id="svrBussFinBondRepInfo_div">
					<div class="page-component"
						 th:data-path="@{/chb/assetinfodetail/asset/SvrBussFinBondRepInfo/init}"

						 th:data-params="|{entityName: 'svrBussFinBondRepInfoDto',assetUuid:'${entity?.assetUuid}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">
					</div>
				</div>

				<div class="businessDeptClass" id="svrBussRepPlacementInfo_div">
					<div class="page-component"
						 th:data-path="@{/chb/assetinfodetail/asset/plancement/SvrBussRepPlacementInfo/init}"
						 th:data-params="|{entityName: 'svrBussRepPlacementInfoDto',assetUuid:'${entity?.assetCode}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">					</div>
				</div>
			</div>
			<div class="pro-module">
				<div class="businessDeptClass" id="svrBussRepFinanciallInfo_div">
					<div class="page-component"
						 th:data-path="@{/chb/assetinfodetail/asset/financiall/SvrBussRepFinanciallInfo/init}"
						 th:data-params="|{entityName: 'svrBussRepFinanciallInfoDto',assetUuid:'${entity?.assetCode}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">

					</div>
				</div>
			</div>
			<div class="pro-module">
				<div class="businessDeptClass" id="svrBussRepQDIIdemolitionInfo_div">
					<div class="page-component"
						 th:data-path="@{/chb/assetinfodetail/asset/qdiidemolition/SvrBussRepQDIIdemolitionInfo/init}"
						 th:data-params="|{entityName: 'svrBussRepFinanciallInfoDto',assetUuid:'${entity?.assetCode}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">

					</div>
				</div>
			</div>


				<div class="row text-center stepbar"><a
						id="AssetInfoDetail002_btn_submit"
						class="layui-btn layui-btn-sm btn-submit"
						data-th-text="#{SysCommon.submit}">提交</a> <a
						id="AssetInfoDetail002_btn_cancel"
						class="layui-btn layui-btn-sm btn-cancel"
						data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
		</form>
	</div>
</div>

<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
		var FINPROD_TYPE_TG_F01 = /*[[${FINPROD_TYPE_TG_F01}]]*/'F01'; //债券资产类型code
		var FINPROD_TYPE_TG_F07 = /*[[${FINPROD_TYPE_TG_F07}]]*/'F07'; //存款资产类型code
		var FINPROD_TYPE_TG_F17 = /*[[${FINPROD_TYPE_TG_F17}]]*/'F17'; //计划类资产类型code
		var FINPROD_TYPE_TG_F18 = /*[[${FINPROD_TYPE_TG_F18}]]*/'F17'; //项目类资产类型code
		var DEPO_ASSET_TYPE_01 = /*[[${DEPO_ASSET_TYPE_01}]]*/'01'; //同业借款
		var DEPO_ASSET_TYPE_02 = /*[[${DEPO_ASSET_TYPE_02}]]*/'02'; //存放同业
		var CALC_METHOD_01 = /*[[${CALC_METHOD_01}]]*/'01'; //起息日向后
		var INTPAY_CYCLE_01 = /*[[${INTPAY_CYCLE_01}]]*/'01'; //到期支付
		var iPlatformDate = /*[[${iPlatformDate}]]*/'';//平台日期
		var isTransInAsset = /*[[${isTransInAsset}]]*/'';//该资产是否有交易
		var CE_MODEL = /*[[${CE_MODEL}]]*/'02';
		var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
		var INT_ASSET_TYPE = /*[[${INT_ASSET_TYPE}]]*/'F07';
		var DEPO_ASSET_TYPE_03 = /*[[${DEPO_ASSET_TYPE_03}]]*/'03'; //活期存放
		var isCalLoadrate = /*[[${isCalLoadrate}]]*/'01';  //是否以借款利率计提
		var isQuickInput = /*[[${isQuickInput}]]*/'';
	</script>
	<script data-th-src="@{/js/component/asset/BussAssetFiveType.js}" type="text/javascript"></script>
	<script data-th-src="@{/js/report/chb/assetinfodetail/AssetInfoDetail002.js}"
			type="text/javascript"></script>
	<script data-th-src="@{/js/invest/asset/common/AssetCommon.js}" type="text/javascript"></script>
</div>
</body>

</html>
