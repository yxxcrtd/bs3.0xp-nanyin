<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge"/>
<meta http-equiv="Content-type" content="text/html; charset=utf-8">
<link rel="icon" data-th-href="@{/public/images/favicon.ico}" type="image/x-icon"/>
<link data-th-href="@{/public/layui/css/layui.css}" rel="stylesheet" />
<link data-th-href="@{/public/font/iconfont.css}" rel="stylesheet" />
<link data-th-href="@{/public/font1/iconfont.css}" rel="stylesheet" />
<link data-th-href="@{/public/css/login.css}" rel="stylesheet" />
<title data-th-text="|${applicationTitle} - 用户登录|"></title>
<script>
    if (self.frameElement != null && self.frameElement.tagName == "IFRAME") {
        top.location.href = this.location.href;
    }
</script>
<style type="text/css">
.login-wrapper{
	background: url(../image/valuation/login-val.png);
    background-size: 100% 100%;
    height: 100%;
    overflow: hidden;
}	
.login-container {
    width: 350px;
    height: 250px;
    position:absolute;
    left:0;
    top: 0;
    bottom: 0;
    right: 0;
    margin: auto;
}
.login-img img{
    height: 34px;
}
.layui-form{
    width: 300px;
   
}
.login-input {
    width: 300px;
}
.login-btn {
    width: 300px;
}
</style>
</head>
<body style="height: 662px; overflow:hidden;">
<div class="login-wrapper">
	<div class="layui-main  login-container">
		<p class="login-img">
           <img  data-th-src="@{${bankNameLog}}" >
	       <img  data-th-src="@{${applicationLogo}}" width="200px" >
		</p>
		<form name= "loginForm" class="layui-form" action="#" data-th-action="@{/valuation/login}" method="post">
			<div >
				<div>
					<span id="message" style="font-size:13px; color:red"></span>
				</div>
			</div>
			<div class="layui-form-item login-form-wrap">
				<div class="layui-input-inline">
					<span class="iconfont icon-user user-icon"></span>
					<input name="username" id="username" autocomplete="off" class="layui-input login-input" placeholder="请输入用户名">
				</div>
			</div>
			<div class="layui-form-item login-form-wrap">
				<div class="layui-input-inline">
					<span class="iconfont icon-password login-icon"></span>
					<input id="password" name="password" type="password" autocomplete="off" class="layui-input login-input" placeholder="请输入密码">
				</div>
			</div>
			<div class="layui-form-item login-form-wrap">
				<button type="submit" class="layui-btn login-btn" onclick="beforSubmit(this.form)">登录</button>
			</div>
		</form>
	</div>
</div>
    <script data-th-src="@{/public/layui/layui.all.js}" type="text/javascript"></script>
	<script data-th-src="@{/public/js/jquery-1.9.1.min.js}" type="text/javascript"></script>
	<script data-th-src="@{/public/js/crypto-js/tripledes.js}" type="text/javascript"></script>
    <script data-th-inline="javascript" type="text/javascript">
         var message = /*[[${message}]]*/;
         var messageType = /*[[${messageType}]]*/;
         var privateKey = /*[[${privateKey}]]*/'';
         if(message) {
        	 var iconType = 1;
        	 if ( !messageType || messageType === 'info') {
        		 iconType = 1;
             } else if (messageType === 'warning') {
            	 iconType = 7;
             } else if (messageType === 'error') {
            	 iconType = 2;
             }
        	 document.getElementById("message").innerText = message;      	 
         }
         function beforSubmit(form){
        	 if(form.password.value != ""){
        		 form.password.value = CryptoJS.DES.encrypt(form.password.value, privateKey).toString();
        	 }
        	 document.loginForm.submit();
         }
         // body高度自适应
         $(function() {
             $('body').height(document.documentElement.clientHeight);
             $(window).resize(function() {
                 $('body').height(document.documentElement.clientHeight);
             });
         });
    </script>
</body>
</html>
