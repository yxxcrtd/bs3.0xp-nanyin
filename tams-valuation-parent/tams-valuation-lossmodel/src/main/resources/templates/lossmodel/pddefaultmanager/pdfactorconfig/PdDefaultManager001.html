<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorator="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{PdDefaultManager001}">PD违约概率管理</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="layui-tab" style="margin-bottom: 0px;">
		  <ul class="layui-tab-title">
		    <li  th:if="${isShowRemind}" class="layui-this">&nbsp;
			    <span data-th-text="#{PdFactorConfig001}">前瞻因子维护</span>
		    </li>
		    <li  th:if="${isShowMyHome}">&nbsp;
			    <span data-th-text="评级PD维护">评级PD维护</span>
		    </li>
		  </ul>
		  <div class="layui-tab-content">
		    <!--  前瞻因子维护 -->
		    <div class="layui-tab-item  layui-show">
                <iframe th:src="@{/model/impairment/pddefaultmanager/pdfactorconfig/PdFactorConfig001/init}" width="100%"
                        height="100%" frameborder="0" style="border:none;min-height:600px;"></iframe>
            </div>
             <!-- 评级PD维护    -->
		    <div class="layui-tab-item" >
            	<iframe th:src="@{/model/impairment/pddefaultmanager/gradepdconfig/ModGradePdConfig001/init}" width="100%"
                        height="100%" frameborder="0" style="border:none;min-height:600px;"></iframe>
            </div>
		  </div>
		</div>
    </div>
    <div layout:fragment="script">
     
    </div>
</body>
</html>
