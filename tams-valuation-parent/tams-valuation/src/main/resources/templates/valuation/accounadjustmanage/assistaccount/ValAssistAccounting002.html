<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title>辅助核算配置</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title">
                    <span class="title-des">科目信息</span><i
                        class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">账套代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="booksetId" name="booksetId" class="layui-input form-input"
                                       data-th-value="${booksetId}" disabled="disabled">
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">账套名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="booksetName" name="booksetName" class="layui-input form-input"
                                       data-th-value="${booksetName}" disabled="disabled">
                            </div>
                        </div>

                    </div>

                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable">内部科目编码</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="subjectInternalCode" name="subjectInternalCode"
                                           class="layui-input form-input"
                                           data-th-value="${subjectInternalCode}" disabled="disabled">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable">内部科目名称</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="subjectInternalName" name="subjectInternalName"
                                           class="layui-input form-input"
                                           data-th-value="${subjectInternalName}" disabled="disabled">
                                </div>
                            </div>
                        </div>

                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">科目级别</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="subjectLevel" name="subjectLevel"
                                               class="layui-input form-input"
                                               data-th-value="${subjectLevel}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">是否核算项</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="accFlagName" name="accFlagName"
                                               class="layui-input form-input"
                                               data-th-value="${accFlagName}" disabled="disabled">
                                    </div>

                                </div>
                            </div>

                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">核算属性</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="subjectTypeName" name="subjectTypeName"
                                                   class="layui-input form-input"
                                                   data-th-value="${subjectTypeName}" disabled="disabled">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">底层科目</label>
                                        <div class="layui-input-inline input-inline">
<!--                                            <input type="text" id="genDetsubRuleName" name="genDetsubRuleName"-->
<!--                                                   class="layui-input form-input"-->
<!--                                                   data-th-value="${genDetsubRuleName}" >-->

                                            <select  type="text" id="genDetsubRule" name="genDetsubRule"
                                                     class="layui-input form-input input-select"
                                                     placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                     th:data-result='${GEN_DETSUB_RULE}'
                                                     allowClear="true"
                                                     formatoption="true"
                                                     th:initValue="*{entity?.genDetsubRule?:GEN_DETSUB_RULE_default}"></select>
                                        </div>
                                    </div>
                                </div>


                            </div>
                        </div>


                    </div>
                </div>
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des">辅助核算项</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div id="hands" style="height: 80px;">

                    </div>
                    <input type="hidden" id="handstr" name="handstr"
                           class="layui-input form-input"
                           data-th-value="${hands}" disabled="disabled" >
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md11" style="margin:10px 0 10px 0;">
        <div class="text-center">
            <!--             <a id="ValAssetBook003_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a> -->
            <a id="ValAssistAccounting002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
            <a id="ValAssistAccounting002_btn_save" class="layui-btn layui-btn-sm btn-save">重置</a>
            <a id="ValAssistAccounting002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>

        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/accounadjustmanage/assistaccount/ValAssistAccounting002.js}"
            type="text/javascript"></script>
</div>
</body>

</html>
