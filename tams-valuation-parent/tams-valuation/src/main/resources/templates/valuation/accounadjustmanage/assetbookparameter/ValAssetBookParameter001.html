<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <meta charset="utf-8">
    <title data-th-text="#{ValAssetBookParameter001}">账套参数管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area" >
       <a id="ValAssetBookParameter001_btn_add" class="layui-btn layui-btn-sm"> 
            <i class="iconfont icon-found"></i>
             <span>新建</span>
        </a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md5">
                    <label class="layui-form-label form-lable">账套</label>
                    <div class="layui-input-inline input-inline">
                        <select id="ValAssetBookParameter001_name" name="ValAssetBookParameter001_name"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/valuation/accounadjustmanage/assetbookparameter/ValAssetBookParameter001/getBooksetId}"
                                 allowClear="true" placeholder="请输入内容">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md5">
                    <label class="layui-form-label form-lable">参数</label>
                    <div class="layui-input-inline input-inline">
                        <select id="paramCode" name="paramCode" 
                            class="layui-input form-input input-select" data-th-data-url='@{/valuation/accounadjustmanage/assetbookparameter/ValAssetBookParameter002/findParam}' allowClear="true"
                            placeholder="请输入内容" parentIds="booksetId,pageModel" >
                            <option></option>
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/accounadjustmanage/assetbookparameter/ValAssetBookParameter001.js}" type="text/javascript"></script>
</div>
</body>
</html>
