<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>批处理启动</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="searchForm">
        <input type="hidden" id="prdGroupSeqNo" th:value="*{productGroup?.seqNo}">
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">选择执行日期：</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="executeDate" class="layui-input form-input input-dateRangeSelect"/>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">选择执行任务：</label>
                <div class="layui-input-inline input-inline">
                    <input type="radio" name="batchGroupType" value="0" title="任务组" checked lay-filter="batchGroupType">
                    <input type="radio" name="batchGroupType" value="1" title="任务" lay-filter="batchGroupType">
                </div>
            </div>
            <div class="layui-inline layui-col-md2">
                <a class="layui-btn layui-btn-sm btn-submit" id="ValBatchStart001_btn_batchGroupSelect">选择...</a>
            </div>
            <div class="layui-inline layui-col-md6">
                <input hidden id="selectedBatch"/>
                <input id="selectedBatchName" type="text" class="layui-input form-input" disabled/>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">选择执行产品：</label>
                <div class="layui-input-inline input-inline" th:if="${AUTHORITY_TYPE}=='02'">
                    <input type="radio" name="prodGroupType" value="1" title="产品" checked lay-filter="prodGroupType">
                </div>
                <div class="layui-input-inline input-inline" th:if="${AUTHORITY_TYPE}=='01'">
                    <input type="radio" name="prodGroupType" value="0" title="产品组" checked lay-filter="prodGroupType">
                    <input type="radio" name="prodGroupType" value="1" title="产品" lay-filter="prodGroupType">
                </div>
            </div>
            <div class="layui-inline layui-col-md2">
                <a class="layui-btn layui-btn-sm btn-submit" id="ValBatchStart001_btn_prodGroupSelect">选择...</a>
            </div>
            <div class="layui-inline layui-col-md6">
                <input hidden id="selectedProd"/>
                <input id="selectedProdName" type="text" class="layui-input form-input" disabled/>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md12" style="text-align: center;">
                <a class="layui-btn layui-btn-sm btn-reset" id="ValBatchStart001_reset">重置</a>
                <a id="SysBatchStart001_btn_save" class="layui-btn layui-btn-sm btn-config">执行</a>
            </div>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script type="text/javascript" data-th-src="@{/js/valuation/system/batchstart/ValBatchStart001.js}"></script>
    <script data-th-inline="javascript" type="text/javascript">
        var realName = /*[[${user.realName}]]*/'test';
    </script>
    <style>
        .layui-form-radio{
            margin:0;
        }
    </style>
</div>
</body>
</html>
