<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title th:text="#{batch.label.setting.batchgroup.title}">批处理组选择</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form" id="searchForm" targer="_blank">
        <input type="hidden" id="prodGroupType" th:value="*{prodGroupType}">
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">名称</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="prdGroupName" name="prdGroupName" class="layui-input form-input"
                           placeholder="请输入内容">
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <a id="setting_btn_search" class="layui-btn layui-btn-sm btn-search">检索</a>
            </div>
        </div>
        <div>
            <div class="layui-col-md12" style="margin-bottom:-10px;">
                <label class="layui-form-label form-lable" style="width: 5%;">已选择</label>
                <label class="layui-form-label form-lable" id="selectedProdName" style="width: 92%; text-align: left;"></label>
                <input id="selectedProdId" hidden />
            </div>
            <table class="layui-table" id="prdGroupDataTable"></table>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md5">&nbsp;</div>
            <div class="layui-inline layui-col-md1">
                <a id="setting_btn_select" class="layui-btn layui-btn-sm btn-submit">选择</a>
            </div>
            <div class="layui-inline layui-col-md5">&nbsp;</div>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script type="text/javascript" data-th-src="@{/js/valuation/system/batchstart/prodGroupSelect.js}"></script>
</div>
</body>
</html>
