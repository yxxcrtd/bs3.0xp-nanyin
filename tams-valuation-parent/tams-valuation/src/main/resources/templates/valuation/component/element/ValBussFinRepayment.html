<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>  
    <div th:id="|${entityName}_div|" class="pro-module-wrap">
        <div class="pro-module">
            <h3 class="pro-module-title" th:id="|${entityName}_title_div|"><span class="title-des" data-th-text="#{ValBussFinRepayment}">还本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
            <div class="pro-module-item">
                <div class="layui-form-item" th:id="|${entityName}_content_div|">
                    <input th:name="|${entityName}.finprodType2|" th:value="${INT_ASSET_TYPE}" hidden>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{ValBussFinRepayment.payCycle}" >还款周期</label>
                        <div class="layui-input-inline input-inline">
                            <select th:id="|${entityName}_payCycle|" th:name="|${entityName}.payCycle|" th:initValue="${entity?.payCycle}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${REPAYCYCLE}">
                            </select>
                        </div>
                    </div>
                     <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{ValBussFinRepayment.remark}">还款周期说明</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_remark|" th:name="|${entityName}.remark|"   th:value="${entity?.remark}"
                                   class="layui-input form-input"/>
                        </div>
                     </div>
                    <div class="form-inline-wrap" th:id="|${entityName}_isPayInt_div|">
                        <label class="layui-form-label form-label-wrap" >是否还本不带息</label>
                        <div class="layui-input-inline input-inline">
                            <input type="checkbox" th:id="|${entityName}_isPayIntFlag|" th:name="|${entityName}.isPayIntFlag|"
                                   lay-filter="|${entityName}_isPayIntFlag|" lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                   data-th-checked="${YES} ==${entity?.isPayIntFlag}">
                        </div>
                     </div>
                     <div class="layui-col-md11"  style="margin:10px;" >
                            <div class="text-left">
                                <a th:id="|${entityName}_btn_generationPlan|" class="layui-btn layui-btn-sm" data-th-text="#{FinPayInterestStdInfo.generationPlan}">生成计划</a>
                                <a th:id="|${entityName}_btn_confirm|" class="layui-btn layui-btn-sm">确认</a>
                            </div>
                     </div>
                </div>
                <div id="bussfintemp">
                    <table class="layui-table" id="bussFinRepaymentTable"></table>
                </div>
            </div>
            
            </div>
        </div>
    </div>
    <script data-th-inline="javascript" type="text/javascript">
        var entityName_BussFinRepayment = /*[[${entityName}]]*/'bussFinRepaymentDto'; //
        var entityName_FinPayInterestStdInfo = /*[[${entityNameFinPayInterestStdInfo}]]*/'';
        var entityName_FinInterestFactor = /*[[${entityNameFinInterestFactor}]]*/'';
        var INT_ASSET_TYPE = /*[[${INT_ASSET_TYPE}]]*/'';//初始化 --金融产品类型(投管)
        var INT_ASSET_TYPE_REPAY = /*[[${INT_ASSET_TYPE_REPAY}]]*/'';//项目类资产还本计划维护标志
        var COMMON_BUSINESS_TYPE = /*[[${COMMON_BUSINESS_TYPE}]]*/'';//计划类资产利率型标志
        var COMMON_BUSINESS_TYPE_FINPROD10 = /*[[${COMMON_BUSINESS_TYPE_FINPROD10}]]*/'';//共同业务类型--付息计划调整
        var FINPROD_TYPE_TG_F01 = /*[[${FINPROD_TYPE_TG_F01}]]*/'F01'; //债券资产类型code
        var FINPROD_TYPE_TG_F07 = /*[[${FINPROD_TYPE_TG_F07}]]*/'F07'; //存款资产类型code
        var FINPROD_TYPE_TG_F17 = /*[[${FINPROD_TYPE_TG_F17}]]*/'F17'; //计划类资产类型code
        var FINPROD_TYPE_TG_F18 = /*[[${FINPROD_TYPE_TG_F18}]]*/'F18'; //项目类资产类型code
        var COMMON_BUSINESS_TYPE_F03=/*[[${COMMON_BUSINESS_TYPE_F03}]]*/'F03'; //计划类资产利率型code
        var COUPON_SPECIES_01 = /*[[${COUPON_SPECIES_01}]]*/'01'; //息票品种01
    </script>
    <script data-th-src="@{/js/valuation/component/element/ValBussFinRepayment.js}" type="text/javascript"></script>
</body>
    
</html>
