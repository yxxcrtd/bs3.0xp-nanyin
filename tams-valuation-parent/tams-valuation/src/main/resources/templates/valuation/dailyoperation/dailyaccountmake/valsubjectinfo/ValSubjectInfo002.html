<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>日志查看</title>
</head>
<body>
<div layout:fragment="content">
    <div class="layui-form-item">
        <div class="layui-inline layui-col-md12 layui-col-xs8 layui-col-sm8 layui-col-lg8">
            <label class="layui-form-label form-lable" style="width: 15%;">日志详情</label>
            <div class="layui-input-inline layui-inline layui-textarea" id="returnTxt" style="max-height: 350px;overflow-y: scroll;width: 600px;">
            </div>
            <div style="display: none;" id="returnTxtHidden" data-th-text="${entity?.returnTxt}"></div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script type="text/javascript" data-th-src="@{/js/valuation/dailyoperation/dailyaccountmake/valsubjectinfo/ValSubjectInfo002.js}"></script>
</div>
</body>
</html>
