<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title>净值修改</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form" id="submitForm">
        	<input type="text" id="valBalFlagCode" name="valBalFlagCode" data-th-value='${entity?.valBalFlagCode}' hidden>
        	<input type="text" id="profitTypeCode" name="profitTypeCode" data-th-value='${entity?.profitTypeCode}' hidden>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">产品代码</label>
                    <div class="layui-input-inline input-inline">
                           <input type="text" id="finprodId" name="finprodId" 
                           data-th-value="${entity?.finprodId}" readonly
                           class="layui-input form-input input-lenovoselect">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable" id="netUnitValueLabel">单位净值</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="netUnitValue" name="netUnitValue"
                           data-textrange="4" readonly
                            class="layui-input form-input text-number" maxlength='6' data-th-value="${entity?.netUnitValue}" >
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">估值日</label>
                    <div class="layui-input-inline input-inline">
                           <input type="text" id="valDate" name="valDate" 
                           data-th-value="${entity?.valDate}"
                           class="layui-input form-input input-dateSelect" disabled>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">理财份额</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="capiTal" name="capiTal" data-textrange="2" readonly
                            class="layui-input form-input text-number" maxlength='14' data-th-value="${entity?.capiTal}" >
                    </div>
                </div>
            </div>
            
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable" id="netUnitValueEditLabel">修改后单位净值</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="netUnitValueEdit" name="netUnitValueEdit"
                           data-textrange="4" data-th-required="true" data-th-placeholder="#{SysCommon.placeholder}"
                            class="layui-input form-input text-number" maxlength='6' data-th-value="${entity?.netUnitValueEdit}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable" id="assetValueEditLabel">修改后总净值</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="assetValueEdit" name="assetValueEdit"
                           data-textrange="2" data-th-required="true" data-th-placeholder="#{SysCommon.placeholder}"
                            class="layui-input form-input text-number" maxlength='14' data-th-value="${entity?.assetValueEdit}">
                    </div>
                </div>
            </div>
         
            <div class="layui-form-item">
                <div class="text-center">
                    <a id="ValNetValueConfirm004_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a> 
                    <a id="ValNetValueConfirm004_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
                    <a id="ValNetValueConfirm004_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
                </div>
            </div>
        </form>
    </div>
</body>
<div layout:fragment="script">
	<script th:inline="javascript" type="text/javascript">
        var profitTypeMoney = /*[[${profitTypeMoney}]]*/'';
    </script>
    <script data-th-src="@{/js/valuation/dailyoperation/dailyaccountmake/valnetvalueconfirm/ValNetValueConfirm004.js}" type="text/javascript"></script>
</div>
</html>
