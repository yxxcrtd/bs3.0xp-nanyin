<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>文件组装</title>
</head>

<body>
<div layout:fragment="content">
	<div class="layui-row ">
	   	<div class="layui-col-md12">
	   		<div class="joyin-form-wrap condition-area"  style="padding-top: 5px">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">选择执行日期：</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="executeDate"
								class="layui-input form-input input-dateRangeSelect"
								allowClear="true" />
						</div>
					</div>
               	<div class="layui-inline">
                   <button class="layui-btn layui-btn-sm " id="ValInertfBuildXml001_btn_save"><i class="iconfont icon-execute"></i>执行</button>
               	</div>
		    </div>
			<div class="layui-tab layui-tab-card">
				        <div class="layui-tab-item layui-show">
				        	<table class="layui-table" id="dataTable"></table>
			           </div>
	        </div>
	       <div class="input-progressBar" data-key="progressBar" lay-filter="progressBar" id="progressBar" >
		    		<div class="layui-progress-bar" lay-percent="0%">0%</div>
	       </div>
    </div>
</div>
</div>
</body>
<div layout:fragment="script">
   <script data-th-src="@{/js/valuation/interf/inertfBuildXml/ValInertfBuildXml001.js}" type="text/javascript"></script>
</div>

</html>
