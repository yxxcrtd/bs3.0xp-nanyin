<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>接口启动</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area" export="false">
            <a id="ValInertfStart001_btn_save" class="layui-btn layui-btn-sm"> <i class="iconfont icon-export"></i>
                <span>执行</span></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="ValInertfStart001_FORM_pageForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="inertfName" name="inertfName" class="layui-input form-input"
                                placeholder="请输入内容">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">选择执行日期：</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="executeDate" class="layui-input form-input input-dateRangeSelect"
                                allowClear="true" />
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">选择接入部门：</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="department" class="layui-input form-input input-select"
                                placeholder="请选择"
                                data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;资管&quot;,&quot;col&quot;:&quot;&quot;}]'
                                allowClear="true">
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div id="dataTable"></div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/valuation/interf/inertfStartUp/ValInertfStartUp001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
