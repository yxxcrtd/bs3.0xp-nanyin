server:
  port: 9080
  address: 0.0.0.0
#主配置文件，配置了这个会优先读取里面的属性覆盖主配置文件的属性
base:
  datasource:
    driverClassName: oracle.jdbc.driver.OracleDriver
    url: jdbc:oracle:thin:@(DESCRIPTION=(ADDRESS_LIST=(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.90.111)(PORT=1521))(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.90.112)(PORT=1521))(LOAD_BALANCE=no)(FAILOVER=on))(CONNECT_DATA=(SERVICE_NAME=tamsdbpdb)))
    username: tams212
    password: tams212
    validationQuery: SELECT 1 FROM DUAL
    initialSize: 10
    maxWaitMillis: -1
    defaultAutoCommit: true
    defaultReadOnly: false
    defaultTransactionIsolation: -1
    defaultCatalog:
    connectionProperties:
    testOnBorrow: true
    testOnReturn: false
    testOnCreate: false
    testWhileIdle: false
    #timeBetweenEvictionRunsMillis: -1
    #numTestsPerEvictionRun: 3
    minEvictableIdleTimeMillis: 1800000
    poolPreparedStatements: false
    maxOpenPreparedStatements: -1
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    #logAbandoned: false
spring:
  http:
    multipart: # 文件上传设置
      maxFileSize: 500Mb #设置单个文件的大小（只允许使用Mb）
      maxRequestSize: 10240Mb #设置单次请求的文件的总大小
  profiles:
    active: dev
  application:
    name: valuation-server #服务名称

  datasource:
    driverClassName: oracle.jdbc.driver.OracleDriver
    validationQuery: SELECT 1 FROM DUAL
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
shiro:
  casClientName: valuation
  loginUrl: /valuation/login
application:
  menuType: hover
  menuPosition: top
  sysCode: VAL #系统代码
  logoAbout: /image/valuation/logo-about.png
  logo: /image/valuation/logo.png
  logoPA: /image/valuation/bankNameLog.png
  isDimensionRun: true

jixu:
#用户系统
#1 jixu用户系统
#2 joyin用户系统
#3 joyinBatch用户系统
  user:
    type: 2

eureka:
  instance:
    hostname: ${spring.cloud.client.ipAddress}
    instanceId: ${spring.cloud.client.ipAddress}:${server.port}
    preferIpAddress: true
  client:
    enabled: false
---
spring:
  profiles: dev
  thymeleaf:
    cache: false
  datasource:
    url: jdbc:oracle:thin:@(DESCRIPTION=(ADDRESS_LIST=(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.90.111)(PORT=1521))(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.90.112)(PORT=1521))(LOAD_BALANCE=no)(FAILOVER=on))(CONNECT_DATA=(SERVICE_NAME=tamsdbpdb)))
    username: tams212
    password: tams212
    validationQuery: SELECT 1 FROM DUAL
    initialSize: 10
    maxTotal: 100
    maxIdle: 60
    minIdle: 10
    maxWaitMillis: -1
    defaultAutoCommit: true
    defaultReadOnly: false
    defaultTransactionIsolation: -1
    defaultCatalog:
    connectionProperties:
    testOnBorrow: true
    testOnReturn: false
    testOnCreate: false
    testWhileIdle: false
    #timeBetweenEvictionRunsMillis: -1
    numTestsPerEvictionRun: 3
    minEvictableIdleTimeMillis: 1800000
    poolPreparedStatements: false
    maxOpenPreparedStatements: -1
    #removeAbandonedOnBorrow: false
    #removeAbandonedOnMaintenance: false
    removeAbandonedTimeout: 300
    logAbandoned: false
    timeBetweenEvictionRunsMillis: 60000   #默认是-1
    removeAbandonedOnBorrow: true    #默认是false
    removeAbandonedOnMaintenance: true   #默认是false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
shiro:
  casEnable: false

interf:
  hostname: localhost
  port: 28080
  contextPath: /interf

eureka:
  client:
    enabled: true #是否启用eureka客户端，如果启用，则需要有eureka服务器，默认为true
    serviceUrl:
      defaultZone: http://192.168.70.220:8761/eureka/
  instance:
    hostname: localhost


tams:
  properties:
    maxSqlNum: 500
# 一体化
application:
  batch:
    sysCode: VAL
