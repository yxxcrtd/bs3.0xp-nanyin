<div id="spinner" class="spinner" style="display:none;">
	<img src=./img/ajax-loader.gif></img>
	<p></p>
	<h4>系统处理中，请稍后......</h4>
</div>
<script type="text/javascript">
	$("#title").text(site_title);
	$(document).off("click", "[href='version.do']").on("click", "[href='version.do']", function(){
		var ver = fetch(getURL("version"), {}, "alertAll");
		$("#version_detail").text(ver);
		$("#version_modal").modal();
		return false;
	});
</script>
<body>
	<div class="page-header">
  		<h1 class="jum" id="site_name"></h1>
  		<p class="jum" id="site_intro"></p>
	</div>
	<div id="alertAll"></div>
	<div class="col-md-offset-4 col-md-4">
	<div class="account-wall">
		<img id="site_pic" class="profile-img" alt="">
		<form role="form" class="form-signin" method="post">
		  <input type="text" class="form-control" id="username" placeholder="用户名">
		  <input type="password" class="form-control" id="password" placeholder="密码">
		  <button class="btn btn-lg btn-primary btn-block" type="submit" id="login">登录  <img id="loginSpin" style="display:none;" src="./img/ajax-loader.gif"></img></button>
	   </form>
	   
	</div>
	</div>
</body>
<script type="text/javascript">
	$(function(){
		 $("#site_name").text(site_name);
		 $("#site_intro").text(site_intro);
		 $("#site_pic").attr("src", site_pic);
		 var username = $("#username").val();
		 var password = $("#password").val();
		 if (getParameter("pass") == "OK"){
			 loginInvoke(getURL("authenticate"),{username:username, password:password}, function(data){
					var result = $.parseJSON(data);
					if (result){
						var perms = setMenuPermission();
						var directURL = "";
						$.each(perms, function(url, status){
							if (status){
								directURL = "dataAdapter.do";
								return false;
							}
						});
						$.cookie(jixu_user_cookie, "jixu", {path: '/'});
						window.location.href=directURL;
					}
					else{
						$("#alertAll").append(genAlert("fail", "用户名密码错误！"));
					}
				})
		}
		 
		$("#login").on("click", function(){
			var username = $("#username").val();
			var password = $("#password").val();
			if (! username || ! password){
				alert("用户名和密码均不能为空!");
			}
			else {
				loginInvoke(getURL("authenticate"),{username:username, password:password}, function(data){
					var result = $.parseJSON(data);
					if (result){
						var perms = setMenuPermission();
						var directURL = "";
						$.each(perms, function(url, status){
							if (status){
								directURL = "dataAdapter.do";
								return false;
							}
						});
						$.cookie(jixu_user_cookie, username, {path: '/'});
						window.location.href=directURL;
					}
					else{
						$("#alertAll").append(genAlert("fail", "用户名密码错误！"));
					}
				})
			}
			return false;
		});
	});
</script>
