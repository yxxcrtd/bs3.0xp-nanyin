    <title id='title'></title>
    <div class="modal fade sm" id="version_modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <h4 class="modal-title">版本信息</h4>
	      </div>
	      <div class="modal-body">
	        <p id="version_detail"></p>

<div id="spinner" class="spinner" style="display:none;">
	<img src=./img/ajax-loader.gif></img>
	<p></p>
	<h4>系统处理中，请稍后......</h4>
</div>
<script type="text/javascript">
	$("#title").text(site_title);
	$(document).off("click", "[href='version.do']").on("click", "[href='version.do']", function(){
		var ver = fetch(getURL("version"), {}, "alertAll");
		$("#version_detail").text(ver);
		$("#version_modal").modal();
		return false;
	});
</script>
<body id="body">
	<h4 id="interfaceID">[[${interfaceID}]]</h4>
	<form class="form-inline" novalidate="novalidate">
		<div class="form-group">
			&nbsp;&nbsp;<label id="interfaceName"></label>
		</div>
		<div class="form-group">
			&nbsp;&nbsp;<a href="#" role="button" id="execute_btn" class="btn btn-success">执行适配器</a>
			&nbsp;&nbsp;<a href="#" role="button" id="debug_btn" class="btn btn-warning">手动完成</a>
		</div>
	</form>
	<br>
	<div class="row" style="border-bottom: dotted; border-width: thin"></div>
	<br/>
	<div id="alertAll"></div>
</body>
<script type="text/javascript" src="./js/jixu/adapter.js" charset="utf-8"></script>
<script type="text/javascript">
	$(function(){
		var $menu = genMenu();
		$menu.insertBefore($("#interfaceID"));
		drawModal("interfaceID", "execute");
		$("#dataAdapter_nav").addClass("active");
		$("#interfaceID").hide();
		var interfaceID = $("#interfaceID").text();
		genTabs("body", "interface_ul", "interface_content", {"info":"基本配置", "param":"参数配置", "basic":"基础列配置", "advance":"增强列配置", "filter":"筛选数据", "message":"消息模板","deleteCol":"目标库删除关键字段", "updateCol":"目标库更新关键字段",});	
		removeAlert();
		
		drawInfo("info_display", interfaceID);
		drawParam("param_display", interfaceID);
		drawBasic("basic_display", interfaceID);
		drawAdvance("advance_display", interfaceID);
		drawDelete("deleteCol_display", interfaceID);
		drawUpdate("updateCol_display", interfaceID);
		drawFilter("filter_display", interfaceID);
		drawMessage("message_display", interfaceID);
		$("#execute_btn").on("click", function(){
			//executeInterface("execute_detail", "execute_title", "execute_alert");
			$("#execute_detail").empty();
			if (confirm("是否需要执行?")){
				invoke(getURL("importData"), {id:interfaceID,
											  port:-1, 
											  workflowStep:price,
											  date:""}, function(data){
					$("#result").empty();
					alert("适配器: " + interfaceID + " 已开始运行，请到任务面板查看执行状态")
				}, "alertAll");
			}
			return false;
		});
		
		$("#debug_btn").on("click", function(){
			if (confirm("该功能手动设置该适配器已经运行结束，会影响下游系统的运行，是否确认操作?")){
				invoke(getURL("interfaceSetFinishFlag"), {id:interfaceID}, function(data){
					$("#alertAll").append(genAlert("success", "适配器手动标记成功!"));
				}, "alertAll");
			}
			return false;
		});
});
</script>
