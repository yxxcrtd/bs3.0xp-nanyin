    <title id='title'></title>
    <div class="modal fade sm" id="version_modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <h4 class="modal-title">版本信息</h4>

<div id="spinner" class="spinner" style="display:none;">
	<img src=./img/ajax-loader.gif></img>
	<p></p>
	<h4>系统处理中，请稍后......</h4>
</div>
<script type="text/javascript">
	$("#title").text(site_title);
	$(document).off("click", "[href='/jixu/version.do']").on("click", "[href='/jixu/version.do']", function(){
		var ver = fetch(getURL("version"), {}, "alertAll");
		$("#version_detail").text(ver);
		$("#version_modal").modal();
		return false;
	});
</script>
<body id="body">
	<h4 id="exportID">[[${exportID}]]</h4>
	<form class="form-inline" novalidate="novalidate">
		<div class="form-group">
			&nbsp;&nbsp;<label id="exportName"></label>
		</div>
		<div class="form-group">
			&nbsp;&nbsp;<a href="#" role="button" id="execute_btn" class="btn btn-success">执行适配器</a>
			&nbsp;&nbsp;<a href="#" role="button" id="debug_btn" class="btn btn-warning">手动完成</a>
		</div>
	</form>
	<br>
	<div class="row"></div>
	<div class="row" style="border-bottom: dotted; border-width: thin"></div>
	<br/>
	<div id="alertAll"></div>
</body>
<script type="text/javascript" src="./js/jixu/adp_export.js" charset="utf-8"></script>
<script type="text/javascript">
	$(function(){
		var $menu = genMenu();
		$menu.insertBefore($("#exportID"));
		$("#config_nav").addClass("active");
		$("#exportID").hide();
		$("#exportName").text("导出接口");
		var exportID = $("#exportID").text();
		genTabs("body", "export_ul", "export_content", {"info":"基本配置", "param":"参数配置", "basic":"基础列配置", "advance":"增强列配置", "filter":"筛选配置", "template":"导出模板"});	
		removeAlert();
		
		drawInfo("info_display", exportID);
		drawParam("param_display", exportID);
		//drawBasic("basic_display", exportID);
		drawAdvance("advance_display", exportID);
		drawFilter("filter_display", exportID);
		drawTemplate("template_display", exportID);
		$("#execute_btn").on("click", function(){
			//executeInterface("execute_detail", "execute_title", "execute_alert");
			$("#execute_detail").empty();
			if (confirm("是否需要执行?")){
				invoke(getURL("adpExportData"), {id:exportID}, function(data){
					$("#result").empty();
					alert("适配器: " + exportID + " 已开始运行，请到任务面板查看执行状态")
				}, "alertAll");
			}
			return false;
		});
});
</script>
