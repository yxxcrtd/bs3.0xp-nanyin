<script type="text/javascript">
	$("#title").text(site_title);
	$(document).off("click", "[href='version.do']").on("click", "[href='version.do']", function(){
		var ver = fetch(getURL("version"), {}, "alertAll");
		$("#version_detail").text(ver);
		$("#version_modal").modal();
		return false;
	});
</script>
<body>
	<div class="col-md-5" id="holiday_form"></div>
    <div class="row" style="border-bottom: dotted; border-width: thin"></div>
    <div id="alertAll"></div>
    <div id="content"></div>
</body>
<script type="text/javascript">
	$(function(){
		var $menu = genMenu();
		$menu.insertBefore($("#holiday_form"));
		$("#config_nav").addClass("active");
		//生成filter form, 并与Modal关联
		drawFilterForm("holiday_form", "holiday", "holiday_filter", [], false);	
        $("#holiday_create_btn").attr("data-toggle", "modal");
        $("#holiday_create_btn").attr("data-target", "#holiday_modal");
        removeAlert();
        
        //当选择假期安排后，content自动变成相应内容
        $("#holiday_search_btn").on("click", function(){
        	var holidayID = $("#holiday_table_filter").val();
        	var f = $.extend(true, {}, tableForm);
    		
        	f.source.address = "holidayDetail";
    		f.source.inputs = {id:holidayID};
    		f.form.name = "holiday_table";
    		f.form.func = function(){
    			$("#holidayDay_preadd").text("增加节假日");
	    		$("#holidayDay_postadd").text("增加节假日");
    		};
    		f.event.update.source.address = "holidayDayUpdate";
    		f.event.update.source.inputs = {pid:holidayID};
    		
    		f.event.del.source.address = "holidayDayRemove";
    		f.event.del.source.inputs = {pid:holidayID};
    		
    		f.event.add.source.address = "holidayDayCreate";
    		f.event.add.source.inputs = {pid:holidayID};
    		f.event.add.form.name = "holidayDay_add";
    		
    		$("#content").empty();
    		$("#content").append("<div><label>假期安排编号：</label><label id='holidayID'>" + holidayID + "</label></div>");
    		genTableSimpleForm("content", "holidayDay", f.source, f.form, f.event, "alertAll", true);

        });
        //响应事件: 新建holiday
        $("#holiday_create_btn").on("click", function(){
        	bootbox.prompt("请输入假期安排名称", function(result){
       	    	if (result == null){
       	    		bootbox.hideAll();
           		}
           		else {
           			if (result == ""){
           				$("#alertAll").empty();
       	                $("#alertAll").append(genAlert("fail", translate["holiday"] + "创建失败! 请输入假期安排名称!"));	
           			}
           			else {
           				invoke(getURL("holidayCreate"), {name:result}, function(data){
           					var holidayID = data;
           					var f = $.extend(true, {}, tableForm);
               	    		
               	        	f.source.on = false;
               	        	f.form.name = "holiday_table";
               	        	f.form.func = function(){
               	    			$("#holidayDay_preadd").text("增加节假日");
               	    			$("#holidayDay_postadd").text("增加节假日");
               	    		};
               	    		f.event.update.source.address = "holidayDayUpdate";
               	    		f.event.update.source.inputs = {pid:holidayID};
               	    		
               	    		f.event.del.source.address = "holidayDayRemove";
               	    		f.event.del.source.inputs = {pid:holidayID};
               	    		
               	    		f.event.add.source.address = "holidayDayCreate";
               	    		f.event.add.source.inputs = {pid:holidayID};
               	    		f.event.add.form.name = "holidayDay_add";
               	    		
               	    		$("#content").empty();
               	    		$("#content").append("<div><label>假期安排编号：</label><label id='holidayID'>" + holidayID + "</label></div>");
               	    		genTableSimpleForm("content", "holidayDay", f.source, f.form, f.event, "alertAll", true);
               	    		updateSelectOptions($("#holiday_table_filter"), fetch(getURL("holidayList"), {}));
           				});	
           			}
           		}
        	});
        });
	});
</script>
