<script type="text/javascript">
	$("#title").text(site_title);
	$(document).off("click", "[href='/jixu/version.do']").on("click", "[href='/jixu/version.do']", function(){
		var ver = fetch(getURL("version"), {}, "alertAll");
		$("#version_detail").text(ver);
		$("#version_modal").modal();
		return false;
	});
</script>
<body>
	<div id="title_form"></div>
	<div class="row" style="border-bottom: dotted; border-width: thin"></div>
	<div id="alertAll"></div>
	<div id="export_list"></div>
</body>
<script type="text/javascript">
	$(function(){
		var $menu = genMenu();
		$menu.insertBefore($("#title_form"));
		$("#adpExport_nav").addClass("active");
		drawFilterForm("title_form", "export", "export_filter", {}, false);
		drawModal("title_form", "export");
		drawModal("title_form", "log");
		
		$("#export_create_btn").click(function(){
			$("#export_detail").empty();
			var e = $.extend(true, {}, editForm);
			e.source.on = false;
			e.form.name = "export_add";
			e.form.func = function(){
				$("#export_resource").hide();
				$("#fieldset_db").hide();
				
				$("#export_deliverType").on("change", function(){
					if ($(this).val() == FILE){
						$("#fieldset_db").hide();
						$("#fieldset_file").show();
					}
					else if ($(this).val() == DB){
						$("#fieldset_db").show();
						$("#fieldset_file").hide();
					}
				});
				
				$("#export_autoDateFormat").prop("disabled", true)
				$("#export_fromDay").prop("disabled", true);
				$("#export_autoTime").prop("disabled", true);
				$("#export_autoTime").prop("disabled", true);
				$("#export_moveto").prop("disabled", true);
				$("#export_holiday").prop("disabled", true);
				$("#export_startDate").prop("disabled", true);
				$("#export_startTime").prop("disabled", true);
				
				$("#export_autodo").on("change", function(){
					if ($("#export_autodo").is(":checked")){
						$("#export_autoDateFormat").prop("disabled", false);
						$("#export_fromDay").prop("disabled", false);
						$("#export_autoTime").prop("disabled", false);
						$("#export_autoTime").prop("disabled", false);
						$("#export_moveto").prop("disabled", false);
						$("#export_holiday").prop("disabled", false);
						$("#export_startDate").prop("disabled", false);
						$("#export_startTime").prop("disabled", false);
					}
					else{
						$("#export_autoDateFormat").prop("disabled", true)
						$("#export_fromDay").prop("disabled", true);
						$("#export_autoTime").prop("disabled", true);
						$("#export_autoTime").prop("disabled", true);
						$("#export_moveto").prop("disabled", true);
						$("#export_holiday").prop("disabled", true);
						$("#export_startDate").prop("disabled", true);
						$("#export_startTime").prop("disabled", true);
					}
				});
				
				$("#export_dbTest_btn").on("click", function(){
					var inputs = {
							"dbURL":$("#export_dbURL").val()||"",
							"dbFormat":$("#export_dbFormat").val(),
							"dbUser":$("#export_user").val()||"",
							"dbPwd":$("#export_pwd").val()||""
					};
					invoke(getURL("dbTest"), inputs, function(data){
						if (data == 1){
							alert("连接成功!");
						}
						else{
							alert("连接失败!");
						}
					});
				});
			};
			
			e.event.create.source.address = "exportCreate";
			e.event.update.on = false;
			genEditForm("export_detail", "export", e.source, e.form, e.event, 3, "export_alert", false);
			$("#export_title").text("创建 " + adp_translate["export"]);
			$("#export_modal").modal();
		});
		
		$("#export_search_btn").click(function(){
			var t = $.extend(true, {}, checkTable);
			t.source.address = "adpExportList";
			t.source.inputs = {name:$("#export_name_filter").val(), 
							   category: $("#export_category_filter").val()};
			t.event.del.source.address = "adpExportRemove";
			t.event.execute.source.address = "adpExportData";
			t.event.execute.source.func = function(itemID, dataFor){
				alert("导出接口: " + itemID + " 已开始运行，请到任务面板查看执行状态")
			};
			t.source.func = function(data){
				$("[data-for='export_log']").off('click').on('click', function(){
					var sourceID = $(this).attr("id").split("_")[1];
					$("#log_detail").empty();
					$("#log_title").text("导出配置" + sourceID + ": 日志详情");
					$("#log_detail").empty();
					drawFilterForm("log_detail", "exportLog", "export_log_filter", {}, true);
					$("#exportLog_search_btn").off("click").on("click", function(){
						$("#exportLog_list").empty();
						drawPagTable("exportLog_list", "exportLog", {id:sourceID, startDate:$("#exportLog_startDate_filter").val(), endDate:$("#exportLog_endDate_filter").val(), num:1}, "", "", "log_alert");
					})
					$("#log_modal").modal();
					$("#exportLog_search_btn").click();
				});
			}
			genTableWithCheck("export_list", "export", t.source, t.event, ["execute", "log","delete","detail"], "alertAll", true);
			return false;
		});
		$("#export_search_btn").click();
	});
</script>
