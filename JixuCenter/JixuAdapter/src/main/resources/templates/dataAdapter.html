<script type="text/javascript">
	$("#title").text(site_title);
	$(document).off("click", "[href='version.do']").on("click", "[href='version.do']", function(){
		var ver = fetch(getURL("version"), {}, "alertAll");
		$("#version_detail").text(ver);
		$("#version_modal").modal();
		return false;
	});
</script>
<body>
	<div id="title_form"></div>
	<div class="row" style="border-bottom: dotted; border-width: thin"></div>
	<div id="alertAll"></div>
	<div id="interface_list"></div>
</body>
<script type="text/javascript">
	$(function(){
		var $menu = genMenu();
		$menu.insertBefore($("#title_form"));
		$("#dataAdapter_nav").addClass("active");
		drawFilterForm("title_form", "interface", "adapter_filter", {}, false);
		drawModal("title_form", "interface");
		drawModal("title_form", "log");
		
		$("#interface_create_btn").click(function(){
			$("#interface_detail").empty();
			var e = $.extend(true, {}, editForm);
			e.source.on = false;
			e.form.name = "adapter_add";
			e.form.func = function(){
				$("#fieldset_db").hide();
				$("#interface_type").hide();
				$("#interface_trantype").hide();
				$("#interface_deliverType").on("change", function(){
					if ($(this).val() == FILE){
						$("#fieldset_db").hide();
						$("#fieldset_file").show();
						$("#fieldset_read").show();
					}
					else if ($(this).val() == DB){
						$("#fieldset_db").show();
						$("#fieldset_file").hide();
						$("#fieldset_read").hide();
					}
				});
				
				//$("#interface_dependency").on("change", function(){
				//	if ($(this).val() == "0"){
				//		$("#fieldset_time").show();
				//	}
				//	else {
				//		$("#fieldset_time").hide();
				//	}
				//});
				
				$("#interface_dbURL").val("[hostname]:[port]:[dbname]");
				$("#interface_dbFormat").on("change", function(){
					if ($(this).val() == 0){
						$("#interface_dbURL").val("[hostname],[port],[dbname]");
					}
					else{
						$("#interface_dbURL").val("[hostname],[port],[dbname]");
					}
				});
				
				$("#interface_autoDateFormat").prop("disabled", true)
				$("#interface_fromDay").prop("disabled", true);
				$("#interface_autoTime").prop("disabled", true);
				$("#interface_autoTime").prop("disabled", true);
				$("#interface_moveto").prop("disabled", true);
				$("#interface_holiday").prop("disabled", true);
				$("#interface_startDate").prop("disabled", true);
				$("#interface_startTime").prop("disabled", true);
				
				$("#interface_autodo").on("change", function(){
					if ($("#interface_autodo").is(":checked")){
						$("#interface_autoDateFormat").prop("disabled", false);
						$("#interface_fromDay").prop("disabled", false);
						$("#interface_autoTime").prop("disabled", false);
						$("#interface_autoTime").prop("disabled", false);
						$("#interface_moveto").prop("disabled", false);
						$("#interface_holiday").prop("disabled", false);
						$("#interface_startDate").prop("disabled", false);
						$("#interface_startTime").prop("disabled", false);
					}
					else{
						$("#interface_autoDateFormat").prop("disabled", true)
						$("#interface_fromDay").prop("disabled", true);
						$("#interface_autoTime").prop("disabled", true);
						$("#interface_autoTime").prop("disabled", true);
						$("#interface_moveto").prop("disabled", true);
						$("#interface_holiday").prop("disabled", true);
						$("#interface_startDate").prop("disabled", true);
						$("#interface_startTime").prop("disabled", true);
					}
				});
				
				$("#interface_dbTest_btn").on("click", function(){
					var inputs = {
							"dbURL":$("#interface_dbURL").val()||"",
							"dbFormat":$("#interface_dbFormat").val(),
							"dbUser":$("#interface_user").val()||"",
							"dbPwd":$("#interface_pwd").val()||""
					};
					invoke(getURL("dbTest"), inputs, function(data){
						if (data == 1){
							alert("连接成功!");
						}
						else{
							alert("连接失败!");
						}
					});
				});
			};
			e.event.create.source.address = "interfaceCreate";
			e.event.update.on = false;
			genEditForm("interface_detail", "interface", e.source, e.form, e.event, 3, "interface_alert", false);
			$("#interface_title").text("创建 " + adp_translate["interface"]);
			$("#interface_modal").modal();
		});
		
		$("#interface_search_btn").click(function(){
			var t = $.extend(true, {}, checkTable);
			t.source.address = "jobLatestStatus";
			t.event.del.source.address = "interfaceRemove";
			t.event.execute.source.address = "importData";
			t.event.execute.source.inputs = {port:-1, workflowStep:price, date:""}
			t.event.execute.source.func = function(itemID, dataFor){
				alert("适配器: " + itemID + " 已开始运行，请到任务面板查看执行状态")
			};
			
			t.source.inputs = {name:$("#interface_name_filter").val(), 
							   category: $("#interface_category_filter").val(),
							   type: 0
					  		   };
			
			t.source.func = function(data){
				$("[data-for='adapter_log']").off('click').on('click', function(){
					var sourceID = $(this).attr("id").split("_")[1];
					$("#log_detail").empty();
					$("#log_title").text("适配器" + sourceID + ": 日志详情");
					$("#log_detail").empty();
					drawFilterForm("log_detail", "adapterLog", "adapter_log_filter", {}, true);
					$("#adapterLog_search_btn").off("click").on("click", function(){
						$("#adapterLog_list").empty();
						drawPagTable("adapterLog_list", "interfaceLog", {id:sourceID, startDate:$("#adapterLog_startDate_filter").val(), endDate:$("#adapterLog_endDate_filter").val(), num:1}, "", "", "log_alert");
					})
					$("#log_modal").modal();
					$("#adapterLog_search_btn").click();
				});
			}
			genTableWithCheck("interface_list", "adapter", t.source, t.event, ["execute", "log","delete","detail"], "alertAll", true);
			return false;
		});
		
		
		$("#interface_search_btn").click();
	});
</script>
