server:
  port: 9080
  address: 0.0.0.0
  
spring:
  application:
    name: adapterService
  profiles:
    active: yitihua-jicheng    #一体化使用yitihua-jicheng
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration  
  datasource:
    validationQuery: SELECT 1 FROM DUAL
    maxWaitMillis: -1
    defaultAutoCommit: true
    defaultReadOnly: false
    defaultTransactionIsolation: -1
    defaultCatalog:
    testOnBorrow: true
    testOnReturn: false
    testOnCreate: false
    testWhileIdle: false
    minEvictableIdleTimeMillis: 1800000
    poolPreparedStatements: false
    maxOpenPreparedStatements: -1
    removeAbandonedTimeout: 300
    initialSize: 10
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.net.ReadTimeout=50000 # 批处理不加该配置
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: false  
#用户系统
#1 jixu用户系统
#2 joyin用户系统
#3 joyinBatch用户系统
jixu:
  user:
    type: 1
  #用户组
  project:
    group: Interface-Auto
    
 #是否取BS系统平台日   
  platedate: true
  #主配置文件，配置了这个会优先读取里面的属性覆盖主配置文件的属性
  ##目标数据库的类型 
  #Oracle=11;
  #MySQL=12;
  #SQLServer=13;
  #DB2=14;
  #Access=15;   
  adapter:
    targetDB:
      dbType: 11
  #是否使用和joyin整合后的缩表版本,该参数为临时存在，在尚未完成缩表结构前,测试人员还是测试用原表进行功能测试
  #true 精简锁表版本
  #false 使用原始的jixu表结构
  joyintables:
    flag: false

