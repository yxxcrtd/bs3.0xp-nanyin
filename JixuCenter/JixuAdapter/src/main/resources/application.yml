# 注册中心配置
eureka:
  client:
    enabled: true #是否启用eureka客户端，如果启用，则需要有eureka服务器，默认为true
    serviceUrl:
      defaultZone: http://127.0.0.1:9100/eureka/
  instance:
    ip-address: 127.0.0.1
    prefer-ip-address: false   
#分布式事物配置
tx-lcn:
  springcloud:
    loadbalance:
      enabled: true #开启负载均衡
  client:
    managerAddress: 192.168.90.89:8071,192.168.90.89:8072 # manager服务地址(rpc端口),可填写多个负载
  logger:
    enabled: true # 开启日志数据库记录存储
    onlyError: true
