#log4j.appender.stdout.layout.ConversionPattern=%d{ABSOLUTE} %5p %c{1}:%L - %m%n

### direct messages to file hibernate.log ###
log4j.appender.file=org.apache.log4j.DailyRollingFileAppender
log4j.appender.file.Encoding=UTF-8 
log4j.appender.file.File=C:/WorkSpace/Project/Logs/jixu.log
log4j.appender.file.DatePattern='.'yyyyMMdd
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%p]%C{1} %m%n


###当需要查看接口的详细解析数据过程,info改成debug
log4j.logger.com.jixu.dataInterface.service= INFO, interfaceLog
log4j.appender.interfaceLog=org.apache.log4j.FileAppender
log4j.appender.interfaceLog.Encoding=UTF-8
log4j.appender.interfaceLog.File=C:/WorkSpace/Project/Logs/interface.log
log4j.appender.interfaceLog.layout=org.apache.log4j.PatternLayout
log4j.appender.interfaceLog.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%p]%C{1} %m%n

log4j.additivity.com.jixu.dataInterface.service = false

log4j.logger.org.hibernate.hql=INFO


###查看自动做账凭证比较详细结果 
log4j.logger.com.jixu.mvc.control.service.impl.PeriodRunServiceImpl= debug,autoLog
log4j.appender.autoLog=org.apache.log4j.FileAppender
log4j.appender.autoLog.Encoding=UTF-8
log4j.appender.autoLog.File=C:/WorkSpace/Project/Logs/auto.log
log4j.appender.autoLog.layout=org.apache.log4j.PatternLayout
log4j.appender.autoLog.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%p]%C{1} %m%n

log4j.additivity.com.jixu.mvc.control.service.impl.PeriodRunServiceImpl = false


