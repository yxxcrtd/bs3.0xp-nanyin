<script type="text/javascript">
	$("#title").text(site_title);
	$(document).off("click", "[href='/jixu/version.do']").on("click", "[href='/jixu/version.do']", function(){
		var ver = fetch(getURL("version"), {}, "alertAll");
		$("#version_detail").text(ver);
		$("#version_modal").modal();
		return false;
	});
</script>
<body id='body'>
</body>
<script type="text/javascript" src="./js/jixu/tradeUtils.js" charset="utf-8"></script>
<script type="text/javascript">
	$(function(){
		var $menu = genMenu();
		$("#body").append($menu);
		$("#process_nav").addClass("active");
		$("#body").append("<div id='alertAll'></div>");
		genTabs("body", "process_ul", "process_content", {"newFund":"新基金上线", "oldFund":"老基金迁移", "batchJob":"批量做账"});
		drawFilterForm("newFund_display", "newFund", "newFund_filter", {}, true);
		drawFilterForm("oldFund_display", "oldFund", "oldFund_filter", {}, true);
		drawFilterForm("batchJob_display", "batchJob", "batchJob_filter", {}, true);
		
		drawSmallModal("body", "preExe");
		drawFilterForm("preExe_detail", "preExe", "preExe_filter", {}, true);
		
		var $port = $("#oldFund_port_filter");
		var $client = $("#oldFund_client_filter");
		
		updateSelectOptions($port, fetch(getURL("portShortList"), {client:$client.val()}));
		$client.on("change", function(){
			var options = fetch(getURL("portShortList"), {client:$(this).val()});
			updateSelectOptions($port, options);
		});
		
		var $portB = $("#batchJob_port_filter");
		var $clientB = $("#batchJob_client_filter");
		
		updateSelectOptions($portB, fetch(getURL("portShortList"), {client:$client.val()}));
		$clientB.on("change", function(){
			var options = fetch(getURL("portShortList"), {client:$(this).val()});
			updateSelectOptions($portB, options);
		});
		
		removeAlert();
		$("a[href='#newFund_display']").tab("show");
		
		$("#batchJob_execute_btn").on("click", function(){
			var inputs = {startDate:$("#batchJob_start_filter").val(),
						  endDate:$("#batchJob_end_filter").val(),
						  ports:$("#batchJob_port_filter").val()
						 }
			invoke(getURL("runBatchJob"), inputs, function(data){
				$("#batchJob_list").empty();
				drawTable("batchJob_list",data);
			}, "alertAll");
			return false;
		});
		$("#batchJob_redo_btn").on("click", function(){
			var inputs = {startDate:$("#batchJob_start_filter").val(),
						  endDate:$("#batchJob_end_filter").val(),
						  ports:$("#batchJob_port_filter").val()
						 }
			invoke(getURL("runRedoJob"), inputs, function(data){
				$("#batchJob_list").empty();
				drawTable("batchJob_list",data);
			}, "alertAll");
			return false;
		});
		
		$("#newFund_search_btn").on("click", function(){
			var t = $.extend(true, {}, checkTable);
			t.source.address = "processConfigList";
			t.source.inputs = {client:$("#newFund_client_filter").val(), port:0, processType: NEW_FUND};
			t.event.execute.source.address = "processConfigExe";
			t.event.execute.source.inputs = {processType: NEW_FUND, initShares:0};
			t.event.execute.source.func = function(itemID, dataFor){
				$.each($("tr[data-for='newFund']"), function(i, tr){
					if ($(tr).attr('id') == itemID){
						$(tr).find("td").eq(4).text("是");
					}
				});
			};
			genTableWithCheck("newFund_list", "newFund", t.source, t.event, ["detail","execute"], "alertAll", true);
			return false;
		});
		
		$("#oldFund_search_btn").on("click", function(){
			var t = $.extend(true, {}, checkTable);
			t.source.address = "processConfigList";
			t.source.inputs = {client:$("#oldFund_client_filter").val(), port:$("#oldFund_port_filter").val(), processType: OLD_FUND};
			t.event.execute.on = false;
			t.event.execute.source.address = "processConfigExe";
			//t.event.execute.source.inputs = {processType: OLD_FUND};
			t.event.execute.source.func = function(itemID, dataFor){
				if(confirm("是否确认执行流程配置？")){
					$("#preExe_modal").modal();
					$("#preExe_title").text("执行基金初始化流程");
					$("#preExe_exe_btn").off();
					$("#preExe_exe_btn").on("click", function(){
						invoke(getURL("processConfigExe"), {id:itemID, 
															initDate:$("#preExe_date_filter").val(), 
															initShares:$("#preExe_shares_filter").val(),
															processType:OLD_FUND}, function(data){
							$("#preExe_alert").empty();
							$("#preExe_alert").append(genAlert("success", "流程执行成功!"));
							$("#preExe_list").empty();
							$.each($("tr[data-for='oldFund']"), function(i, tr){
								if ($(tr).attr('id') == itemID){
									$(tr).find("td").eq(4).text("是");
								}
							});
						},"preExe_alert");
					});
				}
			};
			genTableWithCheck("oldFund_list", "oldFund", t.source, t.event, ["detail","execute"], "alertAll", true);
			return false;
		});
		
		$("#newFund_create_btn").on("click", function(){
        	bootbox.prompt("请输入流程名称", function(result){
       	    	if (result == null){
       	    		bootbox.hideAll();
           		}
           		else {
           			if (result == ""){
           				$("#alertAll").empty();
       	                $("#alertAll").append(genAlert("fail", "流程创建失败! 请输入流程名称!"));	
           			}
           			else {
           				invoke(getURL("processConfigCreate"), {clientID:$("#newFund_client_filter").val(), portID:0, name:result, processType:NEW_FUND}, function(data){
           					window.location.href = getURL("newFund") + "?id=" + data;
           				});	
           			}
           		}
        	});
		});
		
		$("#oldFund_create_btn").on("click", function(){
        	bootbox.prompt("请输入流程名称", function(result){
       	    	if (result == null){
       	    		bootbox.hideAll();
           		}
           		else {
           			if (result == ""){
           				$("#alertAll").empty();
       	                $("#alertAll").append(genAlert("fail", "流程创建失败! 请输入流程名称!"));	
           			}
           			else {
           				invoke(getURL("processConfigCreate"), {clientID:$("#oldFund_client_filter").val(), 
           													   portID:$("#oldFund_port_filter").val(),
           												       name:result, 
           												       processType:OLD_FUND}, 
           				function(data){
           					window.location.href = getURL("oldFund") + "?id=" + data;
           				});	
           			}
           		}
        	});
		});
	});
		
</script>
