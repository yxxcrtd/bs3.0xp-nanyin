<script type="text/javascript">

	$(document).off("click", "[href='/jixu/version.do']").on("click", "[href='/jixu/version.do']", function(){

<script type="text/javascript" src="./js/jixu/process.js" charset="utf-8"></script>
<script type="text/javascript" src="./js/jixu/newFund.js" charset="utf-8"></script>
<script type="text/javascript">
	$(function(){
		var $menu = genMenu();
		$menu.insertBefore($("#configID"));
		$("#process_nav").addClass("active");
		$("#configID").hide();
		var config = location.search.substr(1).split("&")[0].split("=")[1];
		$("#configID").text(config);
		removeAlert();
		$('#main').bootstrapWizard({
			'tabClass': 'bwizard-steps',
		});
		var client = $("#clientID").text();

		drawModal("configID", "rate");
		drawModal("configID", "map");
		drawModal("configID", "expense");
		
		invoke(getURL("processConfigLoad"), {id:config, processType:NEW_FUND}, function(data){
			var result = data;
			//var result = getData("/newFund");
			PORT = result.port;
			INTS = result.interests;
			BANKACCTS = result.bankAccts;
			SECACCTS = result.secAccts;
			EXPENSES = result.expenses;
			INTERFACES = result.interfaces;
			
			drawPortConfig("portPane", client, result.port.data);
			drawInterestConfig("interest", result.interests);
			drawBankAcctConfig("bank", result.bankAccts);
			drawSecAcctConfig("secAcct", result.secAccts);
			drawPortExpenseConfig("expensePane", result.expenses);
			drawInterfaceConfig("interface", result.interfaces);
			tabChangeEvent();
			
		}, "alertAll");
		
		$("#process_save").on("click", function(){
			var params = {}
			saveData();
			params.port = PORT;
			params.interests = INTS;
			params.bankAccts = BANKACCTS;
			params.secAccts = SECACCTS;
			params.expenses = EXPENSES;
			params.interfaces = INTERFACES;
			
			invoke(getURL("processConfigSave"), {id:config, config:JSON.stringify(params)}, function(data){
				$("#alertAll").empty();
				$("#alertAll").append(genAlert("success", config + " 流程保存成功!"));
			}, "alertAll");
		});
		
		$("#process_exe").on("click", function(){
			if(confirm("是否确认执行流程配置？")){
				invoke(getURL("processConfigExe"), {id:config, processType:NEW_FUND, initShares:0}, function(data){
					$("#alertAll").empty();
					$("#alertAll").append(genAlert("success", config + " 流程执行成功!"));
				},"alertAll");
			}
		});
	})	
</script>
