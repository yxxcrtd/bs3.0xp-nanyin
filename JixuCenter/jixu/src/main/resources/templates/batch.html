<script type="text/javascript">
	$("#title").text(site_title);
	$(document).off("click", "[href='/jixu/version.do']").on("click", "[href='/jixu/version.do']", function(){
		var ver = fetch(getURL("version"), {}, "alertAll");
		$("#version_detail").text(ver);
		$("#version_modal").modal();
		return false;
	});
</script>
<body>
	<div id="title_form"></div>
	<div class="row" style="border-bottom: dotted; border-width: thin"></div>
	<div id="alertAll"></div>
	<div id="sub_list"></div>
</body>
<script type="text/javascript" src="./js/jixu/tradeUtils.js" charset="utf-8"></script>
<script type="text/javascript" src="./js/jixu/trade.js" charset="utf-8"></script>
<script type="text/javascript" src="./js/jixu/batch.js" charset="utf-8"></script>
<script type="text/javascript">
	$(function(){
		var $menu = genMenu();
		$menu.insertBefore($("#title_form"));
		$("#batch_nav").addClass("active");
		drawModal("title_form", "trade");
		drawModal("title_form", "fee");
		
		drawTradeFilterForm("title_form", "sub", getForm("port_sub_filter"), {}, false);
		setDatePick();
		updateSelectOptions($("#sub_port_filter"), fetch(getURL("portShortList"), {client:$("#sub_client_filter").val()}));
		$("#sub_client_filter").on("change", function(){
			var options = fetch(getURL("portShortList"), {client:$("#sub_client_filter").val()});
			updateSelectOptions($("#sub_port_filter"), options);
		});
		
		var btns = [$("#sub_red_btn"), $("#sub_payment_btn")]		
		//直接显示
		var inputs = {}
		inputs.portfolio = $("#sub_port_filter").val();
		inputs.start = $("#sub_start_filter").val()||"1900-01-01";
		inputs.end = $("#sub_end_filter").val()||"2099-01-01";
		drawPagTable("sub_list", "portSubList", inputs, "", "");
		
		//批次选中
		$(document).on("click", "#sub_list_table td",
				function() {
					$("#sub_list_table tr[choose='true']").css("background-color", "");
					$("#sub_list_table tr[choose='true']").attr("choose",false);

					$(this).parent().css("background-color", "#ccc");
					$(this).parent().attr("choose", true);
					var tds = $(this).parent().find("td");
					//TODO: 此处根据后台返回的内容进行修改，很重要
					var lot = $(tds[0]).text() + "|" + $(tds[1]).text() + "|" + $(tds[2]).text() + "|" + $(tds[3]).text() +"|" + $(tds[7]).text() +"|" + $(tds[8]).text();
					
					$.each(btns, function(i, btn){btn.attr("choose", lot);});
					$("#sub_feeConfig_btn").attr("choose", lot);
		});
		
		//执行各种交易
		$.each(btns, function(i, btn){
			btn.off("click").on("click", function(){
				var lot_id = $(this).attr("choose");
				//lot_id = "1|2|3|4|5|6|7"
				if (lot_id) {
					var brief = lot_id.split("|"); 
					var info = {};
					var port = $("#sub_port_filter").val()
					info["client"] = $("#sub_client_filter").val();
			 		info["port"] = port;
			 		info["ports"] = [port];
			 		info["tradeDate"] = $("#sub_end_filter").val();
			 		info["ports_str"] = JSON.stringify(info.ports);
			 		info["secid"] = brief[0] + "|" + brief[1] + "|" + brief[2];
			 		info["contract"] = brief[3];
			 		
			 		info = genTradeInfo($(this).attr("id").split("_")[1], lot_id, info);	
					tradeCreate("trade_detail", "trade_alert", info);
					$("#trade_modal").modal();
				}	
				else {
					alert("请选择要操作的批次!");
				}
				return false;
			});
		});
		
		//绩效费配置
		$("#sub_feeConfig_btn").off("click").on("click", function(){
			var lot_id = $(this).attr("choose");
			//lot_id = "1|2|3|4|5|6|7"
			if (lot_id) {
				var brief = lot_id.split("|"); 
				var info = {};
				info["port"] = $("#sub_port_filter").val()
				info["secid"] =brief[0] + "|" + brief[1] + "|" + brief[2];
			 	info["contract"] = brief[3];
				 
				var fee = fetch(getURL("portPerformanceFeeDetail"),info,"alert_all");
				if (fee){
					if (fee.data){
						var e = $.extend(true, {}, tradeEditForm)
						e.source.on = false;
						e.source.value = fee.data;
						var fee_form = getForm("portPerformanceFee_edit");
						e.form.form = fee_form;
						info["messageHeader"] = fee_form.messageHeader;
						info.id = fee.data.id;
						e.form.inputs = info;
						e.form.func = fee_form.func;
						
						e.event.create.on = false;
						e.event.update.on = true;
						e.event.update.source.address = "portPerformanceFeeUpdate";
						e.event.update.source.inputs = info;
						
						$("#fee_detail").empty();
						$("#fee_title").text("绩效费配置更新");
						genTradeEditForm("fee_detail", "feeConfig", e.source, e.form, e.event, 4, "fee_alert", true);
						$("#fee_modal").modal();
					}
					else{
						var e = $.extend(true, {}, tradeEditForm)
						e.source.on = false;
						var fee_form = getForm("portPerformanceFee_add");
						e.form.form = fee_form;
						info["messageHeader"] = fee_form.messageHeader;
						e.form.inputs = info;
						e.form.func = fee_form.func;
						
						e.event.create.on = true;
						e.event.update.on = false;
						e.event.create.source.address = "portPerformanceFeeCreate";
						e.event.create.source.inputs = info;
						
						$("#fee_detail").empty();
						$("#fee_title").text("绩效费配置创建");
						genTradeEditForm("fee_detail", "feeConfig", e.source, e.form, e.event, 4, "fee_alert", false);
						$("#fee_modal").modal();
					}
				}
				else{
					alert("无权限调用!");
				}
				
			}	
			else {
				alert("请选择要操作的批次!");
			}
			return false;
		});
		

		//点击批次管理的搜索后搜索组合所在批次
		$("#sub_search_btn").off();
		$("#sub_search_btn").on("click", function(){
			var inputs = {}
			inputs.portfolio = $("#sub_port_filter").val();
			inputs.start = $("#sub_start_filter").val()||"1900-01-01";
			inputs.end = $("#sub_end_filter").val()||"2099-01-01";
			
			drawPagTable("sub_list", "portSubList", inputs, "", "");
			return false;
		})
	
	});
</script>
