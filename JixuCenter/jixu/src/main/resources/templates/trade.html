	$(document).off("click", "[href='/jixu/version.do']").on("click", "[href='/jixu/version.do']", function(){

<body>
	<div id="title_form"></div>
	<div class="row" style="border-bottom: dotted; border-width: thin"></div>
	<br/>
	<ul class="nav nav-tabs" role="tablist">
		<li id="cash_tab" role="presentation"><a href="#cash_display" aria-controls="cash_display" role="tab" data-toggle="tab">现金交易</a></li>
		<li id="shareholder_tab" role="presentation"><a href="#shareholder_display" aria-controls="shareholder_display" role="tab" data-toggle="tab">股东交易</a></li>
		<li id="portTrade_tab" role="presentation"><a href="#portTrade_display" aria-controls="portTrade_display" role="tab" data-toggle="tab">投资组合交易</a></li>
		<li id="fx_tab" role="presentation"><a href="#fx_display" aria-controls="fx_display" role="tab" data-toggle="tab">汇率利率交易</a></li>
		<li id="ca_tab" role="presentation"><a href="#ca_display" aria-controls="ca_display" role="tab" data-toggle="tab">公司行为</a></li>
	</ul>
	<div id="alertAll"></div>
	<div class="tab-content">
		<div role="tabpanel" class="tab-pane fade" id="cash_display"></div>
		<div role="tabpanel" class="tab-pane fade" id="shareholder_display"></div>
		<div role="tabpanel" class="tab-pane fade" id="portTrade_display"></div>
		<div role="tabpanel" class="tab-pane fade" id="fx_display"></div>
		<div role="tabpanel" class="tab-pane fade" id="ca_display"></div>
	</div>

<script type="text/javascript" src="./js/jixu/tradeUtils.js" charset="utf-8"></script>
<script type="text/javascript" src="./js/jixu/trade.js" charset="utf-8"></script>
<script type="text/javascript">
	$(function(){
		var $menu = genMenu();
		$menu.insertBefore($("#title_form"));
		
		$("#trade_nav").addClass("active");	
		drawModal("title_form", "voucher");
		
		var catHM = {};
		catHM["cash"] = cash;
		catHM["shareholder"] = ta;
		catHM["portTrade"] = tran;
		catHM["fx"] = fxTrade;
		catHM["ca"] = corpAction;
		
		function genFilters(){
			var port = $("#portfolio_port_filter").val();
			var cats = ["cash", "shareholder", "portTrade", "fx", "ca"];
			$.each(cats, function(index, cat){	
				$("#" + cat + "_display").empty();
				var inputs = {};
				if (port != "" && typeof(port) != "undefined"){
					inputs[1] = {portfolios:port, category:catHM[cat], type:ALL};
				}
				if (cat == "portTrade"){
					inputs[2] = {config:ALL, type:ALL};
				}
				else if (cat == "cash"){
					inputs[0] = {type:CASH, all:false}; 
				}
				else if (cat == "shareholder"){
					inputs[0] = {type:CAPITAL, all:false};
				}
				else if (cat == "ca"){
					inputs[2] = {"config":ALL,"type":COMMON_STOCK}
				}
				drawFilterForm(cat + "_display", cat, cat + "_filter", inputs, true);
			});
			
			
			$("a.btn.btn-success").off("click");
			$("a.btn.btn-success").on("click", function(){
				var action = $(this).attr("id").split("_")[1];
			 	var tp = $(this).attr("id").split("_")[0];
			 	if (action == "create"){
			 		var info = {};
			 		info["tp"] = tp;
			 		info["client"] = $("#portfolio_client_filter").val();
			 		info["port"] = $("#portfolio_port_filter").val();
			 		info["ports"] = [port];
			 		info["date"] = getNowFormatDate();
			 		info["ports_str"] = JSON.stringify(info.ports);
			 		if (tp == "ca") {
			 			var exist = fetch(getURL("verifySecurity"), {assetType:COMMON_STOCK, secid:$("#ca_secid_filter").val()||""},"alertAll");
	 					if (exist){
	 						info["tradeType"] = $("#ca_type_filter").val();
	 						info["secid"] = $("#ca_secid_filter").val();
	 						info["assetType"] = COMMON_STOCK
	 						caCreate("trade_detail", "trade_alert", info);
		 					$("#trade_modal").modal();
	 					}
	 					else{
	 						$("#alertAll").empty();
	 						$("#alertAll").append(genAlert("fail", "您输入的证券不存在，请输入正确的证券名称！"));
	 					}
			 		}
			 		else {
			 			if (tp == "portTrade" || tp == "fx"){
				 			info["assetType"] = $("#" + tp + "_type_filter").val();
				 		}
				 		else if (tp == "cash"){
				 			info["assetType"] = CASH;
				 		}
				 		else if (tp == "shareholder"){
				 			info["assetType"] = CAPITAL;
				 		}
				 		var assetForm = getData(fetch(getURL("assetForm"), {assetType:info["assetType"]}));
				 		if (! assetForm){
				 			alert("请选择合适的资产类型后再创建交易！")
				 			return false;
				 		}
				 		info["expense"] = assetForm.expense;
				 		info["collateral"] = assetForm.collateral;
				 		if (assetForm.PreForm){
				 			$("#preTrade_detail").empty();
				 			drawTradeFilterForm("preTrade_detail", "preTrade", assetForm.PreForm, info, false);
				 			$("#preTrade_modal").modal();
				 			$("#preTrade_proceed_btn").on("click", function(){
				 				if ($("#preTrade_filter").valid()){
				 					var exist = false;
				 					if ($("#preTrade_secid_filter").val()){
				 						exist = fetch(getURL("verifySecurity"), {assetType:info.assetType, secid:$("#preTrade_secid_filter").val()},"preTrade_alert");
				 					}
				 					else {
				 						exist = true;
				 					}
				 					if (exist){
				 						$.each(assetForm.info, function(k, v){
					 						info[k] = $("#" + v).val();
					 					});
					 					tradeCreate("trade_detail", "trade_alert", info);
					 					$("#preTrade_modal").modal("hide");
					 					$("#trade_modal").modal();
				 					}
				 					else{
				 						$("#preTrade_alert").empty();
				 						$("#preTrade_alert").append(genAlert("fail", "您输入的证券不存在，请输入正确的证券名称！"));
				 					}
				 				}
				 				return false;
				 			});
				 		}
				 		else {
				 			$.each(assetForm.info, function(k, v){
		 						info[k] = $("#" + v).val();
		 					});
				 			tradeCreate("trade_detail", "trade_alert", info);
				 			$("#trade_modal").modal();
				 		}
			 		}
			 	}
			});
			
			$("a.btn.btn-primary").off("click");
			$("a.btn.btn-primary").on("click", function(){
				var action = "";
				if (typeof($(this).attr("id")) != "undefined"){
					action = $(this).attr("id").split("_")[1];
				}
			 	if (action == "search"){
			 		var tp = $(this).attr("id").split("_")[0]; 
			 		var inputs = {config:JSON.stringify([$("#" + tp + "_resource_filter").val()]),
		 					  		   smf:$("#" + tp + "_secid_filter").val(),
		 					  		   type:$("#" + tp + "_type_filter").val(),
		 					  		   portfolio:$("#portfolio_port_filter").val(),
		 					  		   start:$("#portfolio_start_filter").val(),
		 					  		   end:$("#portfolio_end_filter").val(),
		 					  		   displayDelete:$("#"+ tp + "_delete_filter").is(":checked")};
			 		var t = $.extend(true, {}, checkTable);
	 				t.source.address = tp + "Trades";
	 				t.source.inputs = inputs;
	 				t.event.add.on = false;
	 				t.event.detail.on = false;
					if (tp == "ca"){
						t.event.del.source.address = "caRemove";
						t.event.detail.source.address = "caDetail";
						t.event.detail.source.func = caDetail;
						t.event.update.on = false;
						t.event.update.source.address = "caUpdate";
		    				t.event.update.source.func = caUpdate;
					}
					else {
						t.event.del.source.address = "tradeRemove";
						t.event.detail.source.address = "tradeDetail";
						t.event.detail.source.inputs["type"] = $("#" + tp + "_type_filter").val();
						t.event.detail.source.func = tradeDetail;
						t.event.update.on = false;
						t.event.update.source.address = "tradeUpdate";
		    				t.event.update.source.func = tradeUpdate;
					}
					t.event.detail.form.target_id = "trade_detail";
					t.event.detail.form.alert_id = "trade_alert";
	 				$("#" + tp + "_list").empty();
					genTableWithCheck(tp + "_list", tp, t.source, t.event, ["detail", "del"], "alertAll", false);
			 		
				return false;
			}
			});
			
			$("a.btn.btn-info").off("click");
			$("a.btn.btn-info").on("click", function(){
				var action = $(this).attr("id").split("_")[1];
			 	if (action == "voucher"){
			 		var trade_id = $(this).attr("choose");
			 		if (trade_id){
			 			invoke(getURL("getTradeVoucher"), {tradeID : trade_id}, function(vdata) {
			 				$("#voucher_title").text("#" + trade_id + "交易: 凭证详情");
							$("#voucher_detail").empty();
							drawTable("voucher_detail", vdata);
							$("#voucher_modal").modal();
						});
			 		}
			 		else{
			 			alert("请选择交易后再进行此操作!");
			 		}
			 	}
			});
		};
		
		removeAlert();
		drawPortfolioSelect("portfolio_filter");
		drawModal("title_form", "trade");
		drawModal("title_form", "smf");
		drawModal("title_form", "cf");
		drawModal("title_form", "cf2");
		drawSmallModal("title_form", "preTrade");
		
		genFilters();
		setDatePick();
		$("a[href='#cash_display']").tab("show");
		$("#portfolio_port_filter").change(genFilters);
		$("select.form-control").change(function(){
			var idl = $(this).attr("id").split("_");
			var cat = idl[0];
			var action1 = idl[1];
			var action2 = idl[2];
			if (action1 == "type" && action2 == "select"){
				var port = $("#portfolio_port_filter").val();
				var options = fetch(getURL("importConfigList"), {portfolios:port, category:catHM[cat], type:$(this).val()});
				updateSelectOptions($("#" + cat + "_resource_filter"), options);
			}
			return false;
		});
		
		$(document).on("click", ".table.table-hover tr td",
				function() {
					var $tr = $(this).parent();
					var $table = $tr.parent();
					$table.find("tr[choose='true']").css("background-color", "");
					$table.find("tr[choose='true']").attr("choose",false);

					$tr.css("background-color", "#ccc");
					$tr.attr("choose", true);
					$("#" + $tr.attr("data-for") + "_voucher_btn").attr("choose", $tr.attr("id"));
		}); 
	});
</script>
