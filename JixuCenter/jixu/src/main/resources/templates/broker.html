<script type="text/javascript">
	$("#title").text(site_title);
	$(document).off("click", "[href='/jixu/version.do']").on("click", "[href='/jixu/version.do']", function(){
		var ver = fetch(getURL("version"), {}, "alertAll");
		$("#version_detail").text(ver);
		$("#version_modal").modal();
		return false;
	});
</script>
<body>
	<ul id="tabs" class="nav nav-tabs" role="tablist">
		<li id="broker_tab" role="presentation"><a href="#broker_display" aria-controls="broker_display" role="tab" data-toggle="tab">券商配置</a></li>
		<li id="secAcct_tab" role="presentation"><a href="#secAcct_display" aria-controls="secAcct_display" role="tab" data-toggle="tab">证券账户配置</a></li>
		<li id="seatNumber_tab" role="presentation"><a href="#seatNumber_display" aria-controls="seatNumber_display" role="tab" data-toggle="tab">券商席位号配置</a></li>
	</ul>
	<div id="alertAll"></div>
	<div class="tab-content">
		<div role="tabpanel" class="tab-pane fade" id="broker_display"></div>
		<div role="tabpanel" class="tab-pane fade" id="secAcct_display"></div>
		<div role="tabpanel" class="tab-pane fade" id="seatNumber_display"></div>
	</div>
</body>
<script type="text/javascript" src="./js/jixu/broker.js" charset="utf-8"></script>
<script type="text/javascript">
	$(function(){
		var $menu = genMenu();
		$menu.insertBefore($("#tabs"));
		$("#config_nav").addClass("active");
		$.each(["broker", "secAcct", "seatNumber"], function(i, tab){
			drawFilterForm(tab + "_display", tab, tab + "_filter", [], true);
		});
		drawModal("alertAll", "secAcct");
		$("a[href='#broker_display']").tab("show");
		removeAlert();
		
		$("#broker_search_btn").on("click", function(){
			var brokerID = $("#broker_table_filter").val();
			var e = $.extend(true, {}, editForm);
	 		e.source.address = "brokerDetail";
			e.source.inputs = {id: brokerID};
			e.form.name = "broker_edit";
			
			e.event.create.on = false;;
			e.event.update.source.address = "brokerUpdate";
			e.event.update.source.inputs = {id: brokerID};
			$("#broker_list").empty();
			genEditForm("broker_list", "broker", e.source, e.form, e.event, 3, "alertAll", true);
			return false;
		});
		
		$("#broker_create_btn").on("click", function(){
			var e = $.extend(true, {}, editForm);
	 		e.source.on = false;
			e.form.name = "broker_add";
			e.event.create.source.address = "brokerCreate";
			e.event.update.on = false;
			$("#broker_list").empty();
			genEditForm("broker_list", "broker", e.source, e.form, e.event, 3, "alertAll", false);
			return false;
		});
		
		$("#secAcct_search_btn").on("click", function(){
			var tp = "secAcct";
			var brokerID = $("#secAcct_broker_filter").val();
	 		var t = $.extend(true, {}, checkTable);
			t.source.address = "secAcctsInBroker";
			t.source.inputs = {pid:brokerID};
			
			t.event.add.on = false;
			
			t.event.detail.on = false;
			t.event.detail.source.address = "secAcctDetail";
			t.event.detail.source.func = secAcctDetail;
			t.event.detail.form.target_id = "secAcct_detail";
			t.event.detail.form.alert_id = "secAcct_alert";
			
			t.event.del.on = false;
			
			t.event.update.on = false;
   			t.event.update.source.func = secAcctUpdate;
			
			$("#" + tp + "_list").empty();
			genTableWithCheck(tp + "_list", tp, t.source, t.event, ["detail"], "alertAll", false);
			return false;
		});
		
		$("#secAcct_create_btn").on("click", function(){
			var brokerID = $("#secAcct_broker_filter").val();
			secAcctCreate("secAcct_detail", brokerID, "secAcct_alert");
			return false;
		});
		
		seatNumberDetail();
		$("#seatNumber_broker_filter").on("change", function(){
			seatNumberDetail();
			return false;
		});
		
		
	});
</script>
