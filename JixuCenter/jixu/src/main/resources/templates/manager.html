<script type="text/javascript">
	$("#title").text(site_title);
	$(document).off("click", "[href='/jixu/version.do']").on("click", "[href='/jixu/version.do']", function(){
		var ver = fetch(getURL("version"), {}, "alertAll");
		$("#version_detail").text(ver);
		$("#version_modal").modal();
		return false;
	});
</script>
<body>
	<div class="col-md-5" id="managerGroup_form"></div>
    <div class="row" style="border-bottom: dotted; border-width: thin"></div>
    <div id="alertAll"></div>
    <div id="content"></div>
</body>
<script type="text/javascript">
	$(function(){
		var $menu = genMenu();
		$menu.insertBefore($("#managerGroup_form"));
		$("#config_nav").addClass("active");
		//生成filter form, 并与Modal关联
		drawFilterForm("managerGroup_form", "managerGroup", "managerGroup_filter", [], false);	
        $("#managerGroup_create_btn").attr("data-toggle", "modal");
        $("#managerGroup_create_btn").attr("data-target", "#managerGroup_modal");
        removeAlert();
        
        $("#managerGroup_search_btn").on("click", function(){
        	var mgID = $("#managerGroup_table_filter").val();
        	var f = $.extend(true, {}, tableForm);
    		
        	f.source.address = "managerGroupDetail";
    		f.source.inputs = {id:mgID};
    		f.form.name = "managerGroup_table";
    		f.form.func = function(){
    			$("#manager_preadd").text("增加基金经理");
    			$("#manager_postadd").text("增加基金经理");
    		};
    		f.event.update.source.address = "managerUpdate";
    		f.event.update.source.inputs = {pid:mgID};
    		
    		f.event.del.source.address = "managerRemove";
    		f.event.del.source.inputs = {pid:mgID};
    		
    		f.event.add.source.address = "managerCreate";
    		f.event.add.source.inputs = {pid:mgID};
    		f.event.add.form.name = "manager_add";
    		
    		$("#content").empty();
    		$("#content").append("<div><label>经理组编号：</label><label id='mgID'>" + mgID + "</label></div>");
    		genTableSimpleForm("content", "manager", f.source, f.form, f.event, "alertAll", true);

        });
      
        $("#managerGroup_create_btn").on("click", function(){
        	bootbox.prompt("请输入经理组名称", function(result){
       	    	if (result == null){
       	    		bootbox.hideAll();
           		}
           		else {
           			if (result == ""){
           				$("#alertAll").empty();
       	                $("#alertAll").append(genAlert("fail", translate["managerGroup"] + "创建失败! 请输入假期安排名称!"));	
           			}
           			else {
           				invoke(getURL("managerGroupCreate"), {name:result}, function(data){
           					var mgID = data;
           					var f = $.extend(true, {}, tableForm);
               	    		
               	        	f.source.on = false;
               	        	f.form.name = "managerGroup_table";
               	        	f.form.func = function(){
               	    			$("#manager_preadd").text("增加基金经理");
               	    			$("#manager_postadd").text("增加基金经理");
               	    		};
               	    		f.event.update.source.address = "managerUpdate";
               	    		f.event.update.source.inputs = {pid:mgID};
               	    		
               	    		f.event.del.source.address = "managerRemove";
               	    		f.event.del.source.inputs = {pid:mgID};
               	    		
               	    		f.event.add.source.address = "managerCreate";
               	    		f.event.add.source.inputs = {pid:mgID};
               	    		f.event.add.form.name = "manager_add";
               	    		
               	    		$("#content").empty();
               	    		$("#content").append("<div><label>经理组编号：</label><label id='mgID'>" + mgID + "</label></div>");
               	    		genTableSimpleForm("content", "manager", f.source, f.form, f.event, "alertAll", true);
               	    		updateSelectOptions($("#managerGroup_table_filter"), fetch(getURL("managerGroupList"), {}));
           				});	
           			}
           		}
        	});
        });
	});
</script>
