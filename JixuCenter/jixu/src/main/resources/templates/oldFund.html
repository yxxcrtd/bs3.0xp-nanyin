<script type="text/javascript">
	$("#title").text(site_title);
	$(document).off("click", "[href='/jixu/version.do']").on("click", "[href='/jixu/version.do']", function(){
		var ver = fetch(getURL("version"), {}, "alertAll");

	});
</script>
<body>
	<div id="configID" style="display: none;">${configID}</div>
	<div id="clientID" style="display: none;">${clientID}</div>
	<div id="portID" style="display: none;">${portID}</div>
	<div class = "row">
		<div class="col-md-2">
			<h4 id="configName">${configName} - ${portName}</h4>
			<!-- h5 id="configName">${configName} - 投资组合1</h5-->
		</div>
		<div class="col-md-2">
			<button class='btn btn-primary' id='process_save'>保存</button>
			&nbsp;&nbsp;
			<button class='btn btn-success' id='process_exe'>执行</button>
		</div>
	</div>
	<div class="row"></div>
	<div class="row" style="border-bottom: dotted; border-width: thin"></div>
	<br/>
	<div id="alertAll"></div>
	<div id="main" style="margin:0px 25px;">
		<ul>
			<li><a href="#tb" data-toggle="tab"><span class="label">1</span> 科目余额初始化</a></li>
			<li><a href="#secPos" data-toggle="tab"><span class="label">2</span> 证券头寸初始化</a></li>
			<li><a href="#rcpy" data-toggle="tab"><span class="label">3</span> 应收应付初始化</a></li>
		</ul>
		<div class="tab-content">
			<div class="tab-pane" id="tb"></div>
			<div class="tab-pane" id="secPos"></div>
			<div class="tab-pane" id="rcpy"></div>
			<br/>
			<ul class="pager wizard">
				<li class="previous"><a href="#">上一步</a></li>
			  	<li class="next"><a href="#">下一步</a></li>
			</ul>
		</div>
	</div>
</body>
<script type="text/javascript" src="./static/js/jixu/tradeUtils.js" charset="utf-8"></script>
<script type="text/javascript" src="./static/js/jixu/market.js" charset="utf-8"></script>
<script type="text/javascript" src="./static/js/jixu/process.js" charset="utf-8"></script>
<script type="text/javascript" src="./static/js/jixu/oldFund.js" charset="utf-8"></script>
<script type="text/javascript">
	$(function(){
		var $menu = genMenu();
		$menu.insertBefore($("#configID"));
		var config = location.search.substr(1).split("&")[0].split("=")[1];
		$("#configID").text(config);

		$("#process_nav").addClass("active");
		removeAlert();
		$('#main').bootstrapWizard({
			'tabClass': 'bwizard-steps',
		});
		drawModal("configID", "tbAcct");
		drawModal("configID", "preSMF");
		drawModal("configID", "mapSMF");
		drawSmallModal("configID", "preExe");
		drawFilterForm("preExe_detail", "preExe", "preExe_filter", {}, true);
		
		var inputs = {};
		drawFilterForm("preSMF_detail", "smf", "smf_filter2", {}, false);
		
		CLIENT = $("#clientID").text();
		CONFIG = $("#configID").text();
		PORT = $("#portID").text();
		
		invoke(getURL("processConfigLoad"), {id:CONFIG, processType:OLD_FUND}, function(data){
			var result = data;
			//var result = getData("/oldFund");
			//NAV = result.nav;
			TB = result.tb;
			SECPOS = result.secPos;
			RCPY = result.rcpy;
			COA = fetch(getURL("acctList"), {portID:PORT});
			SMF = fetch(getURL("smfList"), {config:ALL, type:ALL});
			BANKACCTS = fetch(getURL("portBankShortList"), {portID:PORT});
			SECACCTS = fetch(getURL("secAcctListInPort"), {pid:PORT});
			
			if (! TB.info){
				TB.info = [];
				TB.newAccts = {};
			}
			if (! SECPOS.info){
				SECPOS.info = [];
				SECPOS.newSecs = {};
			}
			if (! RCPY.info){
				RCPY.info = [];
			}
			drawTBFilter("tb", "tb", "tb_filter", "tb_result", {portID:PORT, configID:CONFIG});
			drawSecFilter("secPos", "secPos", "secPos_filter", "secPos_result",{portID:PORT, configID:CONFIG});
			drawRCPYFilter("rcpy", "rcpy", "rcpy_filter", "rcpy_result", {portID:PORT, configID:CONFIG});
			
			drawTBConfig("tb_result", TB.info);
			drawSecPosConfig("secPos_result", SECPOS.info);
			drawRCPYConfig("rcpy_result", RCPY.info);
			tabChangeEvent();
		}, "alertAll");
		
		$("#process_save").on("click", function(){
			var params = {}
			params.tb = TB;
			params.secPos = SECPOS;
			
			var result = loadTableForm2("form_rcpy_div","rcpy");
			RCPY.info = result.params;
			RCPY.complete = result.complete;
			params.rcpy = RCPY;
			
			if (!TB.complete || !SECPOS.complete || !RCPY.complete){
				if (confirm("表单中仍有未填写内容，保存后执行可能会有问题，是否仍需保存?")){
					invoke(getURL("processConfigSave"), {id:CONFIG, config:JSON.stringify(params)}, function(data){
						$("#alertAll").empty();
						$("#alertAll").append(genAlert("success", CONFIG + " 流程保存成功!"));
					}, "alertAll");
				}
			}
			else{
				invoke(getURL("processConfigSave"), {id:CONFIG, config:JSON.stringify(params)}, function(data){
					$("#alertAll").empty();
					$("#alertAll").append(genAlert("success", CONFIG + " 流程保存成功!"));
				}, "alertAll");
			}
		});
		
		$("#process_exe").on("click", function(){
			if(confirm("是否确认执行流程配置？")){
				$("#preExe_title").text("执行基金初始化流程");
				$("#preExe_modal").modal();
			}
		});
		
		$("#preExe_exe_btn").on("click", function(){
			invoke(getURL("processConfigExe"), {id:CONFIG, 
												initDate:$("#preExe_date_filter").val(),
												initShares:$("#preExe_shares_filter").val(),
												processType:OLD_FUND
												}, 
			function(data){
				$("#preExe_alert").empty();
				$("#preExe_alert").append(genAlert("success", CONFIG + " 流程执行成功!"));
				$("#preExe_list").empty();
			},"preExe_alert");
		});
	})	
</script>
