<script type="text/javascript">
	$(function() {
		var $menu = genMenu();
		$menu.insertBefore($("#title_form"));
		$("#info_nav").addClass("active");
		drawPortfolioSelect("portfolio_filter");

		setDatePick();
		drawFilterForm("voucher_display", "voucher", "voucher_filter", {}, true);
		drawFilterForm("rcpy_display", "rcpy", "rcpy_opr", {}, true);
		drawFilterForm("rd_display", "rd", "rd_opr", {}, true);
		drawTradeFilterForm("position_display", "position", getForm("secPos_filter2"), {}, true);
		drawModal("title_form", "voucher");
		drawModal("title_form", "positionVoucher");
		drawModal("title_form", "cashVoucher");
		drawModal("title_form", "rd");
		drawModal("title_form", "rcpy");
		drawSmallModal("title_form", "rcpy_opr");
		drawModal("title_form", "manual");
		drawModal("title_form", "manualCreate");
		drawModal("title_form", "manualEdit");
		drawModal("title_form", "position");
		drawModal("title_form", "trade");
		drawModal("title_form", "cash");
		drawModal("title_form", "nav");
		$("a[href='#voucher_display']").tab("show");
		removeAlert();

		$("li[role='presentation']")
				.on(
						"click",
						function() {
							var func = ($(this).attr("id")).split("_")[0];
							var inputs = {
								portfolio : $("#portfolio_port_filter").val(),
								start : $("#portfolio_start_filter").val()||"1900-01-01",
								end : $("#portfolio_end_filter").val()||"2099-01-01"
							};

							if (func == "rd" || func == "rcpy") {
								var dom_id = func + "_list";

								var postFunc = function() {
									$("a[data-for='rd_rcpy']")
											.on(
													"click",
													function() {
														var rcpy = $(this)
																.attr("id")
																.split("_")[2];
														$("#rd_title").text(
																"应收应付 - "
																		+ rcpy);
														invoke(
																getURL("getRCPY"),
																{
																	rcpyNum : rcpy
																},
																function(data) {
																	$(
																			"#rd_detail")
																			.empty();
																	drawTable(
																			"rd_detail",
																			data);
																});
													});
									$("a[data-for='rd_trade']")
											.on(
													"click",
													function() {
														var trade = $(this)
																.attr("id")
																.split("_")[2];
														$("#rd_title")
																.text(
																		"交易 - "
																				+ trade);
														invoke(
																getURL("getTrade"),
																{
																	tradeNum : trade
																},
																function(data) {
																	$(
																			"#rd_detail")
																			.empty();
																	drawTable(
																			"rd_detail",
																			data);
																});
													});
									$("a[data-for='rcpy_trade']").on(
											"click",
											function() {
												var trade = $(this).attr("id")
														.split("_")[2];
												$("#rcpy_title").text(
														"交易 - " + trade);
												invoke(getURL("getTrade"), {
													tradeNum : trade
												}, function(data) {
													$("#rcpy_detail").empty();
													drawTable("rcpy_detail",
															data);
												});
											});

								};
								var preFunc;
								if (func == "rd") {
										preFunc = function(data) {
											for (var i = 0; i < data.data.length; i++){
					                			data.data[i][11] = "<a href='#' id='rd_rcpy_" + data.data[i][11] + "' role='button' data-for='" + func + "_rcpy' data-toggle='modal' data-target='#" + func + "_modal'>#" + data.data[i][11] +"</a>";
					                			data.data[i][12] = "<a href='#' id='rd_trade_" + data.data[i][12] + "' role='button' data-for='" + func + "_trade' data-toggle='modal' data-target='#" + func + "_modal'>#" + data.data[i][12] +"</a>"
					                		}
									return data;
								}

								} else if (func == "rcpy") {
									preFunc = function(data) {
										for (var i = 0; i < data.data.length; i++){
				                				data.data[i][11] = "<a href='#' id='rcpy_trade_" + data.data[i][11] + "' role='button' data-for='" + func + "_trade' data-toggle='modal' data-target='#" + func + "_modal'>#" + data.data[i][11] +"</a>";
				                			}
									return data;
									}
								}
								$("#" + dom_id).empty();
								drawPagTable(dom_id, func, inputs, preFunc,postFunc);
							} else if (func == "nav" || func == "cash") {
								var t = $.extend(true, {}, checkTable);
								t.source.address = func;
								t.source.inputs = inputs;

								t.event.add.on = false;
								t.event.del.on = false;
								t.event.detail.on = false;
								t.event.detail.source.address = "dummy";
								t.event.detail.source.inputs = inputs;
								if (func == "nav") {
									t.event.detail.source.func = navDetail;
								} else if (func == "cash") {
									t.event.detail.source.func = cashDetail;
								} else if (func == "position") {
									t.event.detail.source.func = positionDetail;
								}
								$("#" + func + "_display").empty();
								genTableWithCheck(func + "_display", func,
										t.source, t.event, [ "detail" ],
										"alertAll", false);
							}

							else if (func == "valuation") {
								$("#valuation_display").empty();
								inputs.id = "ValuationReport";
								
								drawFilterForm2("valuation_display", "report",
										"report_filter", {}, true);
								var viewable = fetch(getURL("isViewable"),
										inputs, "alertAll");
								var viewable = true;
								if (!viewable) {
									$("#report_view_btn")
											.prop("disabled", true);
								}
								$("#report_view_btn").on(
										"click",
										function() {
											inputs.params = "";
											inputs.portfolio = $("#portfolio_port_filter").val(),
											inputs.start = $("#portfolio_start_filter").val()||"1900-01-01",
											inputs.end = $("#portfolio_end_filter").val()||"2099-01-01"
											getReport(getURL("viewReport"),
													inputs, displayReport,
													"report_list", "alertAll");
											return false;
										});
								$("#report_generate_btn").on(
										"click",
										function() {
											inputs.params = "";
											inputs.portfolio = $("#portfolio_port_filter").val(),
											inputs.start = $("#portfolio_start_filter").val()||"1900-01-01",
											inputs.end = $("#portfolio_end_filter").val()||"2099-01-01"
											getReport(getURL("genReport"),
													inputs, displayReport,
													"report_list", "alertAll",
													"report_view_btn");
											return false;
										});
							} else if (func == "tb") {
								$("#tb_display").empty();
								inputs.id = "AcctBalanceReport";
								drawFilterForm2("tb_display", "tbReport",
										"tbReport_filter", {}, true);

								$("#tbReport_generate_btn")
										.on(
												"click",
												function() {
													var params = {
														"acctNo" : $(
																"#tbReport_acct_filter")
																.val()
													};
													inputs.portfolio = $("#portfolio_port_filter").val(),
													inputs.start = $("#portfolio_start_filter").val()||"1900-01-01",
													inputs.end = $("#portfolio_end_filter").val()||"2099-01-01"
													inputs.params = JSON.stringify(params);
													getReport(
															getURL("genReport"),
															inputs,
															displayReport,
															"tbReport_list",
															"alertAll",
															"tbReport_view_btn");
													return false;
												});
							}
						});

		$("#position_search_btn").on(
				"click",
				function() {
					var inputs = {
						portfolio : $("#portfolio_port_filter").val(),
						start : $("#portfolio_start_filter").val(),
						end : $("#portfolio_end_filter").val(),
						secid : $("#position_secid_filter").val()
					};

					var t = $.extend(true, {}, checkTable);
					t.source.address = "position";
					t.source.inputs = inputs;

					t.event.add.on = false;
					t.event.del.on = false;
					t.event.detail.on = false;
					t.event.detail.source.address = "dummy";
					t.event.detail.source.inputs = inputs;
					t.event.detail.source.func = positionDetail;
					$("#position_list").empty();
					genTableWithCheck("position_list", "position", t.source,
							t.event, [ "detail" ], "alertAll", false);
				});
		$("#voucher_search_btn").on(
				"click",
				function() {
					var inputs = {
						voucher : $("#voucher_type_filter").val(),
						currency : $("#voucher_currency_filter").val(),
						secid : $("#voucher_secid_filter").val(),
						acctNum : $("#voucher_acctNum_filter").val(),
						portfolio : $("#portfolio_port_filter").val(),
						start : $("#portfolio_start_filter").val(),
						end : $("#portfolio_end_filter").val()
					};

					var t = $.extend(true, {}, checkTable);
					t.source.address = "voucherList";
					t.source.inputs = inputs;
					t.source.func = function(data) {
						$.each($("tr[data-for='voucher']"),
								function(index, tr) {
									var $td = $(tr).find("td").eq(9);
									var content = $td.text();
									if (content != "" && content != "-") {
										$td.empty();
										var $a = $("<a href='#'>#" + content
												+ "</a>");
										$a.attr("id", "voucher_trade_"
												+ content);
										$a.attr("data-for", "voucher_trade");
										$td.append($a);
									}
								});
						$("a[data-for='voucher_trade']")
								.on(
										"click",
										function() {
											var trade = $(this).attr("id")
													.split("_")[2];
											$("#voucher_title").text(
													"交易 - " + trade);
											invoke(getURL("getTrade"), {
												tradeNum : trade
											}, function(tdata) {
												$("#voucher_detail").empty();
												drawTable("voucher_detail",
														tdata);
												$("#voucher_modal").modal();
											});
										});
					}
					t.event.add.on = false;
					t.event.del.on = false;
					t.event.detail.on = false;
					t.event.detail.source.address = "voucherDetail";
					t.event.detail.source.func = function(id, dataFor, data) {
						$("#voucher_detail").empty();
						$("#voucher_title").text("凭证详情 -" + id);
						drawTable("voucher_detail", data);
						$("#voucher_modal").modal();
					};
					$("#voucher_list").empty();
					genTableWithCheck("voucher_list", "voucher", t.source,
							t.event, [ "detail" ], "alertAll", false);
					return false;
				});

		$("#voucher_create_btn").on(
				"click",
				function() {
					$("#manual_detail").empty();
					var port_options = {};
					$.each($("#portfolio_port_filter").find("option"),
							function(i, opt) {
								port_options[$(opt).val()] = $(opt).text();
							});
					manageManualEntry("manual_detail", "manual_title",
							"manual_alert", $("#portfolio_port_filter").val(),
							port_options, $("#portfolio_start_filter").val(),
							$("#portfolio_end_filter").val());
					$("#manual_modal").modal();
				});

		$(document).on(
				"click",
				"#position_tableWithCheck td",
				function() {
					$("#position_tableWithCheck tr[choose='true']").css("background-color", "");
					$("#position_tableWithCheck tr[choose='true']").attr("choose",false);

					$(this).parent().css("background-color", "#ccc");
					$(this).parent().attr("choose", true);
					var sec_id = $($(this).parent().find("td")[2]).text() + "|" + $($(this).parent().find("td")[0]).text() + "|" + $($(this).parent().find("td")[3]).text()  ;
					$("#position_costAdj_btn").attr("choose", sec_id);
					$("#position_incomeAdj_btn").attr("choose", sec_id);
		}); 
		
		$("#position_costAdj_btn").on("click", function() {
			var sec_id = $(this).attr("choose");
			if (sec_id) {
				$("#trade_detail").empty();
				var info = {};
				var port = $("#portfolio_port_filter").val()
				info["client"] = $("#portfolio_client_filter").val();
		 		info["port"] = port;
		 		info["ports"] = [port];
		 		info["tradeDate"] = $("#portfolio_end_filter").val();
		 		info["ports_str"] = JSON.stringify(info.ports);
		 		info["secid"] = sec_id;
		 		
		 		var cusipid = sec_id.split("|")[0];
		 		var smfDetail = fetch(getURL("smfDetail"), {id:cusipid}, "alertAll");
				info["assetType"] = smfDetail.data.issuetype;
				var costUpdateTrade = 882;
				info["tradeType"] = costUpdateTrade;
				info["tp"] = "costUpdate"
					
				tradeCreate("trade_detail", "trade_alert", info);
				$("#trade_modal").modal();
			}	
			else {
				alert("请选择要操作的证券!");
			}
		});
		
		$("#position_incomeAdj_btn").on("click", function() {
			var sec_id = $(this).attr("choose");
			if (sec_id) {
					$("#trade_detail").empty();
					var info = {};
					var port = $("#portfolio_port_filter").val()
					info["client"] = $("#portfolio_client_filter").val();
			 		info["port"] = port;
			 		info["ports"] = [port];
			 		info["tradeDate"] = $("#portfolio_end_filter").val();
			 		info["ports_str"] = JSON.stringify(info.ports);
			 		info["secid"] = sec_id;
			 		
			 		var cusipid = sec_id.split("|")[0];
			 		var smfDetail = fetch(getURL("smfDetail"), {id:cusipid}, "alertAll");
					info["assetType"] = smfDetail.data.issuetype;
					var incomeUpdateTrade = 883;
					info["tradeType"] = incomeUpdateTrade;
					info["tp"] = "incomeUpdate";
					
					tradeCreate("trade_detail", "trade_alert", info);
					$("#trade_modal").modal();
			}	
			else {
				alert("请选择要操作的证券!");
			}
		});
		
		$(document).on(
				"click",
				"#rd_list_table td",
				function() {
					$("#rd_list_table tr[choose='true']").css(
							"background-color", "");
					$("#rd_list_table tr[choose='true']").attr("choose",
							false);

					$(this).parent().css("background-color", "#ccc");
					$(this).parent().attr("choose", true);
					var cash_id = $($(this).parent().find("td")[0]).text();
					$("#rd_delete_btn").prop("disabled", false);
					$("#rd_delete_btn").attr("choose", cash_id);
				});
		
		//删除实收实付
		$("#rd_delete_btn").on("click", function() {
			var cash_id = $(this).attr("choose");
			if (cash_id) {
				if(confirm("是否确认删除?")){
					invoke(getURL("deleteCash"), {id:cash_id}, function(data){
						$("#alertAll").empty();
		                	$("#alertAll").append(genAlert("success", "编号" +data + "实收实付删除成功!"));
		                	$("#rd_a").click();
					});
				}
			}	
			else {
				alert("请选择要操作的实收实付!");
			}
		});
		
		//当RCPY表格一行被点中
		$(document).on(
				"click",
				"#rcpy_list_table td",
				function() {
					$("#rcpy_list_table tr[choose='true']").css(
							"background-color", "");
					$("#rcpy_list_table tr[choose='true']").attr("choose",
							false);

					$(this).parent().css("background-color", "#ccc");
					$(this).parent().attr("choose", true);
					var rcpy_id = $($(this).parent().find("td")[0]).text();
					$("#rcpy_settle_btn").prop("disabled", false);
					$("#rcpy_date_btn").prop("disabled", false);
					$("#rcpy_settle_btn").attr("choose", rcpy_id);
					$("#rcpy_date_btn").attr("choose", rcpy_id);
				});

		//调整应收应付时间
		$("#rcpy_date_btn").on("click", function() {
			var rcpy_id = $(this).attr("choose");
			if (rcpy_id) {
				var rcpy = fetch(getURL("getRCPYBrief"),{rcpyNum:rcpy_id});
				if (rcpy){
					var e = $.extend(true, {}, tradeEditForm)
					e.source.on = false;
					e.source.value = rcpy;
					var rcpy_form = getForm("rcpy_update");
					e.form.form = rcpy_form;
					e.form.inputs = e.form.inputs = {"id":rcpy_id,"port": rcpy.port,"messageHeader":rcpy_form.messageHeader };
					e.form.func = rcpy_form.func;
					
					e.event.create.on = false;
					e.event.update.on = true;
					e.event.update.source.address = "updateRCPY";
					e.event.update.source.inputs["id"] = rcpy_id;
					e.event.update.source.func = function(iid, dataFor){
						$("#rcpy_a").click();
					};
					
					$("#rcpy_opr_detail").empty();
					$("#rcpy_opr_title").text("应收应付款结算日调整：");
					genTradeEditForm("rcpy_opr_detail", "rcpy", e.source, e.form, e.event, 4, "rcpy_opr_alert", true);
					$("#rcpy_opr_modal").modal();
					}
				}		
			
			else {
				alert("请选择要操作的应收应付!");
			}
		});

		//手动结转应收应付金额
		$("#rcpy_settle_btn").on("click", function() {
			var rcpy_id = $(this).attr("choose");
			if (rcpy_id) {
				var rcpy = fetch(getURL("getRCPYBrief"),{rcpyNum:rcpy_id});
				if (rcpy){
					var e = $.extend(true, {}, tradeEditForm)
					e.source.on = false;
					e.source.value = rcpy;
					var rcpy_form = getForm("rcpy_settle");
					e.form.form = rcpy_form;
					e.form.inputs = {"id":rcpy_id,"port": rcpy.port,"messageHeader":rcpy_form.messageHeader };
					e.form.func = rcpy_form.func;
					
					e.event.create.on = true;
					e.event.update.on = false;
					e.event.create.source.address = "settleRCPY";
					e.event.create.source.inputs["id"] = rcpy_id;
					e.event.create.source.func = function(iid, dataFor){
						$("#rcpy_a").click();
					};
					$("#rcpy_opr_detail").empty();
					$("#rcpy_opr_title").text("应收应付款结转操作：");
					genTradeEditForm("rcpy_opr_detail", "rcpy", e.source, e.form, e.event, 4, "rcpy_opr_alert", false);
					$("#rcpy_opr_modal").modal();
					}
				}		
			
			else {
				alert("请选择要操作的应收应付!");
			}
		});
	});
</script>
</html>
