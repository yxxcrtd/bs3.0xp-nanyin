<script type="text/javascript">
	$("#title").text(site_title);
	$(document).off("click", "[href='/jixu/version.do']").on("click", "[href='/jixu/version.do']", function(){
		var ver = fetch(getURL("version"), {}, "alertAll");
		$("#version_detail").text(ver);
		$("#version_modal").modal();
		return false;
	});
</script>
<body>
	<div class="col-md-5" id="expense_form"></div>
    <div class="row" style="border-bottom: dotted; border-width: thin"></div>
    <div id="alertAll"></div>
    <div id="content"></div>
</body>
<script type="text/javascript" src="./js/jixu/tradeUtils.js" charset="utf-8"></script>
<script type="text/javascript">
	$(function(){
		var $menu = genMenu();
		$menu.insertBefore($("#expense_form"));
		$("#config_nav").addClass("active");
        removeAlert();
        drawModal("alertAll", "expense");
        drawModal("alertAll", "cf");
        var ACCRUED = 1;
        var comFunc = function(){
	        	cfExpenseConfig("expense_cf");
	   		 	$("#expense_type").on("change", function(){
				if ($(this).val() == ACCRUED){
					$("#expense_expenseRatio").prop("disabled", true);
					$("#expense_cashRatio").prop("disabled", true);
					//$("#expense_principalGL").prop("disabled", true);
					//$("#expense_settleGL").prop("disabled", true);
					$("#expense_cf_update").prop("disabled", false);
					$("#expense_cf_create").prop("disabled", false);
				}
				else{
					$("#expense_expenseRatio").prop("disabled", false);
					$("#expense_cashRatio").prop("disabled", false);
					//$("#expense_principalGL").prop("disabled", false);
					//$("#expense_settleGL").prop("disabled", false);
					$("#expense_cf_update").prop("disabled", true);
					$("#expense_cf_create").prop("disabled", true);
				}
			})
        }
        var t = $.extend(true, {}, checkTable);
        t.source.address = "expenseList";
        
        t.event.detail.source.address = "expenseDetail";
        t.event.detail.form.func = function(){comFunc()}
   		t.event.detail.form.name = "expense_edit";
   		
   		t.event.add.source.on = false;
   		t.event.add.source.value = [];
   		t.event.add.source.func = function(){comFunc()}
   		t.event.add.form.name = "expense_add";
   		t.event.add.form.title_id = "expense_title";
   		t.event.add.form.alert_id = "expense_alert";
   		t.event.add.form.target_id = "expense_detail";
   		t.event.add.form.modal_id = "expense_modal";
		t.event.del.on = false;
	
    	t.event.update.source.address = "expenseUpdate";
    	t.event.update.source.editFunc = function(){
    		if ($("#expense_type").val() == ACCRUED){
				$("#expense_expenseRatio").prop("disabled", true);
				$("#expense_cashRatio").prop("disabled", true);
				//$("#expense_principalGL").prop("disabled", true);
				//$("#expense_settleGL").prop("disabled", true);
				$("#expense_cf_update").prop("disabled", false);
				$("#expense_cf_create").prop("disabled", false);
			}
			else{
				$("#expense_expenseRatio").prop("disabled", false);
				$("#expense_cashRatio").prop("disabled", false);
				//$("#expense_principalGL").prop("disabled", false);
				//$("#expense_settleGL").prop("disabled", false);
				$("#expense_cf_update").prop("disabled", true);
				$("#expense_cf_create").prop("disabled", true);
			}
    	};
    	t.event.create.source.address = "expenseCreate";
    	t.event.create.source.func = function(){window.location.reload();};
    	
    	function cfExpenseConfig(cf_id){
    		var $cf = $("#" + cf_id);
    		if ($("#expense_update").text()){
    			$("#expense_update").parent().attr("class", "col-md-offset-10 col-md-2");
    			$("#expense_update").parent().prepend("&nbsp;&nbsp;");
    			$("<button id='expense_cf_update' class='btn btn-info'>现金流配置</button>").prependTo($("#expense_update").parent());
    			$("#expense_cf_update").prop("disabled", true);
    			$("#expense_cf_update").on("click", function(){
    				if($cf.val()){
    					cfUpdate(cf_id);
    				}
    				else{
    					cfCreate(cf_id);
    				}
    				return false;
    			});
    		}
    		else{
    			$("#expense_create").parent().attr("class", "col-md-offset-10 col-md-2");
    			$("#expense_create").parent().prepend("&nbsp;&nbsp;");
    			$("<button id='expense_cf_create' class='btn btn-info'>现金流配置</button>").prependTo($("#expense_create").parent());
    			$("#expense_cf_create").prop("disabled", true);
    			$("#expense_cf_create").on("click", function(){
    				if($cf.val()){
    					cfUpdate(cf_id);
    				}
    				else{
    					cfCreate(cf_id);
    				}
    				return false;
    			});
    		}
    		$("#cf_modal").on("hidden.bs.modal", function(){
    			$("#expense_modal").modal();
    		});
    	}
    	$("#content").empty();
    	genTableWithCheck("content", "expense", t.source, t.event, ["detail","add"], "alertAll", false);
	});
</script>
