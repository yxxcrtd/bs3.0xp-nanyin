<script type="text/javascript">
	$("#title").text(site_title);
	$(document).off("click", "[href='/jixu/version.do']").on("click", "[href='/jixu/version.do']", function(){
		var ver = fetch(getURL("version"), {}, "alertAll");
		$("#version_detail").text(ver);
		$("#version_modal").modal();
		return false;
	});
</script>

<script type="text/javascript">
	$(function(){
		var $menu = genMenu();
		$menu.insertBefore($("#portID"));
		$("#port_nav").addClass("active");
		drawModal("portID", "secAcct");

		removeAlert();
		$("#portID").hide();
		var portID = location.search.substr(1).split("&")[0].split("=")[1];
		drawModal("portID", "portExpense");
		drawPort(portID);
		drawPortAggregation(portID);
		drawPortBank(portID);
		drawPortExpense(portID);
		drawPortInterface(portID);
		drawPortExport(portID);
		drawPortCustomise(portID);
		
<!--		$("#portExpense_modal").on("hidden.bs.modal", function(){-->
<!--			drawPortExpense(portID);-->
<!--		});-->
		
		$(document).on("change", "select[data-for]", function(){
    		var dataFor = $(this).attr("id").split("_")[0];
    		var id = $(this).attr("id").split("_")[1];
    		var category = $(this).attr("id").split("_")[2];
    		
    		if (dataFor == "portBank"){
    			if (category == "custodian"){
        			var accounts = fetch(getURL("bankAccountList"), {bank: $(this).val()});
        			updateSelectOptions($("#portBank" + "_" + id + "_account"), accounts);
        		}
    		}
	    });		
});
</script>
