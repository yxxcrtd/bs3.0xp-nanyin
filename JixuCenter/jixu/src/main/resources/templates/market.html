<script type="text/javascript">
	$("#title").text(site_title);
	$(document).off("click", "[href='/jixu/version.do']").on("click", "[href='/jixu/version.do']", function(){
		var ver = fetch(getURL("version"), {}, "alertAll");
		$("#version_detail").text(ver);
		$("#version_modal").modal();
		return false;
	});
</script>
<body>
	<div id="title_form"></div>
	<div class="row" style="border-bottom: dotted; border-width: thin"></div>
	<br/>
	<ul class="nav nav-tabs" role="tablist">
		<li id="price_tab" role="presentation"><a href="#price_display" aria-controls="price_display" role="tab" data-toggle="tab">价格</a></li>
		<li id="ex_tab" role="presentation"><a href="#ex_display" aria-controls="ex_display" role="tab" data-toggle="tab">汇率</a></li>
		<li id="smf_tab" role="presentation"><a href="#smf_display" aria-controls="smf_display" role="tab" data-toggle="tab">证券主文件</a></li>
	</ul>
	<div id="alertAll"></div>
	<div class="tab-content">
		<div role="tabpanel" class="tab-pane fade" id="price_display"></div>
		<div role="tabpanel" class="tab-pane fade" id="ex_display"></div>
		<div role="tabpanel" class="tab-pane fade" id="smf_display"></div>
	</div>
</body>
<script type="text/javascript" src="./js/jixu/tradeUtils.js" charset="utf-8"></script>
<script type="text/javascript" src="./js/jixu/market.js" charset="utf-8"></script>
<script type="text/javascript">
	$(function(){
		var $menu = genMenu();
		$menu.insertBefore($("#title_form"));
		$("#market_nav").addClass("active");
		
		drawSmallModal("title_form", "price");
		drawSmallModal("title_form", "ex");
		drawModal("title_form", "smf");
		drawModal("title_form", "cf");
		drawModal("title_form", "cf2");
		
		drawFilterForm("title_form", "time", "time", {}, false);
		setDatePick();
		
		var inputs = {};
		inputs["0"] = {category:price, type:ALL};
		inputs["1"] = {config:ALL, type:ALL};
		drawFilterForm("price_display", "price", "price_filter", inputs, true);
		
		var inputs = {};
		inputs["0"] = {category:fxRate, type:ALL};
		drawFilterForm("ex_display", "ex", "ex_filter", inputs, true);
		
		var inputs = {};
		inputs["0"] = {category:smf, type:ALL};
		inputs["2"] = {config:ALL, type:ALL};
		drawFilterForm("smf_display", "smf", "smf_filter", inputs, true);
		
		$("a[href='#price_display']").tab("show");
		removeAlert();
		
		$("a.btn.btn-success").on("click", function(){
			var action = $(this).attr("id").split("_")[1];
		 	var tp = $(this).attr("id").split("_")[0];
		 	if (action == "create"){
        		marketCreate(tp + "_detail", tp, tp + "_alert", getNowFormatDate());
		 	}
		});
		
		$("a.btn.btn-primary").on("click", function(){
		 	var action = $(this).attr("id").split("_")[1];
		 	var tp = $(this).attr("id").split("_")[0];
		 	if (action == "search"){
		 		marketDetail(tp + "_list", tp, "alertAll");
		 	}
			return false;
		});
	});
	
</script>
