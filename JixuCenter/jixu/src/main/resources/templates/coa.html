<!DOCTYPE html>
<html>
<head>
	<link rel="shortcut icon" type="image/x-icon" href="./img/logo.ico" media="screen" />
    <link rel="stylesheet" href="./css/bootstrap.min.css"/>
	<link rel="stylesheet" href="./css/bootstrap-datetimepicker.min.css"/>

	<link rel="stylesheet" href="./css/jixu.css"/>
	<script type="text/javascript" src="./js/jquery/jquery.js"></script>
	<script type="text/javascript" src="./js/jquery/jquery.orgchart.js"></script>
	<script type="text/javascript" src="./js/jquery/jquery.validate.js"></script>
	<script type="text/javascript" src="./js/jquery/messages_zh.js"></script>
	<script type="text/javascript" src="./js/jquery/jquery.ui.widget.js"></script>
	<script type="text/javascript" src="./js/jquery/jquery.fileupload.js"></script>
	<script type="text/javascript" src="./js/jquery/jquery.iframe-transport.js"></script>
	<script type="text/javascript" src="./js/jquery/jquery-ajax-native.js"></script>
	<script type="text/javascript" src="./js/jquery/jquery.cookie.js"></script>
	<script type="text/javascript" src="./js/bootstrap/bootstrap-datetimepicker.min.js"></script>
	<script type="text/javascript" src="./js/bootstrap/bootstrap-datetimepicker.zh-CN.js"></script>
	<script type="text/javascript" src="./js/bootstrap/bootstrap3-typeahead.min.js"></script>
	<script type="text/javascript" src="./js/bootstrap/bootstrap.js"></script>
	<script type="text/javascript" src="./js/bootstrap/bootbox.min.js"></script>
	<script type="text/javascript" src="./js/bootstrap/bootstrap-multiselect.js"></script>
	<script type="text/javascript" src="./js/jquery/jquery.bootstrap.wizard.min.js"></script>
	<script type="text/javascript" src="./js/jquery/jquery.bootpag.min.js"></script>
	<script type="text/javascript" src="./js/jixu/urls.js" charset="utf-8"></script>
	<script type="text/javascript" src="./js/jixu/types.js" charset="utf-8"></script>
	<script type="text/javascript" src="./js/jixu/forms.js" charset="utf-8"></script>
	<script type="text/javascript" src="./js/jixu/18n.js" charset="utf-8"></script>
	<script type="text/javascript" src="./js/jixu/settings.js" charset="utf-8"></script>
	<script type="text/javascript" src="./js/jixu/utils.js" charset="utf-8"></script>
	<script type="text/javascript" src="./js/jixu/PDFObject.js" charset="utf-8"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id='title'></title>
    <div class="modal fade sm" id="version_modal" tabindex="-1" role="dialog">
	  <div class="modal-dialog" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <h4 class="modal-title">版本信息</h4>
	      </div>
	      <div class="modal-body">
	        <p id="version_detail"></p>
	      </div>
	      <div class="modal-footer">
	        <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
	      </div>
	    </div><!-- /.modal-content -->
	  </div><!-- /.modal-dialog -->
	</div><!-- /.modal -->
    		
</head>
<div id="spinner" class="spinner" style="display:none;">
	<img src=./img/ajax-loader.gif></img>
	<p></p>
	<h4>系统处理中，请稍后......</h4>
</div>
<script type="text/javascript">
	$("#title").text(site_title);
	$(document).off("click", "[href='/jixu/version.do']").on("click", "[href='/jixu/version.do']", function(){
		var ver = fetch(getURL("version"), {}, "alertAll");
		$("#version_detail").text(ver);
		$("#version_modal").modal();
		return false;
	});
</script>
<body>
    <div class="col-md-5" id="coa_form"></div>
    <div class="col-md-5" id="gl_form"></div>
    <div class="row" style="border-bottom: dotted; border-width: thin"></div>
    <div id="alertAll"></div>
    <div id="content"></div>
</body>
</body>
<script type="text/javascript">
    $(function(){
    	var $menu = genMenu();
		$menu.insertBefore($("#coa_form"));
		
        $("#config_nav").addClass("active");
        var cats = ["coa", "gl"];
        $.each(cats, function(index, cat){
            drawFilterForm(cat + "_form", cat, cat + "_filter", [], false);	
            drawModal("coa_form", cat);
        });
        removeAlert();
        
        //选择不同的COA，COA下的GL会被刷新
        updateSelectOptions($("#gl_table_filter"), fetch(getURL("glListInCOA"), {coaID:$("#coa_table_filter").val()}));
        $("#coa_table_filter").on("change", function(){
            var gls = fetch(getURL("glListInCOA"), {coaID:$(this).val()});
            updateSelectOptions($("#gl_table_filter"), gls);
        });
        
        //相应COA Search Button的动作
        $("#coa_search_btn").on("click", function(){
            var coaID = $("#coa_table_filter").val();
            var f = $.extend(true, {}, tableForm);
    		f.source.address = "coaDetail";
    		f.source.inputs = {id: coaID};
    		f.form.name = "coa_table";
    		f.form.func = function(data){
    			$("<div><label>会计科目表编号：</label><label id='coaID'>" + $("#coa_table_filter").val() + "</label></div>").insertBefore("#acct_table");
    		};
    		
    		f.event.update.source.address = "acctUpdate";
    		f.event.update.source.inputs = {pid:coaID};
    		f.event.update.source.func = function(id, dataFor){
    			var ops = fetch(getURL("acctListInCOA"), {coaID: coaID});
   				$("#acct_" + id + "_closeAcct").typeahead({source:ops});   
    		}
    		f.event.del.source.address = "acctRemove";
    		f.event.del.source.inputs = {pid:coaID};
    		
    		f.event.add.source.address = "acctCreate";
    		f.event.add.source.inputs = {pid:coaID};
    		f.event.add.source.func = function(id, dataFor){
	    			var ops = fetch(getURL("acctListInCOA"), {coaID: coaID});
	   				$("#acct_" + id + "_closeAcct").typeahead({source:ops});   
	    	}
    		f.event.add.form.name = "acct_add";
    		$("#content").empty();
    		var acctTypes = fetch(getURL("acctTypes"), {});
    		var cons = {category:acctTypes};
    		genTableSimpleForm("content", "acct", f.source, f.form, f.event, "alertAll", true, cons);
            return false;
        });
        
        $("#coa_create_btn").on("click", function(){
        	bootbox.prompt("请输入会计科目表名称", function(result){
       	    	if (result == null){
       	    		bootbox.hideAll();
           		}
           		else {
           			if (result == ""){
           				$("#alertAll").empty();
       	                $("#alertAll").append(genAlert("fail", translate["coa"] + "创建失败! 请输入会计科目表名称!"));	
           			}
           			else {
           	    		invoke(getURL("coaCreate"), {coaName:result}, function(data){
           	    			var coaID = data;
           	    			var f = $.extend(true, {}, tableForm);
               	    		f.source.on = false;
               	    		f.form.name = "coa_table";
               	    		f.event.update.source.address = "acctUpdate";
               	    		f.event.update.source.inputs = {pid:coaID};
               	    		
               	    		f.event.add.source.address = "acctCreate";
               	    		f.event.add.source.inputs = {pid:coaID};
               	    		f.event.add.form.name = "acct_add";
               	    		
               	    		$("#content").empty();
               	    		$("#content").append("<div><label>会计科目表编号：</label><label id='coaID'>" + coaID + "</label></div>");
               	    		genTableSimpleForm("content", "acct", f.source, f.form, f.event, "alertAll", true);
               	    		updateSelectOptions($("#coa_table_filter"),fetch(getURL("coaList"),{}));
               	    		$("#alertAll").empty();
        	                $("#alertAll").append(genAlert("success", "编号" + coaID + " " + translate["coa"] + "创建成功! 请开始向其中添加科目。"));
           	    		}, "alertAll");
           			}
           		}
        	});
        });
        
        $("#gl_create_btn").on("click", function(){
        	bootbox.prompt("请输入总账组名称", function(result){
       	    	if (result == null){
       	    		bootbox.hideAll();
           		}
           		else {
           			if (result == ""){
           				$("#alertAll").empty();
       	                $("#alertAll").append(genAlert("fail", translate["gl"] + "创建失败! 请输入总账组名称!"));	
           			}
           			else {
           				invoke(getURL("glCreate"), {coaID:$("#coa_table_filter").val(), glName:result}, function(data){
           					var coaID = data[0];
           					var glID = data[1];
           	    			var f = $.extend(true, {}, tableForm);
               	    		f.source.on = false;
               	    		f.form.name = "gl_table";

               	    		f.event.update.source.address = "glColUpdate";
               	    		f.event.update.source.inputs = {pid:glID, coaID:coaID};
               	    		f.event.update.source.func = function(id, dataFor){
          						var opsAcct = fetch(getURL("acctListInCOA"), {coaID:coaID});
          		         		$("#glCol_" + id + "_acct").typeahead({source:opsAcct});  		
          					};
               	    		
               	    		f.event.add.source.address = "glColCreate";
               	    		f.event.add.source.inputs = {pid:glID, coaID:coaID};
               	    		f.event.add.source.func = function(id, dataFor){
          						var opsAcct = fetch(getURL("acctListInCOA"), {coaID:coaID});
          		         		$("#glCol_" + id + "_acct").typeahead({source:opsAcct});  		
          					};
               	    		f.event.add.form.name = "glCol_add";
               	    		
               	    		$("#content").empty();
               	    		$("#content").append("<div><label>会计科目表编号：</label><label id='coaID'>" + coaID + "</label></div>");
                        	$("#content").append("<div><label>总账组编号：</label><label id='glID'>" + glID + "</label></div>");
                        	
               	    		genTableSimpleForm("content", "glCol", f.source, f.form, f.event, "alertAll", true);
               	    		updateSelectOptions($("#gl_table_filter"), fetch(getURL("glListInCOA"), {coaID:coaID}));
               	    		$("#alertAll").empty();
        	                $("#alertAll").append(genAlert("success", "编号" + glID + " " + translate["gl"] + "创建成功! 请开始向其中添加总账栏。"));
           	    		},"alertAll");
           			}
           		}
        	});
        });
        
        $("#gl_copy_btn").on("click", function(){
        	bootbox.prompt("请输入拷贝至总账组名称", function(result){
       	    	if (result == null){
       	    		bootbox.hideAll();
           		}
           		else {
           			if (result == ""){
           				$("#alertAll").empty();
       	                $("#alertAll").append(genAlert("fail", translate["gl"] + "拷贝失败! 请输入总账组名称!"));	
           			}
           			else {
           				invoke(getURL("glCopy"), {coaID:$("#coa_table_filter").val(), copyGl:$("#gl_table_filter").val(), glName:result}, function(data){
           					var coaID = data[0];
           					var glID = data[1];
           					var f = $.extend(true, {}, tableForm);
           		    		f.source.address = "glDetail";
           		    		f.source.inputs = {coaID: coaID, id:glID};
           		    		f.form.name = "gl_table";
           		    		
           		    		f.event.update.source.address = "glColUpdate";
           		    		f.event.update.source.inputs = {pid:glID, coaID:coaID};
           		    		f.event.update.source.func = function(id, dataFor){
           		    			var opsAcct = fetch(getURL("acctListInCOA"), {coaID:coaID});
           			         	$("#glCol_" + id + "_acct").typeahead({source:opsAcct});
           		       		}
           		    		
           		    		f.event.del.source.address = "glColRemove";
           		    		f.event.del.source.inputs = {pid:glID, coaID:coaID};
           		    		
           		    		f.event.add.source.address = "glColCreate";
           		    		f.event.add.source.inputs = {pid:glID, coaID:coaID};
           		    		f.event.add.source.func = function(id, dataFor){
           		    			var opsAcct = fetch(getURL("acctListInCOA"), {coaID:coaID});
           			         	$("#glCol_" + id + "_acct").typeahead({source:opsAcct});
           		   			}
           		    		f.event.add.form.name = "glCol_add";
           		    		
           		    		$("#content").empty();
           		    		$("#content").append("<div><label>会计科目表编号：</label><label id='coaID'>" + coaID + "</label></div>");
           		        	$("#content").append("<div><label>总账组编号：</label><label id='glID'>" + glID + "</label></div>");
           		        	var glCols = fetch(getURL("glColList"),{});
           		        	var cons = {glCol:glCols};
           		    		genTableSimpleForm("content", "glCol", f.source, f.form, f.event, "alertAll", true, cons);
           		    		updateSelectOptions($("#gl_table_filter"), fetch(getURL("glListInCOA"), {coaID:coaID}));
           		    		return false;
           	    		},"alertAll");
           			}
           		}
        	});
        });
        
        $("#gl_search_btn").on("click", function(){
            var glID = $("#gl_table_filter").val();
            var coaID = $("#coa_table_filter").val();
            var f = $.extend(true, {}, tableForm);
    		f.source.address = "glDetail";
    		f.source.inputs = {coaID: coaID, id:glID};
    		f.form.name = "gl_table";
    		
    		f.event.update.source.address = "glColUpdate";
    		f.event.update.source.inputs = {pid:glID, coaID:coaID};
    		f.event.update.source.func = function(id, dataFor){
    			var opsAcct = fetch(getURL("acctListInCOA"), {coaID:coaID});
	         	$("#glCol_" + id + "_acct").typeahead({source:opsAcct});
       		}
    		
    		f.event.del.source.address = "glColRemove";
    		f.event.del.source.inputs = {pid:glID, coaID:coaID};
    		
    		f.event.add.source.address = "glColCreate";
    		f.event.add.source.inputs = {pid:glID, coaID:coaID};
    		f.event.add.source.func = function(id, dataFor){
    			var opsAcct = fetch(getURL("acctListInCOA"), {coaID:coaID});
	         	$("#glCol_" + id + "_acct").typeahead({source:opsAcct});
   			}
    		f.event.add.form.name = "glCol_add";
    		
    		$("#content").empty();
    		$("#content").append("<div><label>会计科目表编号：</label><label id='coaID'>" + coaID + "</label></div>");
        	$("#content").append("<div><label>总账组编号：</label><label id='glID'>" + glID + "</label></div>");
        	var glCols = fetch(getURL("glColList"),{});
        	var cons = {glCol:glCols};
    		genTableSimpleForm("content", "glCol", f.source, f.form, f.event, "alertAll", true, cons);
    
            return false;
        });
        
    });
</script>
</html>
