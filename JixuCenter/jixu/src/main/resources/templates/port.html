<script type="text/javascript">
	$("#title").text(site_title);
	$(document).off("click", "[href='/jixu/version.do']").on("click", "[href='/jixu/version.do']", function(){
		var ver = fetch(getURL("version"), {}, "alertAll");
		$("#version_detail").text(ver);
		$("#version_modal").modal();
		return false;
	});
</script>
<body>
	<div id="title_form"></div>
	<div class="row" style="border-bottom: dotted; border-width: thin"></div>
	<div id="alertAll"></div>
	<div id="port_list"></div>
</body>
<script type="text/javascript">
	$(function(){
		var $menu = genMenu();
		$menu.insertBefore($("#title_form"));
		$("#port_nav").addClass("active");
		drawPortfolioSelect("port_filter");
		setDatePick();
		
		drawModal("title_form", "port");
		$("#portfolio_create_btn").attr("data-toggle", "modal");
		$("#portfolio_create_btn").attr("data-target", "#port_modal");
		
		$("#portfolio_create_btn").click(function(){
			$("#port_detail").empty();
			var e = $.extend(true, {}, editForm);
			e.source.on = false;
			e.form.name = "port_add";
			e.form.inputs["mother"] = {client:$("#portfolio_client_filter").val()};
			e.form.func = function(data){
				updateSelectOptions($("#port_glgroup"), fetch(getURL("glListInCOA"), {coaID:$("#port_coa").val()}));
				$("#port_coa").on("click", function(){
	         		var ops = fetch(getURL("glListInCOA"), {coaID:$(this).val()});
	         		updateSelectOptions($("#port_glgroup"), ops);
	         	});
			};
			e.event.create.source.address = "portCreate";
			e.event.update.on = false;
			genEditForm("port_detail", "port", e.source, e.form, e.event, 4, "port_alert", false);
		});
		
		$("#portfolio_search_btn").click(function(){
			var t = $.extend(true, {}, checkTable);
			t.source.address = "portList";
			t.source.inputs = {client:$("#portfolio_client_filter").val(), 
					  		   type: $("#portfolio_type_filter").val(),
					  		   name: $("#portfolio_name_filter").val()};
			genTableWithCheck("port_list", "portfolio", t.source, t.event, ["detail"], "alertAll", true);
			return false;
		});
	});
</script>
