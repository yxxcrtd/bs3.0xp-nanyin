<script type="text/javascript">
	$("#title").text(site_title);
	$(document).off("click", "[href='/jixu/version.do']").on("click", "[href='/jixu/version.do']", function(){
		var ver = fetch(getURL("version"), {}, "alertAll");
		$("#version_detail").text(ver);
		$("#version_modal").modal();
		return false;
	});
</script>
<body>
	<div id="title_form"></div>
	<div class="row" style="border-bottom: dotted; border-width: thin"></div>
	<div id="alertAll"></div>
	<div id="cf_list"></div>
</body>
<script type="text/javascript" src="static/js/jixu/tradeUtils.js" charset="utf-8"></script>
<script type="text/javascript">
	$(function(){
		var $menu = genMenu();
		$menu.insertBefore($("#title_form"));
		$("#port_nav").addClass("active");
		drawFilterForm("title_form", "cf", "cf_filter", {}, false);
		drawModal("title_form", "cf");
		
		$("#cf_create_btn").click(function(){
			$("#cf_detail").empty();
			cfCreate("");
		});
		
		$("#cf_search_btn").click(function(){
			var t = $.extend(true, {}, checkTable);
			t.source.address = "cfList";
			t.source.inputs = {name: $("#cf_name_filter").val()};
			
			t.event.add.on = false;
			t.event.del.on = false;
			t.event.detail.on = false;
			t.event.detail.source.address = "cfDetail";
			t.event.detail.source.func = function(itemID, dataFor, data, inpts){
				 cfUpdate2(itemID);
			};
			t.event.update.on = false;
			t.event.update.source.address = "cfUpdate";
			$("#cf_list").empty();
			genTableWithCheck("cf_list", "cf", t.source, t.event, ["detail"], "alertAll", false);
			
			return false;
		});
		$("#cf_search_btn").click();
	});
</script>
