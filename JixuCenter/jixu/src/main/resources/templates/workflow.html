<script type="text/javascript">
	$("#title").text(site_title);
	$(document).off("click", "[href='/jixu/version.do']").on("click", "[href='/jixu/version.do']", function(){
		var ver = fetch(getURL("version"), {}, "alertAll");
		$("#version_detail").text(ver);
		$("#version_modal").modal();
		return false;
	});
</script>
<body>
	<form class="form-inline" id="title_form">
		<div class="form-group">
			&nbsp;&nbsp;
			<label for="time_input">当前做账日</label>
			&nbsp;&nbsp;
			<input class="form-control form_datetime" type="text" id="time_input">
		</div>
		&nbsp;&nbsp;
		<a class='btn btn-success' href="#" id='ports_search_btn' role='button'>投资组合选择</a>
		<button class="btn btn-info" id="lastday_btn">重做上一日<span class="glyphicon glyphicon-arrow-left" aria-hidden="true"></span></button>
		<button class="btn btn-info" id="nextday_btn">做下一日账<span class="glyphicon glyphicon-arrow-right" aria-hidden="true"></span></button>
		<button class="btn btn-primary" id="export_btn">数据导出<span class="glyphicon glyphicon-share-alt" aria-hidden="true"></span></button>
	</form>
	<br>
	<div class="row" style="border-bottom: dotted; border-width: thin"></div>
	<div id="alertAll"></div>
	<br>
	<div class="row">
		<div id="ports" class="col-md-2"></div>
		<div id="wf" class="col-md-10" style="text-align:center;"></div>
	</div>
	<div id="success">
		<div><h4 id="success_title"></h4></div>
		<div id="success_detail"></div>
	</div>
</body>
<script type="text/javascript" src="./js/jixu/market.js" charset="utf-8"></script>
<script type="text/javascript" src="./js/jixu/tradeUtils.js" charset="utf-8"></script>
<script type="text/javascript" src="./js/jixu/trade.js" charset="utf-8"></script>
<script type="text/javascript" src="./js/jixu/voucher.js" charset="utf-8"></script>
<script type="text/javascript" src="./js/jixu/report.js" charset="utf-8"></script>
<script type="text/javascript" src="./js/jixu/workflow.js" charset="utf-8"></script>
<script type="text/javascript">
	$(function(){
		var $menu = genMenu();
		$menu.insertBefore($("#title_form"));
		$("#workflow_nav").addClass("active");
		setDatePick();
		removeAlert();
		if (PORTS.length <= 0){
			$("#time_input").prop("disabled", true);
			$("#lastday_btn").prop("disabled", true);
			$("#nextday_btn").prop("disabled", true);
			$("#export_btn").prop("disabled", true);
		}
		$("#success").hide();
		
		drawModal("title_form", "ports");
		drawModal("title_form", "content");
		drawModal("title_form", "voucher");
		drawModal("title_form", "trade");
		drawModal("title_form", "manual");
		drawModal("title_form", "manualCreate");
		drawModal("title_form", "manualEdit");
		drawModal("title_form", "rd");
		drawModal("title_form", "rcpy");
		drawModal("title_form", "export");
		drawModal("title_form", "cf");
		drawModal("title_form", "cf2");
		drawModal("title_form", "smf");
		
		drawSmallModal("title_form", "preTrade");
		$("div.modal-footer button").text("关闭");
		drawPortsSelect();
		
		//选择时间，存储 到全局时间变量中
		$("#time_input").on("change", function(){
			NAV_DATE = $(this).val();
		});
		
		//成功选择组合后，会将新选择的组合更新至全局变量PORTS中
		$("#portfolio_save_btn").on("click", function(){
			var checked = $("input[data-for='ports']:checked");
			var ports = [];
			for (var i = 0; i < checked.length; i++){
				var val = $(checked[i]).val();
				ports.push(val);
			}
			
			invoke(getURL("getAccountingDate"), {ports:JSON.stringify(ports)}, function(data){
				PORTS = [];
				NAMES = [];
				PORTS_MAP = [];
				var links = [];
				for (var i = 0; i < checked.length; i++){
					var val = $(checked[i]).val();
					var text = $(checked[i]).parent().text();
					PORTS.push(val);
					NAMES.push(text);
					PORTS_MAP[val] = text;
					links.push(getURL("portfolio") + "?id=" + $(checked[i]).attr("value"));
				}
				
				if (PORTS.length > 0){
					$("#time_input").prop("disabled", false);
					$("#time_input").val(data);
					$("#time_input").trigger("change");
					
				}
				else {
					$("#time_input").prop("disabled", true);
				}
				$("#lastday_btn").prop("disabled", true);
				$("#nextday_btn").prop("disabled", true);
				$("#export_btn").prop("disabled", true);
				$("#ports_modal").modal("hide");
				displaySelectedPorts("ports", NAMES, links);
			}, "ports_alert");
			return false;
		});
		
		//生成工作流按钮
		$(document).on("click", "#gen_wf_btn", function(){
			if (PORTS.length == 0){
				$("#alertAll").empty();;
				$("#alertAll").append(genAlert("fail", "请先选择投资组合后, 再生成工作流！"));
				return false;
			}
			if (NAV_DATE == ""){
				$("#alertAll").empty();;
				$("#alertAll").append(genAlert("fail", "请先选择做账时间后, 再生成工作流！"));
				return false;
			}
			$("#time_input").prop("disabled", true);
			$("#lastday_btn").prop("disabled", false);
			$("#nextday_btn").prop("disabled", false);
			$("#export_btn").prop("disabled", false);
			
			genWorkflow("wf");
			autoRefresh(true);
			drawExport();
			$("#wf").show();
			$("#alertAll").empty();
			$("#alertAll").append(genAlert("success", NAV_DATE + " 工作流程生成成功！"));
			return false;
		});
		
		//处理不同category的工作流功能
		taskHandler("content_detail", "content_alert", "content_title");
		successHandler("success_detail", "alertAll", "success_title");
		failHandler("content_detail", "content_alert", "content_title");
		logHandler("content_detail", "content_alert", "content_title");
		completeAllHandler("content_detail", "alertAll", "content_title");
		redoAllHandler("content_detail", "alertAll", "content_title");
		
		//当modal关闭时开启计时器,重新刷新工作流
		$(".modal").on("hidden.bs.modal", function(){
			var dom_id = $(this).attr("id");
			if (dom_id=="manual_modal" 
				|| dom_id=="manualCreate_modal"
				|| dom_id=="manualEdit_modal"
				|| dom_id == "ports_modal" 
				|| $("#success").is(":visible")
				|| dom_id == "export_modal"
				|| dom_id == "version_modal"
				|| dom_id == "smf_modal"
				|| dom_id == "cf_modal" 
				|| dom_id == "cf2_modal"){
				;	
			}
			else if (dom_id == "preTrade_modal"){
				$("#content_modal").modal();
			}
			else{
				genWorkflow("wf");
				autoRefresh(true);
				$("#wf").show();
				$("#ports").show();
				if (dom_id == "content_modal"){
					var task = $("#content_title").text();
					if (task === "全部完成会计账务处理总结：" || task === "全部重开会计账务处理总结："){
						task = "到期自动作业";
					}
					else {
						task = task.split("-")[1];
						if (task.indexOf("重开") >= 0){
							task = task.split(" ")[1];
						}	
					}
					window.location.hash = "#";
					window.location.hash = taskIds[task] || "#";
				}
			}
		});
		
		//当点击界面的重做上一日账按钮后
		$("#lastday_btn").on("click", function(){
			if ($("#price_status").attr("status") > 0){
				autoRefresh(false);
				NAV_DATE = getNewDate(NAV_DATE, -1);
				genWorkflow("wf");
				$("#time_input").val(NAV_DATE);
				autoRefresh(true);
				$("#wf").show();
				$("#ports").show();
				$("#alertAll").empty();
				$("#alertAll").append(genAlert("success", NAV_DATE + " 工作流程生成成功！"));
				return false;
			}
			else {
				alert("当天仍有未撤销任务，无法重做上一天账！");
				return false;
			}
		});
		
		//当点击界面的做下一日账按钮后
		$("#nextday_btn").on("click", function(){
			if ($("#generalClose_status").attr("status") == 0){
				autoRefresh(false);
				NAV_DATE = getNewDate(NAV_DATE, 1);
				genWorkflow("wf");
				$("#time_input").val(NAV_DATE);
				autoRefresh(true);
				$("#wf").show();
				$("#ports").show();
				$("#alertAll").empty();
				$("#alertAll").append(genAlert("success", NAV_DATE + " 工作流程生成成功！"));
				return false;
			}
			else {
				alert("当天仍有未完成任务，无法做下一天账！");
				return false;
			}
		});
		
		//当点击导出数据按钮后
		$("#export_btn").on("click", function(){
			$("#export_list").empty();
			$("#export_modal").modal();
			return false;
		});
	});
</script>
