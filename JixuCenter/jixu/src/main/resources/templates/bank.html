<script type="text/javascript">
	$("#title").text(site_title);
	$(document).off("click", "[href='/jixu/version.do']").on("click", "[href='/jixu/version.do']", function(){
		var ver = fetch(getURL("version"), {}, "alertAll");
		$("#version_detail").text(ver);
		$("#version_modal").modal();
		return false;
	});

<body>
	<ul id="tabs" class="nav nav-tabs" role="tablist">
		<li id="bank_tab" role="presentation"><a href="#bank_display" aria-controls="bank_display" role="tab" data-toggle="tab">银行配置</a></li>
		<li id="bankAccount_tab" role="presentation"><a href="#bankAccount_display" aria-controls="valuation_display" role="tab" data-toggle="tab">账户配置</a></li>
		<li id="bankInterest_tab" role="presentation"><a href="#bankInterest_display" aria-controls="bankInterest_display" role="tab" data-toggle="tab">利息配置</a></li>
	</ul>
	<div id="alertAll"></div>
	<div class="tab-content">
		<div role="tabpanel" class="tab-pane fade" id="bank_display"></div>
		<div role="tabpanel" class="tab-pane fade" id="bankAccount_display"></div>
		<div role="tabpanel" class="tab-pane fade" id="bankInterest_display"></div>
	</div>
</body>
<script type="text/javascript">
	
	$(function(){
		var PORT;
		var COA;
		var $menu = genMenu();
		$menu.insertBefore($("#tabs"));
		$("#config_nav").addClass("active");
		$.each(["bank", "bankAccount", "bankInterest"], function(index, cat){
			drawFilterForm(cat + "_display", cat, cat + "_filter", [], true);
			if (cat == "bankAccount"){
				updateSelectOptions($("#bankAccount_table_filter"), fetch(getURL("bankAccountList"), {bank:$("#bankAccount_bank_filter").val()}));
				$("#bankAccount_bank_filter").on("change", function(){
					var options = fetch(getURL("bankAccountList"), {bank:$(this).val()});
					updateSelectOptions($("#bankAccount_table_filter"), options);
				});	
			}
			else if(cat == "bankInterest"){
				updateSelectOptions($("#bankInterest_table_filter"), fetch(getURL("bankInterestList"), {bank:$("#bankInterest_bank_filter").val()}));
				$("#bankInterest_bank_filter").on("change", function(){
					var options = fetch(getURL("bankInterestList"), {bank:$(this).val()});
					updateSelectOptions($("#bankInterest_table_filter"), options);
				});
			}
		});
		$("a[href='#bank_display']").tab("show");
		removeAlert();
		$("a.btn").on("click", function(){
		 	var action = $(this).attr("id").split("_")[1];
		 	var tp = $(this).attr("id").split("_")[0];
		 	if (action == "search"){
		 		var e = $.extend(true, {}, editForm);
		 		e.source.address = tp + "Detail";
				e.source.inputs = {id: $("#" + tp + "_table_filter").val()};
				e.form.name = tp + "_edit";
				
				var inputs = {};
				var func; 
				var itemID = $("#" + tp + "_table_filter").val();
				if (tp == "bankAccount"){
					inputs["port"] = {client:"all"};
            		inputs["interest"] = {bank:function(data){return data.data[2]}};
            		func = function(data){
            			PORT = $("#bankAccount_port").val();
            			COA = fetch(getURL("acctList"), {portID:PORT});
                		$("#bankAccount_port").on("change", function(){
                			PORT = $(this).val();
                			COA = fetch(getURL("acctList"), {portID:PORT});
                		});
                		bankCOADetail("bankAccount_list", "alertAll", itemID, fetch(getURL("bankCOADetail"), {id:itemID}));
            		};
            		e.form.inputs = inputs;
					e.form.func = func;
					
					e.event.create.on = false;;
					e.event.update.source.address = tp + "Update";
					e.event.update.source.inputs = {id: itemID};
					$("#" + tp + "_list").empty();
					genEditForm(tp + "_list", tp, e.source, e.form, e.event, 3, "alertAll", true);
					
				}
				else if (tp == "bankInterest"){
					func = function(data){
						updateSelectOptions($("#bankInterest_month"), fetch(getURL("interestMonth"), {freq:parseInt($("#bankInterest_frequency").val())}));
						$("#bankInterest_month").val(data.data[9]);
    		 			$("#bankInterest_frequency").on("change", function(){
                			var v = $(this).val();
                			updateSelectOptions($("#bankInterest_month"), fetch(getURL("interestMonth"), {freq:parseInt(v)}));
        				});
    		 			rateDetail("bankInterest_list", "alertAll", itemID, fetch(getURL("rateDetail"), {id:itemID}));
					}
					e.form.inputs = inputs;
					e.form.func = func;
					
					e.event.create.on = false;;
					e.event.update.source.address = tp + "Update";
					e.event.update.source.inputs = {id: itemID};
					$("#" + tp + "_list").empty();
					genEditForm(tp + "_list", tp, e.source, e.form, e.event, 3, "alertAll", true);
				}
				else if (tp == "bank"){
					e.form.inputs = inputs;
					e.form.func = func;
					
					e.event.create.on = false;;
					e.event.update.source.address = tp + "Update";
					e.event.update.source.inputs = {id: itemID};
					$("#" + tp + "_list").empty();
					genEditForm(tp + "_list", tp, e.source, e.form, e.event, 3, "alertAll", true);
				}
		 	}
		 	
		 	else if (action == "create"){
		 		var e = $.extend(true, {}, editForm);
		 		e.source.on = false;
				e.form.name = tp + "_add";
				e.source.value = ["", $("#bankAccount_bank_filter").val()];
				var inputs = {};
				var func; 
				if (tp == "bankAccount"){
					inputs["port"] = {client:"all"};
					inputs["interest"] = {bank:$("#bankAccount_bank_filter").val()};
            		func = function(data){
            			PORT = $("#bankAccount_port").val();
            			COA = fetch(getURL("acctList"), {portID:PORT});
                		$("#bankAccount_port").on("change", function(){
                			PORT = $(this).val();
                			COA = fetch(getURL("acctList"), {portID:PORT});
                			bankCOACreate(tp + "_list", "alertAll");
                		});
            		}
    				
    				e.form.inputs = inputs;
    				e.form.func = func;
    				e.event.update.on = false;
    				e.event.create.on = false;
    				e.event.create.source.address = "bankAccountCreate";
    				e.event.create.source.func = bankAcctSave;
    				$("#" + tp + "_list").empty();
    				genEditForm(tp + "_list", tp, e.source, e.form, e.event, 3, "alertAll", false);
				}
				else if (tp == "bank"){
					e.event.create.source.func = function(){
    					updateSelectOptions($("#bank_table_filter"), fetch(getURL("bankList"), {}));
    				};
    				e.form.inputs = inputs;
    				e.form.func = func;
    				e.event.create.source.address = tp + "Create";
    				e.event.create.source.func = function(){
    					updateSelectOptions($("#bank_table_filter"), fetch(getURL("bankList"), {}));
    				};
    				e.event.update.on = false;
    				$("#" + tp + "_list").empty();
    				genEditForm(tp + "_list", tp, e.source, e.form, e.event, 3, "alertAll", false);
				}
				else if (tp == "bankInterest"){
					func = function(data){
						$("#bankInterest_bank").val($("#bankInterest_bank_filter").val());
						updateSelectOptions($("#bankInterest_month"), fetch(getURL("interestMonth"), {freq:$("#bankInterest_frequency").val()}));
			 			$("#bankInterest_frequency").on("change", function(){
	            			var v = $(this).val();
	            			updateSelectOptions($("#bankInterest_month"), fetch(getURL("interestMonth"), {freq:v}));
	    				});
			 			//rateCreate(tp + "_list", "alertAll");
					}
					e.event.create.source.func = function(){
    					updateSelectOptions($("#bankInterest_table_filter"), fetch(getURL("bankInterestList"), {bank:$("#bankInterest_bank_filter").val()}));
    				};
    				e.form.inputs = inputs;
    				e.form.func = func;
    				e.event.create.on = false;
    				e.event.create.source.address = "bankInterestCreate";
    				e.event.create.source.func = bankInterestSave;
    				e.event.update.on = false;
    				$("#" + tp + "_list").empty();
    				genEditForm(tp + "_list", tp, e.source, e.form, e.event, 3, "alertAll", false);
				}
		 	}
			return false;
		});
		
		function rateCreate(target_id, alert_id){
			$("#rate_div").remove();
			var $div = $("<div id='rate_div'></div>")
			var $title = $("<div class='col-md-1'></div>");
			$div.append($title);
			$div.append("<br><br>");
			$("#" + target_id).append($div);
			var f = $.extend(true, {}, tableForm);	
			f.source.on = false;
			f.form.name = "rate_table";
			f.event.update.on = false;
			f.event.add.form.name = "rate_add";
			f.event.add.source.address = "rateCreate";
			genTableForm("rate_div", "rate", f.source, f.form, f.event, alert_id, true);
			$("#rate_add").text("增加利率");
			$("#rate_add").appendTo($title);
		}
		
		function rateDetail(target_id, alert_id, intID, rates){
			$("#rate_div").remove();
			var $div = $("<div id='rate_div'></div>")
			var $title = $("<div class='col-md-1'></div>");
			$div.append($title);
			$div.append("<br><br>");
			var dataFor = "rate";
			
			$("#" + target_id).append($div);
			var f = $.extend(true, {}, tableForm);	
			f.source.on = false;
			f.source.value = rates.data;
			f.form.name = "rate_table";

			f.event.del.source.address = "rateRemove";
			f.event.del.source.inputs = {pid:intID};
			f.event.update.source.address = "rateUpdate";
			f.event.update.source.inputs = {pid:intID};
		
			f.event.add.source.address = "rateCreate";
			f.event.add.source.inputs = {pid:intID};
			f.event.add.form.name = "rateUpdate_add";
			
			genTableForm("rate_div", dataFor, f.source, f.form, f.event, alert_id, true);
			$("#" + dataFor + "_add").text("增加利率");
			$("#" + dataFor + "_add").appendTo($title);
		}
		
		function bankCOACreate(target_id, alert_id){
			$("#coa_div").remove();
			var $div = $("<div id='coa_div'></div>")
			var $title = $("<div class='col-md-1'></div>");
			$div.append($title);
			$div.append("<br><br>");
			$("#" + target_id).append($div);
			var f = $.extend(true, {}, tableForm);	
			f.source.on = false;
			f.form.name = "bankCOA_table";
			f.event.update.on = false;
			f.event.add.form.name = "bankCOA_add";
			f.event.add.source.func = function(id, dataFor){
				$("#" + dataFor + "_" + id + "_acct").typeahead({source:COA});  
			};
			genTableForm("coa_div", "coa", f.source, f.form, f.event, alert_id, true);
			$("#bankCOA_add").text("增加会计科目关联");
			$("#bankCOA_add").appendTo($title);
		}
		
		function bankCOADetail(target_id, alert_id, acctID, coas){
			$("#coa_div").remove();
			var $div = $("<div id='coa_div'></div>")
			var $title = $("<div class='col-md-1'></div>");
			$div.append($title);
			$div.append("<br><br>");
			var dataFor = "bankCOA";
			
			$("#" + target_id).append($div);
			var f = $.extend(true, {}, tableForm);	
			f.source.on = false;
			f.source.value = coas.data;
			f.form.name = "bankCOA_table";
			f.form.func = function(data){
				$.each(data, function(i, v){
					var id = v[0];
					$("#" + dataFor + "_" + id + "_acct").typeahead({source:COA});  
				});
			};
			f.event.del.source.address = "bankCOARemove";
			f.event.del.source.inputs = {pid:acctID};
			f.event.update.source.address = "bankCOAUpdate";
			f.event.update.source.inputs = {pid:acctID};
			//f.event.update.source.func = function(){
			//	$("[data-for='bankCOA_update']").remove();
			//};
			f.event.add.source.address = "bankCOACreate";
			f.event.add.source.inputs = {pid:acctID};
			f.event.add.form.name = "bankCOAUpdate_add";
			f.event.add.source.func = function(id, dataFor){
				$("#" + dataFor + "_" + id + "_acct").typeahead({source:COA});
			};
			genTableForm("coa_div", dataFor, f.source, f.form, f.event, alert_id, true);
			$("#" + dataFor + "_add").text("增加会计科目关联");
			$("#" + dataFor + "_add").appendTo($title);
			
		}
		
		function bankInterestSave(){
			var create = true;
			if ($("#bankInterest").valid()){
				if (confirm("是否确认创建?")){
		 			var params = [];
		 			var rates = [];
		 			var json = {header:'bankInterestMsg'};
		 			$.each($("[data-for='bankInterest']"), function(index, value){
		 				if ($(value).prop("type") == "checkbox"){
		 					params.push($(value).is(":checked"));
		 					json[$(value).attr("name").split('_')[1]] = $(value).is(":checked");
		 				}
		 				else {
		 					params.push($(value).val());
		 					if($(value).attr("name")){
	     						json[$(value).attr("name").split('_')[1]] = $(value).val();
	     					}
		 				}
		 			});
		 			$.each($("[data-for='rate_tr']"), function(index, tr){
		 				var rateID = $(tr).attr("id");
		 				var rateList = [];
		 				if ($("#rate_" + rateID).valid()){
		 					$.each($("[data-for='rate_" + rateID + "']"), function(index, rateItem){
		 						rateList.push($(rateItem).val());
		 	     			});
		 					rates.push(rateList);
		 				}
		 				else{
		 					create = false;
		 				}
		 			});
		 			if (create){
		 				var address = "bankInterestCreate";
			 			invoke(getURL(address),{params:JSON.stringify(params),json:JSON.stringify(json), rates:JSON.stringify(rates)}, function(data){
			 				var new_id = data;
			            	$("#alertAll").empty();
			            	$("[data-for='bankInterest']").prop("disabled", true);
			            	$("#bankInterest_create").prop("disabled", true);
			            	$("[data-for*='rate']").prop("disabled", true);
			            	$("#alertAll").append(genAlert("success", "编号" + new_id + " " + translate["bankInterest"] + "创建成功!"));
			     			$("#coa_create").prop("disabled", true);
			     			updateSelectOptions($("#bankInterest_table_filter"), fetch(getURL("bankInterestList"), {bank:$("#bankInterest_bank_filter").val()}));
			 			}, "alertAll");
		 			}
		 			
				}	
			}
		}
		
		function bankAcctSave(){
			var create = true;
			if ($("#bankAccount").valid()){
				if (confirm("是否确认创建?")){
		 			var params = [];
		 			var json = {header:'bankAccountMsg'};;
		 			var coa = [];
		 			$.each($("[data-for='bankAccount']"), function(index, value){
		 				if ($(value).prop("type") == "checkbox"){
		 					params.push($(value).is(":checked"));
		 					json[$(value).attr("name").split('_')[1]] = $(value).is(":checked");
		 				}
		 				else {
		 					params.push($(value).val());
		 					if($(value).attr("name")){
	     						json[$(value).attr("name").split('_')[1]] = $(value).val();
	     					}
		 				}
		 			});
		 			$.each($("[data-for='coa_tr']"), function(index, tr){
		 				var coaID = $(tr).attr("id");
		 				var coaList = [];
		 				if ($("#coa_" + coaID).valid()){
		 					$.each($("[data-for='coa_" + coaID + "']"), function(index, coaItem){
		 						coaList.push($(coaItem).val());
		 	     			});
		 					coa.push(coaList);
		 				}
		 				else{
		 					create = false;
		 				}
		 			});
		 			if (create){
		 				var address = "bankAccountCreate";
			 			invoke(getURL(address),{params:JSON.stringify(params), json:JSON.stringify(json), coa:JSON.stringify(coa)}, function(data){
			 				var new_id = data;
			            	$("#alertAll").empty();
			            	$("[data-for='bankAccount']").prop("disabled", true);
			            	$("#bankAccount_create").prop("disabled", true);
			            	$("[data-for*='coa']").prop("disabled", true);
			            	$("#alertAll").append(genAlert("success", "编号" + new_id + " " + translate["bankAccount"] + "创建成功!"));
			     			$("#coa_create").prop("disabled", true);
			     			updateSelectOptions($("#bankAccount_table_filter"), fetch(getURL("bankAccountList"), {bank:$("#bankAccount_bank_filter").val()}));
			 			}, "alertAll");
		 			}
		 			
				}	
			}
		}
		
	});
</script>
</html>
