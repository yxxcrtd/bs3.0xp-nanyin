<script type="text/javascript">
	$("#title").text(site_title);
	$(document).off("click", "[href='/jixu/version.do']").on("click", "[href='/jixu/version.do']", function(){
		var ver = fetch(getURL("version"), {}, "alertAll");
		$("#version_detail").text(ver);
		$("#version_modal").modal();
		return false;
	});
</script>
<body id="body">
	<div id="alertAll"></div>
</body>
<script type="text/javascript" src="./js/jixu/user.js" charset="utf-8"></script>
<script type="text/javascript"> 
	$(function(){
		var $menu = genMenu();
		$menu.insertBefore($("#alertAll"));
		$("#config_nav").addClass("active");
		drawModal("alertAll", "user");
		drawModal("alertAll", "client");
		drawModal("alertAll", "port");
		genTabs("body", "userConfig_ul", "userConfig_content", {"user":"用户", "role":"用户角色", "group":"用户分组"});
		drawUsers("user_display");
		drawRoles("role_display");
		drawGroups("group_display");
		$("a[href='#user_display']").tab("show");
		removeAlert();
	});
</script>
