prod:
  bussRep: 1
server:
  port: 8080
  address: 0.0.0.0
  maxHttpHeaderSize: 102400
  context-path: /tams
listener:
  port: 8888
  length: 8
  encode: UTF-8
spring:
  jmx:
    enabled: false
  thymeleaf:
    cache: false
  profiles:
    active: dtx
  application:
    name: tams-server
    dfstype: 2
  datasource:
    driverClassName: oracle.jdbc.driver.OracleDriver
    validationQuery: SELECT 1 FROM DUAL
    maxTotal: 10
    maxIdle: 10
    minIdle: 5
    timeBetweenEvictionRunsMillis: 60000
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.net.ReadTimeout=50000
  activemq:
    systemId: tams
    active: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  http:
    multipart:
      maxFileSize: 10Mb
      maxRequestSize: 100Mb
base:
  datasource:
    driverClassName: oracle.jdbc.driver.OracleDriver
    maxTotal: 10
    maxIdle: 10
    minIdle: 5
    timeBetweenEvictionRunsMillis: 60000
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.net.ReadTimeout=50000
interf:
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    driverClassName: oracle.jdbc.driver.OracleDriver
    validationQuery: SELECT 1 FROM DUAL
    maxTotal: 10
    maxIdle: 10
    minIdle: 5
    timeBetweenEvictionRunsMillis: 60000
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.net.ReadTimeout=50000
    testWhileIdle: true
stresstest:
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    validationQuery: select 1 from dual
    maxTotal: 10
    maxIdle: 10
    minIdle: 5
    timeBetweenEvictionRunsMillis: 60000
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.net.ReadTimeout=50000
    testWhileIdle: true
tx-lcn:
  springcloud:
    loadbalance:
      enabled: true
  logger:
    enabled: true
    onlyError: true
jixu:
  user:
    type: 2
shiro:
  sessionId: JSESSIONID
  casClientName: tams
  allowUrl: /service/**, /api/sys/refreshPlatDate,/invest/trade/forwex/TrdForwexInvestTrade002/autosave, /mobileApproval/AssetMobileApproval/getAuditDetailConfig

specialsyspara:
  parakey: AUTHORIZE_LIMIT||PRICE_CAL_TYPE||portfolio_handle_userid||settle_acct_name||settle_acct_no||prod_tru_acct_no||prod_tru_acct_name||lending_acct_no||lending_acct_name
#页面特殊参数取值
specialsyspage:
  pagekey: SysInstitution001||SysDepartment001||SysUser001||SysActorRole001||SysActorAssign001||SysBatchProcess001||SysBatchStart001||ValBatchStart001||SystemBatchQuartzConfig001||Workflow001||SysDate001||SysDataDict001||SysParaSet001
application:
  cache:
    file: classpath:ehcache_app.xml
  remindPage: invest/remindMain  
  menuType: hover
  sysCode: TAMS
  menuPosition: top
  pageStep: 100
  logoAbout: /image/logos/logo-about.png
  logo: /image/logos/logo.png
  sessionTimeout: 1800000
  interfMaxCorePoolSize: 20
  maxDataCountOneTimeForInvestholdInfo: 50
  reportInterfIsNeedOkFile: 1
  reportInterfOkFileExtension: ok
  reportInsertCount: 15
  reportSelectOrDeleteCount: 50
  reportSelectOrDeleteCountForShenFen: 100
  reportInsertLongCount: 10
  reportInterfFileEncoding: UTF-8
  reportInterfOneTimeDataCount: 1000
  reportInterfOneTimeSqlLdrDataCount: 200000
  reportInterfOneTimeSqlLdrCommitCount: 10000
  reportInterfSplitCharacter: '|'
  reportCbFeedBackHandleCountOneTime: 10000
