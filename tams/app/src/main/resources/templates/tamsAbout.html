<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>版本信息</title>
<style>
body {
  background: #2e2d2d;
  font-family:Centaur,"楷体";
}
#title{
	padding-top:40px;
	padding-left:20px;
}
#detail{
	padding-top:20px;
}
#productName{
	font-size:45px;
	padding-left:35px;
	font-family:"华文新魏";
	color:#3e5eac;
}
#contain{
  background: url("[[@{/public/images/copy-bg.png}]]");
}
h3{
	font-size:18px;
	padding-left:110px;
	margin-block-start:10px;
    margin-block-end:10px;
    font-family:"宋体";
}
.message{
    margin-block-start:10px;
    margin-block-end:10px;
	padding-left:25%;
	font-size:22px;
}
    </style>
</head>

<body>
<div id = "contain">
<div id="title">
	 <p class="edition-logo"><img data-th-src="@{${logoAbout}}"  /><span id="productName" data-th-text="#{aplication.title}"></span></p>
</div>
<div id = "detail">
	<article>
		<h3 data-th-text="#{aplication.customerName}"></h3>
		<p class="message" data-th-text="${customerName}"></p>
	</article>
	<article >
		<h3 data-th-text="#{aplication.systemversion}"></h3>
		<p class="message" data-th-text="${systemVersion}"></p>
	</article>
	<article >
		<h3  data-th-text="#{aplication.supportedBrowsers}"></h3>
		<p class="message" data-th-text="${lastChromeVersion}"></p>
	</article>
</div>
</div>
    <div layout:fragment="script">
       <script data-th-src="@{/public/js/jquery-1.9.1.min.js}"></script>
        <script>
        $('#contain').height(document.documentElement.clientHeight-30);
        </script>
    </div>
</body>

</html>
