[sailfish]
rpc_type=2                              ;行情推送通信方式。0-共享内存；1-组播；2-tcp（TCP行情仅用于互联网联调测试使用）
support_markets=sh,sz                   ;支持的市场类别。以逗号分隔，和下面市场key对应
service_heart_beat_interval=15          ;发送到行情服务的心跳间隔

;用户登录、接收代码表等信息的tcp通道
service_addr=218.17.170.24              ;行情服务侦听TCP服务地址
service_port=8888                       ;行情服务侦听TCP服务端口

;用户登录、接收代码表等信息的tcp冷备通道
service_addr1=218.17.170.24             ;行情服务侦听TCP服务冷备地址
service_port1=8898                      ;行情服务侦听TCP服务冷备端口

;开户绑定mac地址对应网卡配置，用户登录校验使用
auth_interface_ip=192.168.1.189         ;登记在权限服务系统的mac地址对应的本机网卡ip地址

[sh]
session_num=1                           ;对应mdgw通道数
timeout=20                              ;超时时间20秒,至少大于网关超时时间两倍以上

[sh_session1]
session_cpu_affinity=5                  ;通道所属线程绑定到的cpu序号，以0开始
recv_buf_size=128                       ;接收组播行情的UDP缓存大小，单位M


;接收NSQ组播行情配置
;rpc_type配置成1有效
mcast_interface_addr=192.168.1.189      ;接收组播行情的本机网卡IP

;接收NSQ组播行情主地址
mcast_addr=225.0.0.188                  ;接收行情的组播ip，主地址
mcast_port=17888                        ;接收行情的组播端口
priority_type=0                         ;地址优先级。取值0~9，数值大优先级低

;接收NSQ组播行情备地址（备份地址最多9个）
mcast_addr1=225.0.0.198                 ;接收行情的组播ip，备地址
mcast_port1=17889                       ;接收行情的组播端口
priority_type1=0                        ;地址优先级。取值0~9，数值大优先级低


;接收NSQ TCP行情配置端（互联网测试使用）
;rpc_type配置成2有效

;接收NSQ TCP行情主地址
server_addr=218.17.170.24               ;接收tcp行情的服务端ip，主地址
server_port=17888                       ;接收tcp行情的服务端端口
server_priority_type=0                  ;地址优先级。取值0~9，数值大优先级低

;接收NSQ TCP行情备地址（备份地址最多9个）
server_addr1=218.17.170.24              ;接收tcp行情的服务端ip，备地址
server_port1=18898                      ;接收tcp行情的服务端端口
server_priority_type1=0                 ;地址优先级。取值0~9，数值大优先级低


[sz]
session_num=1                           ;对应mdgw通道数
timeout=30                              ;超时时间30秒，至少大于网关超时时间两倍以上

[sz_session1]
session_cpu_affinity=3                  ;通道所属线程绑定到的cpu序号，以0开始
recv_buf_size=128                       ;接收组播行情的UDP缓存大小，单位M


;接收NSQ组播行情配置
;rpc_type配置成1有效
mcast_interface_addr=192.168.1.189      ;接收组播行情的本机网卡IP

;接收NSQ组播行情主地址
mcast_addr=225.0.0.188                  ;接收行情的组播ip，主地址
mcast_port=18888                        ;接收行情的组播端口
priority_type=0                         ;地址优先级。取值0~9，数值大优先级低

;接收NSQ组播行情备地址（备份地址最多9个）
mcast_addr1=225.0.0.198                 ;接收行情的组播ip，备地址
mcast_port1=18889                       ;接收行情的组播端口
priority_type1=0                        ;地址优先级。取值0~9，数值大优先级低


;接收NSQ TCP行情配置端（互联网测试使用）
;rpc_type配置成2有效

;接收NSQ TCP行情主地址
server_addr=218.17.170.24               ;接收tcp行情的服务端ip，主地址
server_port=18888                       ;接收tcp行情的服务端端口
server_priority_type=0                  ;地址优先级。取值0~9，数值大优先级低

;接收NSQ TCP行情备地址（备份地址最多9个）
server_addr1=218.17.170.24              ;接收tcp行情的服务端ip，备地址
server_port1=17898                      ;接收tcp行情的服务端端口
server_priority_type1=0                 ;地址优先级。取值0~9，数值大优先级低


