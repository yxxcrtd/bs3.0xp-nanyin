<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <link data-th-href="@{/public/layui/css/layui.css}" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" data-th-href="@{/js/exchange/joyin/common.css}">
    <link rel="stylesheet" type="text/css" data-th-href="@{/js/exchange/joyin/select2.min.css}" media="all">
    <link rel="stylesheet" type="text/css" data-th-href="@{/js/exchange/joyin/lightblue.css}" media="all">
    <link rel="icon" data-th-href="@{/js/exchange/joyin/favicon.ico}" type="image/x-icon">

    <title>交易终端配置 - 场内交易</title>
</head>
<body>

<div id="content-body" class="content-body">

    <div id="content-root" class="content-root2">

        <!-- 账户管理 | 终端管理 -->
        <div class="data-list-panel">

            <div class="layui-tab layui-tab-card" lay-filter="map-list-tab">

                <ul class="layui-tab-title">
                    <li id="tab-entrust" class="layui-this">账号管理</li>
                    <li id="tab-exchange">终端管理</li>
                </ul>

                <!-- 终端关联的权限控制按钮 -->
                <div class="table-data-tools-relate">

                    <button id="terminal-binding-btn" class="layui-btn"></button>
                    <button id="terminal-remove-btn" class="layui-btn"></button>
                    <button id="risk-set-btn" class="layui-btn"></button>
                    <button id="risk-delete-btn" class="layui-btn"></button>
                </div>

                <div class="layui-tab-content">

                    <div class="layui-tab-item layui-show">

                        <form class="form-terminal layui-form" lay-filter="form-account" action="" onkeydown="if(event.keyCode==13){return false}">
                            <div class="layui-form-item">
                                <div class="layui-inline">
                                    <input type="text" name="keyWords" id="keywords-account" class="layui-input" placeholder="关键字搜索">
                                </div>
                            </div>
                        </form>

                        <div class="tab-content">

                            <div id="table-account">

                                <table>
                                    <tbody>
                                    <tr>
                                        <td label="账户ID" prop="acctNo" min-width="100" sortable overflowt fixed></td>
                                        <td label="账户名称" prop="accountName" min-width="50" sortable overflowt fixed></td>
                                        <td label="券商营业部代码" prop="stockExchangeNo" min-width="50" sorting-method="sortByExchangeNo" sortable overflowt fixed></td>
                                        <td label="状态" prop="accountStatus" min-width="80" formatter="formatAccountStatusText" sortable overflowt></td>
                                        <td label="交易终端" prop="terminalList" min-width="150" formatter="formatAccountTerminalText" overflowt></td>
                                        <td label="风控" prop="accountName" min-width="60" formatter="formatAccountRiskRowAction"></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div id="page-account" class="table-page"></div>
                        </div>

                    </div>

                    <div class="layui-tab-item">

                        <form class="form-terminal layui-form" lay-filter="form-terminal" action="" onkeydown="if(event.keyCode==13){return false}">
                            <div class="layui-form-item">
                                <div class="layui-inline">
                                    <input type="text" name="keyWords" id="keywords-terminal" class="layui-input" placeholder="关键字搜索">
                                </div>
                            </div>
                        </form>

                        <button id="terminal-create-btn" class="layui-btn layui-btn-normal terminal-create-btn">创建新的交易终端</button>

                        <div class="tab-content">

                            <div id="table-terminal">

                                <table>
                                    <tbody>
                                    <tr>
                                        <td label="序号" type="index" prop="index" min-width="50" sortable overflowt fixed></td>
                                        <td label="终端名称" prop="terminalName" min-width="200" sortable overflowt></td>
                                        <td label="创建时间" prop="createTime" min-width="500" formatter="formatDate"  sortable overflowt></td>
                                        <td label="操作" prop="terminalName" min-width="100" formatter="formatTerminalRowAction"></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div id="page-terminal" class="table-page"></div>

                            <div id="table-bind-account">

                                <table>
                                    <tbody>
                                    <tr>
                                        <td label="账户ID" prop="accountId" min-width="80" sortable overflowt fixed></td>
                                        <td label="创建时间" prop="createTime" min-width="50" formatter="formatDate"  sortable overflowt></td>
                                        <td label="操作" prop="accountId" min-width="50" formatter="formatBindAccountRowAction"></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>


    </div>

    <div id="mapping-terminal-dialog" class="mapping-terminal-dialog is-hidden">

        <div id="table-child-terminal" class="table-child-terminal">
            <table>
                <tbody>
                <tr>
                    <td type="check" label="序号" min-width="50" fixed></td>
                    <td label="终端名称" prop="terminalName" min-width="100" sortable overflowt fixed></td>
                    <td label="终端权重" prop="terminalWeight" min-width="80" formatter="formatTerminalWeight" sortable></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="form-create-terminal-dialog" class="form-create-terminal-dialog is-hidden">

        <form class="form-create-terminal layui-form" lay-filter="form-create-terminal" action="" onkeydown="if(event.keyCode==13){return false}">

            <div class="layui-form-item">
                <label class="layui-form-label">终端名称</label>
                <div class="layui-input-block">
                    <input type="text" id="terminal-name" name="terminalName" lay-verify="required" autocomplete="off"  maxlength="30" class="layui-input">
                </div>
            </div>
            <!-- <br>
            <div class="layui-form-item">
                <label class="layui-form-label">终端类型</label>
                <div class="layui-input-block">

                    <select id="terminal-type" name="terminal-type">

                        <option value="01">股票终端</option>
                        <option value="02">期货终端</option>
                        <option value="03">股票期权终端</option>
                        <option value="04">债券终端</option>
                        <option value="05">其它终端</option>

                    </select>
                </div>
            </div> -->
            <div class="layui-form-item is-hidden">
                <div class="layui-input-block">
                    <button class="layui-btn" id="terminalSubmit"  type="button" lay-submit lay-filter="terminalSubmit" >立即提交</button>
                </div>
            </div>

        </form>
    </div>

    <div id='form-risk' class="is-hidden">

        <form class="layui-form form-create-risk" lay-filter="form-create-risk"  action="">
            <div class="layui-form-item">
                <label class="layui-form-label">下单流量</label>
                <div class="layui-input-block">
                    <input type="text" name="flow" required  lay-verify="required" placeholder="请输入下单流量" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">委托总次数</label>
                <div class="layui-input-block">
                    <input type="text" name="totalCount" required  lay-verify="required" placeholder="请输入委托总次数" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">报撤单比率</label>
                <div class="layui-input-block">
                    <input type="text" name="cancelRatio" required  lay-verify="required|cancelRatioRule|number" placeholder="请输入报撤单比率" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">自成交检测</label>
                <div class="layui-input-block">
                    <input type="radio" name="selfTrade" value="true" title="是" checked>
                    <input type="radio" name="selfTrade" value="false" title="否">
                </div>
            </div>
            <div class="layui-form-item is-hidden">
                <div class="layui-input-block">
                    <button class="layui-btn" id="riskSubmit" type="button" lay-submit lay-filter="riskSubmit" >立即提交</button>
                </div>
            </div>

        </form>
    </div>

</div>

<script data-th-src="@{/public/layui/layui.all.js}" type="text/javascript" charset="utf-8"></script>
<script data-th-src="@{/js/exchange/3rd/axios.min.js}" type="text/javascript" charset="utf-8"></script>
<script data-th-src="@{/js/exchange/3rd/split.min.js}" type="text/javascript" charset="utf-8"></script>
<script data-th-src="@{/js/exchange/type-extension.js}" type="text/javascript" charset="utf-8"></script>

<script data-th-inline="javascript" type="text/javascript">
    var entity=/*[[${entity}]]*/'';
    var exchangeusername = /*[[${username}]]*/'';
    var basePath = /*[[@{/}]]*/'/';

    window.UserName = exchangeusername;
    window.ServiceBaseUrl = basePath + 'joyin';
    window.ServerBaseUrl = basePath ;

    var contentBody = document.getElementById('content-body');
    contentBody.style.height = window.innerHeight + 'px';

    window.onresize = function(){
        contentBody.style.height = window.innerHeight + 'px';
    }

</script>
<script type="text/javascript" data-th-src="@{/js/exchange/pages/terminal.js}"></script></body>
</html>
