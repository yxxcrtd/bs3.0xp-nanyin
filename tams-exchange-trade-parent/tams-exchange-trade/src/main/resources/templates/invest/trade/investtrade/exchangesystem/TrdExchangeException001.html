<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <link data-th-href="@{/public/layui/css/layui.css}" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" data-th-href="@{/js/exchange/joyin/common.css}">
    <link rel="stylesheet" type="text/css" data-th-href="@{/js/exchange/joyin/select2.min.css}" media="all">
    <link rel="stylesheet" type="text/css" data-th-href="@{/js/exchange/joyin/lightblue.css}" media="all">
    <link rel="icon" data-th-href="@{/js/exchange/joyin/favicon.ico}" type="image/x-icon">

    <title>异常委托处理 - 场内交易</title>
</head>
<body>

<div id="content-body" class="content-body">
    <div id="content-root" class="content-root2">
        <div class="data-list-panel">
            <div class="layui-tab layui-tab-card" lay-filter="manage-list-tab">

                <ul class="layui-tab-title">
                    <li id="tab-entrust" class="layui-this">异常委托处理</li>
                </ul>

                <div class="layui-tab-content">
                    <div class="layui-tab-item layui-show">
                        <div class="tool-panel-history">
                            <form class="form-manage-query form-entrusts layui-form" lay-filter="form-entrusts"
                                  action="" onkeydown="if(event.keyCode==13){return false}">

                                <div class="layui-form-item">
                                    <div class="layui-inline" id="entrust-status-container"></div>
                                    <div class="layui-inline">
                                        <input type="text" name="keyWords" id="keywords-abnormal-entrusts"
                                               class="layui-input" placeholder="输入关键字搜索">
                                    </div>
                                </div>
                            </form>
                            <div class="layui-inline">
                                <button type="button" id="quick-btn-cancel"
                                        class="layui-btn layui-btn-normal layui-btn-sm">批量撤销</button>

                            </div>

                            <div class="common-toolkit" id="toolkit-abnormal-entrusts">
                                <span class="refresh-time"></span>
                                <a class="layui-icon layui-icon-refresh-3" title="刷新"></a>
                            </div>

                        </div>

                        <div class="tab-content">

                            <div id="table-abnormal-entrusts">

                                <table>
                                    <tbody>
                                    <tr>
                                        <td type="check" label="序号" min-width="50" fixed></td>
                                        <td label="指令ID" prop="instructionId" min-width="120" sortable searchable overflowt ></td>
                                        <td label="委托编号" prop="id" min-width="140" sortable searchable overflowt ></td>
                                        <td label="委托状态" prop="entrustStatus" min-width="80" formatter="formatEntrustStatus" sortable  overflowt></td>
                                        <td label="组合代码" prop="portfolioId" min-width="100" sortable searchable overflowt></td>
                                        <td label="组合名称" prop="stockName" min-width="100" sortable searchable overflowt></td>
                                        <td label="资金账户" prop="financeAccount" min-width="100" sortable searchable overflowt></td>
                                        <td label="资产代码" prop="stockCode" min-width="90" sortable searchable overflowt></td>
                                        <td label="资产名称" prop="stockName" min-width="100" sortable searchable overflowt></td>
                                        <td label="委托方向" prop="direction" min-width="80" sorting-method="sortByDirection" formatter="formatHsDirection" sortable overflowt></td>
                                        <td label="委托数量" prop="entrustVolume" align="right" min-width="80" sortable  overflowt></td>
                                        <td label="已成交数量" prop="tradedVolume" align="right" min-width="80" sortable  overflowt></td>
                                        <td label="撤销数量" prop="cancelVolume" align="right" min-width="80" sortable  overflowt></td>
                                        <td label="交易员" prop="username" min-width="80" sortable  overflowt></td>
                                        <td label="委托日期和时间" prop="createTime" min-width="130" formatter="formatDateTime" sortable overflowt></td>
                                        <td label="撤销人员" prop="operateUser" min-width="90"  sortable overflowt></td>
                                        <td label="撤销日期和时间" prop="updateTime" min-width="130" formatter="formatDateTime" sortable overflowt></td>
                                        <td label="操作" watch="entrustStatus" min-width="60" formatter="formatEntrustsRowAction" fixed="right"></td>
                                    </tr>
                                    </tbody>
                                </table>

                            </div>

                            <div id="page-entrusts" class="table-page"></div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script data-th-src="@{/public/layui/layui.all.js}" type="text/javascript" charset="utf-8"></script>
<script data-th-src="@{/js/exchange/3rd/axios.min.js}" type="text/javascript" charset="utf-8"></script>
<script data-th-src="@{/js/exchange/3rd/split.min.js}" type="text/javascript" charset="utf-8"></script>
<script data-th-src="@{/js/exchange/type-extension.js}" type="text/javascript" charset="utf-8"></script>

<script data-th-inline="javascript" type="text/javascript">
    var entity=/*[[${entity}]]*/'';
    var exchangerealname = /*[[${realname}]]*/'';
    var exchangeusername = /*[[${username}]]*/'';
    var basePath = /*[[@{/}]]*/'/';

    window.RealName = exchangerealname;
    window.UserName = exchangeusername;
    window.ServiceBaseUrl = basePath + 'joyin';
    window.ServerBaseUrl = basePath ;

    var contentBody = document.getElementById('content-body');
    contentBody.style.height = window.innerHeight + 'px';

    window.onresize = function(){
        contentBody.style.height = window.innerHeight + 'px';
    }

</script>
<script type="text/javascript" data-th-src="@{/js/exchange/pages/abnormal.js}"></script></body>
</html>
