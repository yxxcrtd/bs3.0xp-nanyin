package proto;

option java_package = "com.joyintech.tams.exchange.common.proto";

option java_outer_classname = "QuoteProto";

message TickBean{
    required string exchange = 1;           //交易所代码
    required string instrumentID = 2;       //证券ID
    required double  updateTime = 3;        //行情时间戳
    required double  lastPrice = 4;          //最新价
    required double  openPrice = 5;          //开盘价
    required double  highPrice = 6;          //最高价
    required double  lowPrice  = 7;          //最低价

    required int64  volume = 8;             //成交总量
    required int64  turnover = 9;          //换手率
    optional int64  position = 10;          //合约持仓量(期)
    required double tradeBalance = 11;	    // 成交额
    required double  upperLimitPrice = 12;    //涨停价
    required double  lowerLimitPrice = 13;    //跌停价
    required double  settlePrice = 14;        //结算价
    required double  preClosePrice = 15;      //昨收盘价

    repeated double askPrice = 16;               //买价
    repeated int32 askVolume = 17;              //买量
    repeated double bidPrice = 18;               //卖价
    repeated int32 bidVolume = 19;              //卖量
	
}


